<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spider-Man Game V203</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#071017;
    color:white;
}

#game{
    position:fixed;
    inset:0;
    overflow:hidden;
    background:#789da9;
}

#sky{
    position:absolute;
    inset:0;
    background:linear-gradient(
        #568da2 0%,
        #a8c6cb 58%,
        #d6dad7 100%
    );
}

#sun{
    position:absolute;
    width:75px;
    height:75px;
    right:10%;
    top:9%;
    border-radius:50%;
    background:#fff1ae;
    box-shadow:0 0 50px #fff1ae;
}

/* CITY */

.building{
    position:absolute;
    bottom:0;
    background:#263740;
    border:1px solid #ffffff18;
    box-shadow:0 0 20px #0005;
}

.building:after{
    content:"";
    position:absolute;
    inset:9px;
    background:
        repeating-linear-gradient(
            90deg,
            #dce7e733 0 7px,
            transparent 7px 17px
        ),
        repeating-linear-gradient(
            0deg,
            #dce7e733 0 7px,
            transparent 7px 18px
        );
}

.b1{left:0;width:11%;height:45%}
.b2{left:12%;width:13%;height:70%}
.b3{left:27%;width:10%;height:52%}
.b4{left:39%;width:16%;height:83%}
.b5{left:57%;width:11%;height:60%}
.b6{left:70%;width:14%;height:76%}
.b7{right:0;width:13%;height:50%}

/* ROADS */

#roadH{
    position:absolute;
    left:0;
    right:0;
    bottom:16%;
    height:90px;
    background:#242a2f;
    border-top:3px solid #555;
    border-bottom:3px solid #555;
}

#roadH:after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    top:43px;
    border-top:4px dashed #d8c85d;
}

#roadV{
    position:absolute;
    top:42%;
    bottom:0;
    left:48%;
    width:90px;
    background:#242a2f;
    border-left:3px solid #555;
    border-right:3px solid #555;
}

#roadV:after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    left:43px;
    border-left:4px dashed #d8c85d;
}

/* ANCHORS */

.anchor{
    position:absolute;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#eaf8ff;
    border:2px solid #14212a;
    box-shadow:
        0 0 8px white,
        0 0 20px #64c9ff;
    z-index:40;
    cursor:pointer;
}

.a1{left:17%;top:22%}
.a2{left:40%;top:14%}
.a3{left:61%;top:25%}
.a4{left:78%;top:17%}
.a5{left:89%;top:35%}
.a6{left:30%;top:34%}
.a7{left:52%;top:10%}

/* WEB ROPE */

#rope{
    position:absolute;
    height:3px;
    left:0;
    top:0;
    width:0;
    background:white;
    transform-origin:left center;
    display:none;
    z-index:70;
    box-shadow:
        0 0 5px white,
        0 0 12px #8ddcff;
}

/* PLAYER */

#spiderman{
    position:absolute;
    width:34px;
    height:48px;
    left:50%;
    top:50%;
    z-index:100;
    transform:translate(-50%,-50%);
}

.body{
    position:absolute;
    width:30px;
    height:35px;
    left:2px;
    top:12px;
    border-radius:12px 12px 6px 6px;
    background:
        linear-gradient(
            90deg,
            #8b0b13 0 44%,
            #d51622 45%,
            #0b2b72 46%,
            #071a49
        );
    border:2px solid #050b15;
}

.head{
    position:absolute;
    width:25px;
    height:25px;
    left:4px;
    top:-5px;
    border-radius:50%;
    background:#c91522;
    border:2px solid #080c15;
}

.head:before,
.head:after{
    content:"";
    position:absolute;
    width:8px;
    height:4px;
    top:9px;
    background:white;
    border:1px solid #111;
}

.head:before{
    left:2px;
    transform:rotate(25deg);
}

.head:after{
    right:2px;
    transform:rotate(-25deg);
}

.body:after{
    content:"";
    position:absolute;
    inset:5px;
    border-radius:8px;
    background:
        repeating-linear-gradient(
            45deg,
            transparent 0 7px,
            #ffffff20 8px 9px
        );
}

/* HUD */

#hud{
    position:fixed;
    top:12px;
    left:12px;
    width:min(520px,93vw);
    padding:12px;
    background:#03070ddd;
    border:1px solid #ffffff25;
    border-radius:13px;
    z-index:500;
}

.title{
    font-size:14px;
    font-weight:bold;
}

.subtitle{
    margin-top:4px;
    font-size:9px;
    color:#aebfc7;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-top:10px;
}

.stat{
    background:#101b23;
    padding:8px 4px;
    border-radius:7px;
    text-align:center;
    font-size:9px;
}

#status{
    margin-top:8px;
    padding:8px;
    background:#101b23;
    border-radius:7px;
    font-size:9px;
    line-height:1.7;
}

/* CONTROLS */

#controls{
    position:fixed;
    left:50%;
    bottom:12px;
    transform:translateX(-50%);
    width:min(650px,95vw);
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    z-index:600;
}

button{
    padding:11px 5px;
    background:#111f2a;
    border:1px solid #ffffff25;
    border-radius:9px;
    color:white;
    font-size:10px;
    cursor:pointer;
}

button:active{
    transform:scale(.95);
}

/* MESSAGE */

#message{
    position:fixed;
    left:50%;
    top:24%;
    transform:translateX(-50%);
    padding:10px 16px;
    background:#03070cf5;
    border:1px solid #ffffff25;
    border-radius:9px;
    font-size:10px;
    display:none;
    z-index:1500;
    text-align:center;
}

/* MAP */

#map{
    display:none;
    position:fixed;
    inset:0;
    background:#02060aee;
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.mapbox{
    width:min(700px,95vw);
    background:#0b141b;
    border:1px solid #ffffff22;
    border-radius:14px;
    padding:16px;
}

.mapgrid{
    position:relative;
    height:360px;
    margin-top:12px;
    background:
        linear-gradient(
            90deg,
            transparent 48%,
            #d7c86e55 49% 51%,
            transparent 52%
        ),
        linear-gradient(
            transparent 48%,
            #d7c86e55 49% 51%,
            transparent 52%
        ),
        #1c2c34;
    border-radius:10px;
}

.mapPlayer{
    position:absolute;
    left:50%;
    top:50%;
    width:12px;
    height:12px;
    border-radius:50%;
    background:#e21b2b;
    box-shadow:0 0 15px #e21b2b;
}
</style>
</head>

<body>

<div id="game">

<div id="sky"></div>
<div id="sun"></div>

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>

<div id="roadH"></div>
<div id="roadV"></div>

<!-- WEB ANCHORS -->

<div class="anchor a1"></div>
<div class="anchor a2"></div>
<div class="anchor a3"></div>
<div class="anchor a4"></div>
<div class="anchor a5"></div>
<div class="anchor a6"></div>
<div class="anchor a7"></div>

<div id="rope"></div>

<!-- PLAYER -->

<div id="spiderman">
    <div class="head"></div>
    <div class="body"></div>
</div>

<!-- HUD -->

<div id="hud">

<div class="title">
🕷️ SPIDER-MAN — V203
</div>

<div class="subtitle">
WEB SWINGING SYSTEM
</div>

<div class="stats">

<div class="stat">
❤️ HEALTH<br>
<span id="health">100</span>
</div>

<div class="stat">
⚡ POWER<br>
<span id="power">100</span>
</div>

<div class="stat">
🕸️ WEBS<br>
<span id="webs">30</span>
</div>

<div class="stat">
⭐ LEVEL<br>
<span id="level">1</span>
</div>

</div>

<div id="status">

📍 Location:
<b id="locationText">Downtown</b>

<br>

🕸️ Swing:
<span id="swingStatus">READY</span>

<br>

⚓ Anchor:
<span id="anchorStatus">None</span>

<br>

💨 Momentum:
<span id="momentum">0</span>

</div>

</div>

<div id="message"></div>

<!-- CONTROLS -->

<div id="controls">

<button onclick="Spider.attachWeb()">
🕸️ ATTACH
</button>

<button onclick="Spider.swingLeft()">
⬅️ SWING
</button>

<button onclick="Spider.swingRight()">
➡️ SWING
</button>

<button onclick="Spider.pump()">
⬆️ PUMP
</button>

<button onclick="Spider.release()">
🚀 RELEASE
</button>

<button onclick="Spider.detach()">
✂️ DETACH
</button>

<button onclick="Spider.jump()">
🦘 JUMP
</button>

<button onclick="Spider.sense()">
🕷️ SENSE
</button>

<button onclick="Spider.map()">
🗺️ MAP
</button>

<button onclick="Spider.save()">
💾 SAVE
</button>

</div>

<!-- MAP -->

<div id="map">

<div class="mapbox">

<h2>🗺️ CITY MAP</h2>

<div class="mapgrid">
<div id="mapPlayer" class="mapPlayer"></div>
</div>

<br>

<button onclick="Spider.map()">
CLOSE MAP
</button>

</div>

</div>

<script>

const Spider={

saveKey:"SPIDERMAN_V203",

x:0,
y:0,

health:100,
power:100,
webs:30,
level:1,

momentum:0,

swinging:false,

anchor:null,

anchorX:0,
anchorY:0,

ropeLength:0,

swingAngle:0,

swingDirection:1,

keys:{},

lastTime:0,

init(){

this.load();

this.setupAnchors();

this.setupKeyboard();

this.update();

this.loop();

this.message(
"🕷️ V203 Web Swinging ready!"
);

},

/* KEYBOARD */

setupKeyboard(){

document.addEventListener(
"keydown",
e=>{

const k=e.key.toLowerCase();

this.keys[k]=true;

if(k==="e")
this.attachWeb();

if(k==="q")
this.swingLeft();

if(k==="r")
this.swingRight();

if(k===" ")
{
e.preventDefault();
this.release();
}

if(k==="x")
this.detach();

});

document.addEventListener(
"keyup",
e=>{
this.keys[e.key.toLowerCase()]=false;
});

},

/* ANCHORS */

setupAnchors(){

document
.querySelectorAll(".anchor")
.forEach(
(anchor,index)=>{

anchor.addEventListener(
"click",
()=>{

this.selectAnchor(anchor);

}
);

});

},

selectAnchor(anchor){

const rect=
anchor.getBoundingClientRect();

this.anchorX=
rect.left+
rect.width/2;

this.anchorY=
rect.top+
rect.height/2;

this.anchor=anchor;

this.message(
"⚓ Anchor selected!"
);

},

/* ATTACH */

attachWeb(){

if(this.power<3){

this.message(
"⚡ Not enough power."
);

return;

}

if(!this.anchor){

const nearest=
this.findNearestAnchor();

if(!nearest){

this.message(
"🕸️ No anchor nearby."
);

return;

}

this.selectAnchor(nearest);

}

const player=
document.getElementById(
"spiderman"
);

const rect=
player.getBoundingClientRect();

const px=
rect.left+
rect.width/2;

const py=
rect.top+
rect.height/2;

const dx=
this.anchorX-px;

const dy=
this.anchorY-py;

this.ropeLength=
Math.max(
70,
Math.min(
420,
Math.sqrt(dx*dx+dy*dy)
)
);

this.swingAngle=
Math.atan2(
px-this.anchorX,
py-this.anchorY
);

this.momentum=2;

this.swinging=true;

this.power-=3;

document.getElementById(
"rope"
).style.display=
"block";

this.message(
"🕸️ Web attached — SWING!"
);

this.update();

},

/* FIND NEAREST */

findNearestAnchor(){

const anchors=
[
...document.querySelectorAll(
".anchor"
)
];

const player=
document
.getElementById(
"spiderman"
)
.getBoundingClientRect();

const px=
player.left+
player.width/2;

const py=
player.top+
player.height/2;

let best=null;
let bestDistance=Infinity;

anchors.forEach(
anchor=>{

const r=
anchor.getBoundingClientRect();

const ax=
r.left+r.width/2;
const ay=
r.top+r.height/2;

const d=
Math.hypot(
ax-px,
ay-py
);

if(d<bestDistance){

bestDistance=d;
best=anchor;

}

});

if(bestDistance>500)
return null;

return best;

},

/* SWING LEFT */

swingLeft(){

if(!this.swinging){

this.attachWeb();

return;

}

this.swingDirection=-1;

this.momentum+=0.8;

this.message(
"⬅️ Swinging left"
);

},

/* SWING RIGHT */

swingRight(){

if(!this.swinging){

this.attachWeb();

return;

}

this.swingDirection=1;

this.momentum+=0.8;

this.message(
"➡️ Swinging right"
);

},

/* PUMP SWING */

pump(){

if(!this.swinging){

this.message(
"🕸️ Attach a web first."
);

return;

}

if(this.power<3){

this.message(
"⚡ Low power."
);

return;

}

this.power-=3;

this.momentum+=2.5;

this.message(
"⬆️ Momentum increased!"
);

},

/* RELEASE */

release(){

if(!this.swinging){

this.message(
"🕸️ You aren't swinging."
);

return;

}

const angle=
this.swingAngle;

const speed=
Math.min(
18,
this.momentum
);

this.x+=
Math.sin(angle)*
speed*2.5;

this.y+=
-Math.cos(angle)*
speed*2;

this.momentum+=3;

this.swinging=false;

document.getElementById(
"rope"
).style.display=
"none";

this.message(
"🚀 WEB RELEASE!"
);

this.render();

this.update();

},

/* DETACH */

detach(){

if(!this.swinging){

this.message(
"No active web."
);

return;

}

this.swinging=false;

this.momentum=0;

document.getElementById(
"rope"
).style.display=
"none";

this.message(
"✂️ Web detached."
);

this.update();

},

/* PHYSICS LOOP */

loop(){

requestAnimationFrame(
()=>this.loop()
);

if(!this.swinging)
return;

const dt=0.016;

const gravity=0.045;

this.swingAngle+=
this.swingDirection*
(this.momentum/55)*
dt;

this.momentum+=
gravity*Math.sin(
this.swingAngle
);

this.momentum*=0.998;

this.momentum=
Math.max(
-10,
Math.min(
10,
this.momentum
)
);

const centerX=
window.innerWidth/2;

const centerY=
window.innerHeight/2;

const px=
this.anchorX+
Math.sin(this.swingAngle)*
this.ropeLength;

const py=
this.anchorY+
Math.cos(this.swingAngle)*
this.ropeLength;

const player=
document.getElementById(
"spiderman"
);

player.style.left=
px+"px";

player.style.top=
py+"px";

this.updateRope(
px,
py
);

},

/* ROPE */

updateRope(px,py){

const rope=
document.getElementById(
"rope"
);

const dx=
this.anchorX-px;

const dy=
this.anchorY-py;

const distance=
Math.hypot(dx,dy);

const angle=
Math.atan2(dy,dx)*
180/Math.PI;

rope.style.left=
px+"px";

rope.style.top=
py+"px";

rope.style.width=
distance+"px";

rope.style.transform=
"rotate("+angle+"deg)";

},

/* NORMAL MOVEMENT */

move(dx,dy){

if(this.swinging)
return;

this.x+=dx*4;
this.y+=dy*4;

this.x=
Math.max(
-100,
Math.min(100,this.x)
);

this.y=
Math.max(
-100,
Math.min(100,this.y)
);

this.render();

this.location();

},

/* RENDER */

render(){

const player=
document.getElementById(
"spiderman"
);

player.style.left=
(50+this.x*.25)+"%";

player.style.top=
(50+this.y*.18)+"%";

},

/* JUMP */

jump(){

if(this.swinging){

this.pump();

return;

}

if(this.power<5){

this.message(
"⚡ Not enough power."
);

return;

}

this.power-=5;

const player=
document.getElementById(
"spiderman"
);

player.animate(
[
{
transform:
"translate(-50%,-50%)"
},
{
transform:
"translate(-50%,-150%)"
},
{
transform:
"translate(-50%,-50%)"
}
],
{
duration:450,
easing:"ease-out"
}
);

this.update();

},

/* SPIDER SENSE */

sense(){

if(this.power<8){

this.message(
"⚡ Spider-Sense unavailable."
);

return;

}

this.power-=8;

this.message(
"🕷️ Spider-Sense: Safe route detected."
);

this.update();

},

/* LOCATION */

location(){

let place="Downtown";

if(this.x>50)
place="Financial District";

else if(this.x<-50)
place="Residential District";

else if(this.y>50)
place="Industrial District";

else if(this.y<-50)
place="City Center";

document.getElementById(
"locationText"
).textContent=
place;

},

/* MAP */

map(){

const map=
document.getElementById(
"map"
);

map.style.display=
map.style.display==="flex"
?
"none":
"flex";

const mp=
document.getElementById(
"mapPlayer"
);

mp.style.left=
(50+this.x*.35)+"%";

mp.style.top=
(50+this.y*.35)+"%";

},

/* HUD */

update(){

document.getElementById(
"health"
).textContent=
Math.round(this.health);

document.getElementById(
"power"
).textContent=
Math.round(this.power);

document.getElementById(
"webs"
).textContent=
this.webs;

document.getElementById(
"level"
).textContent=
this.level;

document.getElementById(
"momentum"
).textContent=
this.momentum.toFixed(1);

document.getElementById(
"swingStatus"
).textContent=
this.swinging
?
"SWINGING":
"READY";

document.getElementById(
"anchorStatus"
).textContent=
this.anchor
?
"LOCKED":
"None";

},

/* SAVE */

save(){

localStorage.setItem(
this.saveKey,
JSON.stringify({

x:this.x,
y:this.y,
health:this.health,
power:this.power,
webs:this.webs,
level:this.level

})
);

this.message(
"💾 V203 saved!"
);

},

/* LOAD */

load(){

try{

const raw=
localStorage.getItem(
this.saveKey
);

if(!raw)return;

const d=
JSON.parse(raw);

if(Number.isFinite(d.x))
this.x=d.x;

if(Number.isFinite(d.y))
this.y=d.y;

if(Number.isFinite(d.health))
this.health=d.health;

if(Number.isFinite(d.power))
this.power=d.power;

if(Number.isFinite(d.webs))
this.webs=d.webs;

if(Number.isFinite(d.level))
this.level=d.level;

this.render();

}
catch(e){

console.log(
"Load error:",
e
);

},

/* MESSAGE */

message(text){

const box=
document.getElementById(
"message"
);

box.textContent=text;
box.style.display="block";

clearTimeout(
this.messageTimer
);

this.messageTimer=
setTimeout(
()=>{
box.style.display="none";
},
1800
);

}

};

Spider.init();

</script>

</div>
</body>
</html>
