<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WEBBOUND V41 — Vehicle System</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;z-index:20;left:10px;top:10px;width:275px;
 padding:13px;color:white;background:rgba(0,0,0,.78);
 border:1px solid rgba(255,255,255,.18);border-radius:15px;
 backdrop-filter:blur(8px);font-size:11px
}
.title{font-size:18px;font-weight:800}
.sub{color:#62dcff;margin-top:3px}
.row{margin-top:8px;line-height:1.55}
#vehicleStatus{color:#ffd34d;font-weight:bold}

#topButtons{
 position:fixed;z-index:30;right:10px;top:10px;
 display:flex;gap:6px
}
#topButtons button{width:95px;height:40px}

button{
 border:1px solid rgba(255,255,255,.25);
 background:rgba(0,0,0,.75);
 color:white;border-radius:12px;
 font-size:10px;font-weight:bold;
 touch-action:none
}
button:active{
 transform:scale(.94);
 background:rgba(255,255,255,.22)
}

#message{
 position:fixed;z-index:100;left:50%;top:23%;
 transform:translateX(-50%);
 width:92%;text-align:center;
 color:white;font-size:25px;font-weight:800;
 text-shadow:0 5px 25px #000;
 opacity:0;transition:.25s
}

#vehicleHUD{
 position:fixed;z-index:25;
 right:12px;bottom:150px;
 width:170px;padding:12px;
 background:rgba(0,0,0,.75);
 color:white;border:1px solid rgba(255,255,255,.2);
 border-radius:14px;display:none
}

.bar{
 width:100%;height:8px;
 background:#222;border-radius:10px;
 overflow:hidden;margin-top:5px
}
.bar div{
 height:100%;width:100%;
 background:#ffd34d
}

#touch{
 position:fixed;z-index:40;
 left:0;right:0;bottom:8px;
 display:flex;justify-content:space-between;
 padding:9px;pointer-events:none
}
.pad,.actions{
 display:grid;gap:6px;
 pointer-events:auto
}
.pad{
 grid-template-columns:48px 48px 48px;
 grid-template-rows:48px 48px
}
.actions{
 grid-template-columns:52px 52px;
 grid-template-rows:52px 52px 52px
}
#touch button{width:52px;height:52px}
.empty{visibility:hidden}

@media(max-width:600px){
 #hud{width:235px;font-size:10px}
 #topButtons{top:125px}
 #topButtons button{width:82px}
}
</style>
</head>

<body>

<div id="hud">

 <div class="title">
  🕷️ WEBBOUND V41
 </div>

 <div class="sub">
  VEHICLE SYSTEM
 </div>

 <div class="row">
  ⭐ Level: <b id="level">1</b><br>
  ❤️ Health: <b id="health">100</b><br>
  🕸️ Energy: <b id="energy">100</b><br>
  ⭐ XP: <b id="xp">0</b><br>
  🏆 Score: <b id="score">0</b>
 </div>

 <div class="row">
  📖 Chapter: <b id="chapter">1</b><br>
  🎯 Mission: <b id="mission">1</b><br>
  🚗 Vehicle:
  <b id="vehicleStatus">ON FOOT</b>
 </div>

</div>


<div id="topButtons">
 <button id="vehicleButton">
  🚗 ENTER
 </button>

 <button id="boostButton">
  ⚡ BOOST
 </button>
</div>


<div id="vehicleHUD">

 <b>🚗 CITY VEHICLE</b>

 <div style="margin-top:7px">
  Speed:
  <b id="speed">0</b> km/h
 </div>

 <div style="margin-top:6px">
  Fuel
 </div>

 <div class="bar">
  <div id="fuelBar"></div>
 </div>

</div>


<div id="message"></div>


<div id="touch">

 <div class="pad">

  <button class="empty"></button>
  <button id="up">▲</button>
  <button class="empty"></button>

  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>

 </div>


 <div class="actions">

  <button id="jump">
   JUMP
  </button>

  <button id="web">
   WEB
  </button>

  <button id="punch">
   PUNCH
  </button>

  <button id="shot">
   WEB SHOT
  </button>

  <button id="vehicle">
   ENTER
  </button>

  <button id="boost">
   BOOST
  </button>

 </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene=new THREE.Scene();

scene.background=
 new THREE.Color(0x07111e);

scene.fog=
 new THREE.FogExp2(
  0x07111e,
  .00115
 );


const camera=
 new THREE.PerspectiveCamera(
  68,
  innerWidth/innerHeight,
  .1,
  3500
 );


const renderer=
 new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:
   "high-performance"
 });


renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(
  devicePixelRatio,
  1.3
 )
);

renderer.outputColorSpace=
 THREE.SRGBColorSpace;

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun=
 new THREE.DirectionalLight(
  0xffffff,
  1.8
 );

sun.position.set(
 -400,
 700,
 300
);

sun.castShadow=true;

scene.add(sun);


scene.add(
 new THREE.HemisphereLight(
  0x7897c4,
  0x05070b,
  1.1
 )
);


/* =====================================================
   CITY
===================================================== */

const buildings=[];

const buildingMaterials=[
 new THREE.MeshStandardMaterial({
  color:0x17212b
 }),
 new THREE.MeshStandardMaterial({
  color:0x222c36
 }),
 new THREE.MeshStandardMaterial({
  color:0x101920
 })
];


for(
 let x=-850;
 x<=850;
 x+=100
){

 for(
  let z=-850;
  z<=850;
  z+=100
 ){

  if(
   Math.abs(x)<100 &&
   Math.abs(z)<100
  )
   continue;


  const w=
   55+
   Math.random()*20;

  const d=
   55+
   Math.random()*20;

  const h=
   70+
   Math.random()*250;


  const building=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     w,h,d
    ),
    buildingMaterials[
     Math.floor(
      Math.random()*
      buildingMaterials.length
     )
    ]
   );


  building.position.set(
   x,
   h/2,
   z
  );

  building.castShadow=true;

  scene.add(
   building
  );

  buildings.push(
   building
  );
 }
}


const ground=
 new THREE.Mesh(
  new THREE.PlaneGeometry(
   3000,
   3000
  ),
  new THREE.MeshStandardMaterial({
   color:0x070a0e
  })
 );


ground.rotation.x=
 -Math.PI/2;

ground.receiveShadow=true;

scene.add(
 ground
);


/* =====================================================
   PLAYER
===================================================== */

const player=
 new THREE.Group();

player.position.set(
 0,1.1,0
);

scene.add(
 player
);


const suit=
 new THREE.MeshStandardMaterial({
  color:0xa8192d,
  roughness:.4
 });


const body=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .65,1.55,8,14
  ),
  suit
 );


body.position.y=1.45;

player.add(body);


const head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .57,20,16
  ),
  suit
 );


head.position.y=2.75;

player.add(head);


const eyeMat=
 new THREE.MeshBasicMaterial({
  color:0xffffff
 });


for(
 const x of [-.2,.2]
){

 const eye=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .18,12,10
   ),
   eyeMat
  );

 eye.position.set(
  x,2.78,-.54
 );

 eye.scale.z=.18;

 player.add(eye);
}


/* =====================================================
   PLAYER STATE
===================================================== */

const velocity=
 new THREE.Vector3();

const input=
 new THREE.Vector3();

const keys={};

let grounded=true;
let doubleJump=true;

let swinging=false;
let anchor=null;
let webLine=null;

let health=100;
let energy=100;
let xp=0;
let score=0;
let level=1;

let chapter=1;
let mission=1;


/* =====================================================
   VEHICLE
===================================================== */

const vehicle=
 new THREE.Group();

vehicle.visible=true;

scene.add(vehicle);


const carBody=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   5.2,1.2,8
  ),
  new THREE.MeshStandardMaterial({
   color:0x145d91,
   metalness:.35,
   roughness:.35
  })
 );

carBody.position.y=1.15;

vehicle.add(carBody);


const roof=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   4.1,1.15,3.7
  ),
  new THREE.MeshStandardMaterial({
   color:0x102638,
   metalness:.2,
   roughness:.3
  })
 );

roof.position.set(
 0,2.05,-.15
);

vehicle.add(roof);


/* WINDOWS */

const windowMat=
 new THREE.MeshStandardMaterial({
  color:0x07121d,
  metalness:.2,
  roughness:.15
 });


const frontWindow=
 new THREE.Mesh(
  new THREE.BoxGeometry(
   3.7,.75,.15
  ),
  windowMat
 );

frontWindow.position.set(
 0,2.1,-2.02
);

vehicle.add(frontWindow);


/* WHEELS */

const wheels=[];

for(
 const x of [-2.65,2.65]
){

 for(
  const z of [-2.5,2.5]
 ){

  const wheel=
   new THREE.Mesh(
    new THREE.CylinderGeometry(
     .75,.75,.55,16
    ),
    new THREE.MeshStandardMaterial({
     color:0x090909
    })
   );

  wheel.rotation.z=
   Math.PI/2;

  wheel.position.set(
   x,.75,z
  );

  vehicle.add(wheel);
  wheels.push(wheel);
 }
}


/* HEADLIGHTS */

const lightMat=
 new THREE.MeshBasicMaterial({
  color:0xffffcc
 });

for(
 const x of [-1.45,1.45]
){

 const lamp=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .22,10,10
   ),
   lightMat
  );

 lamp.position.set(
  x,1.25,-4.02
 );

 vehicle.add(lamp);
}


/* VEHICLE STATE */

let inVehicle=false;

let vehicleSpeed=0;

let vehicleFuel=100;

let vehicleHeading=0;

vehicle.position.set(
 35,0,0
);


/* =====================================================
   ENTER / EXIT
===================================================== */

function nearestVehicle(){

 const d=
  vehicle.position.distanceTo(
   player.position
  );

 return d<9;
}


function enterVehicle(){

 if(inVehicle){

  exitVehicle();
  return;
 }


 if(!nearestVehicle()){

  showMessage(
   "🚗 MOVE CLOSER TO THE CAR"
  );

  return;
 }


 inVehicle=true;

 vehicle.visible=true;

 player.visible=false;

 vehicleFuel=
  Math.max(
   vehicleFuel,
   1
  );

 showMessage(
  "🚗 VEHICLE ENTERED"
 );
}


function exitVehicle(){

 if(!inVehicle)
  return;

 inVehicle=false;

 player.visible=true;

 player.position.copy(
  vehicle.position
 );

 player.position.x+=6;

 player.position.y=1.1;

 vehicleSpeed=0;

 showMessage(
  "🚶 VEHICLE EXITED"
 );
}


/* =====================================================
   VEHICLE MOVEMENT
===================================================== */

function updateVehicle(dt){

 if(!inVehicle)
  return;


 let acceleration=0;

 if(keys.KeyW)
  acceleration+=22;

 if(keys.KeyS)
  acceleration-=16;


 const braking=
  keys.Space;


 if(braking)
  vehicleSpeed*=.88;


 vehicleSpeed+=
  acceleration*dt;


 vehicleSpeed*=.97;


 const maxSpeed=
  keys.ShiftLeft?
  52:
  32;


 vehicleSpeed=
  THREE.MathUtils.clamp(
   vehicleSpeed,
   -15,
   maxSpeed
  );


 if(
  vehicleFuel<=0
 ){

  vehicleSpeed*=.94;

 }else{

  vehicleFuel-=
   Math.abs(
    vehicleSpeed
   )*
   dt*.025;
 }


 if(keys.KeyA){

  vehicleHeading+=
   dt*
   1.5*
   Math.min(
    Math.abs(vehicleSpeed)/10,
    1
   );
 }


 if(keys.KeyD){

  vehicleHeading-=
   dt*
   1.5*
   Math.min(
    Math.abs(vehicleSpeed)/10,
    1
   );
 }


 vehicle.rotation.y=
  vehicleHeading;


 const forward=
  new THREE.Vector3(
   0,0,-1
  );

 forward.applyQuaternion(
  vehicle.quaternion
 );


 vehicle.position.addScaledVector(
  forward,
  vehicleSpeed*dt
 );


 for(
  const wheel of wheels
 ){

  wheel.rotation.x+=
   vehicleSpeed*
   dt*
   .25;
 }


 if(
  vehicleFuel<5
 ){

  showMessage(
   "⛽ LOW FUEL"
  );
 }
}


/* =====================================================
   VEHICLE BOOST
===================================================== */

function vehicleBoost(){

 if(!inVehicle){

  showMessage(
   "🚗 ENTER VEHICLE FIRST"
  );

  return;
 }


 if(vehicleFuel<8){

  showMessage(
   "⛽ NOT ENOUGH FUEL"
  );

  return;
 }


 vehicleFuel-=8;

 vehicleSpeed+=18;

 score+=25;

 showMessage(
  "⚡ VEHICLE BOOST!"
 );
}


/* =====================================================
   REFUEL
===================================================== */

function refuel(){

 if(
  vehicle.position.length()<100
 ){

  vehicleFuel=100;

  showMessage(
   "⛽ VEHICLE REFUELED"
  );
 }
}


/* =====================================================
   XP
===================================================== */

function xpRequired(){

 return 500+
  (level-1)*250;
}


function addXP(amount){

 xp+=amount;

 while(
  xp>=xpRequired()
 ){

  xp-=xpRequired();

  level++;

  health=100;
  energy=100;

  showMessage(
   "⭐ LEVEL "+
   level+
   "!"
  );
 }
}


/* =====================================================
   ENEMIES
===================================================== */

const enemies=[];


function createEnemy(){

 const enemy=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .55,1,6,10
   ),
   new THREE.MeshStandardMaterial({
    color:0x353941
   })
  );


 const angle=
  Math.random()*
  Math.PI*2;

 const distance=
  100+
  Math.random()*200;


 enemy.position.set(
  player.position.x+
  Math.cos(angle)*distance,
  1,
  player.position.z+
  Math.sin(angle)*distance
 );


 enemy.userData={
  health:100,
  speed:4
 };


 scene.add(enemy);

 enemies.push(enemy);
}


for(
 let i=0;
 i<8;
 i++
)
 createEnemy();


function nearestEnemy(range){

 let target=null;
 let closest=range;


 for(
  const enemy of enemies
 ){

  const d=
   enemy.position.distanceTo(
    inVehicle?
    vehicle.position:
    player.position
   );


  if(
   d<closest
  ){

   closest=d;
   target=enemy;
  }
 }


 return target;
}


function defeatEnemy(enemy){

 score+=250;

 addXP(100);

 scene.remove(
  enemy
 );

 const i=
  enemies.indexOf(
   enemy
  );

 if(i>=0)
  enemies.splice(
   i,1
  );

 setTimeout(
  createEnemy,
  1200
 );
}


function punch(){

 if(inVehicle){

  vehicleAttack();
  return;
 }


 const enemy=
  nearestEnemy(7);

 if(!enemy)return;

 enemy.userData.health-=50;

 score+=100;

 addXP(20);

 if(
  enemy.userData.health<=0
 )
  defeatEnemy(enemy);
}


function webShot(){

 if(inVehicle)
  return;


 if(energy<15)
  return;


 const enemy=
  nearestEnemy(40);

 if(!enemy)
  return;


 energy-=15;

 enemy.userData.health-=60;

 if(
  enemy.userData.health<=0
 )
  defeatEnemy(enemy);
}


function burst(){

 if(inVehicle)
  return;


 if(energy<35)
  return;


 energy-=35;


 for(
  const enemy of [...enemies]
 ){

  if(
   enemy.position.distanceTo(
    player.position
   )<18
  ){

   enemy.userData.health-=70;

   if(
    enemy.userData.health<=0
   )
    defeatEnemy(enemy);
  }
 }
}


/* VEHICLE ATTACK */

function vehicleAttack(){

 const enemy=
  nearestEnemy(12);

 if(!enemy)
  return;


 enemy.userData.health-=100;

 vehicleSpeed+=5;

 score+=150;

 addXP(50);


 if(
  enemy.userData.health<=0
 )
  defeatEnemy(enemy);
}


function updateEnemies(dt){

 for(
  const enemy of enemies
 ){

  const target=
   inVehicle?
   vehicle.position:
   player.position;

  const d=
   enemy.position.distanceTo(
    target
   );


  if(d<100){

   const dir=
    new THREE.Vector3()
     .subVectors(
      target,
      enemy.position
     )
     .normalize();

   dir.y=0;

   enemy.position.addScaledVector(
    dir,
    enemy.userData.speed*dt
   );


   if(
    d<4 &&
    !inVehicle
   )
    health-=7*dt;
  }
 }
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function jump(){

 if(inVehicle)
  return;


 if(grounded){

  velocity.y=15;

  grounded=false;

  doubleJump=true;

 }else if(doubleJump){

  velocity.y=13;

  doubleJump=false;
 }
}


function updateMovement(dt){

 if(inVehicle)
  return;


 input.set(0,0,0);

 if(keys.KeyW)
  input.z-=1;

 if(keys.KeyS)
  input.z+=1;

 if(keys.KeyA)
  input.x-=1;

 if(keys.KeyD)
  input.x+=1;


 if(input.length())
  input.normalize();


 const speed=
  keys.ShiftLeft?
  14:
  9;


 velocity.x+=
  input.x*
  speed*
  dt*5;

 velocity.z+=
  input.z*
  speed*
  dt*5;

 velocity.x*=.91;
 velocity.z*=.91;


 if(!grounded)
  velocity.y-=30*dt;


 player.position.addScaledVector(
  velocity,
  dt
 );


 if(
  player.position.y<=1.1
 ){

  player.position.y=1.1;

  velocity.y=0;

  grounded=true;

  doubleJump=true;

 }else{

  grounded=false;
 }
}


/* =====================================================
   WEB SWING
===================================================== */

function findAnchor(){

 let best=null;
 let closest=450;

 for(
  const building of buildings
 ){

  const h=
   building.geometry.parameters
    .height;

  const point=
   new THREE.Vector3(
    building.position.x,
    building.position.y+
    h/2,
    building.position.z
   );

  const d=
   point.distanceTo(
    player.position
   );


  if(
   d<closest &&
   point.y>
   player.position.y+8
  ){

   closest=d;
   best=point;
  }
 }

 return best;
}


function toggleSwing(){

 if(inVehicle)
  return;


 if(swinging){

  swinging=false;

  if(webLine){

   scene.remove(
    webLine
   );

   webLine=null;
  }

  velocity.multiplyScalar(1.4);

  return;
 }


 const point=
  findAnchor();

 if(!point)
  return;


 anchor=point;

 swinging=true;


 webLine=
  new THREE.Line(
   new THREE.BufferGeometry()
    .setFromPoints([
     player.position.clone(),
     anchor.clone()
    ]),
   new THREE.LineBasicMaterial({
    color:0xffffff
   })
  );


 scene.add(
  webLine
 );
}


function updateSwing(dt){

 if(!swinging)
  return;


 const pull=
  new THREE.Vector3()
   .subVectors(
    anchor,
    player.position
   );


 const distance=
  pull.length();

 pull.normalize();


 if(distance>10){

  velocity.addScaledVector(
   pull,
   (distance-10)*
   dt*16
  );
 }


 velocity.y-=7*dt;


 if(webLine){

  const p=
   webLine.geometry
    .attributes
    .position
    .array;


  p[0]=player.position.x;
  p[1]=player.position.y+1;
  p[2]=player.position.z;

  p[3]=anchor.x;
  p[4]=anchor.y;
  p[5]=anchor.z;


  webLine.geometry
   .attributes
   .position
   .needsUpdate=true;
 }
}


/* =====================================================
   MISSION
===================================================== */

function updateMission(){

 const targets=[
  [300,-250],
  [-450,300],
  [-350,-420],
  [500,420],
  [120,350]
 ];


 const target=
  targets[
   (mission-1)%
   targets.length
  ];


 const currentPosition=
  inVehicle?
  vehicle.position:
  player.position;


 const distance=
  Math.hypot(
   currentPosition.x-target[0],
   currentPosition.z-target[1]
  );


 if(
  distance<20
 ){

  score+=500;

  addXP(200);

  mission++;


  if(
   mission>targets.length
  ){

   mission=1;

   chapter++;

   showMessage(
    "📖 CHAPTER "+
    chapter+
    " UNLOCKED"
   );

  }else{

   showMessage(
    "🎯 MISSION COMPLETE"
   );
  }
 }
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

 document.getElementById(
  "level"
 ).textContent=level;


 document.getElementById(
  "health"
 ).textContent=
  Math.floor(
   Math.max(0,health)
  );


 document.getElementById(
  "energy"
 ).textContent=
  Math.floor(
   energy
  );


 document.getElementById(
  "xp"
 ).textContent=
  Math.floor(xp);


 document.getElementById(
  "score"
 ).textContent=
  score;


 document.getElementById(
  "chapter"
 ).textContent=
  chapter;


 document.getElementById(
  "mission"
 ).textContent=
  mission;


 document.getElementById(
  "vehicleStatus"
 ).textContent=
  inVehicle?
  "DRIVING":
  "ON FOOT";


 document.getElementById(
  "vehicleHUD"
 ).style.display=
  inVehicle?
  "block":
  "none";


 document.getElementById(
  "speed"
 ).textContent=
  Math.floor(
   Math.abs(vehicleSpeed)*
   3.6
  );


 document.getElementById(
  "fuelBar"
 ).style.width=
  Math.max(
   0,
   vehicleFuel
  )+"%";
}


function showMessage(text){

 const message=
  document.getElementById(
   "message"
  );

 message.textContent=text;

 message.style.opacity=1;

 setTimeout(
  ()=>{
   message.style.opacity=0;
  },
  1300
 );
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener(
 "keydown",
 e=>{

  keys[e.code]=true;


  if(e.code==="Space")
   jump();


  if(e.code==="KeyE")
   enterVehicle();


  if(e.code==="KeyF")
   punch();


  if(e.code==="KeyZ")
   webShot();


  if(e.code==="KeyC")
   burst();


  if(e.code==="KeyB")
   vehicleBoost();
 });


addEventListener(
 "keyup",
 e=>{
  keys[e.code]=false;
 });


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function hold(id,code){

 const button=
  document.getElementById(id);


 const down=e=>{
  e.preventDefault();
  keys[code]=true;
 };


 const up=e=>{
  e.preventDefault();
  keys[code]=false;
 };


 button.addEventListener(
  "touchstart",
  down,
  {passive:false}
 );


 button.addEventListener(
  "touchend",
  up,
  {passive:false}
 );


 button.addEventListener(
  "touchcancel",
  up,
  {passive:false}
 );
}


hold("up","KeyW");
hold("down","KeyS");
hold("left","KeyA");
hold("right","KeyD");


function tap(id,fn){

 document.getElementById(id)
 .addEventListener(
  "touchstart",
  e=>{
   e.preventDefault();
   fn();
  },
  {passive:false}
 );
}


tap("jump",jump);
tap("web",toggleSwing);
tap("punch",punch);
tap("shot",webShot);
tap("vehicle",enterVehicle);
tap("boost",vehicleBoost);


/* TOP BUTTONS */

document.getElementById(
 "vehicleButton"
).onclick=enterVehicle;


document.getElementById(
 "boostButton"
).onclick=vehicleBoost;


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

 const target=
  inVehicle?
  vehicle.position:
  player.position;


 const offset=
  inVehicle?
  new THREE.Vector3(
   0,7,17
  ):
  new THREE.Vector3(
   0,5.5,12
  );


 offset.applyQuaternion(
  inVehicle?
  vehicle.quaternion:
  new THREE.Quaternion()
 );


 camera.position.lerp(
  target.clone().add(offset),
  .075
 );


 camera.lookAt(
  target.x,
  target.y+2,
  target.z
 );
}


/* =====================================================
   AUTO SAVE
===================================================== */

setInterval(
 ()=>{

  try{

   localStorage.setItem(
    "WEBBOUND_V41",
    JSON.stringify({
     x:player.position.x,
     y:player.position.y,
     z:player.position.z,
     vehicleX:vehicle.position.x,
     vehicleY:vehicle.position.y,
     vehicleZ:vehicle.position.z,
     level,
     xp,
     score,
     health,
     energy,
     chapter,
     mission,
     vehicleFuel
    })
   );

  }catch(e){}
 },
 30000
);


/* =====================================================
   MAIN LOOP
===================================================== */

const clock=
 new THREE.Clock();


function loop(){

 requestAnimationFrame(
  loop
 );


 const dt=
  Math.min(
   clock.getDelta(),
   .033
  );


 updateMovement(dt);

 updateVehicle(dt);

 updateSwing(dt);

 updateEnemies(dt);

 updateMission();


 energy=
  Math.min(
   100,
   energy+dt*5
  );


 if(
  health<=0
 ){

  health=100;

  energy=100;

  inVehicle=false;

  player.visible=true;

  player.position.set(
   0,1.1,0
  );

  vehicle.position.set(
   35,0,0
  );

  vehicleSpeed=0;

  showMessage(
   "📍 CHECKPOINT RESTORED"
  );
 }


 updateUI();

 updateCamera();


 renderer.render(
  scene,
  camera
 );
}


updateUI();

loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 });

</script>

</body>
</html>
