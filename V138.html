<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V138</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:#071018;
  color:white;
  font-family:Arial,sans-serif
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:linear-gradient(#182833,#09131b)
}

.road{
  position:absolute;
  background:#252c32;
  z-index:3
}

.road.h{
  height:38px;
  left:0;
  right:0
}

.road.v{
  width:38px;
  top:0;
  bottom:0
}

#buildings{
  position:absolute;
  inset:0;
  z-index:5
}

.building{
  position:absolute;
  background:#1b2935;
  border:1px solid #ffffff18;
  border-radius:8px
}

.label{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  white-space:nowrap
}

#player{
  position:absolute;
  width:22px;
  height:30px;
  background:#268de5;
  border-radius:9px 9px 4px 4px;
  transform:translate(-50%,-50%);
  z-index:7000
}

#player:before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  left:4.5px;
  top:-9px;
  border-radius:50%;
  background:#c9936c
}

.npc{
  position:absolute;
  width:17px;
  height:25px;
  border-radius:8px 8px 4px 4px;
  z-index:2000
}

.npc:before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  left:3.5px;
  top:-8px;
  border-radius:50%;
  background:#c9936c
}

.npcName{
  position:absolute;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  font-size:7px;
  white-space:nowrap;
  text-shadow:0 1px 3px #000
}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  z-index:1800
}

.station{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:7px;
  z-index:2500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#182c3b;
  border:1px solid #ffffff30;
  font-size:17px
}

.emergency{
  position:absolute;
  width:39px;
  height:17px;
  border-radius:5px;
  z-index:5000;
  box-shadow:0 2px 9px #000
}

.police{background:#285080}
.ambulance{background:#e8e8e8}
.fire{background:#c63c2d}

.emergency:before{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  top:3px;
  height:7px;
  background:#9fc0ce;
  border-radius:2px
}

.caseMarker{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  z-index:5500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#712d88;
  border:2px solid #e8a7ff;
  box-shadow:0 0 12px #a84bd8;
  animation:pulse 1.1s infinite
}

@keyframes pulse{
  50%{transform:scale(1.2)}
}

#hud{
  position:fixed;
  left:10px;
  bottom:10px;
  width:min(440px,94vw);
  padding:13px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:14px;
  z-index:9000
}

#title{
  font-size:14px;
  font-weight:bold
}

#stats{
  margin-top:8px;
  font-size:10px;
  line-height:1.7
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px
}

button{
  flex:1;
  min-width:92px;
  padding:8px;
  border:1px solid #ffffff18;
  border-radius:8px;
  background:#172535;
  color:white;
  font-size:9px
}

#clock{
  position:fixed;
  right:10px;
  top:10px;
  z-index:9000;
  padding:9px 12px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:10px;
  font-size:11px
}

#message{
  position:fixed;
  left:50%;
  top:16%;
  transform:translateX(-50%);
  z-index:9500;
  display:none;
  padding:10px 15px;
  background:#03070cf5;
  border:1px solid #ffffff30;
  border-radius:10px;
  font-size:11px;
  text-align:center
}

#panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(470px,94vw);
  max-height:80vh;
  overflow:auto;
  display:none;
  padding:15px;
  background:#03070cf9;
  border:1px solid #ffffff30;
  border-radius:16px;
  z-index:12000
}

#panelTitle{
  font-size:14px;
  font-weight:bold
}

.row{
  margin-top:8px;
  padding:10px;
  background:#111c28;
  border-radius:9px;
  font-size:10px
}

.close{
  width:100%;
  margin-top:10px
}

.progress{
  height:8px;
  background:#25313c;
  border-radius:5px;
  margin-top:7px;
  overflow:hidden
}

.progress i{
  display:block;
  height:100%;
  width:0;
  background:#b45ad7
}
</style>
</head>

<body>

<div id="world">

  <div class="road h" style="top:27%"></div>
  <div class="road h" style="top:67%"></div>

  <div class="road v" style="left:24%"></div>
  <div class="road v" style="left:56%"></div>
  <div class="road v" style="left:78%"></div>

  <div id="buildings"></div>

  <div id="player"></div>

</div>

<div id="clock">📅 Day 1 • 🕐 08:00</div>

<div id="message"></div>

<div id="hud">

  <div id="title">
    🕵️ WEBBOUND V138 — POLICE INVESTIGATION
  </div>

  <div id="stats"></div>

  <div class="buttons">

    <button onclick="V138.casePanel()">
      🕵️ CASES
    </button>

    <button onclick="V138.investigate()">
      🔎 INVESTIGATE
    </button>

    <button onclick="V138.collectEvidence()">
      🧪 EVIDENCE
    </button>

    <button onclick="V138.interview()">
      🗣️ INTERVIEW
    </button>

    <button onclick="V138.cityPanel()">
      🏙️ CITY
    </button>

    <button onclick="V138.advanceHour()">
      ⏩ +1 HOUR
    </button>

  </div>

</div>

<div id="panel">

  <div id="panelTitle">
    WEBBOUND V138
  </div>

  <div id="panelContent"></div>

  <button class="close" onclick="V138.closePanel()">
    CLOSE
  </button>

</div>

<script>

const V138={

  saveKey:"WEBBOUND_V137",

  running:true,

  hour:8,

  day:1,

  keys:{},

  player:{
    x:window.innerWidth/2,
    y:window.innerHeight/2,
    money:1000,
    reputation:0,
    job:"Detective"
  },

  npcs:[],
  cars:[],
  stations:[],
  emergencyVehicles:[],
  cases:[],

  stats:{
    casesOpened:0,
    casesSolved:0,
    evidence:0,
    interviews:0,
    arrests:0,
    investigationScore:0
  },

  /* ================================
     INIT
     ================================ */

  init(){

    this.load();

    this.createBuildings();

    this.createStations();

    this.createNPCs();

    this.createCars();

    this.createEmergencyVehicles();

    this.keyboard();

    this.render();

    setInterval(
      ()=>{
        if(this.running){
          this.update();
        }
      },
      40
    );

    setInterval(
      ()=>{
        if(this.running){
          this.randomCase();
        }
      },
      9000
    );

    this.message(
      "🕵️ Investigation department online"
    );

  },

  /* ================================
     BUILDINGS
     ================================ */

  createBuildings(){

    const root=
      document.getElementById(
        "buildings"
      );

    root.innerHTML="";

    const data=[

      ["🏠 Homes",5,6,17,18],

      ["🏫 School",29,7,17,15],

      ["🏥 Hospital",60,7,14,15],

      ["🏢 Offices",81,7,15,16],

      ["🏪 Shops",81,45,15,16],

      ["🌳 Park",29,47,18,17],

      ["🍽️ Restaurant",60,46,15,15],

      ["🏭 Factory",5,46,17,16]

    ];

    data.forEach(
      d=>{

        const el=
          document.createElement(
            "div"
          );

        el.className="building";

        el.style.left=d[1]+"%";
        el.style.top=d[2]+"%";
        el.style.width=d[3]+"%";
        el.style.height=d[4]+"%";

        const label=
          document.createElement(
            "div"
          );

        label.className="label";
        label.textContent=d[0];

        el.appendChild(label);

        root.appendChild(el);

      }
    );

  },

  /* ================================
     STATIONS
     ================================ */

  createStations(){

    const data=[
      {
        type:"police",
        icon:"🚓",
        name:"Police HQ",
        x:.12,
        y:.20
      },
      {
        type:"medical",
        icon:"🏥",
        name:"Hospital",
        x:.65,
        y:.18
      },
      {
        type:"fire",
        icon:"🚒",
        name:"Fire Station",
        x:.87,
        y:.35
      }
    ];

    data.forEach(
      d=>{

        const el=
          document.createElement(
            "div"
          );

        el.className="station";

        el.textContent=d.icon;

        el.style.left=
          `calc(${d.x*100}% - 15px)`;

        el.style.top=
          `calc(${d.y*100}% - 15px)`;

        document
          .getElementById("world")
          .appendChild(el);

        this.stations.push({

          type:d.type,
          name:d.name,

          x:
            window.innerWidth*d.x,

          y:
            window.innerHeight*d.y,

          element:el

        });

      }
    );

  },

  /* ================================
     NPCS
     ================================ */

  createNPCs(){

    if(this.npcs.length)
      return;

    const names=[
      "Alex","Sam","Ryan","Maya",
      "Arun","Riya","Dev","Asha",
      "Noah","Leo","Avi","Zara",
      "Kiran","Nikhil","Anu",
      "Rahul","Meera","Vikram"
    ];

    for(
      let i=0;
      i<18;
      i++
    ){

      this.npcs.push({

        id:i+1,

        name:
          names[
            i%names.length
          ],

        x:
          Math.random()*
          window.innerWidth,

        y:
          160+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-220
          ),

        targetX:
          Math.random()*
          window.innerWidth,

        targetY:
          160+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-220
          ),

        trust:
          35+
          Math.floor(
            Math.random()*60
          ),

        element:null

      });

    }

  },

  /* ================================
     CARS
     ================================ */

  createCars(){

    if(this.cars.length)
      return;

    for(
      let i=0;
      i<12;
      i++
    ){

      const horizontal=
        Math.random()>.5;

      this.cars.push({

        x:
          horizontal
          ? Math.random()*
            window.innerWidth
          : window.innerWidth*.24,

        y:
          horizontal
          ? (
              Math.random()>.5
              ? window.innerHeight*.27+12
              : window.innerHeight*.67+12
            )
          : Math.random()*
            window.innerHeight,

        horizontal,

        speed:
          1+
          Math.random()*1.4,

        direction:
          Math.random()>.5
          ? 1
          : -1,

        element:null

      });

    }

  },

  /* ================================
     EMERGENCY VEHICLES
     ================================ */

  createEmergencyVehicles(){

    if(this.emergencyVehicles.length)
      return;

    [
      "police",
      "police",
      "medical",
      "fire"
    ].forEach(
      (type,index)=>{

        const s=
          this.stations.find(
            x=>x.type===type
          );

        this.emergencyVehicles.push({

          id:index+1,
          type,

          x:s.x,
          y:s.y,

          targetX:s.x,
          targetY:s.y,

          speed:1.4,

          available:true,

          element:null

        });

      }
    );

  },

  /* ================================
     UPDATE
     ================================ */

  update(){

    this.movePlayer();

    this.updateNPCs();

    this.updateCars();

    this.updateVehicles();

    this.updateCases();

    this.updateTime();

    this.updateHUD();

  },

  updateNPCs(){

    this.npcs.forEach(
      n=>{

        const dx=n.targetX-n.x;
        const dy=n.targetY-n.y;

        const d=
          Math.sqrt(
            dx*dx+dy*dy
          );

        if(d<10){

          n.targetX=
            Math.random()*
            window.innerWidth;

          n.targetY=
            160+
            Math.random()*
            Math.max(
              1,
              window.innerHeight-220
            );

        }
        else{

          n.x+=dx/d*.42;
          n.y+=dy/d*.42;

        }

      }
    );

  },

  updateCars(){

    this.cars.forEach(
      c=>{

        if(c.horizontal)
          c.x+=c.speed*c.direction;
        else
          c.y+=c.speed*c.direction;

        if(
          c.x<-70||
          c.x>window.innerWidth+70
        )
          c.x=
            c.direction>0
            ? -70
            : window.innerWidth+70;

        if(
          c.y<-70||
          c.y>window.innerHeight+70
        )
          c.y=
            c.direction>0
            ? -70
            : window.innerHeight+70;

      }
    );

  },

  updateVehicles(){

    this.emergencyVehicles.forEach(
      v=>{

        const dx=v.targetX-v.x;
        const dy=v.targetY-v.y;

        const d=
          Math.sqrt(
            dx*dx+dy*dy
          );

        if(d>8){

          v.x+=dx/d*v.speed;
          v.y+=dy/d*v.speed;

        }
        else{

          v.available=true;

        }

      }
    );

  },

  /* ================================
     RANDOM CASE
     ================================ */

  randomCase(){

    if(this.cases.length>=3)
      return;

    const types=[

      {
        name:"Shop Theft",
        icon:"🛍️",
        location:"Shop District"
      },

      {
        name:"Missing Property",
        icon:"📦",
        location:"Residential Area"
      },

      {
        name:"Vehicle Theft",
        icon:"🚗",
        location:"City Road"
      },

      {
        name:"Office Investigation",
        icon:"🏢",
        location:"Business District"
      },

      {
        name:"Park Incident",
        icon:"🌳",
        location:"Central Park"
      }

    ];

    const t=
      types[
        Math.floor(
          Math.random()*types.length
        )
      ];

    const suspect=
      this.npcs[
        Math.floor(
          Math.random()*this.npcs.length
        )
      ];

    const c={

      id:Date.now(),

      name:t.name,

      icon:t.icon,

      location:t.location,

      x:
        60+
        Math.random()*
        Math.max(
          1,
          window.innerWidth-120
        ),

      y:
        170+
        Math.random()*
        Math.max(
          1,
          window.innerHeight-230
        ),

      suspect:suspect.name,

      evidence:0,

      interviews:0,

      progress:0,

      solved:false,

      marker:null

    };

    this.cases.push(c);

    this.stats.casesOpened++;

    this.message(
      t.icon+
      " New case: "+
      t.name
    );

  },

  /* ================================
     INVESTIGATE
     ================================ */

  investigate(){

    const c=
      this.nearestCase();

    if(!c){

      this.message(
        "🕵️ No active case nearby"
      );

      return;

    }

    if(c.progress>=100){

      this.message(
        "✅ This case is complete"
      );

      return;

    }

    c.progress=
      Math.min(
        100,
        c.progress+15
      );

    this.stats.investigationScore+=2;

    this.message(
      "🔎 Investigation progressed +15%"
    );

    if(c.progress>=100)
      this.solveCase(c);

  },

  /* ================================
     EVIDENCE
     ================================ */

  collectEvidence(){

    const c=
      this.nearestCase();

    if(!c){

      this.message(
        "🧪 No investigation scene nearby"
      );

      return;

    }

    if(c.evidence>=3){

      this.message(
        "🧪 All available evidence collected"
      );

      return;

    }

    c.evidence++;

    this.stats.evidence++;

    c.progress=
      Math.min(
        100,
        c.progress+20
      );

    this.message(
      "🧪 Evidence collected "+
      "("+
      c.evidence+
      "/3)"
    );

  },

  /* ================================
     INTERVIEW
     ================================ */

  interview(){

    const c=
      this.nearestCase();

    if(!c){

      this.message(
        "🗣️ No case nearby"
      );

      return;

    }

    const suspect=
      this.npcs.find(
        n=>n.name===c.suspect
      );

    c.interviews++;

    this.stats.interviews++;

    c.progress=
      Math.min(
        100,
        c.progress+
        (
          suspect &&
          suspect.trust>65
          ? 22
          : 10
        )
      );

    this.message(
      "🗣️ Interview completed"
    );

    if(c.progress>=100)
      this.solveCase(c);

  },

  /* ================================
     SOLVE CASE
     ================================ */

  solveCase(c){

    if(c.solved)
      return;

    c.solved=true;

    this.stats.casesSolved++;

    this.stats.investigationScore+=10;

    this.player.money+=
      150+
      c.evidence*50;

    this.player.reputation+=5;

    this.message(
      "🏆 Case solved! +₹"+
      (
        150+
        c.evidence*50
      )
    );

  },

  /* ================================
     NEAREST CASE
     ================================ */

  nearestCase(){

    let best=null;
    let bestDistance=Infinity;

    this.cases.forEach(
      c=>{

        if(c.solved)
          return;

        const dx=
          c.x-this.player.x;

        const dy=
          c.y-this.player.y;

        const d=
          Math.sqrt(
            dx*dx+dy*dy
          );

        if(d<bestDistance){

          bestDistance=d;
          best=c;

        }

      }
    );

    return bestDistance<150
      ? best
      : null;

  },

  /* ================================
     CASE PANEL
     ================================ */

  casePanel(){

    let html="";

    if(!this.cases.length){

      html=`
      <div class="row">
      No active investigations.
      Wait for a new case.
      </div>
      `;

    }

    this.cases.forEach(
      c=>{

        html+=`

        <div class="row">

          <b>
          ${c.icon} ${c.name}
          </b>

          <br>

          📍 ${c.location}

          <br>

          👤 Person of interest:
          ${c.suspect}

          <br>

          🧪 Evidence:
          ${c.evidence}/3

          <br>

          🗣️ Interviews:
          ${c.interviews}

          <br>

          🔎 Progress:
          ${c.progress}%

          <div class="progress">
            <i style="width:${c.progress}%"></i>
          </div>

          <br>

          ${
            c.solved
            ? "🏆 SOLVED"
            : "🔴 ACTIVE"
          }

        </div>

        `;

      }
    );

    this.openPanel(
      "🕵️ ACTIVE CASES",
      html
    );

  },

  /* ================================
     CITY PANEL
     ================================ */

  cityPanel(){

    this.openPanel(
      "🏙️ CITY INVESTIGATION STATUS",
      `

      <div class="row">
      👥 Citizens:
      ${this.npcs.length}
      </div>

      <div class="row">
      🚗 Vehicles:
      ${this.cars.length}
      </div>

      <div class="row">
      📁 Cases Opened:
      ${this.stats.casesOpened}
      </div>

      <div class="row">
      🏆 Cases Solved:
      ${this.stats.casesSolved}
      </div>

      <div class="row">
      🧪 Evidence Collected:
      ${this.stats.evidence}
      </div>

      <div class="row">
      🗣️ Interviews:
      ${this.stats.interviews}
      </div>

      <div class="row">
      ⭐ Investigation Score:
      ${this.stats.investigationScore}
      </div>

      <div class="row">
      💰 Money:
      ₹${Math.floor(this.player.money)}
      </div>

      <div class="row">
      🏅 Reputation:
      ${this.player.reputation}
      </div>

      `
    );

  },

  /* ================================
     TIME
     ================================ */

  updateTime(){

    this.hour+=.025;

    if(this.hour>=24){

      this.hour=0;
      this.day++;

      this.save();

      this.message(
        "🌅 New day — investigation department refreshed"
      );

    }

    const h=
      Math.floor(this.hour);

    const m=
      Math.floor(
        (this.hour-h)*60
      );

    document.getElementById(
      "clock"
    ).textContent=
      "📅 Day "+
      this.day+
      " • 🕐 "+
      String(h).padStart(2,"0")+
