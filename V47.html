<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WEBBOUND V47</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;z-index:20;left:10px;top:10px;width:285px;
 padding:13px;color:#fff;background:rgba(0,0,0,.78);
 border:1px solid rgba(255,255,255,.2);border-radius:15px;
 font-size:11px;line-height:1.5
}
.title{font-size:18px;font-weight:800}
.sub{color:#63dcff}
#objective{color:#ffd34d}
#wanted{color:#ff4055;font-weight:bold}

#box{
 position:fixed;z-index:20;right:10px;top:205px;width:185px;
 padding:10px;text-align:center;color:white;
 background:rgba(0,0,0,.78);border-radius:13px;
 border:1px solid rgba(255,255,255,.2)
}
#stars{font-size:23px;color:#ff4055}
#status{font-weight:bold}
#safe{color:#66ff99;margin-top:4px}

#map{
 position:fixed;z-index:20;right:10px;top:10px;
 width:180px;height:180px;border-radius:14px;
 overflow:hidden;border:2px solid rgba(255,255,255,.25);
 background:#06101a
}
#mapCanvas{width:100%;height:100%}

#buttons{
 position:fixed;z-index:30;right:205px;top:10px;
 display:flex;gap:5px
}

button{
 color:#fff;background:rgba(0,0,0,.78);
 border:1px solid rgba(255,255,255,.25);
 border-radius:11px;font-weight:bold;font-size:10px;
 touch-action:none
}
button:active{transform:scale(.94)}

#message{
 position:fixed;z-index:100;top:24%;left:50%;
 transform:translateX(-50%);width:92%;text-align:center;
 color:#fff;font-size:25px;font-weight:800;
 text-shadow:0 5px 20px #000;opacity:0;
 transition:.25s
}

#touch{
 position:fixed;z-index:40;left:0;right:0;bottom:8px;
 display:flex;justify-content:space-between;
 padding:8px;pointer-events:none
}
.pad,.actions{display:grid;gap:5px;pointer-events:auto}
.pad{grid-template-columns:48px 48px 48px}
.actions{grid-template-columns:52px 52px}
#touch button{width:52px;height:52px}
.empty{visibility:hidden}

@media(max-width:600px){
 #hud{width:235px;font-size:10px}
 #map{width:135px;height:135px;top:125px}
 #buttons{right:10px;top:268px}
 #box{top:365px;width:135px}
}
</style>
</head>

<body>

<div id="hud">
 <div class="title">🕷️ WEBBOUND V47</div>
 <div class="sub">ESCAPE & SAFE-ZONE SYSTEM</div>

 <div>
  ⭐ Level: <b id="level">1</b><br>
  ❤️ Health: <b id="health">100</b><br>
  🕸️ Energy: <b id="energy">100</b><br>
  ⭐ XP: <b id="xp">0</b><br>
  🏆 Score: <b id="score">0</b><br>
  📖 Chapter: <b id="chapter">1</b><br>
  🎯 Mission: <b id="mission">1</b>
 </div>

 <div style="margin-top:7px">
  🚨 Wanted: <span id="wanted">0</span>
 </div>

 <div style="margin-top:7px">
  🎯 Objective:<br>
  <b id="objective">Complete the mission</b>
 </div>

 <div>
  📍 Distance: <b id="distance">0</b> m
 </div>
</div>


<div id="map">
 <canvas id="mapCanvas" width="360" height="360"></canvas>
</div>


<div id="box">
 <div id="stars">☆☆☆☆☆</div>
 <div id="status">PEACEFUL</div>
 <div id="safe">SAFE ZONE: NO</div>
</div>


<div id="buttons">
 <button id="mapBtnTop">🗺️ MAP</button>
 <button id="wantedBtnTop">🚨 WANTED</button>
</div>


<div id="message"></div>


<div id="touch">

 <div class="pad">
  <button class="empty"></button>
  <button id="up">▲</button>
  <button class="empty"></button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>

 <div class="actions">
  <button id="jump">JUMP</button>
  <button id="web">WEB</button>
  <button id="punch">PUNCH</button>
  <button id="shot">SHOT</button>
  <button id="map">MAP</button>
  <button id="wantedBtn">WANTED</button>
 </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
 68,
 innerWidth/innerHeight,
 .1,
 3500
);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.3));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);


/* =====================================================
   LIGHT
===================================================== */

const sun=new THREE.DirectionalLight(
 0xffffff,1.7
);

sun.position.set(-400,700,300);
sun.castShadow=true;
scene.add(sun);

scene.add(
 new THREE.HemisphereLight(
 0x7897c4,
 0x05070b,
 1.1
 )
);


/* =====================================================
   CITY
===================================================== */

const buildings=[];

for(let x=-850;x<=850;x+=100){

 for(let z=-850;z<=850;z+=100){

  if(Math.abs(x)<100&&Math.abs(z)<100)
   continue;

  const h=70+Math.random()*250;

  const b=new THREE.Mesh(
   new THREE.BoxGeometry(
    55+Math.random()*20,
    h,
    55+Math.random()*20
   ),
   new THREE.MeshStandardMaterial({
    color:
     [0x17212b,0x222c36,0x101920]
     [Math.floor(Math.random()*3)]
   })
  );

  b.position.set(x,h/2,z);
  b.castShadow=true;

  scene.add(b);
  buildings.push(b);
 }
}


/* =====================================================
   GROUND
===================================================== */

const ground=new THREE.Mesh(
 new THREE.PlaneGeometry(3000,3000),
 new THREE.MeshStandardMaterial({
  color:0x070a0e
 })
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);


/* =====================================================
   ROADS
===================================================== */

const roadMat=new THREE.MeshStandardMaterial({
 color:0x111318
});

for(let x=-800;x<=800;x+=200){

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(32,.05,1700),
  roadMat
 );

 road.position.set(x,.02,0);
 scene.add(road);
}

for(let z=-800;z<=800;z+=200){

 const road=new THREE.Mesh(
  new THREE.BoxGeometry(1700,.05,32),
  roadMat
 );

 road.position.set(0,.02,z);
 scene.add(road);
}


/* =====================================================
   SAFE ZONES
===================================================== */

const safeZones=[
 {x:0,z:0,r:85,name:"CENTRAL HQ"},
 {x:-600,z:400,r:70,name:"NORTH SAFEHOUSE"},
 {x:600,z:-400,r:70,name:"EAST SAFEHOUSE"}
];

for(const zone of safeZones){

 const ring=new THREE.Mesh(
  new THREE.RingGeometry(
   zone.r-1,
   zone.r,
   48
  ),
  new THREE.MeshBasicMaterial({
   color:0x24ff88,
   transparent:true,
   opacity:.55,
   side:THREE.DoubleSide
  })
 );

 ring.rotation.x=-Math.PI/2;
 ring.position.set(zone.x,.08,zone.z);

 scene.add(ring);
}


/* =====================================================
   PLAYER
===================================================== */

const player=new THREE.Group();

player.position.set(0,1.1,0);
scene.add(player);

const suit=new THREE.MeshStandardMaterial({
 color:0xa8192d
});

const body=new THREE.Mesh(
 new THREE.CapsuleGeometry(.65,1.55,8,14),
 suit
);

body.position.y=1.45;
player.add(body);

const head=new THREE.Mesh(
 new THREE.SphereGeometry(.57,20,16),
 suit
);

head.position.y=2.75;
player.add(head);

const eyes=new THREE.MeshBasicMaterial({
 color:0xffffff
});

for(const x of [-.2,.2]){

 const eye=new THREE.Mesh(
  new THREE.SphereGeometry(.18,12,10),
  eyes
 );

 eye.position.set(x,2.78,-.54);
 eye.scale.z=.18;

 player.add(eye);
}


/* =====================================================
   GAME STATE
===================================================== */

const velocity=new THREE.Vector3();
const input=new THREE.Vector3();
const keys={};

let grounded=true;
let doubleJump=true;

let health=100;
let energy=100;
let xp=0;
let score=0;
let level=1;
let chapter=1;
let mission=1;


/* =====================================================
   WANTED
===================================================== */

let wantedLevel=0;
let wantedHeat=0;

function updateWanted(){

 if(wantedHeat<10)
  wantedLevel=0;
 else if(wantedHeat<30)
  wantedLevel=1;
 else if(wantedHeat<50)
  wantedLevel=2;
 else if(wantedHeat<70)
  wantedLevel=3;
 else if(wantedHeat<85)
  wantedLevel=4;
 else
  wantedLevel=5;

 document.getElementById(
  "wanted"
 ).textContent=wantedLevel;

 let stars="";

 for(let i=1;i<=5;i++)
  stars+=i<=wantedLevel?"★":"☆";

 document.getElementById(
  "stars"
 ).textContent=stars;

 document.getElementById(
  "status"
 ).textContent=
  wantedLevel?
  "POLICE SEARCHING":
  "PEACEFUL";
}

function addWanted(amount){

 const old=wantedLevel;

 wantedHeat=
  Math.min(
   100,
   wantedHeat+amount
  );

 updateWanted();

 if(wantedLevel>old)
  showMessage(
   "🚨 WANTED LEVEL "+wantedLevel
  );
}


/* =====================================================
   POLICE
===================================================== */

const police=[];

function createPolice(){

 const car=new THREE.Group();

 const body=new THREE.Mesh(
  new THREE.BoxGeometry(4.3,1.25,7),
  new THREE.MeshStandardMaterial({
   color:0x10151c
  })
 );

 body.position.y=.75;
 car.add(body);

 const roof=new THREE.Mesh(
  new THREE.BoxGeometry(3,1,3.3),
  new THREE.MeshStandardMaterial({
   color:0xf1f1f1
  })
 );

 roof.position.y=1.6;
 car.add(roof);

 const red=new THREE.Mesh(
  new THREE.BoxGeometry(.55,.2,.3),
  new THREE.MeshBasicMaterial({
   color:0xff0000
  })
 );

 red.position.set(-.7,2.1,0);
 car.add(red);

 const blue=new THREE.Mesh(
  new THREE.BoxGeometry(.55,.2,.3),
  new THREE.MeshBasicMaterial({
   color:0x0066ff
  })
 );

 blue.position.set(.7,2.1,0);
 car.add(blue);

 const a=Math.random()*Math.PI*2;
 const d=120+Math.random()*120;

 car.position.set(
  player.position.x+Math.cos(a)*d,
  0,
  player.position.z+Math.sin(a)*d
 );

 car.userData={
  speed:13+Math.random()*7,
  red,
  blue
 };

 scene.add(car);
 police.push(car);
}

function updatePolice(dt){

 while(police.length<wantedLevel)
  createPolice();

 while(police.length>wantedLevel){

  const p=police.pop();
  scene.remove(p);
 }

 for(const car of police){

  const dir=new THREE.Vector3()
   .subVectors(
    player.position,
    car.position
   );

  dir.y=0;

  const distance=dir.length();

  if(distance>2){

   dir.normalize();

   car.position.addScaledVector(
    dir,
    car.userData.speed*dt
   );

   car.lookAt(
    player.position.x,
    0,
    player.position.z
   );
  }

  const blink=
   Math.floor(
    performance.now()/120
   )%2===0;

  car.userData.red.visible=blink;
  car.userData.blue.visible=!blink;

  if(distance<7){

   health-=
    (8+wantedLevel*2)*dt;

   wantedHeat=
    Math.min(
     100,
     wantedHeat+dt*1.5
    );
  }
 }
}


/* =====================================================
   MISSIONS
===================================================== */

const missions=[
 {
  name:"CITY RUN",
  target:[300,-250],
  reward:500,
  xp:200
 },
 {
  name:"ROOFTOP RUN",
  target:[-450,300],
  reward:750,
  xp:300
 },
 {
  name:"POLICE ESCAPE",
  target:[-600,400],
  reward:1000,
  xp:400
 },
 {
  name:"DOWNTOWN CHASE",
  target:[600,-400],
  reward:1300,
  xp:500
 }
];

let missionDone=false;

function getMission(){
 return missions[
  (mission-1)%missions.length
 ];
}

function getTarget(){

 const m=getMission();

 return new THREE.Vector3(
  m.target[0],
  1,
  m.target[1]
 );
}

function xpNeeded(){
 return 500+(level-1)*250;
}

function addXP(amount){

 xp+=amount;

 while(xp>=xpNeeded()){

  xp-=xpNeeded();
  level++;

  health=100;
  energy=100;

  showMessage(
   "⭐ LEVEL "+level+"!"
  );
 }
}


/* =====================================================
   MISSION LOGIC
===================================================== */

function updateMission(){

 const m=getMission();
 const target=getTarget();

 const d=Math.hypot(
  player.position.x-target.x,
  player.position.z-target.z
 );

 document.getElementById(
  "distance"
 ).textContent=Math.floor(d);

 document.getElementById(
  "objective"
 ).textContent=m.name;

 if(
  mission===3 &&
  wantedLevel===0 &&
  !missionDone
 ){

  addWanted(35);

  showMessage(
   "🚨 POLICE ALERT!"
  );
 }


 if(
  d<28 &&
  !missionDone
 ){

  missionDone=true;

  score+=m.reward;
  addXP(m.xp);

  showMessage(
   "🎯 MISSION COMPLETE!"
  );

  setTimeout(()=>{

   mission++;

   if(mission>missions.length){

    mission=1;
    chapter++;

    showMessage(
     "📖 CHAPTER "+
     chapter+
     " UNLOCKED!"
    );
   }

   missionDone=false;

  },1600);
 }
}


/* =====================================================
   SAFE ZONE
===================================================== */

let insideSafe=false;

function updateSafeZone(dt){

 let found=false;
 let zoneName="";

 for(const z of safeZones){

  const d=Math.hypot(
   player.position.x-z.x,
   player.position.z-z.z
  );

  if(d<z.r){

   found=true;
   zoneName=z.name;
   break;
  }
 }

 if(found){

  document.getElementById(
   "safe"
  ).textContent=
   "SAFE ZONE: YES";

  health=Math.min(
   100,
   health+dt*10
  );

  if(wantedLevel>0){

   wantedHeat=
    Math.max(
     0,
     wantedHeat-dt*12
    );

   updateWanted();
  }

  if(!insideSafe)
   showMessage(
    "🟢 "+zoneName
   );

 }else{

  document.getElementById(
   "safe"
  ).textContent=
   "SAFE ZONE: NO";
 }

 insideSafe=found;
}


/* =====================================================
   MOVEMENT
===================================================== */

function jump(){

 if(grounded){

  velocity.y=15;
  grounded=false;
  doubleJump=true;

 }else if(doubleJump){

  velocity.y=13;
  doubleJump=false;
 }
}

function updateMovement(dt){

 input.set(0,0,0);

 if(keys.KeyW)input.z-=1;
 if(keys.KeyS)input.z+=1;
 if(keys.KeyA)input.x-=1;
 if(keys.KeyD)input.x+=1;

 if(input.length())
  input.normalize();

 const speed=
  keys.ShiftLeft?14:9;

 velocity.x+=
  input.x*speed*dt*5;

 velocity.z+=
  input.z*speed*dt*5;

 velocity.x*=.91;
 velocity.z*=.91;

 if(!grounded)
  velocity.y-=30*dt;

 player.position.addScaledVector(
  velocity,
  dt
 );

 if(player.position.y<=1.1){

  player.position.y=1.1;
  velocity.y=0;
  grounded=true;
  doubleJump=true;
 }
}


/* =====================================================
   WEB SWING
===================================================== */

let swinging=false;
let anchor=null;
let webLine=null;

function findAnchor(){

 let best=null;
 let closest=450;

 for(const b of buildings){

  const h=
   b.geometry.parameters.height;

  const point=new THREE.Vector3(
   b.position.x,
   b.position.y+h/2,
   b.position.z
  );

  const d=
   point.distanceTo(
    player.position
   );

  if(
   d<closest &&
   point.y>player.position.y+8
  ){

   closest=d;
   best=point;
  }
 }

 return best;
}

function toggleSwing(){

 if(swinging){

  swinging=false;

  if(webLine){
   scene.remove(webLine);
   webLine=null;
  }

  velocity.multiplyScalar(1.4);
  return;
 }

 const p=findAnchor();

 if(!p)return;

 anchor=p;
 swinging=true;

 webLine=new THREE.Line(
  new THREE.BufferGeometry()
   .setFromPoints([
    player.position.clone(),
    anchor.clone()
   ]),
  new THREE.LineBasicMaterial({
   color:0xffffff
  })
 );

 scene.add(webLine);
}

function updateSwing(dt){

 if(!swinging)return;

 const pull=new THREE.Vector3()
  .subVectors(
   anchor,
   player.position
  );

 const distance=pull.length();

 pull.normalize();

 if(distance>10){

  velocity.addScaledVector(
   pull,
   (distance-10)*dt*16
  );
 }

 velocity.y-=7*dt;

 if(webLine){

  const p=
   webLine.geometry
    .attributes.position.array;

  p[0]=player.position.x;
  p[1]=player.position.y+1;
  p[2]=player.position.z;

  p[3]=anchor.x;
  p[4]=anchor.y;
  p[5]=anchor.z;

  webLine.geometry
   .attributes.position
   .needsUpdate=true;
 }
}


/* =====================================================
   ENEMIES
===================================================== */

const enemies=[];

function createEnemy(){

 const e=new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .55,1,6,10
  ),
  new THREE.MeshStandardMaterial({
   color:0x353941
  })
 );

 const a=Math.random()*Math.PI*2;
 const d=120+Math.random()*180;

 e.position.set(
  player.position.x+Math.cos(a)*d,
  1,
  player.position.z+Math.sin(a)*d
 );

 e.userData={
  health:100,
  speed:4
 };

 scene.add(e);
 enemies.push(e);
}

for(let i=0;i<8;i++)
 createEnemy();

function nearestEnemy(range){

 let target=null;
 let best=range;

 for(const e of enemies){

  const d=e.position.distanceTo(
   player.position
  );

  if(d<best){

   best=d;
   target=e;
  }
 }

 return target;
}

function punch(){

 const e=nearestEnemy(7);

 if(!e)return;

 e.userData.health-=50;

 score+=100;
 addXP(20);
 addWanted(2);

 if(e.userData.health<=0){

  score+=250;
  addXP(100);

  scene.remove(e);

  const i=enemies.indexOf(e);

  if(i>=0)
   enemies.splice(i,1);

  setTimeout(
   createEnemy,
   1200
  );
 }
}

function webShot(){

 if(energy<15)return;

 const e=nearestEnemy(40);

 if(!e)return;

 energy-=15;

 e.userData.health-=60;

 addWanted(1);

 if(e.userData.health<=0){

  score+=250;
  addXP(100);

  scene.remove(e);

  const i=enemies.indexOf(e);

  if(i>=0)
   enemies.splice(i,1);

  setTimeout(
   createEnemy,
   1200
  );
 }
}

function updateEnemies(dt){

 for(const e of enemies){

  const d=
   e.position.distanceTo(
    player.position
   );

  if(d<100){

   const dir=new THREE.Vector3()
    .subVectors(
     player.position,
     e.position
    )
    .normalize();

   dir.y=0;

   e.position.addScaledVector(
    dir,
    e.userData.speed*dt
   );

   if(d<4)
    health-=7*dt;
  }
 }
}


/* =====================================================
   MINIMAP
===================================================== */

const mapCanvas=
 document.getElementById(
  "mapCanvas"
 );

const ctx=
 mapCanvas.getContext("2d");

function worldToMap(x,z){

 return{
  x:180+x*.09,
  y:180+z*.09
 };
}

function drawMap(){

 ctx.fillStyle="#07101a";
 ctx.fillRect(0,0,360,360);

 ctx.strokeStyle="#333a42";
 ctx.lineWidth=8;

 for(let i=-800;i<=800;i+=200){

  let p=worldToMap(i,0);

  ctx.beginPath();
  ctx.moveTo(p.x,0);
  ctx.lineTo(p.x,360);
  ctx.stroke();

  p=worldToMap(0,i);

  ctx.beginPath();
  ctx.moveTo(0,p.y);
  ctx.lineTo(360,p.y);
  ctx.stroke();
 }

 /* safe zones */

 ctx.strokeStyle="#24ff88";
 ctx.lineWidth=2;

 for(const z of safeZones){

  const p=worldToMap(
   z.x,
   z.z
  );

  ctx.beginPath();

  ctx.arc(
   p.x,
   p.y,
   z.r*.09,
   0,
   Math.PI*2
  );

  ctx.stroke();
 }

 /* police */

 ctx.fillStyle="#3388ff";

 for(const p of police){

  const q=worldToMap(
   p.position.x,
   p.position.z
  );

  ctx.fillRect(
   q.x-4,
   q.y-4,
   8,
   8
  );
 }

 /* mission */

 const target=getTarget();

 const t=worldToMap(
  target.x,
  target.z
 );

 ctx.fillStyle="#ffd34d";

 ctx.beginPath();

 ctx.arc(
  t.x,t.y,8,
  0,Math.PI*2
 );

 ctx.fill();

 /* player */

 const p=worldToMap(
  player.position.x,
  player.position.z
 );

 ctx.fillStyle="#ff304f";

 ctx.beginPath();

 ctx.arc(
  p.x,p.y,7,
  0,Math.PI*2
 );

 ctx.fill();
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

 document.getElementById("level")
  .textContent=level;

 document.getElementById("health")
  .textContent=Math.floor(
   Math.max(0,health)
  );

 document.getElementById("energy")
  .textContent=Math.floor(energy);

 document.getElementById("xp")
  .textContent=Math.floor(xp);

 document.getElementById("score")
  .textContent=score;

 document.getElementById("chapter")
  .textContent=chapter;

 document.getElementById("mission")
  .textContent=mission;
}

function showMessage(text){

 const m=
  document.getElementById(
   "message"
  );

 m.textContent=text;
 m.style.opacity=1;

 setTimeout(()=>{
  m.style.opacity=0;
 },1300);
}


/* =====================================================
   WANTED BUTTON
===================================================== */

function triggerWanted(){

 wantedHeat=
  Math.min(
   100,
   wantedHeat+25
  );

 updateWanted();

 showMessage(
  "🚨 POLICE ALERT!"
 );
}


/* =====================================================
   MAP TOGGLE
===================================================== */

let mapVisible=true;

function toggleMap(){

 mapVisible=!mapVisible;

 document.getElementById(
  "map"
 ).style.display=
  mapVisible?"block":"none";
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener("keydown",e=>{

 keys[e.code]=true;

 if(e.code==="Space")jump();
 if(e.code==="KeyE")toggleSwing();
 if(e.code==="KeyF")punch();
 if(e.code==="KeyZ")webShot();
 if(e.code==="KeyM")toggleMap();
 if(e.code==="KeyT")triggerWanted();
});

addEventListener("keyup",e=>{
 keys[e.code]=false;
});


/* =====================================================
   MOBILE
===================================================== */

function hold(id,code){

 const b=
  document.getElementById(id);

 const down=e=>{
  e.preventDefault();
  keys[code]=true;
 };

 const up=e=>{
  e.preventDefault();
  keys[code]=false;
 };

 b.addEventListener(
  "touchstart",
  down,
  {passive:false}
 );

 b.addEventListener(
  "touchend",
  up,
  {passive:false}
 );

 b.addEventListener(
  "touchcancel",
  up,
  {passive:false}
 );
}

hold("up","KeyW");
hold("down","KeyS");
hold("left","KeyA");
hold("right","KeyD");


function tap(id,fn){

 document.getElementById(id)
 .addEventListener(
  "touchstart",
  e=>{
   e.preventDefault();
   fn();
  },
  {passive:false}
 );
}

tap("jump",jump);
tap("web",toggleSwing);
tap("punch",punch);
tap("shot",webShot);
tap("map",toggleMap);
tap("wantedBtn",triggerWanted);

document.getElementById(
 "mapBtnTop"
).onclick=toggleMap;

document.getElementById(
 "wantedBtnTop"
).onclick=triggerWanted;


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

 camera.position.lerp(
  new THREE.Vector3(
   player.position.x,
   player.position.y+5.5,
   player.position.z+12
  ),
  .075
 );

 camera.lookAt(
  player.position.x,
  player.position.y+2,
  player.position.z
 );
}


/* =====================================================
   SAVE
===================================================== */

setInterval(()=>{

 try{

  localStorage.setItem(
   "WEBBOUND_V47",
   JSON.stringify({
    x:player.position.x,
    y:player.position.y,
    z:player.position.z,
    level,
    health,
    energy,
    xp,
    score,
    chapter,
    mission,
    wantedLevel,
    wantedHeat
   })
  );

 }catch(e){}

},30000);


/* =====================================================
   MAIN LOOP
===================================================== */

const clock=new THREE.Clock();

function loop(){

 requestAnimationFrame(loop);

 const dt=Math.min(
  clock.getDelta(),
  .033
 );

 updateMovement(dt);
 updateSwing(dt);
 updateEnemies(dt);
 updatePolice(dt);

 updateSafeZone(dt);
 updateMission();

 if(wantedLevel>0){

  wantedHeat=
   Math.max(
    0,
    wantedHeat-dt*.7
   );

  updateWanted();
 }

 energy=Math.min(
  100,
  energy+dt*5
 );

 if(health<=0){

  health=100;
  energy=100;

  wantedHeat=0;
  updateWanted();

  player.position.set(
   0,1.1,0
  );

  velocity.set(0,0,0);

  showMessage(
   "📍 CHECKPOINT RESTORED"
  );
 }

 updateUI();
 drawMap();
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}

updateWanted();
updateUI();
loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener("resize",()=>{

 camera.aspect=
  innerWidth/innerHeight;

 camera.updateProjectionMatrix();

 renderer.setSize(
  innerWidth,
  innerHeight
 );

});

</script>
</body>
</html>
