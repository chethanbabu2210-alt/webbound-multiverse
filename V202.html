<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Spider-Man Game V202</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Arial,sans-serif;
background:#071017;
color:white;
}

#game{
position:fixed;
inset:0;
overflow:hidden;
background:#789da9;
}

/* SKY */
#sky{
position:absolute;
inset:0;
background:linear-gradient(
#568da2 0%,
#a5c4ca 60%,
#d2d7d3 100%
);
}

#sun{
position:absolute;
width:75px;
height:75px;
border-radius:50%;
right:10%;
top:9%;
background:#fff2ad;
box-shadow:0 0 50px #fff2ad;
}

/* CITY */

.city{
position:absolute;
inset:0;
}

.building{
position:absolute;
bottom:0;
background:#263740;
border:1px solid #ffffff18;
box-shadow:0 0 20px #0005;
}

.building:after{
content:"";
position:absolute;
inset:9px;

background:
repeating-linear-gradient(
90deg,
#dce7e733 0 7px,
transparent 7px 17px
),
repeating-linear-gradient(
0deg,
#dce7e733 0 7px,
transparent 7px 18px
);
}

.b1{left:0;width:11%;height:45%}
.b2{left:12%;width:13%;height:70%}
.b3{left:27%;width:10%;height:52%}
.b4{left:39%;width:16%;height:83%}
.b5{left:57%;width:11%;height:60%}
.b6{left:70%;width:14%;height:76%}
.b7{right:0;width:13%;height:50%}

/* ROADS */

#roadH{
position:absolute;
left:0;
right:0;
bottom:16%;
height:90px;
background:#242a2f;
border-top:3px solid #555;
border-bottom:3px solid #555;
}

#roadH:after{
content:"";
position:absolute;
left:0;
right:0;
top:43px;
border-top:4px dashed #d8c85d;
}

#roadV{
position:absolute;
top:42%;
bottom:0;
left:48%;
width:90px;
background:#242a2f;
border-left:3px solid #555;
border-right:3px solid #555;
}

#roadV:after{
content:"";
position:absolute;
top:0;
bottom:0;
left:43px;
border-left:4px dashed #d8c85d;
}

/* WEB TARGETS */

.webTarget{
position:absolute;
width:15px;
height:15px;
border-radius:50%;
background:#dbe8ee;
border:2px solid #17222a;
box-shadow:
0 0 10px #ffffff,
0 0 22px #78c9ff;
z-index:30;
}

.target1{left:17%;top:28%}
.target2{left:42%;top:18%}
.target3{left:61%;top:30%}
.target4{left:78%;top:20%}
.target5{left:88%;top:40%}
.target6{left:30%;top:38%}

/* SPIDER-MAN */

#spiderman{
position:absolute;
width:34px;
height:48px;
left:50%;
top:50%;
z-index:100;
transform:translate(-50%,-50%);
}

.body{
position:absolute;
width:30px;
height:35px;
left:2px;
top:12px;
border-radius:12px 12px 6px 6px;

background:
linear-gradient(
90deg,
#8b0b13 0%,
#d51622 44%,
#0b2b72 45%,
#071a49 100%
);

border:2px solid #050b15;
}

.head{
position:absolute;
width:25px;
height:25px;
left:4px;
top:-5px;
border-radius:50%;
background:#c91522;
border:2px solid #080c15;
}

.head:before,
.head:after{
content:"";
position:absolute;
width:8px;
height:4px;
background:white;
top:9px;
border:1px solid #111;
}

.head:before{
left:2px;
transform:rotate(25deg);
}

.head:after{
right:2px;
transform:rotate(-25deg);
}

.body:after{
content:"";
position:absolute;
inset:5px;
border-radius:8px;

background:
repeating-linear-gradient(
45deg,
transparent 0 7px,
#ffffff20 8px 9px
);
}

/* WEB */

.web{
position:absolute;
height:3px;
background:white;
transform-origin:left center;
z-index:80;
box-shadow:
0 0 5px #fff,
0 0 12px #8fd8ff;
border-radius:5px;
}

.web:after{
content:"";
position:absolute;
right:-6px;
top:-4px;
width:11px;
height:11px;
border-radius:50%;
background:white;
box-shadow:0 0 10px white;
}

/* WEB PARTICLES */

.webParticle{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
z-index:90;
pointer-events:none;
}

/* HUD */

#hud{
position:fixed;
top:12px;
left:12px;
width:min(500px,93vw);
padding:12px;

background:#03070ddd;
border:1px solid #ffffff25;
border-radius:13px;

z-index:500;
}

.title{
font-size:14px;
font-weight:bold;
}

.subtitle{
margin-top:4px;
font-size:9px;
color:#aebfc7;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:6px;
margin-top:10px;
}

.stat{
background:#101b23;
padding:8px 4px;
border-radius:7px;
text-align:center;
font-size:9px;
}

#status{
margin-top:8px;
padding:8px;
background:#101b23;
border-radius:7px;
font-size:9px;
line-height:1.7;
}

/* CONTROLS */

#controls{
position:fixed;
left:50%;
bottom:12px;
transform:translateX(-50%);

width:min(600px,95vw);

display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;

z-index:600;
}

button{
padding:11px 5px;

background:#111f2a;
border:1px solid #ffffff25;
border-radius:9px;

color:white;
font-size:10px;
cursor:pointer;
}

button:active{
transform:scale(.95);
}

/* CROSSHAIR */

#crosshair{
position:fixed;
left:50%;
top:50%;
width:25px;
height:25px;
transform:translate(-50%,-50%);
z-index:200;
pointer-events:none;
}

#crosshair:before,
#crosshair:after{
content:"";
position:absolute;
background:#ffffff99;
}

#crosshair:before{
width:25px;
height:2px;
top:12px;
left:0;
}

#crosshair:after{
width:2px;
height:25px;
left:12px;
top:0;
}

/* MAP */

#map{
display:none;
position:fixed;
inset:0;
background:#02060aee;
z-index:1000;
align-items:center;
justify-content:center;
padding:20px;
}

.mapbox{
width:min(700px,95vw);
background:#0b141b;
border:1px solid #ffffff22;
border-radius:14px;
padding:16px;
}

.mapgrid{
position:relative;
height:360px;
margin-top:12px;
background:
linear-gradient(
90deg,
transparent 48%,
#d7c86e55 49% 51%,
transparent 52%
),
linear-gradient(
transparent 48%,
#d7c86e55 49% 51%,
transparent 52%
),
#1c2c34;

border-radius:10px;
}

.mapPlayer{
position:absolute;
left:50%;
top:50%;
width:12px;
height:12px;
border-radius:50%;
background:#e21b2b;
box-shadow:0 0 15px #e21b2b;
}

/* MESSAGE */

#message{
position:fixed;
left:50%;
top:25%;
transform:translateX(-50%);

padding:10px 16px;

background:#03070cf5;
border:1px solid #ffffff25;
border-radius:9px;

font-size:10px;
display:none;

z-index:1500;
text-align:center;
}

/* MOBILE JOYSTICK */

#joystick{
position:fixed;
left:18px;
bottom:30px;
width:105px;
height:105px;
border-radius:50%;

background:#ffffff12;
border:2px solid #ffffff22;

z-index:700;
}

#stick{
position:absolute;
width:43px;
height:43px;
left:29px;
top:29px;
border-radius:50%;
background:#ffffff33;
}
</style>
</head>

<body>

<div id="game">

<div id="sky"></div>
<div id="sun"></div>

<div class="city">

<div class="building b1"></div>
<div class="building b2"></div>
<div class="building b3"></div>
<div class="building b4"></div>
<div class="building b5"></div>
<div class="building b6"></div>
<div class="building b7"></div>

</div>

<div id="roadH"></div>
<div id="roadV"></div>

<!-- WEB TARGETS -->

<div class="webTarget target1"></div>
<div class="webTarget target2"></div>
<div class="webTarget target3"></div>
<div class="webTarget target4"></div>
<div class="webTarget target5"></div>
<div class="webTarget target6"></div>

<!-- SPIDER-MAN -->

<div id="spiderman">

<div class="head"></div>
<div class="body"></div>

</div>

<div id="crosshair"></div>

<!-- HUD -->

<div id="hud">

<div class="title">
🕷️ SPIDER-MAN — V202
</div>

<div class="subtitle">
WEB-SHOOTING SYSTEM
</div>

<div class="stats">

<div class="stat">
❤️ HEALTH<br>
<span id="health">100</span>
</div>

<div class="stat">
⚡ POWER<br>
<span id="power">100</span>
</div>

<div class="stat">
🕸️ WEB<br>
<span id="webs">30</span>
</div>

<div class="stat">
⭐ LEVEL<br>
<span id="level">1</span>
</div>

</div>

<div id="status">

📍 Location:
<b id="locationText">
Downtown
</b>

<br>

🎯 Target:
<span id="targetStatus">
None
</span>

<br>

🕸️ Web Mode:
<span id="webMode">
READY
</span>

</div>

</div>

<div id="message"></div>

<!-- JOYSTICK -->

<div id="joystick">
<div id="stick"></div>
</div>

<!-- CONTROLS -->

<div id="controls">

<button onclick="Spider.webShoot()">
🕸️ WEB SHOOT
</button>

<button onclick="Spider.leftWeb()">
⬅️ LEFT WEB
</button>

<button onclick="Spider.rightWeb()">
➡️ RIGHT WEB
</button>

<button onclick="Spider.webPull()">
🕷️ WEB PULL
</button>

<button onclick="Spider.webBreak()">
✂️ BREAK WEB
</button>

<button onclick="Spider.sense()">
🕷️ SPIDER-SENSE
</button>

<button onclick="Spider.jump()">
🦘 JUMP
</button>

<button onclick="Spider.map()">
🗺️ MAP
</button>

<button onclick="Spider.rest()">
❤️ RESTORE
</button>

<button onclick="Spider.save()">
💾 SAVE
</button>

</div>

<!-- MAP -->

<div id="map">

<div class="mapbox">

<h2>🗺️ NEW YORK CITY</h2>

<div class="mapgrid">

<div class="mapPlayer" id="mapPlayer"></div>

</div>

<br>

<button onclick="Spider.map()">
CLOSE MAP
</button>

</div>

</div>

<script>

const Spider={

saveKey:"SPIDERMAN_V202",

x:0,
y:0,

health:100,
power:100,
webs:30,
level:1,

speed:4,

activeWeb:null,
webMode:false,

targetX:null,
targetY:null,

direction:"down",

init(){

this.load();

this.update();

this.keyboard();

this.setupTargets();

this.message(
"🕷️ V202 Web-Shooting System ready!"
);

},

/* KEYBOARD */

keyboard(){

document.addEventListener(
"keydown",
e=>{

const key=e.key.toLowerCase();

if(
key==="w"||
key==="arrowup"
){

this.move(0,-1);

}

if(
key==="s"||
key==="arrowdown"
){

this.move(0,1);

}

if(
key==="a"||
key==="arrowleft"
){

this.move(-1,0);

}

if(
key==="d"||
key==="arrowright"
){

this.move(1,0);

}

if(key==="e"){

this.webShoot();

}

if(key==="q"){

this.leftWeb();

}

if(key==="r"){

this.rightWeb();

}

if(key===" "){

e.preventDefault();

this.jump();

}

}
);

},

/* MOVEMENT */

move(dx,dy){

this.x+=dx*this.speed;
this.y+=dy*this.speed;

this.x=Math.max(
-100,
Math.min(100,this.x)
);

this.y=Math.max(
-100,
Math.min(100,this.y)
);

if(dx>0)this.direction="right";
if(dx<0)this.direction="left";
if(dy>0)this.direction="down";
if(dy<0)this.direction="up";

this.render();

this.location();

this.power=Math.max(
0,
this.power-.2
);

this.update();

},

render(){

const player=
document.getElementById(
"spiderman"
);

player.style.left=
(50+this.x*.25)+"%";

player.style.top=
(50+this.y*.18)+"%";

},

/* TARGET SYSTEM */

setupTargets(){

document
.querySelectorAll(".webTarget")
.forEach(
(target,index)=>{

target.addEventListener(
"click",
()=>{

this.targetX=
target.getBoundingClientRect().left+
target.offsetWidth/2;

this.targetY=
target.getBoundingClientRect().top+
target.offsetHeight/2;

this.webShoot(
this.targetX,
this.targetY
);

}
);

}
);

},

/* WEB SHOOT */

webShoot(tx=null,ty=null){

if(this.webs<=0){

this.message(
"🕸️ No web cartridges left!"
);

return;

}

if(this.power<2){

this.message(
"⚡ Not enough power!"
);

return;

}

const player=
document.getElementById(
"spiderman"
);

const rect=
player.getBoundingClientRect();

const startX=
rect.left+
rect.width/2;

const startY=
rect.top+
rect.height/2;

if(tx===null){

const angle=

this.direction==="left"
?Math.PI:

this.direction==="right"
?0:

this.direction==="up"
?-Math.PI/2:
Math.PI/2;

tx=
startX+
Math.cos(angle)*240;

ty=
startY+
Math.sin(angle)*240;

}

this.createWeb(
startX,
startY,
tx,
ty
);

this.webs--;

this.power-=2;

this.targetX=tx;
this.targetY=ty;

this.webMode=true;

this.update();

this.message(
"🕸️ Web attached!"
);

},

/* LEFT WEB */

leftWeb(){

const player=
document.getElementById(
"spiderman"
);

const rect=
player.getBoundingClientRect();

const startX=
rect.left+
rect.width/2;

const startY=
rect.top+
rect.height/2;

this.webShoot(
startX-230,
startY-120
);

},

/* RIGHT WEB */

rightWeb(){

const player=
document.getElementById(
"spiderman"
);

const rect=
player.getBoundingClientRect();

const startX=
rect.left+
rect.width/2;

const startY=
rect.top+
rect.height/2;

this.webShoot(
startX+230,
startY-120
);

},

/* CREATE WEB */

createWeb(
x1,
y1,
x2,
y2
){

const web=
document.createElement(
"div"
);

web.className="web";

const dx=x2-x1;
const dy=y2-y1;

const distance=
Math.sqrt(dx*dx+dy*dy);

const angle=
Math.atan2(dy,dx)*
180/Math.PI;

web.style.left=
x1+"px";

web.style.top=
y1+"px";

web.style.width=
distance+"px";

web.style.transform=
"rotate("+angle+"deg)";

document
.getElementById("game")
.appendChild(web);

this.activeWeb=web;

},

/* WEB PULL */

webPull(){

if(!this.activeWeb){

this.message(
"🕸️ No active web."
);

return;

}

if(this.power<8){

this.message(
"⚡ Not enough power!"
);

return;

}

this.power-=8;

const dx=
(this.targetX-window.innerWidth/2);

const dy=
(this.targetY-window.innerHeight/2);

this.x+=
(dx/window.innerWidth)*40;

this.y+=
(dy/window.innerHeight)*30;

this.x=Math.max(
-100,
Math.min(100,this.x)
);

this.y=Math.max(
-100,
Math.min(100,this.y)
);

this.render();

this.location();

this.message(
"🕷️ Web pull!"
);

this.update();

},

/* BREAK WEB */

webBreak(){

if(!this.activeWeb){

this.message(
"No active web."
);

return;

}

this.activeWeb.remove();

this.activeWeb=null;

this.webMode=false;

this.message(
"✂️ Web released."
);

this.update();

},

/* SPIDER SENSE */

sense(){

if(this.power<8){

this.message(
"⚡ Spider-Sense unavailable."
);

return;

}

this.power-=8;

const messages=[

"⚠️ Threat detected!",
"🚨 Police activity nearby!",
"👤 Civilian needs help!",
"🕷️ Strong web target detected!",
"💥 Danger nearby!"

];

this.message(
messages[
Math.floor(
Math.random()*messages.length
)
]
);

this.update();

},

/* JUMP */

jump(){

if(this.power<5){

this.message(
"⚡ Not enough power."
);

return;

}

this.power-=5;

const player=
document.getElementById(
"spiderman"
);

player.animate(

[
{
transform:
"translate(-50%,-50%)"
},

{
transform:
"translate(-50%,-150%)"
},

{
transform:
"translate(-50%,-50%)"
}

],

{
duration:450,
easing:"ease-out"
}

);

this.update();

},

/* REST */

rest(){

this.health=
Math.min(
100,
this.health+20
);

this.power=
Math.min(
100,
this.power+30
);

this.message(
"❤️ Recovered."
);

this.update();

},

/* LOCATION */

location(){

let place=
"Downtown";

if(this.x>50)
place=
"Financial District";

else if(this.x<-50)
place=
"Residential District";

else if(this.y>50)
place=
"Industrial District";

else if(this.y<-50)
place=
"City Center";

document.getElementById(
"locationText"
).textContent=
place;

},

/* MAP */

map(){

const map=
document.getElementById(
"map"
);

map.style.display=
map.style.display==="flex"
?
"none"
:
"flex";

const player=
document.getElementById(
"mapPlayer"
);

player.style.left=
(50+this.x*.35)+"%";

player.style.top=
(50+this.y*.35)+"%";

},

/* UPDATE HUD */

update(){

document.getElementById(
"health"
).textContent=
Math.round(this.health);

document.getElementById(
"power"
).textContent=
Math.round(this.power);

document.getElementById(
"webs"
).textContent=
this.webs;

document.getElementById(
"level"
).textContent=
this.level;

document.getElementById(
"targetStatus"
).textContent=
this.targetX!==null
?
"LOCKED"
:
"None";

document.getElementById(
"webMode"
).textContent=
this.webMode
?
"CONNECTED"
:
"READY";

},

/* SAVE */

save(){

localStorage.setItem(
this.saveKey,
JSON.stringify({

x:this.x,
y:this.y,
health:this.health,
power:this.power,
webs:this.webs,
level:this.level

})
);

this.message(
"💾 Game saved!"
);

},

/* LOAD */

load(){

try{

const raw=
localStorage.getItem(
this.saveKey
);

if(!raw)return;

const data=
JSON.parse(raw);

if(Number.isFinite(data.x))
this.x=data.x;

if(Number.isFinite(data.y))
this.y=data.y;

if(Number.isFinite(data.health))
this.health=
Math.max(
0,
Math.min(
100,
data.health
)
);

if(Number.isFinite(data.power))
this.power=
Math.max(
0,
Math.min(
100,
data.power
)
);

if(Number.isFinite(data.webs))
this.webs=
Math.max(
0,
data.webs
);

if(Number.isFinite(data.level))
this.level=
Math.max(
1,
data.level
);

this.render();

}
catch(error){

console.log(
"Load error:",
error
);

}

},

/* MESSAGE */

message(text){

const box=
document.getElementById(
"message"
);

box.textContent=text;

box.style.display=
"block";

clearTimeout(
this.messageTimer
);

this.messageTimer=
setTimeout(
()=>{
box.style.display="none";
},
2200
);

}

};

Spider.init();

console.log(
"SPIDER-MAN V202 WEB SYSTEM READY"
);

</script>

</body>
</html>
