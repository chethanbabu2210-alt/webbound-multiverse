<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WEBBOUND V40 — Dynamic World</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;z-index:20;left:10px;top:10px;width:270px;
 padding:13px;color:white;background:rgba(0,0,0,.78);
 border:1px solid rgba(255,255,255,.18);border-radius:15px;
 backdrop-filter:blur(8px);font-size:11px
}
.title{font-size:18px;font-weight:800}
.sub{color:#63dcff;margin-top:3px}
.row{margin-top:8px;line-height:1.55}
#weather{color:#75ddff;font-weight:bold}

#controlsTop{
 position:fixed;z-index:30;right:10px;top:10px;
 display:flex;gap:6px
}
#controlsTop button{width:90px;height:40px}

button{
 border:1px solid rgba(255,255,255,.25);
 background:rgba(0,0,0,.75);color:white;
 border-radius:12px;font-size:10px;font-weight:bold;
 touch-action:none
}
button:active{transform:scale(.94);background:rgba(255,255,255,.22)}

#message{
 position:fixed;z-index:100;left:50%;top:23%;
 transform:translateX(-50%);width:92%;text-align:center;
 color:white;font-size:25px;font-weight:800;
 text-shadow:0 5px 25px #000;opacity:0;transition:.25s
}

#touch{
 position:fixed;z-index:40;left:0;right:0;bottom:8px;
 display:flex;justify-content:space-between;padding:9px;
 pointer-events:none
}
.pad,.actions{display:grid;gap:6px;pointer-events:auto}
.pad{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px}
.actions{grid-template-columns:52px 52px;grid-template-rows:52px 52px 52px}
#touch button{width:52px;height:52px}
.empty{visibility:hidden}

#rain{
 position:fixed;z-index:10;inset:0;
 pointer-events:none;display:none;
 background:
 repeating-linear-gradient(
  110deg,
  transparent 0px,
  transparent 9px,
  rgba(130,210,255,.35) 10px,
  transparent 11px
 );
 animation:rain .35s linear infinite
}

@keyframes rain{
 from{background-position:0 0}
 to{background-position:-50px 100px}
}

#lightning{
 position:fixed;z-index:15;inset:0;
 pointer-events:none;background:white;
 opacity:0
}

@media(max-width:600px){
 #hud{width:230px;font-size:10px}
 #controlsTop{top:125px}
 #controlsTop button{width:82px}
}
</style>
</head>

<body>

<div id="rain"></div>
<div id="lightning"></div>

<div id="hud">
 <div class="title">🕷️ WEBBOUND V40</div>
 <div class="sub">DYNAMIC WORLD SYSTEM</div>

 <div class="row">
  🕐 Time:
  <b id="time">06:00</b><br>

  🌦️ Weather:
  <b id="weather">CLEAR</b><br>

  🌡️ Atmosphere:
  <b id="atmosphere">CALM</b>
 </div>

 <div class="row">
  ⭐ Level: <b id="level">1</b><br>
  ❤️ Health: <b id="health">100</b><br>
  🕸️ Energy: <b id="energy">100</b><br>
  ⭐ XP: <b id="xp">0</b><br>
  🏆 Score: <b id="score">0</b>
 </div>

 <div class="row">
  📖 Chapter: <b id="chapter">1</b><br>
  🎯 Mission: <b id="mission">1</b>
 </div>
</div>

<div id="controlsTop">
 <button id="weatherButton">🌦️ WEATHER</button>
 <button id="timeButton">🕐 TIME</button>
</div>

<div id="message"></div>

<div id="touch">

 <div class="pad">
  <button class="empty"></button>
  <button id="up">▲</button>
  <button class="empty"></button>

  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>

 <div class="actions">
  <button id="jump">JUMP</button>
  <button id="web">WEB</button>
  <button id="punch">PUNCH</button>
  <button id="shot">WEB SHOT</button>
  <button id="burst">BURST</button>
  <button id="cycle">CYCLE</button>
 </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene=new THREE.Scene();

scene.background=
 new THREE.Color(0x07111e);

scene.fog=
 new THREE.FogExp2(
  0x07111e,
  .00115
 );

const camera=
 new THREE.PerspectiveCamera(
  68,
  innerWidth/innerHeight,
  .1,
  3500
 );

const renderer=
 new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(devicePixelRatio,1.3)
);

renderer.outputColorSpace=
 THREE.SRGBColorSpace;

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun=
 new THREE.DirectionalLight(
  0xffffff,
  1.8
 );

sun.position.set(
 -400,700,300
);

sun.castShadow=true;

scene.add(sun);

const ambient=
 new THREE.HemisphereLight(
  0x7897c4,
  0x05070b,
  1.1
 );

scene.add(ambient);


/* =====================================================
   CITY
===================================================== */

const buildings=[];

const buildingMaterials=[
 new THREE.MeshStandardMaterial({
  color:0x17212b
 }),
 new THREE.MeshStandardMaterial({
  color:0x222c36
 }),
 new THREE.MeshStandardMaterial({
  color:0x101920
 })
];

for(
 let x=-850;
 x<=850;
 x+=100
){

 for(
  let z=-850;
  z<=850;
  z+=100
 ){

  if(
   Math.abs(x)<100 &&
   Math.abs(z)<100
  )continue;

  const w=
   55+Math.random()*20;

  const d=
   55+Math.random()*20;

  const h=
   70+Math.random()*250;

  const building=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     w,h,d
    ),
    buildingMaterials[
     Math.floor(
      Math.random()*
      buildingMaterials.length
     )
    ]
   );

  building.position.set(
   x,h/2,z
  );

  building.castShadow=true;

  scene.add(building);

  buildings.push(building);
 }
}

const ground=
 new THREE.Mesh(
  new THREE.PlaneGeometry(
   3000,3000
  ),
  new THREE.MeshStandardMaterial({
   color:0x070a0e
  })
 );

ground.rotation.x=
 -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   PLAYER
===================================================== */

const player=
 new THREE.Group();

player.position.set(
 0,1.1,0
);

scene.add(player);

const suit=
 new THREE.MeshStandardMaterial({
  color:0xa8192d,
  roughness:.4
 });

const body=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .65,1.55,8,14
  ),
  suit
 );

body.position.y=1.45;
player.add(body);

const head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .57,20,16
  ),
  suit
 );

head.position.y=2.75;
player.add(head);

const eyeMat=
 new THREE.MeshBasicMaterial({
  color:0xffffff
 });

for(
 const x of [-.2,.2]
){

 const eye=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .18,12,10
   ),
   eyeMat
  );

 eye.position.set(
  x,2.78,-.54
 );

 eye.scale.z=.18;

 player.add(eye);
}


/* =====================================================
   PLAYER STATE
===================================================== */

const velocity=
 new THREE.Vector3();

const input=
 new THREE.Vector3();

const keys={};

let grounded=true;
let doubleJump=true;

let swinging=false;
let anchor=null;
let webLine=null;

let health=100;
let energy=100;
let xp=0;
let score=0;
let level=1;

let chapter=1;
let mission=1;


/* =====================================================
   TIME SYSTEM
===================================================== */

let worldTime=6;

let timeSpeed=0.035;

let lastDayPart="day";


function formatTime(){

 let h=Math.floor(worldTime);
 let m=Math.floor(
  (worldTime-h)*60
 );

 return String(h).padStart(2,"0")+
 ":"+
 String(m).padStart(2,"0");
}


function updateTime(dt){

 worldTime+=
  dt*timeSpeed;

 if(worldTime>=24)
  worldTime-=24;


 const hour=worldTime;

 let intensity=1;

 if(
  hour>=6 &&
  hour<18
 ){

  intensity=
   .75+
   Math.sin(
    ((hour-6)/12)*
    Math.PI
   )*.55;

  lastDayPart="day";

 }else{

  intensity=.18;

  lastDayPart="night";
 }


 sun.intensity=
  intensity*1.8;

 ambient.intensity=
  .5+
  intensity*.6;


 if(lastDayPart==="night"){

  scene.background.set(
   0x020611
  );

  scene.fog.color.set(
   0x020611
  );

 }else{

  scene.background.set(
   0x07111e
  );

  scene.fog.color.set(
   0x07111e
  );
 }


 document.getElementById(
  "time"
 ).textContent=
  formatTime();
}


/* =====================================================
   WEATHER SYSTEM
===================================================== */

const weatherTypes=[
 "CLEAR",
 "RAIN",
 "STORM",
 "FOG"
];

let weatherIndex=0;
let weather="CLEAR";

const rain=
 document.getElementById(
  "rain"
 );


function setWeather(type){

 weather=type;

 weatherIndex=
  weatherTypes.indexOf(type);

 rain.style.display=
  type==="RAIN"||
  type==="STORM"
  ? "block"
  : "none";


 if(type==="FOG"){

  scene.fog.density=.003;

 }else{

  scene.fog.density=.00115;
 }


 if(type==="RAIN"){

  scene.fog.color.set(
   0x172432
  );

 }else if(type==="STORM"){

  scene.fog.color.set(
   0x080d18
  );

 }else{

  scene.fog.color.set(
   scene.background
  );
 }


 document.getElementById(
  "weather"
 ).textContent=
  type;


 showMessage(
  "🌦️ WEATHER: "+
  type
 );
}


function cycleWeather(){

 weatherIndex=
  (weatherIndex+1)%
  weatherTypes.length;

 setWeather(
  weatherTypes[
   weatherIndex
  ]
 );
}


/* =====================================================
   LIGHTNING
===================================================== */

const lightning=
 document.getElementById(
  "lightning"
 );

let lightningTimer=
 8+Math.random()*12;


function updateStorm(dt){

 if(weather!=="STORM")
  return;

 lightningTimer-=dt;

 if(
  lightningTimer<=0
 ){

  lightningTimer=
   5+Math.random()*12;

  lightning.style.opacity=
   .75;

  setTimeout(
   ()=>{
    lightning.style.opacity=0;
   },
   70
  );

  setTimeout(
   ()=>{
    lightning.style.opacity=.35;

    setTimeout(
     ()=>{
      lightning.style.opacity=0;
     },
     50
    );
   },
   110
  );

  showMessage(
   "⚡ LIGHTNING"
  );
 }
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function jump(){

 if(grounded){

  velocity.y=15;
  grounded=false;
  doubleJump=true;

 }else if(doubleJump){

  velocity.y=13;
  doubleJump=false;
 }
}


function updateMovement(dt){

 input.set(0,0,0);

 if(keys.KeyW)
  input.z-=1;

 if(keys.KeyS)
  input.z+=1;

 if(keys.KeyA)
  input.x-=1;

 if(keys.KeyD)
  input.x+=1;

 if(input.length())
  input.normalize();

 let speed=
  keys.ShiftLeft?14:9;

 if(weather==="RAIN")
  speed*=.94;

 if(weather==="STORM")
  speed*=.88;

 velocity.x+=
  input.x*
  speed*
  dt*5;

 velocity.z+=
  input.z*
  speed*
  dt*5;

 velocity.x*=.91;
 velocity.z*=.91;

 if(!grounded)
  velocity.y-=30*dt;

 player.position.addScaledVector(
  velocity,
  dt
 );

 if(
  player.position.y<=1.1
 ){

  player.position.y=1.1;
  velocity.y=0;
  grounded=true;
  doubleJump=true;

 }else{

  grounded=false;
 }
}


/* =====================================================
   WEB SWING
===================================================== */

function findAnchor(){

 let best=null;
 let closest=450;

 for(
  const building of buildings
 ){

  const h=
   building.geometry
    .parameters
    .height;

  const point=
   new THREE.Vector3(
    building.position.x,
    building.position.y+h/2,
    building.position.z
   );

  const d=
   point.distanceTo(
    player.position
   );

  if(
   d<closest &&
   point.y>
   player.position.y+8
  ){

   closest=d;
   best=point;
  }
 }

 return best;
}


function toggleSwing(){

 if(swinging){

  swinging=false;

  if(webLine){

   scene.remove(
    webLine
   );

   webLine=null;
  }

  velocity.multiplyScalar(1.4);

  return;
 }

 const point=findAnchor();

 if(!point)return;

 anchor=point;

 swinging=true;

 webLine=
  new THREE.Line(
   new THREE.BufferGeometry()
    .setFromPoints([
     player.position.clone(),
     anchor.clone()
    ]),
   new THREE.LineBasicMaterial({
    color:0xffffff
   })
  );

 scene.add(webLine);
}


function updateSwing(dt){

 if(!swinging)
  return;

 const pull=
  new THREE.Vector3()
   .subVectors(
    anchor,
    player.position
   );

 const distance=
  pull.length();

 pull.normalize();

 if(distance>10){

  velocity.addScaledVector(
   pull,
   (distance-10)*
   dt*16
  );
 }

 velocity.y-=7*dt;

 if(webLine){

  const p=
   webLine.geometry
    .attributes
    .position
    .array;

  p[0]=player.position.x;
  p[1]=player.position.y+1;
  p[2]=player.position.z;

  p[3]=anchor.x;
  p[4]=anchor.y;
  p[5]=anchor.z;

  webLine.geometry
   .attributes
   .position
   .needsUpdate=true;
 }
}


/* =====================================================
   ENEMIES
===================================================== */

const enemies=[];


function createEnemy(){

 const enemy=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .55,1,6,10
   ),
   new THREE.MeshStandardMaterial({
    color:0x353941
   })
  );

 const angle=
  Math.random()*Math.PI*2;

 const distance=
  100+Math.random()*200;

 enemy.position.set(
  player.position.x+
   Math.cos(angle)*distance,
  1,
  player.position.z+
   Math.sin(angle)*distance
 );

 enemy.userData={
  health:100,
  speed:4
 };

 scene.add(enemy);
 enemies.push(enemy);
}


for(let i=0;i<8;i++)
 createEnemy();


function nearestEnemy(range){

 let target=null;
 let closest=range;

 for(
  const enemy of enemies
 ){

  const d=
   enemy.position.distanceTo(
    player.position
   );

  if(d<closest){

   closest=d;
   target=enemy;
  }
 }

 return target;
}


function defeatEnemy(enemy){

 score+=250;
 addXP(100);

 scene.remove(enemy);

 const i=
  enemies.indexOf(enemy);

 if(i>=0)
  enemies.splice(i,1);

 setTimeout(
  createEnemy,
  1200
 );
}


function punch(){

 const enemy=
  nearestEnemy(7);

 if(!enemy)return;

 enemy.userData.health-=50;

 score+=100;
 addXP(20);

 if(
  enemy.userData.health<=0
 )
  defeatEnemy(enemy);
}


function webShot(){

 if(energy<15)return;

 const enemy=
  nearestEnemy(40);

 if(!enemy)return;

 energy-=15;

 enemy.userData.health-=60;

 if(
  enemy.userData.health<=0
 )
  defeatEnemy(enemy);
}


function burst(){

 if(energy<35)return;

 energy-=35;

 for(
  const enemy of [...enemies]
 ){

  if(
   enemy.position.distanceTo(
    player.position
   )<18
  ){

   enemy.userData.health-=70;

   if(
    enemy.userData.health<=0
   )
    defeatEnemy(enemy);
  }
 }
}


function updateEnemies(dt){

 for(
  const enemy of enemies
 ){

  const d=
   enemy.position.distanceTo(
    player.position
   );

  if(d<100){

   const dir=
    new THREE.Vector3()
     .subVectors(
      player.position,
      enemy.position
     )
     .normalize();

   dir.y=0;

   enemy.position.addScaledVector(
    dir,
    enemy.userData.speed*dt
   );

   if(d<4)
    health-=7*dt;
  }
 }
}


/* =====================================================
   PROGRESSION
===================================================== */

function xpRequired(){

 return 500+
  (level-1)*250;
}


function addXP(amount){

 xp+=amount;

 while(
  xp>=xpRequired()
 ){

  xp-=xpRequired();

  level++;

  health=100;
  energy=100;

  showMessage(
   "⭐ LEVEL "+
   level+
   "!"
  );
 }
}


function updateMission(){

 const targets=[
  [300,-250],
  [-450,300],
  [-350,-420],
  [500,420],
  [120,350]
 ];

 const target=
  targets[
   (mission-1)%
   targets.length
  ];

 const d=
  Math.hypot(
   player.position.x-target[0],
   player.position.z-target[1]
  );

 if(d<20){

  score+=500;
  addXP(200);

  mission++;

  if(mission>targets.length){

   mission=1;
   chapter++;

   showMessage(
    "📖 CHAPTER "+
    chapter+
    " UNLOCKED"
   );

  }else{

   showMessage(
    "🎯 MISSION COMPLETE"
   );
  }
 }
}


/* =====================================================
   UI
===================================================== */

function updateUI(){

 document.getElementById(
  "level"
 ).textContent=level;

 document.getElementById(
  "health"
 ).textContent=
  Math.floor(
   Math.max(0,health)
  );

 document.getElementById(
  "energy"
 ).textContent=
  Math.floor(energy);

 document.getElementById(
  "xp"
 ).textContent=
  Math.floor(xp);

 document.getElementById(
  "score"
 ).textContent=
  score;

 document.getElementById(
  "chapter"
 ).textContent=
  chapter;

 document.getElementById(
  "mission"
 ).textContent=
  mission;

 document.getElementById(
  "weather"
 ).textContent=
  weather;


 document.getElementById(
  "atmosphere"
 ).textContent=
  weather==="STORM"
  ?"DANGEROUS":
  weather==="RAIN"
  ?"WET":
  weather==="FOG"
  ?"LOW VISIBILITY":
  "CALM";
}


function showMessage(text){

 const m=
  document.getElementById(
   "message"
  );

 m.textContent=text;
 m.style.opacity=1;

 setTimeout(
  ()=>m.style.opacity=0,
  1300
 );
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener(
 "keydown",
 e=>{

  keys[e.code]=true;

  if(e.code==="Space")
   jump();

  if(e.code==="KeyE")
   toggleSwing();

  if(e.code==="KeyF")
   punch();

  if(e.code==="KeyZ")
   webShot();

  if(e.code==="KeyC")
   burst();

  if(e.code==="KeyR")
   cycleWeather();
 });

addEventListener(
 "keyup",
 e=>{
  keys[e.code]=false;
 });


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function hold(id,code){

 const button=
  document.getElementById(id);

 const down=e=>{
  e.preventDefault();
  keys[code]=true;
 };

 const up=e=>{
  e.preventDefault();
  keys[code]=false;
 };

 button.addEventListener(
  "touchstart",
  down,
  {passive:false}
 );

 button.addEventListener(
  "touchend",
  up,
  {passive:false}
 );

 button.addEventListener(
  "touchcancel",
  up,
  {passive:false}
 );
}

hold("up","KeyW");
hold("down","KeyS");
hold("left","KeyA");
hold("right","KeyD");


function tap(id,fn){

 document.getElementById(id)
 .addEventListener(
  "touchstart",
  e=>{
   e.preventDefault();
   fn();
  },
  {passive:false}
 );
}

tap("jump",jump);
tap("web",toggleSwing);
tap("punch",punch);
tap("shot",webShot);
tap("burst",burst);
tap("cycle",cycleWeather);


/* =====================================================
   TOP BUTTONS
===================================================== */

document.getElementById(
 "weatherButton"
).onclick=cycleWeather;

document.getElementById(
 "timeButton"
).onclick=()=>{
 worldTime+=6;

 if(worldTime>=24)
  worldTime-=24;

 showMessage(
  "🕐 TIME: "+
  formatTime()
 );
};


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

 camera.position.lerp(
  new THREE.Vector3(
   player.position.x,
   player.position.y+5.5,
   player.position.z+12
  ),
  .075
 );

 camera.lookAt(
  player.position.x,
  player.position.y+2,
  player.position.z
 );
}


/* =====================================================
   SAVE
===================================================== */

setInterval(
 ()=>{

  try{

   localStorage.setItem(
    "WEBBOUND_V40",
    JSON.stringify({
     x:player.position.x,
     y:player.position.y,
     z:player.position.z,
     level,
     xp,
     score,
     health,
     energy,
     chapter,
     mission,
     worldTime,
     weather
    })
   );

  }catch(e){}
 },
 30000
);


/* =====================================================
   MAIN LOOP
===================================================== */

const clock=
 new THREE.Clock();

function loop(){

 requestAnimationFrame(loop);

 const dt=
  Math.min(
   clock.getDelta(),
   .033
  );

 updateTime(dt);

 updateStorm(dt);

 updateMovement(dt);

 updateSwing(dt);

 updateEnemies(dt);

 updateMission();

 energy=
  Math.min(
   100,
   energy+dt*5
  );

 if(
  health<=0
 ){

  health=100;
  energy=100;

  player.position.set(
   0,1.1,0
  );

  velocity.set(
   0,0,0
  );

  showMessage(
   "📍 CHECKPOINT RESTORED"
  );
 }

 updateUI();
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}

updateUI();
loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
