<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V192 — JOBS & CAREERS</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#05090d;color:#fff
}
#game{
 position:fixed;inset:0;overflow:hidden;
 background:linear-gradient(#304d59,#091116)
}
#sky{
 position:absolute;inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8)
}
.road{position:absolute;background:#252d32}
.rh{left:0;right:0;top:57%;height:70px}
.rv{top:0;bottom:0;left:68%;width:70px}
.line{position:absolute;background:#d5c36c;opacity:.4}
.lineH{left:0;right:0;top:calc(57% + 34px);height:2px}
.lineV{top:0;bottom:0;left:calc(68% + 34px);width:2px}

.building{
 position:absolute;display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:#14242d;border:1px solid #ffffff18;
 border-radius:9px;color:#82929b;font-size:10px
}
.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;left:50%;top:53%;
 width:29px;height:41px;border-radius:10px 10px 5px 5px;
 background:#2c91da;z-index:50
}
#player:before{
 content:"";position:absolute;left:5.5px;top:-14px;
 width:18px;height:18px;border-radius:50%;background:#bd8967
}

#hud{
 position:fixed;left:10px;top:10px;
 width:min(970px,94vw);padding:12px;
 background:#03070cee;border:1px solid #ffffff25;
 border-radius:13px;z-index:500
}
.title{font-size:13px;font-weight:bold}
.stats{
 display:grid;grid-template-columns:repeat(6,1fr);
 gap:5px;margin-top:8px
}
.stat{
 padding:7px 4px;background:#101b23;
 border-radius:7px;text-align:center;font-size:9px
}
#jobHud{
 margin-top:8px;padding:9px;background:#111d25;
 border-radius:8px;font-size:9px;line-height:1.8
}
.bar{
 height:7px;background:#ffffff12;
 border-radius:7px;overflow:hidden;margin-top:4px
}
.fill{
 height:100%;width:0%;
 background:#8fb8df;transition:.3s
}

#controls{
 position:fixed;left:50%;bottom:10px;
 transform:translateX(-50%);
 width:min(970px,96vw);
 display:flex;flex-wrap:wrap;gap:6px;z-index:500
}
button{
 flex:1;min-width:105px;padding:10px;
 background:#142733;border:1px solid #ffffff22;
 border-radius:8px;color:#fff;font-size:10px;cursor:pointer
}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}

#panel{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 background:#000c;z-index:1000
}
.box{
 width:min(820px,94vw);max-height:84vh;
 overflow:auto;padding:17px;background:#050b10;
 border:1px solid #ffffff28;border-radius:15px
}
.card{
 padding:11px;background:#111d25;
 border-radius:9px;margin-bottom:7px;
 font-size:10px;line-height:1.7
}
.card button{width:100%;margin-top:8px}

#notification{
 position:fixed;left:50%;top:20%;
 transform:translateX(-50%);
 padding:10px 15px;background:#03070cf5;
 border:1px solid #ffffff25;border-radius:9px;
 display:none;z-index:1500;font-size:10px;
 text-align:center
}
</style>
</head>

<body>

<div id="game">

<div id="sky"></div>
<div class="road rh"></div>
<div class="road rv"></div>
<div class="line lineH"></div>
<div class="line lineV"></div>

<div class="building b1">🏠 RESIDENTIAL</div>
<div class="building b2">🏢 CORPORATE</div>
<div class="building b3">🏥 HOSPITAL</div>
<div class="building b4">💻 TECHNOLOGY PARK</div>
<div class="building b5">🏭 INDUSTRIAL ZONE</div>
<div class="building b6">💼 CAREER CENTER</div>

<div id="player"></div>

<div id="hud">

<div class="title">
💼 WEBBOUND V192 — JOBS & CAREERS
</div>

<div class="stats">

<div class="stat">
💰 CASH<br>
₹<span id="cashText">5000</span>
</div>

<div class="stat">
💼 JOB<br>
<span id="jobText">Unemployed</span>
</div>

<div class="stat">
💵 SALARY<br>
₹<span id="salaryText">0</span>
</div>

<div class="stat">
⭐ XP<br>
<span id="xpText">0</span>
</div>

<div class="stat">
🏆 LEVEL<br>
<span id="levelText">1</span>
</div>

<div class="stat">
⚡ ENERGY<br>
<span id="energyText">100</span>%
</div>

</div>

<div id="jobHud">

<b>💼 ACTIVE CAREER</b><br>

<span id="jobName">No career selected</span><br>

Rank:
<span id="rankText">—</span><br>

Experience:
<span id="experienceText">0</span><br>

Daily Salary:
₹<span id="dailySalary">0</span>

<div class="bar">
<div id="jobFill" class="fill"></div>
</div>

</div>

</div>

<div id="notification"></div>

<div id="controls">

<button onclick="V192.careers()">
💼 CAREERS
</button>

<button onclick="V192.work()">
🧑‍💻 WORK
</button>

<button onclick="V192.promote()">
🏆 PROMOTE
</button>

<button onclick="V192.rest()">
😴 REST
</button>

<button onclick="V192.resume()">
📄 RESUME
</button>

<button onclick="V192.stats()">
📊 CAREER STATS
</button>

<button onclick="V192.save()">
💾 SAVE
</button>

</div>

<div id="panel">

<div class="box">

<h2 id="panelTitle">
WEBBOUND V192
</h2>

<div id="panelContent"></div>

<button onclick="V192.close()">
CLOSE
</button>

</div>

</div>

</div>

<script>

const V192={

saveKey:"WEBBOUND_V192",

cash:5000,

job:null,

experience:0,

level:1,

energy:100,

totalEarned:0,

daysWorked:0,

jobData:{

developer:{
name:"💻 Software Developer",
salary:1200,
xp:35,
energy:20,
maxLevel:10
},

engineer:{
name:"⚙️ Engineer",
salary:1500,
xp:40,
energy:25,
maxLevel:10
},

doctor:{
name:"🩺 Doctor",
salary:2200,
xp:50,
energy:30,
maxLevel:12
},

designer:{
name:"🎨 UI/UX Designer",
salary:1100,
xp:30,
energy:18,
maxLevel:10
},

manager:{
name:"📊 Business Manager",
salary:1800,
xp:42,
energy:24,
maxLevel:12
},

scientist:{
name:"🔬 Research Scientist",
salary:2500,
xp:55,
energy:32,
maxLevel:15
}

},

init(){

this.load();
this.update();

this.notify(
"💼 V192 Career System ready"
);

},

careers(){

let html="";

Object.entries(this.jobData)
.forEach(([id,j])=>{

const selected=
this.job===id;

html+=`

<div class="card">

<b>${j.name}</b>

<br><br>

💵 Starting Salary:
₹${j.salary.toLocaleString()}

<br>

⭐ XP per Work:
${j.xp}

<br>

⚡ Energy Cost:
${j.energy}%

<br>

🏆 Maximum Level:
${j.maxLevel}

<br><br>

<button
onclick="V192.choose('${id}')">

${selected?
"✅ CURRENT CAREER":
"💼 CHOOSE CAREER"}

</button>

</div>

`;

});

this.open(
"💼 CAREER CENTER",
html
);

},

choose(id){

if(!this.jobData[id])
return;

this.job=id;

this.experience=0;

this.level=1;

this.update();
this.save();
this.close();

this.notify(
"💼 Career selected: "+
this.jobData[id].name
);

},

work(){

if(!this.job){

this.notify(
"💼 Choose a career first."
);

return;

}

const j=this.jobData[this.job];

if(this.energy<j.energy){

this.notify(
"⚡ Not enough energy. Rest first."
);

return;

}

const salary=
Math.floor(
j.salary*
(1+(this.level-1)*0.15)
);

this.cash+=salary;

this.totalEarned+=salary;

this.experience+=j.xp;

this.daysWorked++;

this.energy=
Math.max(
0,
this.energy-j.energy
);

this.update();
this.save();

this.notify(
"💼 Work completed! +₹"+
salary.toLocaleString()
);

},

promote(){

if(!this.job){

this.notify(
"💼 Choose a career first."
);

return;

}

const j=this.jobData[this.job];

if(this.level>=j.maxLevel){

this.notify(
"🏆 Maximum career level reached."
);

return;

}

const required=
this.level*100;

if(this.experience<required){

this.notify(
"⭐ Need "+
required+
" XP for promotion."
);

return;

}

this.experience-=required;

this.level++;

this.update();
this.save();

this.notify(
"🏆 Promoted to Level "+
this.level
);

},

rest(){

if(this.energy>=100){

this.notify(
"⚡ Energy is already full."
);

return;

}

this.energy=Math.min(
100,
this.energy+35
);

this.update();
this.save();

this.notify(
"😴 You rested. Energy restored."
);

},

resume(){

let html="";

if(!this.job){

html=`

<div class="card">
You are currently unemployed.
Choose a career to begin.
</div>

`;

}else{

const j=this.jobData[this.job];

html=`

<div class="card">

<b>📄 PROFESSIONAL RESUME</b>

<br><br>

Career:
${j.name}

<br>

Career Level:
${this.level}

<br>

Experience:
${this.experience} XP

<br>

Days Worked:
${this.daysWorked}

<br>

Total Salary Earned:
₹${this.totalEarned.toLocaleString()}

<br>

Current Energy:
${this.energy}%

<br>

Maximum Career Level:
${j.maxLevel}

</div>

`;

}

this.open(
"📄 RESUME",
html
);

},

stats(){

let html=`

<div class="card">

<b>📊 CAREER STATISTICS</b>

<br><br>

💼 Current Career:
${
this.job?
this.jobData[this.job].name:
"Unemployed"
}

<br>

🏆 Career Level:
${this.level}

<br>

⭐ Experience:
${this.experience} XP

<br>

📅 Days Worked:
${this.daysWorked}

<br>

💵 Total Earned:
₹${this.totalEarned.toLocaleString()}

<br>

⚡ Energy:
${this.energy}%

<br>

💰 Current Cash:
₹${this.cash.toLocaleString()}

</div>

`;

this.open(
"📊 CAREER STATISTICS",
html
);

},

update(){

document.getElementById(
"cashText"
).textContent=
this.cash.toLocaleString();

document.getElementById(
"jobText"
).textContent=
this.job?
this.jobData[this.job].name:
"Unemployed";

document.getElementById(
"salaryText"
).textContent=
this.job?
Math.floor(
this.jobData[this.job].salary*
(1+(this.level-1)*0.15)
).toLocaleString():
"0";

document.getElementById(
"xpText"
).textContent=
this.experience;

document.getElementById(
"levelText"
).textContent=
this.level;

document.getElementById(
"energyText"
).textContent=
this.energy;

if(!this.job){

document.getElementById(
"jobName"
).textContent=
"No career selected";

document.getElementById(
"rankText"
).textContent="—";

document.getElementById(
"experienceText"
).textContent="0";

document.getElementById(
"dailySalary"
).textContent="0";

document.getElementById(
"jobFill"
).style.width="0%";

return;

}

const j=this.jobData[this.job];

document.getElementById(
"jobName"
).textContent=
j.name;

document.getElementById(
"rankText"
).textContent=
"Level "+this.level;

document.getElementById(
"experienceText"
).textContent=
this.experience;

document.getElementById(
"dailySalary"
).textContent=
Math.floor(
j.salary*
(1+(this.level-1)*0.15)
).toLocaleString();

document.getElementById(
"jobFill"
).style.width=
Math.min(
100,
this.level/j.maxLevel*100
)+"%";

},

save(){

localStorage.setItem(
this.saveKey,
JSON.stringify({

cash:this.cash,

job:this.job,

experience:this.experience,

level:this.level,

energy:this.energy,

totalEarned:this.totalEarned,

daysWorked:this.daysWorked

})
);

},

load(){

try{

const raw=
localStorage.getItem(
this.saveKey
);

if(!raw)return;

const data=
JSON.parse(raw);

if(Number.isFinite(data.cash))
this.cash=Math.max(
0,data.cash
);

if(
typeof data.job==="string" &&
this.jobData[data.job]
)
this.job=data.job;

if(Number.isFinite(data.experience))
this.experience=Math.max(
0,data.experience
);

if(Number.isFinite(data.level))
this.level=Math.max(
1,data.level
);

if(Number.isFinite(data.energy))
this.energy=Math.min(
100,
Math.max(0,data.energy)
);

if(Number.isFinite(data.totalEarned))
this.totalEarned=Math.max(
0,data.totalEarned
);

if(Number.isFinite(data.daysWorked))
this.daysWorked=Math.max(
0,data.daysWorked
);

}catch(e){

console.log(
"V192 load error:",
e
);

}

},

open(title,content){

document.getElementById(
"panelTitle"
).textContent=title;

document.getElementById(
"panelContent"
).innerHTML=
content;

document.getElementById(
"panel"
).style.display=
"flex";

},

close(){

document.getElementById(
"panel"
).style.display=
"none";

},

notify(text){

const el=
document.getElementById(
"notification"
);

el.textContent=text;

el.style.display=
"block";

clearTimeout(this.timer);

this.timer=
setTimeout(
()=>{
el.style.display=
"none";
},
2400
);

}

};

V192.init();

console.log(
"WEBBOUND V192 JOBS SYSTEM READY"
);

</script>

</body>
</html>
