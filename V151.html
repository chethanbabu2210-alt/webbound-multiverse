<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V151 — DAY NIGHT & WEATHER</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05080c;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:#263f4a;
 transition:
  background 1s linear;
}

#world{
 position:absolute;
 inset:0;
 overflow:hidden;
}

/* WORLD */

.road{
 position:absolute;
 background:#252d32;
}

.road.h{
 left:0;
 right:0;
 top:57%;
 height:58px;
}

.road.v{
 top:0;
 bottom:0;
 left:69%;
 width:58px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff1c;
 border-radius:9px;
 color:#91a0a8;
 font-size:10px;
}

.b1{
 left:4%;
 top:7%;
 width:19%;
 height:28%;
}

.b2{
 left:28%;
 top:7%;
 width:19%;
 height:28%;
}

.b3{
 left:52%;
 top:7%;
 width:16%;
 height:27%;
}

.b4{
 right:3%;
 top:7%;
 width:22%;
 height:28%;
}

.b5{
 left:4%;
 bottom:6%;
 width:20%;
 height:24%;
}

.b6{
 left:30%;
 bottom:7%;
 width:18%;
 height:22%;
}

/* PLAYER */

#player{
 position:absolute;
 left:50%;
 top:57%;
 width:30px;
 height:42px;
 border-radius:10px 10px 5px 5px;
 background:#2b91db;
 z-index:30;
}

#player:before{
 content:"";
 position:absolute;
 width:18px;
 height:18px;
 left:6px;
 top:-14px;
 border-radius:50%;
 background:#bd8967;
}

/* STREET LIGHTS */

.light{
 position:absolute;
 width:10px;
 height:10px;
 border-radius:50%;
 background:#ffd978;
 box-shadow:
 0 0 14px #ffd978,
 0 0 30px #ffd978;
 opacity:0;
 transition:opacity 1s;
 z-index:10;
}

.l1{left:25%;top:54%}
.l2{left:50%;top:54%}
.l3{left:80%;top:54%}
.l4{left:67%;top:35%}
.l5{left:67%;top:72%}

/* WEATHER */

#weatherLayer{
 position:absolute;
 inset:0;
 pointer-events:none;
 z-index:200;
 overflow:hidden;
}

.rainDrop{
 position:absolute;
 width:2px;
 height:15px;
 background:#a8d8ff;
 opacity:.55;
 transform:rotate(15deg);
}

.snowDrop{
 position:absolute;
 width:5px;
 height:5px;
 border-radius:50%;
 background:white;
 opacity:.8;
}

#fog{
 position:absolute;
 inset:0;
 background:#dcecff;
 opacity:0;
 pointer-events:none;
 z-index:190;
 transition:opacity 1s;
}

#nightOverlay{
 position:absolute;
 inset:0;
 background:#071225;
 opacity:0;
 pointer-events:none;
 z-index:180;
 transition:opacity 1s;
}

/* HUD */

#hud{
 position:fixed;
 top:10px;
 left:10px;
 width:min(420px,76vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.row{
 display:flex;
 gap:6px;
 margin-top:8px;
}

.stat{
 flex:1;
 padding:7px;
 text-align:center;
 background:#101b23;
 border-radius:7px;
 font-size:9px;
}

#weatherText{
 margin-top:8px;
 padding:8px;
 background:#111d25;
 border-radius:8px;
 font-size:10px;
}

#timeBar{
 margin-top:8px;
 height:7px;
 background:#ffffff18;
 border-radius:5px;
 overflow:hidden;
}

#timeProgress{
 width:25%;
 height:100%;
 background:#b68be8;
 transition:width .4s;
}

/* CONTROLS */

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(760px,95vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 color:#fff;
 border:1px solid #ffffff22;
 border-radius:8px;
 font-size:10px;
}

button:active{
 transform:scale(.97);
}

/* PANEL */

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000b;
 z-index:1000;
}

.box{
 width:min(620px,92vw);
 max-height:82vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 margin-top:7px;
 background:#111d25;
 border-radius:9px;
 font-size:10px;
 line-height:1.6;
}

/* MESSAGE */

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road h"></div>
  <div class="road v"></div>

  <div class="building b1">
   🏠 RESIDENTIAL
  </div>

  <div class="building b2">
   🏫 SCHOOL
  </div>

  <div class="building b3">
   🏥 HOSPITAL
  </div>

  <div class="building b4">
   🏢 CORPORATE
  </div>

  <div class="building b5">
   🏭 WAREHOUSE
  </div>

  <div class="building b6">
   🌳 PARK
  </div>

  <div class="light l1"></div>
  <div class="light l2"></div>
  <div class="light l3"></div>
  <div class="light l4"></div>
  <div class="light l5"></div>

  <div id="player"></div>

 </div>

 <div id="nightOverlay"></div>
 <div id="fog"></div>
 <div id="weatherLayer"></div>

 <div id="hud">

  <div class="title">
   🌍 WEBBOUND V151
  </div>

  <div class="row">

   <div class="stat">
    🕐 TIME<br>
    <span id="clock">06:00</span>
   </div>

   <div class="stat">
    🌤️ PERIOD<br>
    <span id="period">Morning</span>
   </div>

   <div class="stat">
    📅 DAY<br>
    <span id="day">1</span>
   </div>

  </div>

  <div id="weatherText">
   ☀️ Weather: Clear
  </div>

  <div id="timeBar">
   <div id="timeProgress"></div>
  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V151.toggleTime()">
   ⏯️ TIME
  </button>

  <button onclick="V151.changeWeather()">
   🌦️ WEATHER
  </button>

  <button onclick="V151.fastForward()">
   ⏩ +1 HOUR
  </button>

  <button onclick="V151.worldInfo()">
   🌍 WORLD
  </button>

  <button onclick="V151.save()">
   💾 SAVE
  </button>

  <button onclick="V151.reset()">
   🔄 RESET
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND
   </h2>

   <div id="panelContent"></div>

   <button onclick="V151.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V151={

 saveKey:"WEBBOUND_V151",

 hour:6,

 minute:0,

 day:1,

 running:true,

 weatherIndex:0,

 weatherTypes:[

  {
   id:"clear",
   name:"Clear",
   icon:"☀️",
   fog:0
  },

  {
   id:"cloudy",
   name:"Cloudy",
   icon:"☁️",
   fog:0.05
  },

  {
   id:"rain",
   name:"Rain",
   icon:"🌧️",
   fog:0.08
  },

  {
   id:"storm",
   name:"Storm",
   icon:"⛈️",
   fog:0.12
  },

  {
   id:"fog",
   name:"Fog",
   icon:"🌫️",
   fog:0.55
  },

  {
   id:"snow",
   name:"Snow",
   icon:"❄️",
   fog:0.15
  }

 ],

 rainTimer:null,

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  setInterval(
   ()=>{
    if(this.running)
     this.tick();
   },
   1000
  );

  this.notify(
   "🌍 V151 dynamic world loaded"
  );

 },

 /* =========================
    TIME
 ========================= */

 tick(){

  this.minute+=5;

  if(this.minute>=60){

   this.minute=0;

   this.hour++;

  }

  if(this.hour>=24){

   this.hour=0;

   this.day++;

   this.notify(
    "🌅 Day "+
    this.day+
    " has begun"
   );

  }

  this.update();

 },

 toggleTime(){

  this.running=
   !this.running;

  this.notify(
   this.running
   ?"▶ Time resumed"
   :"⏸ Time paused"
  );

 },

 fastForward(){

  this.hour++;

  if(this.hour>=24){

   this.hour=0;

   this.day++;

  }

  this.update();

  this.notify(
   "⏩ Time advanced"
  );

 },

 /* =========================
    PERIOD
 ========================= */

 getPeriod(){

  if(this.hour>=5 && this.hour<8)
   return "Dawn";

  if(this.hour>=8 && this.hour<12)
   return "Morning";

  if(this.hour>=12 && this.hour<17)
   return "Afternoon";

  if(this.hour>=17 && this.hour<20)
   return "Evening";

  if(this.hour>=20 || this.hour<5)
   return "Night";

  return "Day";

 },

 isNight(){

  return(
   this.hour>=20 ||
   this.hour<5
  );

 },

 /* =========================
    WORLD VISUALS
 ========================= */

 update(){

  const game=
   document.getElementById(
    "game"
   );

  const night=
   document.getElementById(
    "nightOverlay"
   );

  const fog=
   document.getElementById(
    "fog"
   );

  const weather=
   this.weatherTypes[
    this.weatherIndex
   ];

  /* NIGHT */

  if(this.isNight()){

   night.style.opacity=
    this.hour>=23 ||
    this.hour<3
    ?0.72
    :0.5;

  }
  else if(
   this.hour>=17
  ){

   night.style.opacity=0.25;

  }
  else{

   night.style.opacity=0;

  }

  /* WEATHER FOG */

  fog.style.opacity=
   weather.fog;

  /* BACKGROUND */

  if(
   weather.id==="storm"
  ){

   game.style.background=
    "linear-gradient(#26343d,#10171b 65%)";

  }
  else if(
   weather.id==="rain"
  ){

   game.style.background=
    "linear-gradient(#304653,#0d171d 65%)";

  }
  else if(
   this.isNight()
  ){

   game.style.background=
    "linear-gradient(#111d34,#050911 65%)";

  }
  else{

   game.style.background=
    "linear-gradient(#284957,#081218 65%)";

  }

  this.updateLights();

  this.updateHUD();

  this.updateWeather();

 },

 /* =========================
    LIGHTS
 ========================= */

 updateLights(){

  const lights=
   document.querySelectorAll(
    ".light"
   );

  const active=
   this.isNight()||
   this.hour>=18||
   this.hour<6;

  lights.forEach(
   light=>{
    light.style.opacity=
     active?1:0;
   }
  );

 },

 /* =========================
    WEATHER
 ========================= */

 changeWeather(){

  this.weatherIndex++;

  if(
   this.weatherIndex>=
   this.weatherTypes.length
  )
   this.weatherIndex=0;

  this.updateWeather();

  const weather=
   this.weatherTypes[
    this.weatherIndex
   ];

  this.notify(
   weather.icon+
   " Weather changed to "+
   weather.name
  );

  this.save();

 },

 updateWeather(){

  const weather=
   this.weatherTypes[
    this.weatherIndex
   ];

  document.getElementById(
   "weatherText"
  ).textContent=
   weather.icon+
   " Weather: "+
   weather.name;

  this.clearWeatherEffects();

  if(weather.id==="rain")
   this.createRain(90);

  if(weather.id==="storm")
   this.createRain(160);

  if(weather.id==="snow")
   this.createSnow(80);

 },

 clearWeatherEffects(){

  const layer=
   document.getElementById(
    "weatherLayer"
   );

  layer.innerHTML="";

 },

 createRain(count){

  const layer=
   document.getElementById(
    "weatherLayer"
   );

  for(
   let i=0;
   i<count;
   i++
  ){

   const drop=
    document.createElement(
     "div"
    );

   drop.className=
    "rainDrop";

   drop.style.left=
    Math.random()*100+
    "%";

   drop.style.top=
    Math.random()*100+
    "%";

   drop.style.animation=
    "fall "+
    (
     0.35+
     Math.random()*
     0.65
    )+
    "s linear infinite";

   layer.appendChild(drop);

  }

 },

 createSnow(count){

  const layer=
   document.getElementById(
    "weatherLayer"
   );

  for(
   let i=0;
   i<count;
   i++
  ){

   const snow=
    document.createElement(
     "div"
    );

   snow.className=
    "snowDrop";

   snow.style.left=
    Math.random()*100+
    "%";

   snow.style.top=
    Math.random()*100+
    "%";

   snow.style.animation=
    "snowFall "+
    (
     2+
     Math.random()*4
    )+
    "s linear infinite";

   layer.appendChild(snow);

  }

 },

 /* =========================
    HUD
 ========================= */

 updateHUD(){

  const hh=
   String(this.hour)
    .padStart(2,"0");

  const mm=
   String(this.minute)
    .padStart(2,"0");

  document.getElementById(
   "clock"
  ).textContent=
   hh+":"+mm;

  document.getElementById(
   "period"
  ).textContent=
   this.getPeriod();

  document.getElementById(
   "day"
  ).textContent=
   this.day;

  const total=
   24*60;

  const current=
   this.hour*60+
   this.minute;

  document.getElementById(
   "timeProgress"
  ).style.width=
   (
    current/total*100
   )+"%";

 },

 /* =========================
    WORLD INFO
 ========================= */

 worldInfo(){

  const weather=
   this.weatherTypes[
    this.weatherIndex
   ];

  const html=`

   <div class="card">
    📅 Current day:
    <b>${this.day}</b>
   </div>

   <div class="card">
    🕐 Current time:
    <b>
     ${String(this.hour).padStart(2,"0")}:
     ${String(this.minute).padStart(2,"0")}
    </b>
   </div>

   <div class="card">
    🌤️ Period:
    <b>${this.getPeriod()}</b>
   </div>

   <div class="card">
    ${weather.icon}
    Weather:
    <b>${weather.name}</b>
   </div>

   <div class="card">
    ${
     this.isNight()
     ?"🌙 Night-time world"
     :"☀️ Day-time world"
    }
   </div>

  `;

  this.open(
   "🌍 WORLD STATUS",
   html
  );

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    hour:this.hour,

    minute:this.minute,

    day:this.day,

    running:this.running,

    weatherIndex:
     this.weatherIndex

   })
  );

  this.notify(
   "💾 V151 world saved"
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   this.hour=
    Number.isFinite(data.hour)
    ?data.hour
    :6;

   this.minute=
    Number.isFinite(data.minute)
    ?data.minute
    :0;

   this.day=
    Number.isFinite(data.day)
    ?data.day
    :1;

   this.running=
    data.running!==false;

   this.weatherIndex=
    Number.isFinite(
     data.weatherIndex
    )
    ?data.weatherIndex
    :0;

  }
  catch(e){

   console.log(
    "V151 load error",
    e
   );

  }

 },

 /* =========================
    RESET
 ========================= */

 reset(){

  localStorage.removeItem(
   this.saveKey
  );

  this.hour=6;
  this.minute=0;
  this.day=1;
  this.running=true;
  this.weatherIndex=0;

  this.update();

  this.notify(
   "🔄 World reset"
  );

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2200
   );

 }

};

const style=
document.createElement("style");

style.textContent=`

@keyframes fall{

 from{
  transform:
   translateY(-30px)
   rotate(15deg);
 }

 to{
  transform:
   translateY(110vh)
   rotate(15deg);
 }

}

@keyframes snowFall{

 from{
  transform:
   translateY(-20px)
   translateX(0);
 }

 50%{
  transform:
   translateY(50vh)
   translateX(25px);
 }

 to{
  transform:
   translateY(110vh)
   translateX(-20px);
 }

}

`;

document.head.appendChild(style);

V151.init();

console.log(
 "WEBBOUND V151 DAY/NIGHT & WEATHER SYSTEM READY"
);

</script>

</body>
</html>
