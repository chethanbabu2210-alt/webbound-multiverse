<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V141</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:#071018;
  color:#fff;
  font-family:Arial,sans-serif
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:linear-gradient(#182833,#09131b)
}

.road{
  position:absolute;
  background:#252c32;
  z-index:3
}

.road.h{
  height:38px;
  left:0;
  right:0
}

.road.v{
  width:38px;
  top:0;
  bottom:0
}

#buildings{
  position:absolute;
  inset:0;
  z-index:5
}

.building{
  position:absolute;
  background:#1b2935;
  border:1px solid #ffffff18;
  border-radius:8px
}

.label{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  white-space:nowrap
}

#player{
  position:absolute;
  width:22px;
  height:30px;
  background:#268de5;
  border-radius:9px 9px 4px 4px;
  transform:translate(-50%,-50%);
  z-index:7000
}

#player:before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  left:4.5px;
  top:-9px;
  border-radius:50%;
  background:#c9936c
}

.npc{
  position:absolute;
  width:17px;
  height:25px;
  border-radius:8px 8px 4px 4px;
  z-index:2000
}

.npc:before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  left:3.5px;
  top:-8px;
  border-radius:50%;
  background:#c9936c
}

.npcName{
  position:absolute;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  font-size:7px;
  white-space:nowrap;
  text-shadow:0 1px 3px #000
}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  z-index:1800
}

.station{
  position:absolute;
  width:30px;
  height:30px;
  border-radius:7px;
  z-index:2500;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#182c3b;
  border:1px solid #ffffff30;
  font-size:17px
}

.court{
  position:absolute;
  width:70px;
  height:42px;
  background:#30251e;
  border:1px solid #d0a75b55;
  border-radius:8px;
  z-index:2500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  text-align:center
}

.lawOffice{
  position:absolute;
  width:65px;
  height:38px;
  background:#202b35;
  border:1px solid #8cb5d555;
  border-radius:8px;
  z-index:2500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  text-align:center
}

.evidenceOffice{
  position:absolute;
  width:75px;
  height:40px;
  background:#252d22;
  border:1px solid #9ebd6c55;
  border-radius:8px;
  z-index:2500;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:9px;
  text-align:center
}

.marker{
  position:absolute;
  width:28px;
  height:28px;
  border-radius:50%;
  z-index:5500;
  display:flex;
  align-items:center;
  justify-content:center
}

.caseMarker{
  background:#712d88;
  border:2px solid #e8a7ff;
  box-shadow:0 0 12px #a84bd8;
  animation:pulse 1.1s infinite
}

.warrantMarker{
  background:#9a5b24;
  border:2px solid #ffd17b;
  box-shadow:0 0 10px #d28b35
}

.evidenceMarker{
  background:#2c754c;
  border:2px solid #a4e0b8;
  box-shadow:0 0 10px #4fc47c
}

@keyframes pulse{
  50%{transform:scale(1.2)}
}

#hud{
  position:fixed;
  left:10px;
  bottom:10px;
  width:min(520px,94vw);
  padding:13px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:14px;
  z-index:9000
}

#title{
  font-size:14px;
  font-weight:bold
}

#stats{
  margin-top:8px;
  font-size:10px;
  line-height:1.7
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px
}

button{
  flex:1;
  min-width:92px;
  padding:8px;
  border:1px solid #ffffff18;
  border-radius:8px;
  background:#172535;
  color:white;
  font-size:9px
}

#clock{
  position:fixed;
  right:10px;
  top:10px;
  z-index:9000;
  padding:9px 12px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:10px;
  font-size:11px
}

#message{
  position:fixed;
  left:50%;
  top:16%;
  transform:translateX(-50%);
  z-index:9500;
  display:none;
  padding:10px 15px;
  background:#03070cf5;
  border:1px solid #ffffff30;
  border-radius:10px;
  font-size:11px;
  text-align:center
}

#panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(520px,94vw);
  max-height:80vh;
  overflow:auto;
  display:none;
  padding:15px;
  background:#03070cf9;
  border:1px solid #ffffff30;
  border-radius:16px;
  z-index:12000
}

#panelTitle{
  font-size:14px;
  font-weight:bold
}

.row{
  margin-top:8px;
  padding:10px;
  background:#111c28;
  border-radius:9px;
  font-size:10px;
  line-height:1.6
}

.progress{
  height:8px;
  background:#25313c;
  border-radius:5px;
  margin-top:7px;
  overflow:hidden
}

.progress i{
  display:block;
  height:100%;
  background:#5d9bc8
}

.close{
  width:100%;
  margin-top:10px
}
</style>
</head>

<body>

<div id="world">

  <div class="road h" style="top:27%"></div>
  <div class="road h" style="top:67%"></div>

  <div class="road v" style="left:24%"></div>
  <div class="road v" style="left:56%"></div>
  <div class="road v" style="left:78%"></div>

  <div id="buildings"></div>
  <div id="player"></div>

</div>

<div id="clock">📅 Day 1 • 🕐 08:00</div>

<div id="message"></div>

<div id="hud">

  <div id="title">
    🔎 WEBBOUND V141 — INVESTIGATION SYSTEM
  </div>

  <div id="stats"></div>

  <div class="buttons">

    <button onclick="V141.casePanel()">
      📁 CASES
    </button>

    <button onclick="V141.collectEvidence()">
      🔎 COLLECT
    </button>

    <button onclick="V141.interviewWitness()">
      🗣️ WITNESS
    </button>

    <button onclick="V141.analyzeEvidence()">
      🧪 ANALYZE
    </button>

    <button onclick="V141.evidenceBoard()">
      🧩 BOARD
    </button>

    <button onclick="V141.lawyerPanel()">
      👨‍⚖️ LAWYER
    </button>

    <button onclick="V141.prepareCase()">
      📚 PREPARE
    </button>

    <button onclick="V141.trial()">
      ⚖️ TRIAL
    </button>

  </div>

</div>

<div id="panel">

  <div id="panelTitle">
    WEBBOUND V141
  </div>

  <div id="panelContent"></div>

  <button class="close" onclick="V141.closePanel()">
    CLOSE
  </button>

</div>

<script>

const V141={

  saveKey:"WEBBOUND_V140",

  keys:{},

  hour:8,

  day:1,

  player:{
    x:window.innerWidth/2,
    y:window.innerHeight/2,
    money:1000,
    reputation:0,
    job:"Detective"
  },

  npcs:[],
  cars:[],
  stations:[],
  cases:[],

  lawyers:[
    {
      id:1,
      name:"Aarav Rao",
      type:"Defense",
      skill:72,
      fee:120,
      available:true,
      hired:false
    },
    {
      id:2,
      name:"Maya Sharma",
      type:"Defense",
      skill:84,
      fee:180,
      available:true,
      hired:false
    },
    {
      id:3,
      name:"Daniel Brooks",
      type:"Prosecution",
      skill:78,
      fee:160,
      available:true,
      hired:false
    },
    {
      id:4,
      name:"Riya Menon",
      type:"Defense",
      skill:91,
      fee:250,
      available:true,
      hired:false
    }
  ],

  hiredLawyer:null,

  court:{
    hearings:0,
    convictions:0,
    acquittals:0,
    warrants:0,
    arrests:0,
    fines:0,
    justiceScore:50
  },

  investigation:{
    evidenceCollected:0,
    evidenceAnalyzed:0,
    witnessInterviews:0,
    solvedCases:0
  },

  /* ==================================
     INIT
     ================================== */

  init(){

    this.load();

    this.createBuildings();
    this.createStations();
    this.createCourt();
    this.createLawOffice();
    this.createEvidenceOffice();

    this.createNPCs();
    this.createCars();

    this.keyboard();
    this.render();

    setInterval(
      ()=>this.update(),
      40
    );

    setInterval(
      ()=>this.generateCase(),
      15000
    );

    this.message(
      "🔎 V141 Investigation System online"
    );

  },

  /* ==================================
     BUILDINGS
     ================================== */

  createBuildings(){

    const root=
      document.getElementById("buildings");

    const data=[

      ["🏠 Homes",5,6,17,18],
      ["🏫 School",29,7,17,15],
      ["🏥 Hospital",60,7,14,15],
      ["🏢 Offices",81,7,15,16],
      ["🏪 Shops",81,45,15,16],
      ["🌳 Park",29,47,18,17],
      ["🍽️ Restaurant",60,46,15,15],
      ["🏭 Factory",5,46,17,16]

    ];

    data.forEach(d=>{

      const el=
        document.createElement("div");

      el.className="building";

      el.style.left=d[1]+"%";
      el.style.top=d[2]+"%";
      el.style.width=d[3]+"%";
      el.style.height=d[4]+"%";

      const label=
        document.createElement("div");

      label.className="label";
      label.textContent=d[0];

      el.appendChild(label);
      root.appendChild(el);

    });

  },

  /* ==================================
     COURT
     ================================== */

  createCourt(){

    const el=
      document.createElement("div");

    el.className="court";
    el.textContent="⚖️ CITY COURT";

    el.style.left="43%";
    el.style.top="82%";

    document
      .getElementById("world")
      .appendChild(el);

    this.courtPosition={
      x:window.innerWidth*.43+35,
      y:window.innerHeight*.82+21
    };

  },

  /* ==================================
     LAW OFFICE
     ================================== */

  createLawOffice(){

    const el=
      document.createElement("div");

    el.className="lawOffice";
    el.textContent="👨‍⚖️ LAW OFFICE";

    el.style.left="65%";
    el.style.top="82%";

    document
      .getElementById("world")
      .appendChild(el);

    this.lawOfficePosition={
      x:window.innerWidth*.65+32,
      y:window.innerHeight*.82+19
    };

  },

  /* ==================================
     EVIDENCE OFFICE
     ================================== */

  createEvidenceOffice(){

    const el=
      document.createElement("div");

    el.className="evidenceOffice";
    el.textContent="🧪 FORENSICS";

    el.style.left="13%";
    el.style.top="82%";

    document
      .getElementById("world")
      .appendChild(el);

    this.evidencePosition={
      x:window.innerWidth*.13+37,
      y:window.innerHeight*.82+20
    };

  },

  /* ==================================
     STATIONS
     ================================== */

  createStations(){

    const data=[

      ["police","🚓",.12,.20],
      ["medical","🏥",.65,.18],
      ["fire","🚒",.87,.35]

    ];

    data.forEach(d=>{

      const el=
        document.createElement("div");

      el.className="station";
      el.textContent=d[1];

      el.style.left=
        `calc(${d[2]*100}% - 15px)`;

      el.style.top=
        `calc(${d[3]*100}% - 15px)`;

      document
        .getElementById("world")
        .appendChild(el);

      this.stations.push({

        type:d[0],

        x:
          window.innerWidth*d[2],

        y:
          window.innerHeight*d[3],

        element:el

      });

    });

  },

  /* ==================================
     NPCS
     ================================== */

  createNPCs(){

    if(this.npcs.length)
      return;

    const names=[

      "Alex","Sam","Ryan","Maya",
      "Arun","Riya","Dev","Asha",
      "Noah","Leo","Avi","Zara",
      "Kiran","Nikhil","Anu",
      "Rahul","Meera","Vikram"

    ];

    for(let i=0;i<18;i++){

      this.npcs.push({

        id:i+1,

        name:
          names[i%names.length],

        x:
          Math.random()*
          window.innerWidth,

        y:
          160+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-220
          ),

        targetX:
          Math.random()*
          window.innerWidth,

        targetY:
          160+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-220
          ),

        trust:
          35+
          Math.floor(
            Math.random()*60
          ),

        legalStatus:"Free",

        element:null

      });

    }

  },

  /* ==================================
     CARS
     ================================== */

  createCars(){

    if(this.cars.length)
      return;

    for(let i=0;i<12;i++){

      const horizontal=
        Math.random()>.5;

      this.cars.push({

        x:
          horizontal
          ?Math.random()*
            window.innerWidth
          :window.innerWidth*.24,

        y:
          horizontal
          ?(
            Math.random()>.5
            ?window.innerHeight*.27+12
            :window.innerHeight*.67+12
          )
          :Math.random()*
            window.innerHeight,

        horizontal,

        speed:
          1+
          Math.random()*1.4,

        direction:
          Math.random()>.5
          ?1
          :-1,

        element:null

      });

    }

  },

  /* ==================================
     CASE GENERATION
     ================================== */

  generateCase(){

    if(
      this.cases.filter(
        c=>c.status!=="Closed"
      ).length>=4
    )
      return;

    const types=[

      ["🛍️","Shop Theft","Property theft"],
      ["🚗","Vehicle Theft","Vehicle theft"],
      ["💳","Fraud","Financial fraud"],
      ["🏠","Burglary","Burglary"],
      ["🏢","Office Crime","Property crime"]

    ];

    const t=
      types[
        Math.floor(
          Math.random()*types.length
        )
      ];

    const suspect=
      this.npcs[
        Math.floor(
          Math.random()*this.npcs.length
        )
      ];

    const c={

      id:Date.now(),

      icon:t[0],
      name:t[1],
      charge:t[2],

      suspect:suspect.name,

      evidence:20+
        Math.floor(
          Math.random()*51
        ),

      witness:
        Math.random()>.4,

      evidenceItems:[],

      witnessStatements:[],

      analyzed:false,

      prepared:false,

      warrant:false,

      arrested:false,

      lawyer:null,

      verdict:null,

      status:"Investigation",

      fine:0,

      x:
        80+
        Math.random()*
        Math.max(
          1,
          window.innerWidth-160
        ),

      y:
        170+
        Math.random()*
        Math.max(
          1,
          window.innerHeight-230
        ),

      marker:null

    };

    this.cases.push(c);

    this.message(
      c.icon+
      " New case: "+
      c.name
    );

  },

  /* ==================================
     FIND CASE
     ================================== */

  nearestCase(){

    let best=null;
    let distance=Infinity;

    this.cases.forEach(c=>{

      if(c.status==="Closed")
        return;

      const dx=
        c.x-this.player.x;

      const dy=
        c.y-this.player.y;

      const d=
        Math.sqrt(
          dx*dx+
          dy*dy
        );

      if(d<distance){

        distance=d;
        best=c;

      }

    });

    return distance<150
      ?best
      :null;

  },

  /* ==================================
     COLLECT EVIDENCE
     ================================== */

  collectEvidence(){

    const c=this.nearestCase();

    if(!c){

      this.message(
        "🔎 Move near a case marker"
      );

      return;

    }

    const evidenceTypes=[

      "🔍 Fingerprint",
      "📷 CCTV footage",
      "🧾 Receipt",
      "📱 Digital record",
      "👟 Footprint",
      "🧤 Object trace"

    ];

    const item=
      evidenceTypes[
        Math.floor(
          Math.random()*
          evidenceTypes.length
        )
      ];

    if(
      c.evidenceItems.includes(item)
    ){

      this.message(
        "🔎 You already collected this clue"
      );

      return;

    }

    c.evidenceItems.push(item);

    c.evidence=
      Math.min(
        100,
        c.evidence+8
      );

    this.investigation.evidenceCollected++;

    this.message(
      "🔎 Evidence collected: "+
      item
    );

  },

  /* ==================================
     WITNESS INTERVIEW
     ================================== */

  interviewWitness(){

    const c=this.nearestCase();

    if(!c){

      this.message(
        "🗣️ No active case nearby"
      );

      return;

    }

    const witness=
      this.npcs.find(
        n=>
          n.name!==c.suspect &&
          n.legalStatus!=="Arrested"
      );

    if(!witness){

      this.message(
        "🗣️ No witness available"
      );

      return;

    }

    if(
      c.witnessStatements.includes(
        witness.name
      )
    ){

      this.message(
        "🗣️ This witness was already interviewed"
      );

      return;

    }

    c.witnessStatements.push(
      witness.name
    );

    this.investigation.witnessInterviews++;

    if(witness.trust>=60){

      c.evidence=
        Math.min(
          100,
          c.evidence+12
        );

      this.message(
        "🗣️ "+
        witness.name+
        " provided useful testimony"
      );

    }
    else{

      c.evidence=
        Math.min(
          100,
          c.evidence+5
        );

      this.message(
        "🗣️ "+
        witness.name+
        " provided limited information"
      );

    }

  },

  /* ==================================
     ANALYZE
     ================================== */

  analyzeEvidence(){

    const c=
      this.cases.find(
        x=>
          x.status!=="Closed" &&
          x.evidenceItems.length>0 &&
          !x.analyzed
      );

    if(!c){

      this.message(
        "🧪 No evidence ready for analysis"
      );

      return;

    }

    const dx=
      this.player.x-this.evidencePosition.x;

    const dy=
      this.player.y-this.evidencePosition.y;

    if(
      Math.sqrt(dx*dx+dy*dy)>180
    ){

      this.message(
        "🧪 Go to the Forensics building"
      );

      return;

    }

    c.analyzed=true;

    c.evidence=
      Math.min(
        100,
        c.evidence+15
      );

    this.investigation.evidenceAnalyzed++;

    this.message(
      "🧪 Forensic analysis completed"
    );

  },

  /* ==================================
     LAWYERS
     ================================== */

  lawyerPanel(){

    let html="";

    if(this.hiredLawyer){

      html+=`

      <div class="row">

      👨‍⚖️ Current lawyer:
      <b>${this.hiredLawyer.name}</b>

      <br>

      ⚖️ Role:
      ${this.hiredLawyer.type}

      <br>

      ⭐ Skill:
      ${this.hiredLawyer.skill}%

      </div>

      `;

    }

    this.lawyers.forEach(l=>{

      html+=`

      <div class="row">

      <b>
      👨‍⚖️ ${l.name}
      </b>

      <br>

      ⚖️ ${l.type}

      <br>

      ⭐ Skill:
      ${l.skill}%

      <div class="progress">
      <i style="width:${l.skill}%"></i>
      </div>

      <br>

      💰 Fee:
      ₹${l.fee}

      <br>

      ${l.available
        ?"🟢 Available"
        :"🔴 Unavailable"}

      </div>

      `;

    });

    this.openPanel(
      "👨‍⚖️ LAWYERS",
      html
    );

  },

  hireLawyer(){

    if(this.hiredLawyer){

      this.message(
        "👨‍⚖️ You already have a lawyer"
      );

      return;

    }

    const lawyer=
      this.lawyers
      .filter(l=>l.available)
      .sort(
        (a,b)=>b.skill-a.skill
      )[0];

    if(!lawyer){

      this.message(
        "No lawyer available"
      );

      return;

    }

    if(
      this.player.money<
      lawyer.fee
    ){

      this.message(
        "💰 Not enough money"
      );

      return;

    }

    this.player.money-=
      lawyer.fee;

    lawyer.available=false;
    lawyer.hired=true;

    this.hiredLawyer=lawyer;

    this.message(
      "🤝 Hired "+
      lawyer.name
    );

  },

  /* ==================================
     PREPARE CASE
     ================================== */

  prepareCase(){

    if(!this.hiredLawyer){

      this.message(
        "👨‍⚖️ Hire a lawyer first"
      );

      return;

    }

    const c=
      this.cases.find(
        x=>
          x.status==="Awaiting trial"
      );

    if(!c){

      this.message(
        "📚 No trial-ready case"
      );

      return;

    }

    if(c.prepared){

      this.message(
