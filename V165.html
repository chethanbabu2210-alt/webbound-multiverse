<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V165 — GARAGE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#05090d;color:#fff}
#game{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#294856,#081217)}
#world{position:absolute;inset:0}
.road{position:absolute;background:#252d32}
.rh{left:0;right:0;top:57%;height:70px}
.rv{top:0;bottom:0;left:68%;width:70px}
.line{position:absolute;background:#d5c36c;opacity:.45}
.lineH{left:0;right:0;top:calc(57% + 34px);height:2px}
.lineV{top:0;bottom:0;left:calc(68% + 34px);width:2px}
.building{
 position:absolute;display:flex;align-items:center;justify-content:center;
 text-align:center;background:#14242d;border:1px solid #ffffff18;
 border-radius:9px;color:#82929b;font-size:10px
}
.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;left:50%;top:53%;width:29px;height:41px;
 border-radius:10px 10px 5px 5px;background:#2c91da;z-index:50
}
#player:before{
 content:"";position:absolute;left:5.5px;top:-14px;width:18px;height:18px;
 border-radius:50%;background:#bd8967
}

#vehicle{
 position:absolute;display:none;left:50%;top:52%;z-index:60;
 font-size:34px;transform:translate(-50%,-50%)
}

#hud{
 position:fixed;left:10px;top:10px;width:min(650px,90vw);padding:12px;
 background:#03070cee;border:1px solid #ffffff25;border-radius:13px;z-index:500
}
.title{font-size:13px;font-weight:bold}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.stat{padding:7px 4px;background:#101b23;border-radius:7px;text-align:center;font-size:9px}
#vehicleHud{margin-top:8px;padding:9px;background:#111d25;border-radius:8px;font-size:9px;line-height:1.7}
.bar{height:8px;background:#ffffff12;border-radius:7px;overflow:hidden;margin-top:5px}
.fill{height:100%;width:0%;transition:.3s}
#fuelFill{background:#719fd0}

#controls{
 position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
 width:min(950px,96vw);display:flex;flex-wrap:wrap;gap:6px;z-index:500
}
button{
 flex:1;min-width:105px;padding:10px;background:#142733;
 border:1px solid #ffffff22;border-radius:8px;color:#fff;font-size:10px;cursor:pointer
}
button:active{transform:scale(.97)}

#panel{
 position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 background:#000c;z-index:1000
}
.box{
 width:min(760px,94vw);max-height:84vh;overflow:auto;padding:17px;
 background:#050b10;border:1px solid #ffffff28;border-radius:15px
}
.card{
 padding:11px;background:#111d25;border-radius:9px;margin-bottom:7px;
 font-size:10px;line-height:1.6
}
.card button{width:100%;margin-top:8px}

#notification{
 position:fixed;left:50%;top:20%;transform:translateX(-50%);
 padding:10px 15px;background:#03070cf5;border:1px solid #ffffff25;
 border-radius:9px;display:none;z-index:1500;font-size:10px;text-align:center
}
</style>
</head>

<body>
<div id="game">

 <div id="world">
  <div class="road rh"></div>
  <div class="road rv"></div>
  <div class="line lineH"></div>
  <div class="line lineV"></div>

  <div class="building b1">🏠 RESIDENTIAL</div>
  <div class="building b2">🏫 SCHOOL</div>
  <div class="building b3">🏥 HOSPITAL</div>
  <div class="building b4">🏢 CORPORATE</div>
  <div class="building b5">🏭 WAREHOUSE</div>
  <div class="building b6">🌳 PARK</div>

  <div id="player"></div>
  <div id="vehicle"></div>
 </div>

 <div id="hud">
  <div class="title">🚗 WEBBOUND V165 — GARAGE SYSTEM</div>

  <div class="stats">
   <div class="stat">💰 CASH<br>₹<span id="cashText">500</span></div>
   <div class="stat">🚘 VEHICLES<br><span id="vehicleCount">1</span></div>
   <div class="stat">🏁 SPEED<br><span id="speedText">0</span> km/h</div>
   <div class="stat">⛽ FUEL<br><span id="fuelText">100%</span></div>
  </div>

  <div id="vehicleHud">
   <b id="vehicleName">🚶 On Foot</b><br>
   Type: <span id="vehicleType">None</span><br>
   Status: <span id="vehicleStatus">Walking</span><br>

   Fuel
   <div class="bar">
    <div id="fuelFill" class="fill"></div>
   </div>
  </div>
 </div>

 <div id="notification"></div>

 <div id="controls">
  <button onclick="V165.garage()">🚗 GARAGE</button>
  <button onclick="V165.drive()">🏁 DRIVE</button>
  <button onclick="V165.accelerate()">⚡ ACCELERATE</button>
  <button onclick="V165.refuel()">⛽ REFUEL</button>
  <button onclick="V165.exitVehicle()">🚶 EXIT</button>
  <button onclick="V165.save()">💾 SAVE</button>
 </div>

 <div id="panel">
  <div class="box">
   <h2 id="panelTitle">WEBBOUND V165</h2>
   <div id="panelContent"></div>
   <button onclick="V165.close()">CLOSE</button>
  </div>
 </div>

</div>

<script>
const V165={

 saveKey:"WEBBOUND_V165",

 cash:500,

 selected:0,

 driving:false,

 speed:0,

 fuel:100,

 vehicles:[
  {
   name:"City Bike",
   icon:"🏍️",
   type:"Bike",
   price:0,
   maxSpeed:90,
   fuelCapacity:100,
   owned:true
  },
  {
   name:"Street Car",
   icon:"🚗",
   type:"Car",
   price:2500,
   maxSpeed:160,
   fuelCapacity:120,
   owned:false
  },
  {
   name:"Sport Car",
   icon:"🏎️",
   type:"Sports Car",
   price:7500,
   maxSpeed:240,
   fuelCapacity:100,
   owned:false
  },
  {
   name:"Super Bike",
   icon:"🏍️",
   type:"Super Bike",
   price:5000,
   maxSpeed:220,
   fuelCapacity:80,
   owned:false
  },
  {
   name:"SUV",
   icon:"🚙",
   type:"SUV",
   price:10000,
   maxSpeed:180,
   fuelCapacity:150,
   owned:false
  }
 ],

 init(){
  this.load();
  this.update();
  this.notify("🚗 V165 Garage System ready");
 },

 garage(){

  let html="";

  this.vehicles.forEach((v,i)=>{

   const selected=i===this.selected;

   html+=`
    <div class="card">
     <b>${v.icon} ${v.name}</b>

     Type: ${v.type}<br>
     Maximum speed: ${v.maxSpeed} km/h<br>
     Fuel capacity: ${v.fuelCapacity}<br>

     ${
      v.owned
      ?selected
       ?"✅ SELECTED"
       :`
        <button onclick="V165.selectVehicle(${i})">
         SELECT
        </button>
       `
      :`
       Price: ₹${v.price}
       <button onclick="V165.buyVehicle(${i})">
        BUY
       </button>
      `
     }
    </div>
   `;
  });

  this.open("🚗 GARAGE",html);
 },

 buyVehicle(index){

  const v=this.vehicles[index];

  if(!v || v.owned)return;

  if(this.cash<v.price){
   this.notify("❌ Not enough cash.");
   return;
  }

  this.cash-=v.price;
  v.owned=true;

  this.notify(
   "🚗 Purchased "+v.name+
   " for ₹"+v.price
  );

  this.update();
  this.save();
  this.garage();
 },

 selectVehicle(index){

  const v=this.vehicles[index];

  if(!v || !v.owned)return;

  if(this.driving){
   this.notify("🚫 Exit the current vehicle first.");
   return;
  }

  this.selected=index;
  this.fuel=100;
  this.speed=0;

  this.close();
  this.update();
  this.save();

  this.notify(
   "🚗 Selected "+v.name
  );
 },

 drive(){

  const v=this.vehicles[this.selected];

  if(!v || !v.owned)return;

  if(this.fuel<=0){
   this.notify("⛽ Fuel empty.");
   return;
  }

  this.driving=true;

  document.getElementById("player")
   .style.display="none";

  document.getElementById("vehicle")
   .style.display="block";

  document.getElementById("vehicle")
   .textContent=v.icon;

  this.speed=20;

  this.update();

  this.notify(
   "🏁 Driving "+v.name
  );

 },

 accelerate(){

  if(!this.driving){
   this.notify("🚗 Enter a vehicle first.");
   return;
  }

  const v=this.vehicles[this.selected];

  if(this.fuel<=0){
   this.speed=0;
   this.update();
   this.notify("⛽ Out of fuel.");
   return;
  }

  this.speed=Math.min(
   v.maxSpeed,
   this.speed+20
  );

  this.fuel=Math.max(
   0,
   this.fuel-5
  );

  const vehicle=
   document.getElementById("vehicle");

  vehicle.style.left=
   15+Math.random()*70+"%";

  vehicle.style.top=
   20+Math.random()*65+"%";

  this.update();
  this.save();

 },

 refuel(){

  const v=this.vehicles[this.selected];

  if(this.fuel>=100){
   this.notify("⛽ Fuel tank is already full.");
   return;
  }

  const needed=100-this.fuel;
  const cost=Math.ceil(needed*2);

  if(this.cash<cost){
   this.notify(
    "❌ You need ₹"+cost+" to refuel."
   );
   return;
  }

  this.cash-=cost;
  this.fuel=100;

  this.notify(
   "⛽ Refueled for ₹"+cost
  );

  this.update();
  this.save();
 },

 exitVehicle(){

  if(!this.driving){
   this.notify("🚶 You are already on foot.");
   return;
  }

  this.driving=false;
  this.speed=0;

  document.getElementById("vehicle")
   .style.display="none";

  document.getElementById("player")
   .style.display="block";

  this.update();
  this.save();

  this.notify("🚶 Exited vehicle.");
 },

 update(){

  const v=this.vehicles[this.selected];

  document.getElementById("cashText")
   .textContent=this.cash;

  document.getElementById("vehicleCount")
   .textContent=this.vehicles.filter(
    x=>x.owned
   ).length;

  document.getElementById("speedText")
   .textContent=this.speed;

  document.getElementById("fuelText")
   .textContent=Math.round(this.fuel)+"%";

  document.getElementById("fuelFill")
   .style.width=this.fuel+"%";

  if(this.driving){

   document.getElementById("vehicleName")
    .textContent=v.icon+" "+v.name;

   document.getElementById("vehicleType")
    .textContent=v.type;

   document.getElementById("vehicleStatus")
    .textContent="Driving";

  }else{

   document.getElementById("vehicleName")
    .textContent="🚶 On Foot";

   document.getElementById("vehicleType")
    .textContent=v.name;

   document.getElementById("vehicleStatus")
    .textContent="Parked";

  }
 },

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({
    cash:this.cash,
    selected:this.selected,
    driving:false,
    speed:0,
    fuel:this.fuel,
    vehicles:this.vehicles
   })
  );

  this.notify("💾 V165 saved");
 },

 load(){

  try{

   const raw=
    localStorage.getItem(this.saveKey);

   if(!raw)return;

   const data=JSON.parse(raw);

   if(Number.isFinite(data.cash))
    this.cash=data.cash;

   if(Number.isFinite(data.selected))
    this.selected=Math.min(
     data.selected,
     this.vehicles.length-1
    );

   if(Number.isFinite(data.fuel))
    this.fuel=Math.max(
     0,
     Math.min(100,data.fuel)
    );

   if(Array.isArray(data.vehicles)){

    data.vehicles.forEach((saved,i)=>{

     if(this.vehicles[i]){
      this.vehicles[i].owned=
       saved.owned===true;
     }

    });

   }

  }catch(error){

   console.log(
    "V165 load error:",
    error
   );

  }
 },

 open(title,content){

  document.getElementById("panelTitle")
   .textContent=title;

  document.getElementById("panelContent")
   .innerHTML=content;

  document.getElementById("panel")
   .style.display="flex";
 },

 close(){

  document.getElementById("panel")
   .style.display="none";

 },

 notify(text){

  const el=
   document.getElementById("notification");

  el.textContent=text;
  el.style.display="block";

  clearTimeout(this.timer);

  this.timer=setTimeout(()=>{
   el.style.display="none";
  },2300);

 }

};

V165.init();

console.log(
 "WEBBOUND V165 GARAGE SYSTEM READY"
);
</script>

</body>
</html>
