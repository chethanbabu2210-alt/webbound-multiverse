<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V153 — MISSION SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#294856,#081217);
}

#world{
 position:absolute;
 inset:0;
 overflow:hidden;
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:64px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:64px;
}

.lane{
 position:absolute;
 background:#d5c36c;
 opacity:.45;
}

.laneH{
 left:0;
 right:0;
 top:calc(57% + 31px);
 height:2px;
}

.laneV{
 top:0;
 bottom:0;
 left:calc(68% + 31px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

/* PLAYER */

#player{
 position:absolute;
 left:50%;
 top:57%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:40;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

/* HUD */

#hud{
 position:fixed;
 top:10px;
 left:10px;
 width:min(470px,82vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:flex;
 gap:5px;
 margin-top:8px;
}

.stat{
 flex:1;
 padding:7px;
 text-align:center;
 background:#101b23;
 border-radius:7px;
 font-size:9px;
}

#missionTracker{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
}

.missionTitle{
 font-size:10px;
 font-weight:bold;
 margin-bottom:5px;
}

#missionDescription{
 font-size:9px;
 color:#b8c3c9;
 line-height:1.5;
}

.progressOuter{
 margin-top:7px;
 height:7px;
 background:#ffffff15;
 border-radius:5px;
 overflow:hidden;
}

#missionProgress{
 width:0%;
 height:100%;
 background:#b58ce8;
 transition:.3s;
}

#missionReward{
 margin-top:5px;
 font-size:9px;
 color:#d7c1e7;
}

/* CONTROLS */

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(820px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

button:disabled{
 opacity:.45;
}

/* PANEL */

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(680px,93vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(150px,1fr));
 gap:7px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 min-height:120px;
 font-size:10px;
 line-height:1.5;
}

.card b{
 display:block;
 margin-bottom:7px;
}

.complete{
 border:1px solid #72d69a;
}

.active{
 border:1px solid #c18ce7;
}

/* NOTIFICATION */

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road rh"></div>
  <div class="road rv"></div>

  <div class="lane laneH"></div>
  <div class="lane laneV"></div>

  <div class="building b1">
   🏠 RESIDENTIAL
  </div>

  <div class="building b2">
   🏫 SCHOOL
  </div>

  <div class="building b3">
   🏥 HOSPITAL
  </div>

  <div class="building b4">
   🏢 CORPORATE
  </div>

  <div class="building b5">
   🏭 WAREHOUSE
  </div>

  <div class="building b6">
   🌳 PARK
  </div>

  <div id="player"></div>

 </div>

 <div id="hud">

  <div class="title">
   🎯 WEBBOUND V153
  </div>

  <div class="stats">

   <div class="stat">
    ⭐ LEVEL<br>
    <span id="level">1</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cash">0</span>
   </div>

   <div class="stat">
    🎯 MISSIONS<br>
    <span id="completed">0</span>
   </div>

   <div class="stat">
    ✨ XP<br>
    <span id="xp">0</span>
   </div>

  </div>

  <div id="missionTracker">

   <div class="missionTitle">
    CURRENT MISSION
   </div>

   <div id="missionDescription">
    Loading mission...
   </div>

   <div class="progressOuter">
    <div id="missionProgress"></div>
   </div>

   <div id="missionReward">
    Reward: —
   </div>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V153.missions()">
   🎯 MISSIONS
  </button>

  <button onclick="V153.doAction('travel')">
   🚶 TRAVEL
  </button>

  <button onclick="V153.doAction('investigate')">
   🔎 INVESTIGATE
  </button>

  <button onclick="V153.doAction('collect')">
   📦 COLLECT
  </button>

  <button onclick="V153.doAction('photo')">
   📷 TAKE PHOTO
  </button>

  <button onclick="V153.doAction('report')">
   📝 REPORT
  </button>

  <button onclick="V153.claimMission()">
   🏆 CLAIM
  </button>

  <button onclick="V153.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND
   </h2>

   <div id="panelContent"></div>

   <button onclick="V153.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V153={

 saveKey:"WEBBOUND_V153",

 cash:0,

 level:1,

 xp:0,

 completed:0,

 activeMission:0,

 missionProgress:0,

 claimed:false,

 missionsList:[

  {
   id:"first_trip",
   icon:"🚶",
   name:"First Investigation",
   description:
    "Travel around the city and learn the area.",
   action:"travel",
   target:3,
   rewardCash:300,
   rewardXP:100
  },

  {
   id:"evidence",
   icon:"🔎",
   name:"Find Evidence",
   description:
    "Investigate three locations.",
   action:"investigate",
   target:3,
   rewardCash:450,
   rewardXP:150
  },

  {
   id:"delivery",
   icon:"📦",
   name:"Evidence Collection",
   description:
    "Collect five evidence packages.",
   action:"collect",
   target:5,
   rewardCash:600,
   rewardXP:200
  },

  {
   id:"photographer",
   icon:"📷",
   name:"Document Everything",
   description:
    "Take four investigation photographs.",
   action:"photo",
   target:4,
   rewardCash:700,
   rewardXP:250
  },

  {
   id:"report",
   icon:"📝",
   name:"Complete the Report",
   description:
    "Submit three investigation reports.",
   action:"report",
   target:3,
   rewardCash:850,
   rewardXP:300
  },

  {
   id:"master",
   icon:"🏆",
   name:"City Investigator",
   description:
    "Complete ten investigation actions.",
   action:"any",
   target:10,
   rewardCash:1200,
   rewardXP:500
  }

 ],

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  this.notify(
   "🎯 V153 mission system ready"
  );

 },

 /* =========================
    CURRENT MISSION
 ========================= */

 current(){

  return this.missionsList[
   this.activeMission
  ];

 },

 /* =========================
    ACTION SYSTEM
 ========================= */

 doAction(action){

  const mission=
   this.current();

  if(!mission){

   this.notify(
    "🏆 All missions completed!"
   );

   return;

  }

  if(
   this.missionProgress>=
   mission.target
  ){

   this.notify(
    "🏆 Mission ready to claim."
   );

   return;

  }

  if(
   mission.action==="any" ||
   mission.action===action
  ){

   this.missionProgress++;

   this.notify(
    mission.icon+
    " Progress: "+
    this.missionProgress+
    "/"+
    mission.target
   );

   if(
    this.missionProgress>=
    mission.target
   ){

    this.notify(
     "🏆 Mission completed! Claim your reward."
    );

   }

   this.update();

   this.save();

  }
  else{

   this.notify(
    "❌ This action does not match the mission."
   );

  }

 },

 /* =========================
    CLAIM
 ========================= */

 claimMission(){

  const mission=
   this.current();

  if(!mission){

   this.notify(
    "🏆 No more missions."
   );

   return;

  }

  if(
   this.missionProgress<
   mission.target
  ){

   this.notify(
    "🎯 Complete the mission first."
   );

   return;

  }

  if(this.claimed){

   this.notify(
    "Reward already claimed."
   );

   return;

  }

  this.cash+=
   mission.rewardCash;

  this.addXP(
   mission.rewardXP
  );

  this.completed++;

  this.claimed=true;

  this.notify(
   "💰 +₹"+
   mission.rewardCash+
   "   ✨ +"+
   mission.rewardXP+
   " XP"
  );

  setTimeout(
   ()=>{

    this.activeMission++;

    this.missionProgress=0;

    this.claimed=false;

    this.update();

    this.save();

   },
   1200
  );

 },

 /* =========================
    XP
 ========================= */

 addXP(amount){

  this.xp+=amount;

  while(
   this.xp>=
   this.level*500
  ){

   this.xp-=
    this.level*500;

   this.level++;

   this.notify(
    "⭐ LEVEL UP! Level "+
    this.level
   );

  }

 },

 /* =========================
    MISSION MENU
 ========================= */

 missions(){

  let html=`

   <div class="card">

    🎯 Completed missions:
    <b>${this.completed}</b>

    Current mission:
    <b>
     ${
      this.current()
      ?this.current().name
      :"All completed"
     }
    </b>

   </div>

   <div class="grid">

  `;

  this.missionsList.forEach(
   (mission,index)=>{

    const done=
     index<
     this.activeMission;

    const current=
     index===
     this.activeMission;

    html+=`

     <div class="card ${
      done
      ?"complete"
      :current
      ?"active"
      :""
     }">

      <b>
       ${mission.icon}
       ${mission.name}
      </b>

      <div>
       ${mission.description}
      </div>

      <br>

      Progress:
      ${
       done
       ?mission.target
       :index===this.activeMission
       ?this.missionProgress
       :0
      }
      /
      ${mission.target}

      <br>

      💰 ₹${mission.rewardCash}

      <br>

      ✨ ${mission.rewardXP} XP

      <br>

      ${
       done
       ?"✅ COMPLETED"
       :current
       ?"🎯 ACTIVE"
       :"🔒 LOCKED"
      }

     </div>

    `;

   }
  );

  html+=`</div>`;

  this.open(
   "🎯 MISSION CENTER",
   html
  );

 },

 /* =========================
    HUD
 ========================= */

 update(){

  const mission=
   this.current();

  document.getElementById(
   "level"
  ).textContent=
   this.level;

  document.getElementById(
   "cash"
  ).textContent=
   this.cash;

  document.getElementById(
   "completed"
  ).textContent=
   this.completed;

  document.getElementById(
   "xp"
  ).textContent=
   this.xp;

  if(!mission){

   document.getElementById(
    "missionDescription"
   ).textContent=
    "🏆 All missions completed!";

   document.getElementById(
    "missionReward"
   ).textContent=
    "Reward: Complete";

   document.getElementById(
    "missionProgress"
   ).style.width=
    "100%";

   return;

  }

  document.getElementById(
   "missionDescription"
  ).innerHTML=
   mission.icon+
   " <b>"+
   mission.name+
   "</b><br>"+
   mission.description;

  document.getElementById(
   "missionReward"
  ).textContent=
   "💰 ₹"+
   mission.rewardCash+
   " + ✨ "+
   mission.rewardXP+
   " XP";

  const percentage=
   Math.min(
    100,
    this.missionProgress/
    mission.target*
    100
   );

  document.getElementById(
   "missionProgress"
  ).style.width=
   percentage+"%";

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    level:this.level,

    xp:this.xp,

    completed:this.completed,

    activeMission:
     this.activeMission,

    missionProgress:
     this.missionProgress,

    claimed:this.claimed

   })
  );

  /*
   Bridge cash to V150/V152.
  */

  localStorage.setItem(
   "WEBBOUND_V150_CASH",
   this.cash
  );

  this.notify(
   "💾 V153 saved"
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw){

    const oldCash=
     Number(
      localStorage.getItem(
       "WEBBOUND_V150_CASH"
      )
     );

    if(Number.isFinite(oldCash))
     this.cash=oldCash;

    return;

   }

   const data=
    JSON.parse(raw);

   this.cash=
    Number.isFinite(data.cash)
    ?data.cash
    :0;

   this.level=
    Number.isFinite(data.level)
    ?data.level
    :1;

   this.xp=
    Number.isFinite(data.xp)
    ?data.xp
    :0;

   this.completed=
    Number.isFinite(data.completed)
    ?data.completed
    :0;

   this.activeMission=
    Number.isFinite(
     data.activeMission
    )
    ?data.activeMission
    :0;

   this.missionProgress=
    Number.isFinite(
     data.missionProgress
    )
    ?data.missionProgress
    :0;

   this.claimed=
    data.claimed===true;

  }
  catch(error){

   console.log(
    "V153 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2300
   );

 }

};

V153.init();

console.log(
 "WEBBOUND V153 MISSION SYSTEM READY"
);

</script>

</body>
</html>
