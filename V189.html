<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V189 — BANKING</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#05090d;color:#fff
}
#game{
 position:fixed;inset:0;overflow:hidden;
 background:linear-gradient(#304d59,#091116)
}
#sky{
 position:absolute;inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8)
}
.road{position:absolute;background:#252d32}
.rh{left:0;right:0;top:57%;height:70px}
.rv{top:0;bottom:0;left:68%;width:70px}
.line{position:absolute;background:#d5c36c;opacity:.4}
.lineH{left:0;right:0;top:calc(57% + 34px);height:2px}
.lineV{top:0;bottom:0;left:calc(68% + 34px);width:2px}

.building{
 position:absolute;display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:#14242d;border:1px solid #ffffff18;
 border-radius:9px;color:#82929b;font-size:10px
}
.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;left:50%;top:53%;
 width:29px;height:41px;border-radius:10px 10px 5px 5px;
 background:#2c91da;z-index:50
}
#player:before{
 content:"";position:absolute;left:5.5px;top:-14px;
 width:18px;height:18px;border-radius:50%;background:#bd8967
}

#hud{
 position:fixed;left:10px;top:10px;
 width:min(950px,94vw);padding:12px;
 background:#03070cee;border:1px solid #ffffff25;
 border-radius:13px;z-index:500
}
.title{font-size:13px;font-weight:bold}
.stats{
 display:grid;grid-template-columns:repeat(6,1fr);
 gap:5px;margin-top:8px
}
.stat{
 padding:7px 4px;background:#101b23;
 border-radius:7px;text-align:center;font-size:9px
}
#bankHud{
 margin-top:8px;padding:9px;background:#111d25;
 border-radius:8px;font-size:9px;line-height:1.8
}
.bar{
 height:7px;background:#ffffff12;
 border-radius:7px;overflow:hidden;margin-top:4px
}
.fill{
 height:100%;width:0%;
 background:#8fb8df;transition:.3s
}

#controls{
 position:fixed;left:50%;bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;flex-wrap:wrap;gap:6px;z-index:500
}
button{
 flex:1;min-width:105px;padding:10px;
 background:#142733;border:1px solid #ffffff22;
 border-radius:8px;color:#fff;font-size:10px;cursor:pointer
}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}

#panel{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 background:#000c;z-index:1000
}
.box{
 width:min(800px,94vw);max-height:84vh;
 overflow:auto;padding:17px;background:#050b10;
 border:1px solid #ffffff28;border-radius:15px
}
.card{
 padding:11px;background:#111d25;
 border-radius:9px;margin-bottom:7px;
 font-size:10px;line-height:1.7
}
.card button{width:100%;margin-top:8px}

input{
 width:100%;padding:10px;margin:5px 0;
 border-radius:7px;border:1px solid #ffffff22;
 background:#0b141b;color:#fff
}

#notification{
 position:fixed;left:50%;top:20%;
 transform:translateX(-50%);
 padding:10px 15px;background:#03070cf5;
 border:1px solid #ffffff25;border-radius:9px;
 display:none;z-index:1500;font-size:10px;
 text-align:center
}
</style>
</head>

<body>

<div id="game">

<div id="sky"></div>
<div class="road rh"></div>
<div class="road rv"></div>
<div class="line lineH"></div>
<div class="line lineV"></div>

<div class="building b1">🏠 RESIDENTIAL</div>
<div class="building b2">🏢 CORPORATE</div>
<div class="building b3">🛍️ SHOPPING</div>
<div class="building b4">💻 TECHNOLOGY PARK</div>
<div class="building b5">🏭 INDUSTRIAL ZONE</div>
<div class="building b6">🏦 NATIONAL BANK</div>

<div id="player"></div>

<div id="hud">

<div class="title">
🏦 WEBBOUND V189 — BANKING & FINANCE
</div>

<div class="stats">

<div class="stat">
💰 CASH<br>
₹<span id="cashText">5000</span>
</div>

<div class="stat">
🏦 BANK<br>
₹<span id="bankText">0</span>
</div>

<div class="stat">
💳 DEBT<br>
₹<span id="debtText">0</span>
</div>

<div class="stat">
💵 INTEREST<br>
₹<span id="interestText">0</span>
</div>

<div class="stat">
📈 CREDIT<br>
<span id="creditText">500</span>
</div>

<div class="stat">
🏦 STATUS<br>
<span id="statusText">ACTIVE</span>
</div>

</div>

<div id="bankHud">

<b>🏦 BANK ACCOUNT</b><br>

Savings:
₹<span id="savingsText">0</span><br>

Loan Balance:
₹<span id="loanText">0</span><br>

Interest Rate:
<span id="rateText">5</span>%<br>

Last Interest:
₹<span id="lastInterestText">0</span>

<div class="bar">
<div id="bankFill" class="fill"></div>
</div>

</div>

</div>

<div id="notification"></div>

<div id="controls">

<button onclick="V189.bank()">
🏦 BANK
</button>

<button onclick="V189.deposit()">
💰 DEPOSIT
</button>

<button onclick="V189.withdraw()">
💵 WITHDRAW
</button>

<button onclick="V189.loan()">
💳 LOAN
</button>

<button onclick="V189.interest()">
📈 INTEREST
</button>

<button onclick="V189.history()">
📊 HISTORY
</button>

<button onclick="V189.save()">
💾 SAVE
</button>

</div>

<div id="panel">

<div class="box">

<h2 id="panelTitle">
WEBBOUND V189
</h2>

<div id="panelContent"></div>

<button onclick="V189.close()">
CLOSE
</button>

</div>

</div>

</div>

<script>

const V189={

saveKey:"WEBBOUND_V189",

cash:5000,

bankBalance:0,

loanBalance:0,

creditScore:500,

totalInterest:0,

lastInterest:0,

lastInterestTime:0,

historyData:[],

interestRate:5,

loanRate:8,

loanLimit:10000,

init(){

this.load();
this.update();

this.notify(
"🏦 V189 Banking System ready"
);

},

bank(){

this.open(
"🏦 BANK ACCOUNT",
`

<div class="card">

<b>WEBBOUND NATIONAL BANK</b>

<br><br>

💰 Wallet:
₹${this.cash.toLocaleString()}

<br>

🏦 Savings:
₹${this.bankBalance.toLocaleString()}

<br>

💳 Loan:
₹${this.loanBalance.toLocaleString()}

<br>

📈 Credit Score:
${this.creditScore}

<br>

💵 Savings Interest:
${this.interestRate}%

<br>

💳 Loan Interest:
${this.loanRate}%

</div>

<div class="card">

<b>💡 Financial Status</b>

<br><br>

Net Worth:
₹${(
this.cash+
this.bankBalance-
this.loanBalance
).toLocaleString()}

</div>

`
);

},

deposit(){

this.open(
"💰 DEPOSIT MONEY",
`

<div class="card">

Wallet Balance:
₹${this.cash.toLocaleString()}

<input
id="depositAmount"
type="number"
min="1"
placeholder="Enter amount">

<button onclick="V189.makeDeposit()">
🏦 DEPOSIT
</button>

</div>

`
);

},

makeDeposit(){

const input=
document.getElementById(
"depositAmount"
);

const amount=
Math.floor(
Number(input.value)
);

if(!Number.isFinite(amount) ||
amount<=0){

this.notify(
"❌ Enter a valid amount."
);

return;

}

if(amount>this.cash){

this.notify(
"❌ Insufficient wallet cash."
);

return;

}

this.cash-=amount;

this.bankBalance+=amount;

this.record(
"Deposit",
amount
);

this.update();
this.save();
this.close();

this.notify(
"🏦 Deposited ₹"+
amount.toLocaleString()
);

},

withdraw(){

this.open(
"💵 WITHDRAW MONEY",
`

<div class="card">

Savings:
₹${this.bankBalance.toLocaleString()}

<input
id="withdrawAmount"
type="number"
min="1"
placeholder="Enter amount">

<button onclick="V189.makeWithdraw()">
💵 WITHDRAW
</button>

</div>

`
);

},

makeWithdraw(){

const input=
document.getElementById(
"withdrawAmount"
);

const amount=
Math.floor(
Number(input.value)
);

if(!Number.isFinite(amount) ||
amount<=0){

this.notify(
"❌ Enter a valid amount."
);

return;

}

if(amount>this.bankBalance){

this.notify(
"❌ Insufficient bank balance."
);

return;

}

this.bankBalance-=amount;

this.cash+=amount;

this.record(
"Withdrawal",
amount
);

this.update();
this.save();
this.close();

this.notify(
"💵 Withdrawn ₹"+
amount.toLocaleString()
);

},

loan(){

const available=
Math.max(
0,
this.loanLimit-this.loanBalance
);

this.open(
"💳 LOAN CENTER",
`

<div class="card">

<b>LOAN INFORMATION</b>

<br><br>

Current Debt:
₹${this.loanBalance.toLocaleString()}

<br>

Maximum Total Loan:
₹${this.loanLimit.toLocaleString()}

<br>

Available:
₹${available.toLocaleString()}

<br>

Interest Rate:
${this.loanRate}%

</div>

<div class="card">

<input
id="loanAmount"
type="number"
min="1"
placeholder="Enter loan amount">

<button onclick="V189.takeLoan()">
💳 TAKE LOAN
</button>

</div>

<div class="card">

<input
id="repayAmount"
type="number"
min="1"
placeholder="Enter repayment amount">

<button onclick="V189.repayLoan()">
💵 REPAY LOAN
</button>

</div>

`
);

},

takeLoan(){

const input=
document.getElementById(
"loanAmount"
);

const amount=
Math.floor(
Number(input.value)
);

const available=
this.loanLimit-this.loanBalance;

if(!Number.isFinite(amount) ||
amount<=0){

this.notify(
"❌ Enter a valid amount."
);

return;

}

if(amount>available){

this.notify(
"❌ Loan limit exceeded."
);

return;

}

this.loanBalance+=amount;

this.cash+=amount;

this.creditScore=
Math.max(
300,
this.creditScore-10
);

this.record(
"Loan received",
amount
);

this.update();
this.save();
this.close();

this.notify(
"💳 Loan received: ₹"+
amount.toLocaleString()
);

},

repayLoan(){

const input=
document.getElementById(
"repayAmount"
);

const amount=
Math.floor(
Number(input.value)
);

if(!Number.isFinite(amount) ||
amount<=0){

this.notify(
"❌ Enter a valid amount."
);

return;

}

if(amount>this.cash){

this.notify(
"❌ Not enough cash."
);

return;

}

if(amount>this.loanBalance){

this.notify(
"❌ Amount exceeds debt."
);

return;

}

this.cash-=amount;

this.loanBalance-=amount;

this.creditScore=
Math.min(
850,
this.creditScore+8
);

this.record(
"Loan repayment",
amount
);

this.update();
this.save();
this.close();

this.notify(
"💵 Loan repayment: ₹"+
amount.toLocaleString()
);

},

interest(){

if(this.bankBalance<=0){

this.notify(
"🏦 Deposit money to earn interest."
);

return;

}

const now=Date.now();

if(
this.lastInterestTime &&
now-this.lastInterestTime<
30000
){

this.notify(
"⏳ Interest can be processed every 30 seconds."
);

return;

}

const earned=
Math.floor(
this.bankBalance*
(this.interestRate/100)
);

if(earned<=0){

this.notify(
"Interest is below ₹1."
);

return;

}

this.bankBalance+=earned;

this.totalInterest+=earned;

this.lastInterest=earned;

this.lastInterestTime=now;

this.creditScore=
Math.min(
850,
this.creditScore+2
);

this.record(
"Savings interest",
earned
);

this.update();
this.save();

this.notify(
"📈 Interest earned: +₹"+
earned.toLocaleString()
);

},

history(){

let html="";

if(this.historyData.length===0){

html=`
<div class="card">
No transactions yet.
</div>
`;

}else{

[...this.historyData]
.reverse()
.forEach(item=>{

html+=`

<div class="card">

<b>${item.type}</b>

<br>

₹${item.amount.toLocaleString()}

<br>

${new Date(item.time).toLocaleString()}

</div>

`;

});

}

this.open(
"📊 FINANCIAL HISTORY",
html
);

},

record(type,amount){

this.historyData.push({

type:type,

amount:amount,

time:Date.now()

});

if(this.historyData.length>50){

this.historyData.shift();

}

},

update(){

document.getElementById(
"cashText"
).textContent=
this.cash.toLocaleString();

document.getElementById(
"bankText"
).textContent=
this.bankBalance.toLocaleString();

document.getElementById(
"debtText"
).textContent=
this.loanBalance.toLocaleString();

document.getElementById(
"interestText"
).textContent=
this.totalInterest.toLocaleString();

document.getElementById(
"creditText"
).textContent=
this.creditScore;

document.getElementById(
"savingsText"
).textContent=
this.bankBalance.toLocaleString();

document.getElementById(
"loanText"
).textContent=
this.loanBalance.toLocaleString();

document.getElementById(
"rateText"
).textContent=
this.interestRate;

document.getElementById(
"lastInterestText"
).textContent=
this.lastInterest.toLocaleString();

document.getElementById(
"bankFill"
).style.width=
Math.min(
100,
this.bankBalance/
Math.max(
1,
this.loanLimit
)*100
)+"%";

if(this.loanBalance>0){

document.getElementById(
"statusText"
).textContent=
"LOAN ACTIVE";

}else{

document.getElementById(
"statusText"
).textContent=
"ACTIVE";

}

},

save(){

localStorage.setItem(
this.saveKey,
JSON.stringify({

cash:this.cash,

bankBalance:this.bankBalance,

loanBalance:this.loanBalance,

creditScore:this.creditScore,

totalInterest:this.totalInterest,

lastInterest:this.lastInterest,

lastInterestTime:this.lastInterestTime,

historyData:this.historyData

})
);

},

load(){

try{

const raw=
localStorage.getItem(
this.saveKey
);

if(!raw)return;

const data=
JSON.parse(raw);

if(Number.isFinite(data.cash))
this.cash=Math.max(
0,data.cash
);

if(Number.isFinite(data.bankBalance))
this.bankBalance=Math.max(
0,data.bankBalance
);

if(Number.isFinite(data.loanBalance))
this.loanBalance=Math.max(
0,data.loanBalance
);

if(Number.isFinite(data.creditScore))
this.creditScore=Math.min(
850,
Math.max(
300,
data.creditScore
)
);

if(Number.isFinite(data.totalInterest))
this.totalInterest=Math.max(
0,data.totalInterest
);

if(Number.isFinite(data.lastInterest))
this.lastInterest=Math.max(
0,data.lastInterest
);

if(Number.isFinite(data.lastInterestTime))
this.lastInterestTime=data.lastInterestTime;

if(Array.isArray(data.historyData))
this.historyData=data.historyData;

}catch(e){

console.log(
"V189 load error:",
e
);

}

},

open(title,content){

document.getElementById(
"panelTitle"
).textContent=title;

document.getElementById(
"panelContent"
).innerHTML=
content;

document.getElementById(
"panel"
).style.display=
"flex";

},

close(){

document.getElementById(
"panel"
).style.display=
"none";

},

notify(text){

const el=
document.getElementById(
"notification"
);

el.textContent=text;

el.style.display=
"block";

clearTimeout(this.timer);

this.timer=
setTimeout(
()=>{
el.style.display=
"none";
},
2400
);

}

};

V189.init();

console.log(
"WEBBOUND V189 BANKING SYSTEM READY"
);

</script>

</body>
</html>
