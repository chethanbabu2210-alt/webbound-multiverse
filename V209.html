<style>

/* ================= CITY ================= */

#cityWorld{
    position:absolute;
    inset:0;

    overflow:hidden;

    background:
        linear-gradient(
            #172235 0%,
            #263b4d 45%,
            #10151c 46%,
            #090b0f 100%
        );

    z-index:1;
}

.cityBuilding{
    position:absolute;

    bottom:0;

    background:
        linear-gradient(
            90deg,
            #15191f,
            #303943,
            #171b20
        );

    border:
        1px solid #ffffff12;

    box-shadow:
        inset 0 0 20px #0008;
}

.cityWindow{
    position:absolute;

    width:7px;
    height:9px;

    background:#cbd5d8;

    opacity:.5;

    box-shadow:
        0 0 5px #ffffff33;
}

.rooftop{
    position:absolute;

    height:7px;

    background:#59636b;

    top:-7px;

    left:-3px;
    right:-3px;
}


/* ================= GROUND ================= */

#cityRoad{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:28%;

    background:
        linear-gradient(
            #262c32,
            #111419
        );

    border-top:
        3px solid #545b60;
}

.roadLine{
    position:absolute;

    width:90px;
    height:4px;

    background:#d9d9d9;

    top:50%;

    opacity:.55;
}


/* ================= CARS ================= */

.cityCar{
    position:absolute;

    width:58px;
    height:25px;

    border-radius:7px;

    background:
        linear-gradient(
            #5d6870,
            #171b1f
        );

    z-index:30;

    transition:left .2s linear;
}

.cityCar:before{
    content:"";

    position:absolute;

    width:30px;
    height:10px;

    left:14px;
    top:-7px;

    background:#27343d;

    border-radius:6px 6px 2px 2px;
}

.cityWheel{
    position:absolute;

    width:10px;
    height:10px;

    bottom:-5px;

    background:#050505;

    border-radius:50%;
}

.cityWheel.one{
    left:8px;
}

.cityWheel.two{
    right:8px;
}


/* ================= CHECKPOINT ================= */

.cityCheckpoint{
    position:absolute;

    width:25px;
    height:25px;

    border:
        3px solid #dce7ea;

    border-radius:50%;

    z-index:80;

    animation:
        checkpointPulse .8s infinite alternate;

    cursor:pointer;
}

@keyframes checkpointPulse{

    from{
        transform:scale(.85);
        opacity:.55;
    }

    to{
        transform:scale(1.15);
        opacity:1;
    }

}

.cityCheckpoint.complete{
    opacity:.25;
    animation:none;
}


/* ================= COLLECTIBLE ================= */

.cityCollectible{
    position:absolute;

    width:14px;
    height:14px;

    background:#e9eef0;

    transform:rotate(45deg);

    z-index:85;

    box-shadow:
        0 0 12px #ffffff88;

    cursor:pointer;

    animation:
        collectibleFloat 1s infinite alternate;
}

@keyframes collectibleFloat{

    from{
        margin-top:-4px;
    }

    to{
        margin-top:5px;
    }

}


/* ================= HUD ================= */

#cityHud{
    position:fixed;

    left:12px;
    top:12px;

    width:min(250px,55vw);

    padding:10px;

    background:#03070ddd;

    border:
        1px solid #ffffff25;

    border-radius:12px;

    z-index:1000;
}

.cityTitle{
    font-size:12px;
    font-weight:bold;
}

.cityStats{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:5px;

    margin-top:7px;
}

.cityStat{
    padding:6px 3px;

    background:#101b23;

    border-radius:6px;

    text-align:center;

    font-size:8px;
}

#cityMission{
    margin-top:8px;

    font-size:9px;

    line-height:1.5;
}


/* ================= MINIMAP ================= */

#cityMap{
    position:fixed;

    right:12px;
    top:12px;

    width:130px;
    height:100px;

    background:#071016dd;

    border:
        1px solid #ffffff35;

    border-radius:9px;

    z-index:1000;

    overflow:hidden;
}

.mapBuilding{
    position:absolute;

    background:#34424a;
}

#mapPlayer{
    position:absolute;

    width:7px;
    height:7px;

    background:#ffffff;

    border-radius:50%;

    z-index:20;
}

.mapPoint{
    position:absolute;

    width:5px;
    height:5px;

    background:#d9e1e4;

    border-radius:50%;
}


/* ================= TRAVERSAL CONTROLS ================= */

#cityControls{
    position:fixed;

    left:50%;
    bottom:20px;

    transform:translateX(-50%);

    width:min(650px,94vw);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:6px;

    z-index:1000;
}

#cityControls button{

    padding:9px 4px;

    color:#fff;

    background:#111f2a;

    border:
        1px solid #ffffff25;

    border-radius:8px;

    font-size:9px;

    cursor:pointer;
}

#cityControls button:active{
    transform:scale(.94);
}

</style>

<script>

/* =====================================================
 V209 CITY ENGINE
 ===================================================== */

const SpiderCity={

    area:1,

    xp:0,

    items:0,

    checkpoints:0,

    playerX:50,

    playerY:65,

    speed:2,

    targetArea:1,


    /* =========================
       INIT
    ========================= */

    init(){

        this.update();

        this.startCars();

        this.message(
            "🏙️ Welcome to the city!"
        );

    },


    /* =========================
       MOVE
    ========================= */

    move(direction){

        this.playerX+=
            direction*
            this.speed;

        this.playerX=
            Math.max(
                3,
                Math.min(
                    97,
                    this.playerX
                )
            );

        this.applyPosition();

        this.updateMap();

        this.checkNearby();

    },


    /* =========================
       ROOFTOP
    ========================= */

    rooftop(){

        this.playerY=
            35;

        this.applyPosition();

        this.message(
            "🏢 Reached the rooftops!"
        );

        this.update();

    },


    /* =========================
       CENTER
    ========================= */

    center(){

        this.playerX=50;

        this.playerY=65;

        this.applyPosition();

        this.message(
            "🎯 Returned to city center."
        );

        this.update();

    },


    /* =========================
       FAST TRAVEL
    ========================= */

    fastTravel(){

        this.area++;

        if(this.area>5)
            this.area=1;

        this.playerX=
            15+
            (this.area-1)*20;

        this.playerY=40;

        this.xp+=10;

        this.applyPosition();

        this.message(
            "⚡ Travelled to District "+
            this.area
        );

        this.update();

    },


    /* =========================
       CHECKPOINT
    ========================= */

    checkpoint(id){

        const checkpoint=
            document.getElementById(
                "checkpoint"+id
            );

        if(
            checkpoint.classList.contains(
                "complete"
            )
        )
            return;

        checkpoint.classList.add(
            "complete"
        );

        this.checkpoints++;

        this.xp+=25;

        this.message(
            "🏁 CHECKPOINT "+
            id+
            " COMPLETE! +25 XP"
        );

        if(
            this.checkpoints>=3
        ){

            this.message(
                "🏆 DISTRICT COMPLETE!"
            );

            this.xp+=50;

        }

        this.update();

    },


    /* =========================
       COLLECT
    ========================= */

    collect(item){

        if(
            item.dataset.collected
        )
            return;

        item.dataset.collected=
            "true";

        item.style.display=
            "none";

        this.items++;

        this.xp+=15;

        this.message(
            "💠 COLLECTIBLE FOUND! +15 XP"
        );

        this.update();

    },


    /* =========================
       NEARBY
    ========================= */

    checkNearby(){

        const checkpoints=[
            ...document.querySelectorAll(
                ".cityCheckpoint"
            )
        ];

        checkpoints.forEach(
            cp=>{

                const rect=
                    cp.getBoundingClientRect();

                const center=
                    rect.left+
                    rect.width/2;

                const player=
                    window.innerWidth*
                    this.playerX/
                    100;

                if(
                    Math.abs(
                        center-player
                    )<35
                ){

                    cp.style.transform=
                        "scale(1.3)";

                }else{

                    cp.style.transform=
                        "";

                }

            }
        );

    },


    /* =========================
       APPLY PLAYER POSITION
    ========================= */

    applyPosition(){

        const player=
            document.getElementById(
                "spiderman"
            );

        if(!player)
            return;

        player.style.left=
            this.playerX+"%";

        player.style.top=
            this.playerY+"%";

    },


    /* =========================
       MAP
    ========================= */

    updateMap(){

        const marker=
            document.getElementById(
                "mapPlayer"
            );

        marker.style.left=
            (
                this.playerX*.9
            )+"%";

        marker.style.top=
            (
                this.playerY*.7
            )+"%";

    },


    /* =========================
       MOVING CARS
    ========================= */

    startCars(){

        let car1=5;
        let car2=55;

        setInterval(
            ()=>{

                car1+=.35;

                if(car1>105)
                    car1=-8;

                document
                    .getElementById(
                        "car1"
                    )
                    .style.left=
                        car1+"%";

                car2-=.25;

                if(car2<-8)
                    car2=105;

                document
                    .getElementById(
                        "car2"
                    )
                    .style.left=
                        car2+"%";

            },
            40
        );

    },


    /* =========================
       UPDATE HUD
    ========================= */

    update(){

        document.getElementById(
            "cityArea"
        ).textContent=
            String(this.area)
            .padStart(2,"0");

        document.getElementById(
            "cityXP"
        ).textContent=
            this.xp;

        document.getElementById(
            "cityItems"
        ).textContent=
            this.items;

        document.getElementById(
            "cityMission"
        ).textContent=
            this.checkpoints<3
            ?
            "Mission: Complete checkpoint "+
            (this.checkpoints+1)
            :
            "Mission: Explore the city";

        this.updateMap();

    },


    /* =========================
       MESSAGE
    ========================= */

    message(text){

        const box=
            document.getElementById(
                "message"
            );

        if(!box)
            return;

        box.textContent=
            text;

        box.style.display=
            "block";

        clearTimeout(
            this.messageTimer
        );

        this.messageTimer=
            setTimeout(
                ()=>{
                    box.style.display=
                        "none";
                },
                1800
            );

    }

};


/* =====================================================
 START V209
 ===================================================== */

SpiderCity.init();


/* =====================================================
 KEYBOARD
 ===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        const key=
            e.key.toLowerCase();

        if(
            key==="arrowleft" ||
            key==="a"
        )
            SpiderCity.move(-1);

        if(
            key==="arrowright" ||
            key==="d"
        )
            SpiderCity.move(1);

        if(key==="e")
            SpiderCity.rooftop();

        if(key==="t")
            SpiderCity.fastTravel();

        if(key==="c")
            SpiderCity.center();

    }
);

</script>
