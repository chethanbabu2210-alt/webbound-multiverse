<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V136</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  overflow:hidden;
  background:#081018;
  color:#fff;
  font-family:Arial,sans-serif;
}

#world{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    linear-gradient(#172633,#0b141d);
}

#roads{
  position:absolute;
  inset:0;
}

.road{
  position:absolute;
  background:#252b31;
}

.road.h{
  height:38px;
  left:0;
  right:0;
}

.road.v{
  width:38px;
  top:0;
  bottom:0;
}

.roadMark{
  position:absolute;
  height:2px;
  background:#e3d064;
  opacity:.7;
}

#buildings{
  position:absolute;
  inset:0;
}

.building{
  position:absolute;
  background:#1b2936;
  border:1px solid #ffffff18;
  border-radius:8px;
  box-shadow:0 5px 14px #0007;
  z-index:20;
}

.label{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:9px;
  white-space:nowrap;
  opacity:.8;
}

#player{
  position:absolute;
  width:22px;
  height:30px;
  background:#278be5;
  border-radius:9px 9px 4px 4px;
  transform:translate(-50%,-50%);
  z-index:5000;
}

#player:before{
  content:"";
  position:absolute;
  width:13px;
  height:13px;
  left:4.5px;
  top:-9px;
  border-radius:50%;
  background:#c9936c;
}

.npc{
  position:absolute;
  width:17px;
  height:25px;
  border-radius:8px 8px 4px 4px;
  z-index:3400;
  box-shadow:0 2px 7px #000;
}

.npc:before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  left:3.5px;
  top:-8px;
  border-radius:50%;
  background:#c9936c;
}

.npcName{
  position:absolute;
  bottom:28px;
  left:50%;
  transform:translateX(-50%);
  font-size:7px;
  white-space:nowrap;
  text-shadow:0 1px 3px #000;
}

.car{
  position:absolute;
  width:27px;
  height:13px;
  border-radius:4px;
  z-index:2500;
  box-shadow:0 2px 8px #000;
}

.car:after{
  content:"";
  position:absolute;
  left:5px;
  right:5px;
  top:2px;
  height:5px;
  background:#9db8c3;
  border-radius:2px;
}

.bus{
  position:absolute;
  width:42px;
  height:18px;
  background:#3f78aa;
  border-radius:5px;
  z-index:2800;
  box-shadow:0 3px 10px #000;
}

.bus:after{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  top:3px;
  height:7px;
  background:#9fc0ce;
  border-radius:2px;
}

.busLabel{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:7px;
  font-weight:bold;
}

.busStop{
  position:absolute;
  width:13px;
  height:13px;
  background:#d2a637;
  border:2px solid #fff;
  border-radius:50%;
  z-index:2600;
  box-shadow:0 2px 8px #000;
}

.stopLabel{
  position:absolute;
  top:-16px;
  left:50%;
  transform:translateX(-50%);
  font-size:7px;
  white-space:nowrap;
}

.trafficLight{
  position:absolute;
  width:10px;
  height:25px;
  background:#111;
  border-radius:5px;
  z-index:3000;
}

.light{
  width:7px;
  height:7px;
  margin:2px auto;
  border-radius:50%;
}

.red{background:#e33}
.yellow{background:#e4c84b}
.green{background:#43d66c}

#hud{
  position:fixed;
  left:10px;
  bottom:10px;
  width:min(410px,90vw);
  padding:13px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:14px;
  z-index:8000;
}

#title{
  font-size:14px;
  font-weight:bold;
}

#stats{
  margin-top:8px;
  font-size:10px;
  line-height:1.65;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:9px;
}

button{
  flex:1;
  min-width:82px;
  padding:8px;
  border:1px solid #ffffff18;
  border-radius:8px;
  background:#172535;
  color:#fff;
  font-size:9px;
}

#clock{
  position:fixed;
  right:10px;
  top:10px;
  z-index:8000;
  padding:9px 12px;
  background:#03070cf2;
  border:1px solid #ffffff25;
  border-radius:10px;
  font-size:11px;
}

#message{
  position:fixed;
  left:50%;
  top:17%;
  transform:translateX(-50%);
  z-index:9000;
  display:none;
  padding:10px 15px;
  background:#03070cf5;
  border:1px solid #ffffff30;
  border-radius:10px;
  font-size:11px;
  text-align:center;
}

#panel{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(440px,90vw);
  max-height:78vh;
  overflow:auto;
  display:none;
  padding:15px;
  background:#03070cf9;
  border:1px solid #ffffff30;
  border-radius:16px;
  z-index:10000;
}

#panelTitle{
  font-weight:bold;
  font-size:14px;
}

.row{
  margin-top:8px;
  padding:10px;
  background:#111c28;
  border-radius:9px;
  font-size:10px;
}

.close{
  width:100%;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="world">

  <div id="roads">

    <div class="road h" style="top:27%"></div>
    <div class="road h" style="top:67%"></div>

    <div class="road v" style="left:24%"></div>
    <div class="road v" style="left:56%"></div>
    <div class="road v" style="left:78%"></div>

  </div>

  <div id="buildings"></div>

  <div id="player"></div>

</div>

<div id="clock">📅 Day 1 • 🕐 08:00</div>

<div id="message"></div>

<div id="hud">

  <div id="title">
    🚌 WEBBOUND V136 — PUBLIC TRANSPORT
  </div>

  <div id="stats"></div>

  <div class="buttons">

    <button onclick="V136.transportPanel()">
      🚌 TRANSPORT
    </button>

    <button onclick="V136.peoplePanel()">
      👥 PEOPLE
    </button>

    <button onclick="V136.cityPanel()">
      🏙️ CITY
    </button>

    <button onclick="V136.advanceHour()">
      ⏩ +1 HOUR
    </button>

    <button onclick="V136.toggle()">
      ⏯️ PAUSE
    </button>

  </div>

</div>

<div id="panel">

  <div id="panelTitle">
    WEBBOUND V136
  </div>

  <div id="panelContent"></div>

  <button class="close" onclick="V136.closePanel()">
    CLOSE
  </button>

</div>

<script>

const V136={

  saveKey:"WEBBOUND_V134",

  running:true,

  hour:8,

  day:1,

  keys:{},

  player:{
    x:window.innerWidth/2,
    y:window.innerHeight/2,
    money:1000,
    reputation:0,
    job:null
  },

  npcs:[],

  cars:[],

  buses:[],

  busStops:[],

  trafficLights:[],

  transportStats:{
    passengers:0,
    busTrips:0,
    completedRoutes:0,
    totalStops:0
  },

  /* =========================================
     INIT
     ========================================= */

  init(){

    this.load();

    this.createBuildings();

    this.createTrafficLights();

    this.createBusStops();

    this.createNPCsIfNeeded();

    this.createCars();

    this.createBuses();

    this.keyboard();

    this.render();

    setInterval(
      ()=>{
        if(this.running){
          this.update();
        }
      },
      40
    );

    this.message(
      "🚌 V136 public transport system online"
    );

  },

  /* =========================================
     BUILDINGS
     ========================================= */

  createBuildings(){

    const root=
      document.getElementById(
        "buildings"
      );

    root.innerHTML="";

    const data=[

      ["🏠 Homes",5,6,17,18],

      ["🏫 School",29,7,17,15],

      ["🏥 Hospital",60,7,14,15],

      ["🏢 Offices",81,7,15,16],

      ["🏪 Shops",81,45,15,16],

      ["🌳 Park",29,47,18,17],

      ["🍽️ Restaurant",60,46,15,15],

      ["🏭 Factory",5,46,17,16]

    ];

    data.forEach(
      d=>{

        const el=
          document.createElement(
            "div"
          );

        el.className="building";

        el.style.left=d[1]+"%";
        el.style.top=d[2]+"%";
        el.style.width=d[3]+"%";
        el.style.height=d[4]+"%";

        const label=
          document.createElement(
            "div"
          );

        label.className="label";
        label.textContent=d[0];

        el.appendChild(label);

        root.appendChild(el);

      }
    );

  },

  /* =========================================
     TRAFFIC LIGHTS
     ========================================= */

  createTrafficLights(){

    const positions=[

      [24,27],
      [56,27],
      [78,27],
      [24,67],
      [56,67],
      [78,67]

    ];

    positions.forEach(
      p=>{

        const el=
          document.createElement(
            "div"
          );

        el.className=
          "trafficLight";

        el.style.left=
          `calc(${p[0]}% + 20px)`;

        el.style.top=
          `calc(${p[1]}% - 30px)`;

        el.innerHTML=
          `
          <div class="light red"></div>
          <div class="light yellow"></div>
          <div class="light green"></div>
          `;

        document
          .getElementById("world")
          .appendChild(el);

        this.trafficLights.push({
          element:el,
          x:p[0],
          y:p[1]
        });

      }
    );

  },

  /* =========================================
     BUS STOPS
     ========================================= */

  createBusStops(){

    const stops=[

      {
        name:"Home Stop",
        x:.19,
        y:.27
      },

      {
        name:"School Stop",
        x:.34,
        y:.27
      },

      {
        name:"Hospital Stop",
        x:.56,
        y:.27
      },

      {
        name:"Office Stop",
        x:.78,
        y:.27
      },

      {
        name:"Park Stop",
        x:.34,
        y:.67
      },

      {
        name:"Restaurant Stop",
        x:.56,
        y:.67
      },

      {
        name:"Shop Stop",
        x:.78,
        y:.67
      },

      {
        name:"Factory Stop",
        x:.19,
        y:.67
      }

    ];

    stops.forEach(
      (stop,index)=>{

        const el=
          document.createElement(
            "div"
          );

        el.className=
          "busStop";

        el.style.left=
          `calc(${stop.x*100}% - 6px)`;

        el.style.top=
          `calc(${stop.y*100}% - 6px)`;

        const label=
          document.createElement(
            "div"
          );

        label.className=
          "stopLabel";

        label.textContent=
          "🚌 "+
          (index+1);

        el.appendChild(label);

        document
          .getElementById("world")
          .appendChild(el);

        this.busStops.push({

          id:index+1,

          name:stop.name,

          x:window.innerWidth*stop.x,

          y:window.innerHeight*stop.y,

          element:el

        });

      }
    );

    this.transportStats.totalStops=
      this.busStops.length;

  },

  /* =========================================
     NPC CREATION
     ========================================= */

  createNPCsIfNeeded(){

    if(
      this.npcs.length>0
    ){

      this.npcs.forEach(
        npc=>{
          npc.element=null;
        }
      );

      return;

    }

    const names=[

      "Alex","Sam","Ryan","Maya",
      "Arun","Riya","Dev","Asha",
      "Noah","Leo","Avi","Zara",
      "Kiran","Nikhil","Anu",
      "Rahul","Meera","Vikram"

    ];

    const jobs=[

      "Student",
      "Engineer",
      "Doctor",
      "Teacher",
      "Shopkeeper",
      "Worker",
      "Tourist"

    ];

    for(
      let i=0;
      i<18;
      i++
    ){

      this.npcs.push({

        id:i+1,

        name:
          names[
            i%names.length
          ],

        job:
          jobs[
            Math.floor(
              Math.random()*jobs.length
            )
          ],

        x:
          Math.random()*
          window.innerWidth,

        y:
          160+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-220
          ),

        targetX:
          Math.random()*
          window.innerWidth,

        targetY:
          170+
          Math.random()*
          Math.max(
            1,
            window.innerHeight-230
          ),

        happiness:
          50+
          Math.floor(
            Math.random()*45
          ),

        relationship:0,

        friendship:"Stranger",

        money:
          500+
          Math.floor(
            Math.random()*4000
          ),

        usingBus:false,

        busId:null,

        element:null

      });

    }

  },

  /* =========================================
     CARS
     ========================================= */

  createCars(){

    if(
      this.cars.length>0
    ){

      this.cars.forEach(
        c=>{
          c.element=null;
        }
      );

      return;

    }

    const colors=[
      "#c84a4a",
      "#4b82bd",
      "#d39a3a",
      "#7c63a7",
      "#4d9b75",
      "#777"
    ];

    for(
      let i=0;
      i<12;
      i++
    ){

      const horizontal=
        Math.random()>.5;

      const car={

        id:i,

        horizontal,

        x:
          horizontal
          ? -50
          : window.innerWidth*.24,

        y:
          horizontal
          ? this.randomRoadY()
          : -50,

        speed:
          1+
          Math.random()*1.4,

        direction:
          Math.random()>.5
          ? 1
          : -1,

        color:
          colors[
            Math.floor(
              Math.random()*colors.length
            )
          ],

        element:null

      };

      if(
        horizontal &&
        car.direction<0
      ){

        car.x=
          window.innerWidth+50;

      }

      if(
        !horizontal &&
        car.direction<0
      ){

        car.y=
          window.innerHeight+50;

      }

      this.cars.push(car);

    }

  },

  randomRoadY(){

    return Math.random()>.5
      ? window.innerHeight*.27+12
      : window.innerHeight*.67+12;

  },

  /* =========================================
     BUSES
     ========================================= */

  createBuses(){

    if(
      this.buses.length>0
    ){

      this.buses.forEach(
        b=>{
          b.element=null;
        }
      );

    }

    else{

      for(
        let i=0;
        i<3;
        i++
      ){

        this.buses.push({

          id:i+1,

          route:i%2===0
            ? "CITY-A"
            : "CITY-B",

          stopIndex:
            i%2===0
            ? 0
            : 4,

          x:
            this.busStops[
              i%2===0
              ? 0
              : 4
            ].x,

          y:
            this.busStops[
              i%2===0
              ? 0
              : 4
            ].y,

          targetX:0,

          targetY:0,

          speed:.65,

          passengers:0,

          maxPassengers:20,

          element:null,

          stopped:false,

          stopTimer:0

        });

      }

    }

    this.buses.forEach(
      bus=>{

        this.setBusTarget(bus);

      }
    );

  },

  setBusTarget(bus){

    let route;

    if(
      bus.route==="CITY-A"
    ){

      route=[
        0,1,2,3,6,5,4,7
      ];

    }
    else{

      route=[
        7,4,5,6,3,2,1,0
      ];

    }

    const next=
      route[
        (route.indexOf(
          bus.stopIndex
        )+1)%
        route.length
      ];

    bus.stopIndex=next;

    const stop=
      this.busStops[next];

    bus.targetX=stop.x;
    bus.targetY=stop.y;

  },

  /* =========================================
     UPDATE
     ========================================= */

  update(){

    this.movePlayer();

    this.updateNPCs();

    this.updateCars();

    this.updateBuses();

    this.updateTrafficLights();

    this.updateTime();

    this.updateHUD();

  },

  /* =========================================
     NPC MOVEMENT
     ========================================= */

  updateNPCs(){

    this.npcs.forEach(
      npc=>{

        if(
          npc.usingBus
        ){

          return;

        }

        const dx=
          npc.targetX-npc.x;

        const dy=
          npc.targetY-npc.y;

        const d=
          Math.sqrt(
            dx*dx+
            dy*dy
          );

        if(
          d<10
        ){

          if(
            Math.random()<.025
          ){

            this.chooseNPCTarget(npc);

          }

          return;

        }

        npc.x+=
          dx/d*.42;

        npc.y+=
          dy/d*.42;

      }
    );

  },

  chooseNPCTarget(npc){

    const stop=
      this.busStops[
        Math.floor(
          Math.random()*
          this.busStops.length
        )
      ];

    npc.targetX=
      stop.x;

    npc.targetY=
      stop.y;

    if(
      Math.random()<.18
    ){

      npc.usingBus=true;

    }

  },

  /* =========================================
     BUS UPDATE
     ========================================= */

  updateBuses(){

    this.buses.forEach(
      bus=>{

        if(
          bus.stopTimer>0
        ){

          bus.stopTimer--;

          if(
            bus.stopTimer===0
          ){

            this.boardPassengers(bus);

            this.setBusTarget(bus);

          }

          this.renderBus(bus);

          return;

        }

        const dx=
          bus.targetX-bus.x;

        const dy=
          bus.targetY-bus.y;

        const d=
          Math.sqrt(
            dx*dx+
            dy*dy
          );

        if(
          d<10
        ){

          bus.stopTimer=45;

          this.transportStats.completedRoutes++;

          this.renderBus(bus);

          return;

        }

        bus.x+=
          dx/d*bus.speed;

        bus.y+=
          dy/d*bus.speed;

        this.renderBus(bus);

      }
    );

  },

  /* =========================================
     BOARD PASSENGERS
     ========================================= */

  boardPassengers(bus){

    const stop=
      this.busStops[
        bus.stopIndex
      ];

    let boarding=0;

    this.npcs.forEach(
      npc=>{

        if(
          !npc.usingBus
        ){

          return;

        }

        const dx=
          npc.x-stop.x;

        const dy=
          npc.y-stop.y;

        const d=
          Math.sqrt(
            dx*dx+
            dy*dy
          );

        if(
          d<55 &&
          bus.passengers<
          bus.maxPassengers
        ){

          npc.usingBus=false;

          npc.x=bus.x;

          npc.y=bus.y;

          bus.passengers++;

          boarding++;

          this.transportStats.passengers++;

        }

      }
    );

    if(
      boarding>0
    ){

      this.message(
        "🚌 "+
        boarding+
        " passenger"+
        (boarding===1?"":"s")+
        " boarded"
      );

    }

    if(
      bus.passengers>0
    ){

      const drop=
        Math.min(
          bus.passengers,
          Math.floor(
            Math.random()*4
          )
        );

      bus.passengers-=drop;

    }

  },

  /* =========================================
     BUS RENDER
     ========================================= */

  renderBus(bus){

    if(!bus.element){

      const el=
        document.createElement(
          "div"
        );

      el.className="bus";

      const label=
        document.createElement(
          "div"
        );

      label.className="busLabel";

      label.textContent=
        "BUS";

      el.appendChild(label);

      bus.element=el;

      document
        .getElementById("world")
        .appendChild(el);

    }

    bus.element.style.left=
      bus.x+"px";

    bus.element.style.top=
      bus.y+"px";

  },

  /* =========================================
     CAR UPDATE
     ========================================= */

  updateCars(){

    this.cars.forEach(
      car=>{

        if(
          car.horizontal
        ){

          car.x+=
            car.speed*
            car.direction;

        }
        else{

          car.y+=
            car.speed*
            car.direction;

        }

        if(
          car.x<
          -60||
          car.x>
          window.innerWidth+60
        ){

          car.x=
            car.direction>0
            ? -60
            : window.innerWidth+60;

          car.y=
            this.randomRoadY();

        }

        if(
          car.y<
          -60||
          car.y>
          window.innerHeight+60
        ){

          car.y=
            car.direction>0
            ? -60
            : window.innerHeight+60;

          car.x=
            window.innerWidth*.24;

        }

        this.renderCar(car);

      }
    );

  },

  renderCa
