<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V184 — BUSINESS & ECONOMY</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#304d59,#091116);
}

#sky{
 position:absolute;
 inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8);
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.4;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(920px,92vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#businessHud{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.8;
}

.bar{
 height:7px;
 background:#ffffff12;
 border-radius:7px;
 overflow:hidden;
 margin-top:4px;
}

.fill{
 height:100%;
 width:0%;
 background:#8fb8df;
 transition:.3s;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(780px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.7;
}

.card button{
 width:100%;
 margin-top:8px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="sky"></div>

 <div class="road rh"></div>
 <div class="road rv"></div>

 <div class="line lineH"></div>
 <div class="line lineV"></div>

 <div class="building b1">🏠 RESIDENTIAL</div>
 <div class="building b2">🏫 SCHOOL</div>
 <div class="building b3">🏥 HOSPITAL</div>
 <div class="building b4">🏢 CORPORATE</div>
 <div class="building b5">🏭 WAREHOUSE</div>
 <div class="building b6">💼 BUSINESS DISTRICT</div>

 <div id="player"></div>

 <div id="hud">

  <div class="title">
   💼 WEBBOUND V184 — BUSINESS & ECONOMY
  </div>

  <div class="stats">

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">5000</span>
   </div>

   <div class="stat">
    📈 INCOME<br>
    ₹<span id="incomeText">0</span>
   </div>

   <div class="stat">
    💸 COST<br>
    ₹<span id="costText">0</span>
   </div>

   <div class="stat">
    👥 EMPLOYEES<br>
    <span id="employeesText">0</span>
   </div>

   <div class="stat">
    ⭐ REPUTATION<br>
    <span id="repText">0</span>
   </div>

  </div>

  <div id="businessHud">

   <b>🏢 ACTIVE BUSINESS</b>

   <br>

   <span id="businessName">
    No business owned
   </span>

   <br>

   Level:
   <span id="businessLevel">—</span>

   <br>

   Daily Profit:
   ₹<span id="profitText">0</span>

   <div class="bar">
    <div id="businessFill" class="fill"></div>
   </div>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V184.businesses()">
   🏢 BUSINESSES
  </button>

  <button onclick="V184.collect()">
   💰 COLLECT INCOME
  </button>

  <button onclick="V184.hire()">
   👥 HIRE
  </button>

  <button onclick="V184.upgrade()">
   ⬆️ UPGRADE
  </button>

  <button onclick="V184.dashboard()">
   📊 DASHBOARD
  </button>

  <button onclick="V184.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V184
   </h2>

   <div id="panelContent"></div>

   <button onclick="V184.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V184={

 saveKey:"WEBBOUND_V184",

 cash:5000,

 reputation:0,

 income:0,

 expenses:0,

 employees:0,

 businessesOwned:[],

 activeBusiness:null,

 businessesData:{

  cafe:{
   name:"☕ City Cafe",
   price:2500,
   baseIncome:250,
   baseCost:70,
   maxEmployees:8
  },

  workshop:{
   name:"🔧 Auto Workshop",
   price:5000,
   baseIncome:500,
   baseCost:150,
   maxEmployees:12
  },

  tech:{
   name:"💻 Tech Studio",
   price:8000,
   baseIncome:850,
   baseCost:250,
   maxEmployees:15
  },

  logistics:{
   name:"📦 Logistics Company",
   price:12000,
   baseIncome:1200,
   baseCost:400,
   maxEmployees:25
  },

  corporation:{
   name:"🏢 City Corporation",
   price:25000,
   baseIncome:2500,
   baseCost:900,
   maxEmployees:40
  }

 },

 businessLevels:{},

 init(){

  this.load();

  this.update();

  this.notify(
   "💼 V184 Business System ready"
  );

 },

 /* =========================
    BUSINESS MARKET
 ========================= */

 businesses(){

  let html="";

  Object.entries(
   this.businessesData
  ).forEach(
   ([id,business])=>{

    const owned=
     this.businessesOwned.includes(
      id
     );

    const level=
     this.businessLevels[id] || 1;

    html+=`

    <div class="card">

     <b>${business.name}</b>

     <br><br>

     💰 Purchase:
     ₹${business.price.toLocaleString()}

     <br>

     📈 Base Income:
     ₹${business.baseIncome}/day

     <br>

     💸 Operating Cost:
     ₹${business.baseCost}/day

     <br>

     👥 Employee Capacity:
     ${business.maxEmployees}

     <br>

     ⭐ Level:
     ${owned ? level : "—"}

     ${
      owned
      ?`
       <br><br>
       🟢 OWNED

       <button
        onclick="
         V184.select('${id}')
        ">
        SELECT BUSINESS
       </button>
      `
      :
      `
       <button
        onclick="
         V184.buy('${id}')
        ">
        💰 BUY BUSINESS
       </button>
      `
     }

    </div>

    `;

   }
  );

  this.open(
   "🏢 BUSINESS MARKET",
   html
  );

 },

 /* =========================
    BUY
 ========================= */

 buy(id){

  const business=
   this.businessesData[id];

  if(!business)
   return;

  if(
   this.businessesOwned.includes(id)
  ){

   this.notify(
    "Already owned."
   );

   return;

  }

  if(
   this.cash<
   business.price
  ){

   this.notify(
    "❌ Not enough cash."
   );

   return;

  }

  this.cash-=
   business.price;

  this.businessesOwned.push(id);

  this.businessLevels[id]=1;

  this.activeBusiness=id;

  this.update();

  this.save();

  this.businesses();

  this.notify(
   "🎉 Purchased "+
   business.name
  );

 },

 /* =========================
    SELECT
 ========================= */

 select(id){

  if(
   !this.businessesOwned.includes(id)
  )
   return;

  this.activeBusiness=id;

  this.update();

  this.save();

  this.close();

  this.notify(
   "🏢 Selected "+
   this.businessesData[id].name
  );

 },

 /* =========================
    COLLECT
 ========================= */

 collect(){

  if(!this.activeBusiness){

   this.notify(
    "🏢 Select a business first."
   );

   return;

  }

  const id=
   this.activeBusiness;

  const business=
   this.businessesData[id];

  const level=
   this.businessLevels[id] || 1;

  const workers=
   this.getBusinessEmployees();

  const income=
   Math.floor(
    business.baseIncome*
    level+
    workers*35
   );

  const cost=
   Math.floor(
    business.baseCost*
    level+
    workers*10
   );

  const profit=
   Math.max(
    0,
    income-cost
   );

  this.income+=income;

  this.expenses+=cost;

  this.cash+=profit;

  this.reputation+=
   Math.max(
    1,
    level
   );

  this.update();

  this.save();

  this.notify(
   "💰 Business cycle complete: +₹"+
   profit
  );

 },

 /* =========================
    EMPLOYEES
 ========================= */

 hire(){

  if(!this.activeBusiness){

   this.notify(
    "🏢 Select a business first."
   );

   return;

  }

  const business=
   this.businessesData[
    this.activeBusiness
   ];

  if(
   this.employees>=
   business.maxEmployees
  ){

   this.notify(
    "👥 Employee capacity reached."
   );

   return;

  }

  const hiringCost=300;

  if(
   this.cash<hiringCost
  ){

   this.notify(
    "❌ Need ₹300 to hire."
   );

   return;

  }

  this.cash-=
   hiringCost;

  this.employees++;

  this.reputation++;

  this.update();

  this.save();

  this.notify(
   "👥 Employee hired."
  );

 },

 /* =========================
    UPGRADE
 ========================= */

 upgrade(){

  if(!this.activeBusiness){

   this.notify(
    "🏢 Select a business first."
   );

   return;

  }

  const id=
   this.activeBusiness;

  const level=
   this.businessLevels[id] || 1;

  const cost=
   level*1500;

  if(
   this.cash<cost
  ){

   this.notify(
    "❌ Upgrade costs ₹"+
    cost
   );

   return;

  }

  this.cash-=cost;

  this.businessLevels[id]=
   level+1;

  this.reputation+=5;

  this.update();

  this.save();

  this.notify(
   "⬆️ Business upgraded to Level "+
   (level+1)
  );

 },

 /* =========================
    EMPLOYEE COUNT
 ========================= */

 getBusinessEmployees(){

  if(!this.activeBusiness)
   return 0;

  const business=
   this.businessesData[
    this.activeBusiness
   ];

  const level=
   this.businessLevels[
    this.activeBusiness
   ] || 1;

  return Math.min(
   this.employees,
   business.maxEmployees+
   (level-1)*5
  );

 },

 /* =========================
    DASHBOARD
 ========================= */

 dashboard(){

  const id=
   this.activeBusiness;

  if(!id){

   this.open(
    "📊 BUSINESS DASHBOARD",
    `
    <div class="card">
     No business selected.
     <br><br>
     Open the Business Market and purchase one.
    </div>
    `
   );

   return;

  }

  const business=
   this.businessesData[id];

  const level=
   this.businessLevels[id] || 1;

  const workers=
   this.getBusinessEmployees();

  const income=
   Math.floor(
    business.baseIncome*
    level+
    workers*35
   );

  const cost=
   Math.floor(
    business.baseCost*
    level+
    workers*10
   );

  const profit=
   Math.max(
    0,
    income-cost
   );

  this.open(
   "📊 BUSINESS DASHBOARD",
   `

   <div class="card">

    <b>${business.name}</b>

    <br><br>

    🏢 Level:
    ${level}

    <br>

    👥 Employees:
    ${workers}

    <br>

    📈 Daily Income:
    ₹${income}

    <br>

    💸 Daily Costs:
    ₹${cost}

    <br>

    💰 Estimated Profit:
    ₹${profit}

   </div>

   <div class="card">

    ⭐ Reputation:
    ${this.reputation}

    <br>

    💵 Total Recorded Income:
    ₹${this.income.toLocaleString()}

    <br>

    💸 Total Recorded Expenses:
    ₹${this.expenses.toLocaleString()}

   </div>

   `
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash.toLocaleString();

  document.getElementById(
   "incomeText"
  ).textContent=
   this.income.toLocaleString();

  document.getElementById(
   "costText"
  ).textContent=
   this.expenses.toLocaleString();

  document.getElementById(
   "employeesText"
  ).textContent=
   this.employees;

  document.getElementById(
   "repText"
  ).textContent=
   this.reputation;

  if(!this.activeBusiness){

   document.getElementById(
    "businessName"
   ).textContent=
    "No business owned";

   document.getElementById(
    "businessLevel"
   ).textContent=
    "—";

   document.getElementById(
    "profitText"
   ).textContent=
    "0";

   document.getElementById(
    "businessFill"
   ).style.width=
    "0%";

   return;

  }

  const business=
   this.businessesData[
    this.activeBusiness
   ];

  const level=
   this.businessLevels[
    this.activeBusiness
   ] || 1;

  const workers=
   this.getBusinessEmployees();

  const income=
   Math.floor(
    business.baseIncome*
    level+
    workers*35
   );

  const cost=
   Math.floor(
    business.baseCost*
    level+
    workers*10
   );

  const profit=
   Math.max(
    0,
    income-cost
   );

  document.getElementById(
   "businessName"
  ).textContent=
   business.name;

  document.getElementById(
   "businessLevel"
  ).textContent=
   level;

  document.getElementById(
   "profitText"
  ).textContent=
   profit.toLocaleString();

  document.getElementById(
   "businessFill"
  ).style.width=
   Math.min(
    100,
    level*20
   )+"%";

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    reputation:this.reputation,

    income:this.income,

    expenses:this.expenses,

    employees:this.employees,

    businessesOwned:
     this.businessesOwned,

    activeBusiness:
     this.activeBusiness,

    businessLevels:
     this.businessLevels

   })
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   if(
    Number.isFinite(
     data.cash
    )
   )
    this.cash=
     Math.max(
      0,
      data.cash
     );

   if(
    Number.isFinite(
     data.reputation
    )
   )
    this.reputation=
     Math.max(
      0,
      data.reputation
     );

   if(
    Number.isFinite(
     data.income
    )
   )
    this.income=
     Math.max(
      0,
      data.income
     );

   if(
    Number.isFinite(
     data.expenses
    )
   )
    this.expenses=
     Math.max(
      0,
      data.expenses
     );

   if(
    Number.isFinite(
     data.employees
    )
   )
    this.employees=
     Math.max(
      0,
      Math.floor(
       data.employees
      )
     );

   if(
    Array.isArray(
     data.businessesOwned
    )
   )
    this.businessesOwned=
     data.businessesOwned.filter(
      id=>
       this.businessesData[id]
     );

   if(
    typeof data.activeBusiness===
    "string" &&
    this.businessesData[
     data.activeBusiness
    ]
   )
    this.activeBusiness=
     data.activeBusiness;

   if(
    data.businessLevels &&
    typeof data.businessLevels===
    "object"
   ){

    Object.keys(
     this.businessesData
    ).forEach(
     id=>{

      if(
       Number.isFinite(
        data.businessLevels[id]
       )
      ){

       this.businessLevels[id]=
        Math.max(
         1,
         Math.floor(
          data.businessLevels[id]
         )
        );

      }

     }
    );

   }

  }
  catch(error){

   console.log(
    "V184 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2400
   );

 }

};

V184.init();

console.log(
 "WEBBOUND V184 BUSINESS SYSTEM READY"
);

</script>

</body>
</html>
