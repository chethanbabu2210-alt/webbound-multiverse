<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V156 — WEATHER & TIME</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#5d9fbe,#14252d);
 transition:background 2s;
}

#world{
 position:absolute;
 inset:0;
 overflow:hidden;
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:64px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:64px;
}

.lane{
 position:absolute;
 background:#d5c36c;
 opacity:.45;
}

.laneH{
 left:0;
 right:0;
 top:calc(57% + 31px);
 height:2px;
}

.laneV{
 top:0;
 bottom:0;
 left:calc(68% + 31px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
 transition:filter 2s,background 2s;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:57%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

/* SKY OVERLAY */

#skyOverlay{
 position:absolute;
 inset:0;
 background:rgba(3,8,20,0);
 pointer-events:none;
 z-index:20;
 transition:background 2s;
}

/* RAIN */

#rain{
 position:absolute;
 inset:0;
 pointer-events:none;
 z-index:100;
 display:none;
 overflow:hidden;
}

.drop{
 position:absolute;
 top:-30px;
 width:1px;
 height:18px;
 background:#a9d8edaa;
 transform:rotate(15deg);
 animation:rainFall linear infinite;
}

@keyframes rainFall{
 from{
  transform:translateY(-40px) rotate(15deg);
 }
 to{
  transform:translateY(110vh) rotate(15deg);
 }
}

/* HUD */

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(490px,84vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:flex;
 gap:5px;
 margin-top:8px;
}

.stat{
 flex:1;
 padding:7px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#weatherInfo{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.7;
}

#temperature{
 font-weight:bold;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(850px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(650px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(145px,1fr));
 gap:7px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 min-height:115px;
 font-size:10px;
 line-height:1.5;
}

.card b{
 display:block;
 margin-bottom:7px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road rh"></div>
  <div class="road rv"></div>

  <div class="lane laneH"></div>
  <div class="lane laneV"></div>

  <div class="building b1">🏠 RESIDENTIAL</div>
  <div class="building b2">🏫 SCHOOL</div>
  <div class="building b3">🏥 HOSPITAL</div>
  <div class="building b4">🏢 CORPORATE</div>
  <div class="building b5">🏭 WAREHOUSE</div>
  <div class="building b6">🌳 PARK</div>

  <div id="skyOverlay"></div>
  <div id="rain"></div>

  <div id="player"></div>

 </div>

 <div id="hud">

  <div class="title">
   🌦️ WEBBOUND V156
  </div>

  <div class="stats">

   <div class="stat">
    🕐 TIME<br>
    <span id="clock">06:00</span>
   </div>

   <div class="stat">
    🌤️ WEATHER<br>
    <span id="weather">CLEAR</span>
   </div>

   <div class="stat">
    🌡️ TEMP<br>
    <span id="temperature">26°C</span>
   </div>

   <div class="stat">
    📅 DAY<br>
    <span id="day">1</span>
   </div>

  </div>

  <div id="weatherInfo">

   <b>WORLD CONDITIONS</b><br>

   ☀️ Sun:
   <span id="sunState">Rising</span>

   <br>

   🌧️ Rain:
   <span id="rainState">No</span>

   <br>

   🌙 Period:
   <span id="period">Morning</span>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V156.openWeather()">
   🌦️ WEATHER
  </button>

  <button onclick="V156.nextWeather()">
   🔄 CHANGE WEATHER
  </button>

  <button onclick="V156.advanceHour()">
   ⏩ +1 HOUR
  </button>

  <button onclick="V156.advanceDay()">
   📅 NEXT DAY
  </button>

  <button onclick="V156.toggleClock()">
   ⏱️ AUTO CLOCK
  </button>

  <button onclick="V156.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND
   </h2>

   <div id="panelContent"></div>

   <button onclick="V156.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V156={

 saveKey:"WEBBOUND_V156",

 hour:6,

 minute:0,

 day:1,

 autoClock:false,

 weatherIndex:0,

 temperature:26,

 timer:null,

 weatherList:[

  {
   id:"clear",
   icon:"☀️",
   name:"CLEAR",
   baseTemp:27,
   description:
    "Clear skies with excellent visibility."
  },

  {
   id:"cloudy",
   icon:"☁️",
   name:"CLOUDY",
   baseTemp:24,
   description:
    "Cloud cover reduces sunlight."
  },

  {
   id:"rain",
   icon:"🌧️",
   name:"RAIN",
   baseTemp:21,
   description:
    "Rain is falling across the city."
  },

  {
   id:"storm",
   icon:"⛈️",
   name:"STORM",
   baseTemp:19,
   description:
    "Heavy weather with strong rainfall."
  },

  {
   id:"fog",
   icon:"🌫️",
   name:"FOG",
   baseTemp:18,
   description:
    "Visibility is reduced by dense fog."
  },

  {
   id:"heat",
   icon:"🔥",
   name:"HEATWAVE",
   baseTemp:34,
   description:
    "Very hot conditions across the city."
  }

 ],

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.renderRain();

  this.update();

  this.notify(
   "🌦️ V156 weather system ready"
  );

 },

 /* =========================
    CURRENT WEATHER
 ========================= */

 currentWeather(){

  return this.weatherList[
   this.weatherIndex
  ];

 },

 /* =========================
    CLOCK
 ========================= */

 advanceHour(){

  this.hour++;

  if(this.hour>=24){

   this.hour=0;

   this.day++;

  }

  this.update();

  this.save();

 },

 advanceDay(){

  this.day++;

  this.hour=6;

  this.minute=0;

  this.update();

  this.save();

  this.notify(
   "📅 Day "+
   this.day+
   " begins."
  );

 },

 toggleClock(){

  this.autoClock=
   !this.autoClock;

  if(this.autoClock){

   clearInterval(
    this.timer
   );

   this.timer=
    setInterval(
     ()=>{
      this.advanceHour();
     },
     15000
    );

   this.notify(
    "⏱️ Auto clock enabled"
   );

  }
  else{

   clearInterval(
    this.timer
   );

   this.notify(
    "⏸️ Auto clock paused"
   );

  }

 },

 /* =========================
    WEATHER
 ========================= */

 nextWeather(){

  this.weatherIndex++;

  if(
   this.weatherIndex>=
   this.weatherList.length
  ){

   this.weatherIndex=0;

  }

  this.temperature=
   this.currentWeather().baseTemp;

  this.applyWeather();

  this.save();

  this.notify(
   this.currentWeather().icon+
   " "+
   this.currentWeather().name
  );

 },

 applyWeather(){

  const weather=
   this.currentWeather();

  const game=
   document.getElementById(
    "game"
   );

  const overlay=
   document.getElementById(
    "skyOverlay"
   );

  const rain=
   document.getElementById(
    "rain"
   );

  /*
   Day/night overlay.
  */

  let darkness=0;

  if(
   this.hour>=20 ||
   this.hour<5
  ){

   darkness=.55;

  }
  else if(
   this.hour>=18
  ){

   darkness=.35;

  }
  else if(
   this.hour<7
  ){

   darkness=.18;

  }

  overlay.style.background=
   "rgba(3,8,20,"+
   darkness+
   ")";

  /*
   Weather backgrounds.
  */

  if(weather.id==="clear"){

   game.style.background=
    "linear-gradient(#5d9fbe,#14252d)";

  }

  if(weather.id==="cloudy"){

   game.style.background=
    "linear-gradient(#71838a,#202d32)";

  }

  if(weather.id==="rain"){

   game.style.background=
    "linear-gradient(#526c78,#17242a)";

  }

  if(weather.id==="storm"){

   game.style.background=
    "linear-gradient(#283743,#080e13)";

  }

  if(weather.id==="fog"){

   game.style.background=
    "linear-gradient(#9ba9aa,#39484b)";

  }

  if(weather.id==="heat"){

   game.style.background=
    "linear-gradient(#78aebd,#30291d)";

  }

  /*
   Rain effects.
  */

  if(
   weather.id==="rain" ||
   weather.id==="storm"
  ){

   rain.style.display=
    "block";

  }
  else{

   rain.style.display=
    "none";

  }

  /*
   Fog effect.
  */

  const buildings=
   document.querySelectorAll(
    ".building"
   );

  buildings.forEach(
   building=>{

    if(weather.id==="fog"){

     building.style.filter=
      "blur(1px)";

    }
    else{

     building.style.filter=
      "none";

    }

   }
  );

 },

 /* =========================
    RAIN
 ========================= */

 renderRain(){

  const rain=
   document.getElementById(
    "rain"
   );

  rain.innerHTML="";

  for(
   let i=0;
   i<90;
   i++
  ){

   const drop=
    document.createElement(
     "div"
    );

   drop.className="drop";

   drop.style.left=
    Math.random()*100+
    "%";

   drop.style.animationDuration=
    (.4+
     Math.random()*.7)+
    "s";

   drop.style.animationDelay=
    (-Math.random()*2)+
    "s";

   rain.appendChild(
    drop
   );

  }

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  const weather=
   this.currentWeather();

  const hh=
   String(
    this.hour
   ).padStart(2,"0");

  const mm=
   String(
    this.minute
   ).padStart(2,"0");

  document.getElementById(
   "clock"
  ).textContent=
   hh+":"+mm;

  document.getElementById(
   "weather"
  ).textContent=
   weather.name;

  document.getElementById(
   "temperature"
  ).textContent=
   this.temperature+
   "°C";

  document.getElementById(
   "day"
  ).textContent=
   this.day;

  document.getElementById(
   "rainState"
  ).textContent=
   (
    weather.id==="rain" ||
    weather.id==="storm"
   )
   ?"Yes"
   :"No";

  let period="Morning";

  if(
   this.hour>=12 &&
   this.hour<17
  )
   period="Afternoon";

  if(
   this.hour>=17 &&
   this.hour<20
  )
   period="Evening";

  if(
   this.hour>=20 ||
   this.hour<5
  )
   period="Night";

  document.getElementById(
   "period"
  ).textContent=
   period;

  let sun="Rising";

  if(
   this.hour>=7 &&
   this.hour<17
  )
   sun="Visible";

  if(
   this.hour>=17 &&
   this.hour<20
  )
   sun="Setting";

  if(
   this.hour>=20 ||
   this.hour<5
  )
   sun="Hidden";

  document.getElementById(
   "sunState"
  ).textContent=
   sun;

  this.applyWeather();

 },

 /* =========================
    WEATHER PANEL
 ========================= */

 openWeather(){

  let html=`

   <div class="card">

    <b>🌦️ Current Conditions</b>

    Weather:
    ${this.currentWeather().icon}
    ${this.currentWeather().name}

    <br>

    Temperature:
    ${this.temperature}°C

    <br>

    Time:
    ${String(this.hour).padStart(2,"0")}:
    ${String(this.minute).padStart(2,"0")}

    <br>

    Day:
    ${this.day}

   </div>

   <div class="grid">

  `;

  this.weatherList.forEach(
   (weather,index)=>{

    html+=`

     <div class="card">

      <b>
       ${weather.icon}
       ${weather.name}
      </b>

      Base temperature:
      ${weather.baseTemp}°C

      <br><br>

      ${weather.description}

      <br>

      <button
       onclick=
       "V156.setWeather(${index})">

       ${
        index===
        this.weatherIndex
        ?"✅ ACTIVE"
        :"SELECT"

       }

      </button>

     </div>

    `;

  });

  html+=`</div>`;

  this.open(
   "🌦️ WEATHER CENTER",
   html
  );

 },

 setWeather(index){

  if(
   index<0 ||
   index>=this.weatherList.length
  )
   return;

  this.weatherIndex=index;

  this.temperature=
   this.currentWeather().baseTemp;

  this.update();

  this.save();

  this.close();

  this.notify(
   this.currentWeather().icon+
   " Weather changed to "+
   this.currentWeather().name
  );

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    hour:this.hour,

    minute:this.minute,

    day:this.day,

    autoClock:false,

    weatherIndex:
     this.weatherIndex,

    temperature:
     this.temperature

   })
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   this.hour=
    Number.isFinite(data.hour)
    ?data.hour
    :6;

   this.minute=
    Number.isFinite(data.minute)
    ?data.minute
    :0;

   this.day=
    Number.isFinite(data.day)
    ?data.day
    :1;

   this.weatherIndex=
    Number.isFinite(
     data.weatherIndex
    )
    ?data.weatherIndex
    :0;

   this.temperature=
    Number.isFinite(
     data.temperature
    )
    ?data.temperature
    :26;

  }
  catch(error){

   console.log(
    "V156 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.notifyTimer
  );

  this.notifyTimer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2300
   );

 }

};

V156.init();

console.log(
 "WEBBOUND V156 WEATHER SYSTEM READY"
);

</script>

</body>
</html>
