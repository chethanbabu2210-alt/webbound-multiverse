<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V29 — Cinematic Mission</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

canvas{display:block}

#hud{
    position:fixed;
    z-index:20;
    left:18px;
    top:18px;
    width:380px;
    padding:17px;
    color:white;
    background:rgba(0,0,0,.78);
    border:1px solid rgba(255,255,255,.14);
    border-radius:16px;
    backdrop-filter:blur(12px);
}

.title{
    font-size:22px;
    font-weight:800;
}

.chapter{
    margin-top:6px;
    color:#70d9ff;
    font-weight:bold;
}

#mission{
    margin-top:12px;
    line-height:1.5;
    color:#eee;
}

.progress{
    margin-top:10px;
    height:7px;
    background:#20242d;
    border-radius:20px;
    overflow:hidden;
}

#progressBar{
    width:0%;
    height:100%;
    background:#fff;
    transition:.25s;
}

.stats{
    margin-top:10px;
    font-size:13px;
    line-height:1.7;
}

#controls{
    position:fixed;
    z-index:20;
    left:18px;
    bottom:18px;
    padding:13px 16px;
    background:rgba(0,0,0,.78);
    color:#ddd;
    border-radius:14px;
    font-size:11px;
    line-height:1.7;
}

#cinema{
    position:fixed;
    z-index:40;
    inset:0;
    pointer-events:none;
}

.bar{
    position:absolute;
    left:0;
    width:100%;
    height:0;
    background:#000;
    transition:.5s;
}

#topBar{top:0}
#bottomBar{bottom:0}

#cinematicText{
    position:absolute;
    left:50%;
    bottom:14%;
    transform:translateX(-50%);
    color:white;
    font-size:28px;
    font-weight:bold;
    text-align:center;
    text-shadow:0 4px 20px #000;
    opacity:0;
    transition:.5s;
    width:90%;
}

#message{
    position:fixed;
    z-index:60;
    top:18%;
    left:50%;
    transform:translateX(-50%);
    color:white;
    font-size:30px;
    font-weight:bold;
    text-shadow:0 5px 30px #000;
    opacity:0;
}

#crosshair{
    position:fixed;
    z-index:15;
    left:50%;
    top:50%;
    width:14px;
    height:14px;
    transform:translate(-50%,-50%);
    border:1px solid white;
    border-radius:50%;
    opacity:.6;
}
</style>
</head>

<body>

<div id="hud">

    <div class="title">
        🕷️ WEBBOUND V29
    </div>

    <div class="chapter">
        CINEMATIC STORY MODE
    </div>

    <div id="mission">
        Mission loading...
    </div>

    <div class="progress">
        <div id="progressBar"></div>
    </div>

    <div class="stats">
        Health: <b id="health">100</b><br>
        Web Energy: <b id="energy">100</b><br>
        Enemies Defeated: <b id="defeated">0</b><br>
        XP: <b id="xp">0</b><br>
        Score: <b id="score">0</b>
    </div>

</div>

<div id="controls">
W A S D — Move<br>
SHIFT — Sprint<br>
SPACE — Jump<br>
E — Web Swing<br>
Q — Web Zip<br>
F — Punch<br>
G — Web Pull<br>
Z — Web Projectile<br>
C — Web Burst<br>
R — Restart Checkpoint<br>
N — Next Mission
</div>

<div id="crosshair"></div>

<div id="message"></div>

<div id="cinema">
    <div id="topBar" class="bar"></div>
    <div id="bottomBar" class="bar"></div>
    <div id="cinematicText"></div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x070b14);

scene.fog =
    new THREE.FogExp2(
        0x070b14,
        .0007
    );


const camera =
    new THREE.PerspectiveCamera(
        68,
        innerWidth/innerHeight,
        .1,
        5000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    -400,
    700,
    300
);

sun.castShadow = true;

scene.add(sun);


scene.add(
    new THREE.HemisphereLight(
        0x7394c4,
        0x08090e,
        1.2
    )
);


/* =====================================================
   CITY
===================================================== */

const buildings = [];

const materials = [

    new THREE.MeshStandardMaterial({
        color:0x18202b,
        roughness:.8
    }),

    new THREE.MeshStandardMaterial({
        color:0x252d38,
        roughness:.75
    }),

    new THREE.MeshStandardMaterial({
        color:0x111720,
        roughness:.9
    })

];


function createBuilding(
    x,
    z,
    w,
    h,
    d
){

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,h,d
            ),
            materials[
                Math.floor(
                    Math.random()*
                    materials.length
                )
            ]
        );

    building.position.set(
        x,
        h/2,
        z
    );

    building.castShadow = true;
    building.receiveShadow = true;

    scene.add(building);

    buildings.push(building);
}


for(
    let x=-1000;
    x<=1000;
    x+=90
){

    for(
        let z=-1000;
        z<=1000;
        z+=90
    ){

        if(
            Math.abs(x)<90 &&
            Math.abs(z)<90
        )
            continue;

        createBuilding(
            x,
            z,
            50+Math.random()*25,
            70+Math.random()*270,
            50+Math.random()*25
        );
    }
}


const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            3200,
            3200
        ),
        new THREE.MeshStandardMaterial({
            color:0x080a0f,
            roughness:1
        })
    );

ground.rotation.x =
    -Math.PI/2;

ground.receiveShadow = true;

scene.add(ground);


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Group();

player.position.set(
    0,
    1.1,
    0
);

scene.add(player);


const suit =
    new THREE.MeshStandardMaterial({
        color:0xa9192c,
        roughness:.35,
        metalness:.15
    });


const body =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .65,
            1.55,
            10,
            20
        ),
        suit
    );

body.position.y = 1.45;

body.castShadow = true;

player.add(body);


const head =
    new THREE.Mesh(
        new THREE.SphereGeometry(
            .57,
            32,
            24
        ),
        suit
    );

head.position.y = 2.75;

player.add(head);


const eyeMat =
    new THREE.MeshStandardMaterial({
        color:0xffffff
    });


for(
    const x of [-.2,.2]
){

    const eye =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .18,
                20,
                16
            ),
            eyeMat
        );

    eye.position.set(
        x,
        2.78,
        -.54
    );

    eye.scale.z = .18;

    player.add(eye);
}


/* =====================================================
   PLAYER STATE
===================================================== */

const velocity =
    new THREE.Vector3();

const input =
    new THREE.Vector3();

const keys = {};

let grounded = true;

let doubleJump = true;

let swinging = false;

let anchor = null;

let webLine = null;

let health = 100;

let energy = 100;

let xp = 0;

let score = 0;

let defeated = 0;

let checkpoint =
    new THREE.Vector3(
        0,
        1.1,
        0
    );


/* =====================================================
   MISSION SYSTEM
===================================================== */

const missions = [

    {
        title:
        "MISSION 01 — FIRST NIGHT",

        objective:
        "Reach the marked location.",

        type:"reach",

        target:
        new THREE.Vector3(
            350,
            1,
            -250
        )
    },

    {
        title:
        "MISSION 02 — STREET THREAT",

        objective:
        "Defeat 5 enemies.",

        type:"defeat",

        amount:5
    },

    {
        title:
        "MISSION 03 — HIGH GROUND",

        objective:
        "Reach the top of a skyscraper.",

        type:"height",

        height:180
    },

    {
        title:
        "MISSION 04 — WEB RUNNER",

        objective:
        "Travel through the city.",

        type:"distance",

        distance:1000
    },

    {
        title:
        "MISSION 05 — FINAL WAVE",

        objective:
        "Defeat the enemy wave.",

        type:"wave",

        amount:10
    }

];


let missionIndex = 0;

let missionStart =
    player.position.clone();

let missionDefeated =
    defeated;

let missionComplete = false;

let waveSpawned = false;


/* =====================================================
   CINEMATIC
===================================================== */

function cinematic(text){

    const top =
        document.getElementById(
            "topBar"
        );

    const bottom =
        document.getElementById(
            "bottomBar"
        );

    const caption =
        document.getElementById(
            "cinematicText"
        );


    top.style.height = "9%";

    bottom.style.height = "9%";

    caption.textContent = text;

    caption.style.opacity = 1;


    setTimeout(
        ()=>{
            caption.style.opacity = 0;
            top.style.height = "0";
            bottom.style.height = "0";
        },
        2600
    );
}


/* =====================================================
   MISSION UPDATE
===================================================== */

function loadMission(){

    missionComplete = false;

    waveSpawned = false;

    missionStart =
        player.position.clone();

    missionDefeated =
        defeated;


    const mission =
        missions[
            missionIndex
        ];


    document.getElementById(
        "mission"
    ).innerHTML =
        "<b>"+
        mission.title+
        "</b><br>"+
        mission.objective;


    cinematic(
        mission.title
    );
}


function updateMission(){

    const mission =
        missions[
            missionIndex
        ];


    if(
        mission.type==="reach"
    ){

        const distance =
            player.position.distanceTo(
                mission.target
            );


        const progress =
            Math.max(
                0,
                Math.min(
                    100,
                    100 -
                    distance/8
                )
            );


        setProgress(
            progress
        );


        if(
            distance<12
        ){

            completeMission();
        }
    }


    if(
        mission.type==="defeat"
    ){

        const amount =
            defeated -
            missionDefeated;


        setProgress(
            Math.min(
                100,
                amount /
                mission.amount *
                100
            )
        );


        if(
            amount>=mission.amount
        ){

            completeMission();
        }
    }


    if(
        mission.type==="height"
    ){

        const height =
            player.position.y;


        setProgress(
            Math.min(
                100,
                height /
                mission.height *
                100
            )
        );


        if(
            height>=mission.height
        ){

            completeMission();
        }
    }


    if(
        mission.type==="distance"
    ){

        const distance =
            player.position.distanceTo(
                missionStart
            );


        setProgress(
            Math.min(
                100,
                distance /
                mission.distance *
                100
            )
        );


        if(
            distance>=mission.distance
        ){

            completeMission();
        }
    }


    if(
        mission.type==="wave"
    ){

        if(!waveSpawned){

            waveSpawned = true;

            for(
                let i=0;
                i<mission.amount;
                i++
            ){

                createEnemy(
                    i===9
                );
            }

            cinematic(
                "THE CITY IS UNDER ATTACK"
            );
        }


        const amount =
            defeated -
            missionDefeated;


        setProgress(
            Math.min(
                100,
                amount /
                mission.amount *
                100
            )
        );


        if(
            amount>=mission.amount
        ){

            completeMission();
        }
    }
}


function setProgress(
    value
){

    document.getElementById(
        "progressBar"
    ).style.width =
        value+"%";
}


function completeMission(){

    if(
        missionComplete
    )
        return;


    missionComplete = true;

    score += 1000;

    xp += 500;


    cinematic(
        "MISSION COMPLETE"
    );


    setTimeout(
        nextMission,
        2200
    );
}


function nextMission(){

    missionIndex++;


    if(
        missionIndex>=missions.length
    ){

        missionIndex = 0;

        cinematic(
            "STORY CHAPTER COMPLETE"
        );
    }


    checkpoint =
        player.position.clone();


    loadMission();
}


/* =====================================================
   ENEMIES
===================================================== */

const enemies = [];


function createEnemy(
    elite=false
){

    const enemy =
        new THREE.Group();


    const mat =
        new THREE.MeshStandardMaterial({
            color:
                elite
                ? 0x20242b
                : 0x343941,
            roughness:.6
        });


    const b =
        new THREE.Mesh(
            new THREE.CapsuleGeometry(
                elite?.7:.55,
                elite?1.3:1,
                8,
                14
            ),
            mat
        );

    b.position.y =
        elite?1.6:1.3;

    b.castShadow = true;

    enemy.add(b);


    const h =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                elite?.55:.43,
                20,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x6c493c
            })
        );

    h.position.y =
        elite?3.05:2.3;

    enemy.add(h);


    const angle =
        Math.random()*
        Math.PI*2;

    const distance =
        40+
        Math.random()*100;


    enemy.position.set(
        player.position.x+
        Math.cos(angle)*
        distance,
        1,
        player.position.z+
        Math.sin(angle)*
        distance
    );


    enemy.userData = {

        health:
            elite?250:90,

        speed:
            elite?3.7:5,

        damage:
            elite?16:7,

        elite,

        stagger:0,

        cooldown:0
    };


    scene.add(enemy);

    enemies.push(enemy);
}


/* Initial enemies */

for(
    let i=0;
    i<6;
    i++
){

    createEnemy(
        false
    );
}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(dt){

    for(
        const enemy of [...enemies]
    ){

        const data =
            enemy.userData;


        data.cooldown =
            Math.max(
                0,
                data.cooldown-dt
            );


        data.stagger =
            Math.max(
                0,
                data.stagger-dt
            );


        if(
            data.stagger>0
        )
            continue;


        const distance =
            enemy.position.distanceTo(
                player.position
            );


        if(
            distance<100
        ){

            const direction =
                new THREE.Vector3()
                .subVectors(
                    player.position,
                    enemy.position
                )
                .normalize();


            direction.y = 0;


            enemy.position.addScaledVector(
                direction,
                data.speed*dt
            );


            enemy.lookAt(
                player.position.x,
                enemy.position.y,
                player.position.z
            );


            if(
                distance<4 &&
                data.cooldown<=0
            ){

                health -=
                    data.damage;

                health =
                    Math.max(
                        0,
                        health
                    );

                data.cooldown =
                    data.elite
                    ? 1.7
                    : 1.2;
            }
        }
    }
}


/* =====================================================
   COMBAT
===================================================== */

function nearestEnemy(
    range
){

    let target = null;

    let closest = range;


    for(
        const enemy of enemies
    ){

        const distance =
            enemy.position.distanceTo(
                player.position
            );


        if(
            distance<closest
        ){

            closest = distance;

            target = enemy;
        }
    }


    return target;
}


function punch(){

    const target =
        nearestEnemy(7);


    if(!target)
        return;


    target.userData.health -=
        target.userData.elite
        ? 35
        : 50;


    target.userData.stagger =
        .6;


    score += 100;

    xp += 20;


    if(
        target.userData.health<=0
    ){

        defeatEnemy(
            target
        );
    }
}


function webShot(){

    if(
        energy<15
    )
        return;


    const target =
        nearestEnemy(40);


    if(!target)
        return;


    energy -= 15;


    target.userData.health -=
        target.userData.elite
        ? 35
        : 60;


    target.userData.stagger =
        .8;


    createWebLine(
        target
    );


    if(
        target.userData.health<=0
    ){

        defeatEnemy(
            target
        );
    }
}


function defeatEnemy(
    enemy
){

    defeated++;

    score +=
        enemy.userData.elite
        ? 1000
        : 250;

    xp +=
        enemy.userData.elite
        ? 500
        : 100;


    scene.remove(
        enemy
    );


    const index =
        enemies.indexOf(
            enemy
        );


    if(
        index>=0
    ){

        enemies.splice(
            index,
            1
        );
    }
}


/* =====================================================
   WEB EFFECT
===================================================== */

function createWebLine(
    target
){

    const start =
        player.position.clone();

    start.y += 2;


    const end =
        target.position.clone();

    end.y += 1;


    const geometry =
        new THREE.BufferGeometry()
        .setFromPoints([
            start,
            end
        ]);


    const line =
        new THREE.Line(
            geometry,
            new THREE.LineBasicMaterial({
                color:0xffffff
            })
        );


    scene.add(line);


    setTimeout(
        ()=>{
            scene.remove(line);
        },
        300
    );
}


/* =====================================================
   SWINGING
===================================================== */

function findAnchor(){

    let best = null;

    let closest = 500;


    for(
        const building of buildings
    ){

        const h =
            building.geometry
            .parameters
            .height;


        const point =
            new THREE.Vector3(
                building.position.x,
                building.position.y+
                h/2,
                building.position.z
            );


        const distance =
            point.distanceTo(
                player.position
            );


        if(
            distance<closest &&
            point.y>
            player.position.y+8
        ){

            closest = distance;

            best = point;
        }
    }


    return best;
}


function toggleSwing(){

    if(
        swinging
    ){

        swinging = false;

        if(webLine){

            scene.remove(
                webLine
            );

            webLine = null;
        }

        velocity.multiplyScalar(
            1.4
        );

        return;
    }


    const point =
        findAnchor();


    if(!point)
        return;


    anchor = point;

    swinging = true;


    webLine =
        new THREE.Line(
            new THREE.BufferGeometry()
            .setFromPoints([
                player.position.clone(),
                anchor.clone()
            ]),
            new THREE.LineBasicMaterial({
                color:0xffffff
            })
        );


    scene.add(
        webLine
    );
}


function updateSwing(dt){

    if(
        !swinging
    )
        return;


    const pull =
        new THREE.Vector3()
        .subVectors(
            anchor,
            player.position
        );


    const distance =
        pull.length();


    pull.normalize();


    if(
        distance>10
    ){

        velocity.addScaledVector(
            pull,
            (distance-10)*
            dt*
            16
        );
    }


    velocity.y -=
        7*dt;


    if(webLine){

        const positions =
            webLine.geometry
            .attributes
            .position
            .array;


        positions[0] =
            player.position.x;

        positions[1] =
            player.position.y+1;

        positions[2] =
            player.position.z;


        positions[3] =
            anchor.x;

        positions[4] =
            anchor.y;

        positions[5] =
            anchor.z;


        webLine.geometry
            .attributes
            .position
            .needsUpdate =
            true;
    }
}


/* =====================================================
   MOVEMENT
===================================================== */

function jump(){

    if(
        grounded
    ){

        velocity.y = 15;

        grounded = false;

        doubleJump = true;

        return;
    }


    if(
        doubleJump
    ){

        velocity.y = 13;

        doubleJump = false;
    }
}


function movement(dt){

    input.set(
        0,0,0
    );


    if(keys.KeyW)
        input.z -= 1;

    if(keys.KeyS)
        input.z += 1;

    if(keys.KeyA)
        input.x -= 1;

    if(keys.KeyD)
        input.x += 1;


    if(
        input.length()>0
    )
        input.normalize();


    const speed =
        keys.ShiftLeft
        ? 15
        : 10;


    velocity.x +=
        input.x*
        speed*
        dt*
        5;


    velocity.z +=
        input.z*
        speed*
        dt*
        5;


    velocity.x *= .91;

    velocity.z *= .91;


    if(
        !grounded &&
        !swinging
    ){

        velocity.y -=
            30*dt;
    }


    updateSwing(dt);


    player.position.addScaledVector(
        velocity,
        dt
    );


    if(
        player.position.y<=1.1
    ){

        player.position.y = 1.1;

        velocity.y = 0;

        grounded = true;

        doubleJump = true;

    }else{

        grounded = false;
    }
}


/* =====================================================
   CAMERA
===================================================== */

function cameraUpdate(){

    const desired =
        new THREE.Vector3(
            player.position.x,
            player.position.y+5.5,
            player.position.z+12
        );


    if(
        swinging
    ){

        desired.y =
            player.position.y+7;

        desired.z =
            player.position.z+16;
    }


    camera.position.lerp(
        desired,
        .075
    );


    camera.fov =
        THREE.MathUtils.lerp(
            camera.fov,
            swinging?78:68,
            .06
        );


    camera.updateProjectionMatrix();


    camera.lookAt(
        player.position.x,
        player.position.y+2,
        player.position.z
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "health"
    ).textContent =
        Math.floor(
            health
        );


    document.getElementById(
        "energy"
    ).textContent =
        Math.floor(
            energy
        );


    document.getElementById(
        "defeated"
    ).textContent =
        defeated;


    document.getElementById(
        "xp"
    ).textContent =
        xp;


    document.getElementById(
        "score"
    ).textContent =
        score;
}


/* =====================================================
   CHECKPOINT
===================================================== */

function restartCheckpoint(){

    player.position.copy(
        checkpoint
    );

    velocity.set(
        0,0,0
    );

    health = 100;

    energy = 100;

    cinematic(
        "CHECKPOINT RESTORED"
    );
}


/* =====================================================
   INPUT
===================================================== */

addEventListener(
    "keydown",
    e=>{

        keys[e.code] = true;


        if(
            e.code==="Space"
        )
            jump();


        if(
            e.code==="KeyE"
        )
            toggleSwing();


        if(
            e.code==="KeyF"
        )
            punch();


        if(
            e.code==="KeyZ"
        )
            webShot();


        if(
            e.code==="KeyR"
        )
            restartCheckpoint();


        if(
            e.code==="KeyN"
        )
            nextMission();
    }
);


addEventListener(
    "keyup",
    e=>{
        keys[e.code] = false;
    }
);


/* =====================================================
   MAIN LOOP
===================================================== */

const clock =
    new THREE.Clock();


function loop(){

    requestAnimationFrame(
        loop
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    movement(dt);

    updateEnemies(dt);

    updateMission();

    cameraUpdate();

    energy =
        Math.min(
            100,
            energy+dt*5
        );


    if(
        health<=0
    ){

        restartCheckpoint();
    }


    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


loadMission();

loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect =
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
