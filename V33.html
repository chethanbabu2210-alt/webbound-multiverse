<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>WEBBOUND V33 — Cinematic Weather</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02040a;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    z-index:20;
    top:10px;
    left:10px;
    width:250px;
    padding:12px;
    color:white;
    background:rgba(0,0,0,.72);
    border-radius:14px;
    border:1px solid rgba(255,255,255,.15);
    backdrop-filter:blur(8px);
    font-size:11px;
}

.title{
    font-size:18px;
    font-weight:bold;
}

.sub{
    color:#72dcff;
    margin-top:3px;
}

.stats{
    margin-top:8px;
    line-height:1.55;
}

#weather{
    margin-top:8px;
    color:#b9dfff;
}

#mission{
    margin-top:8px;
    line-height:1.45;
}

#quality{
    position:fixed;
    z-index:30;
    right:10px;
    top:10px;
    color:white;
    background:rgba(0,0,0,.75);
    padding:7px;
    border-radius:9px;
    font-size:11px;
}

#quality select{
    background:#111;
    color:white;
    border:0;
    padding:4px;
    border-radius:5px;
}

#message{
    position:fixed;
    z-index:50;
    left:50%;
    top:24%;
    transform:translateX(-50%);
    width:90%;
    text-align:center;
    color:white;
    font-size:25px;
    font-weight:bold;
    text-shadow:0 5px 25px #000;
    opacity:0;
    transition:.25s;
}

#flash{
    position:fixed;
    z-index:45;
    inset:0;
    background:white;
    pointer-events:none;
    opacity:0;
}

#crosshair{
    position:fixed;
    z-index:15;
    left:50%;
    top:50%;
    width:12px;
    height:12px;
    transform:translate(-50%,-50%);
    border:1px solid white;
    border-radius:50%;
    opacity:.4;
}

#touch{
    position:fixed;
    z-index:40;
    left:0;
    right:0;
    bottom:8px;
    display:flex;
    justify-content:space-between;
    padding:9px;
    pointer-events:none;
}

.pad,.actions{
    display:grid;
    gap:6px;
    pointer-events:auto;
}

.pad{
    grid-template-columns:48px 48px 48px;
    grid-template-rows:48px 48px;
}

.actions{
    grid-template-columns:52px 52px;
    grid-template-rows:52px 52px 52px;
}

button{
    border:1px solid rgba(255,255,255,.25);
    background:rgba(0,0,0,.68);
    color:white;
    border-radius:13px;
    font-size:10px;
    font-weight:bold;
    touch-action:none;
}

button:active{
    background:rgba(255,255,255,.25);
    transform:scale(.94);
}

.empty{
    visibility:hidden;
}

@media(max-width:600px){

    #hud{
        width:225px;
        font-size:10px;
    }

    .title{
        font-size:16px;
    }
}
</style>
</head>

<body>

<div id="hud">

    <div class="title">
        🕷️ WEBBOUND V33
    </div>

    <div class="sub">
        CINEMATIC WEATHER SYSTEM
    </div>

    <div id="mission">
        Explore the city.
    </div>

    <div id="weather">
        🌧️ Weather: Rain
    </div>

    <div class="stats">

        ❤️ Health:
        <b id="health">100</b><br>

        🕸️ Web:
        <b id="energy">100</b><br>

        ⭐ XP:
        <b id="xp">0</b><br>

        🏆 Score:
        <b id="score">0</b><br>

        👊 Defeated:
        <b id="defeated">0</b><br>

        🕐 Time:
        <b id="time">Night</b>

    </div>

</div>


<div id="quality">

    Graphics:

    <select id="qualitySelect">

        <option value="low">
            Low
        </option>

        <option value="medium" selected>
            Medium
        </option>

        <option value="high">
            High
        </option>

    </select>

</div>


<div id="flash"></div>

<div id="message"></div>

<div id="crosshair"></div>


<div id="touch">

    <div class="pad">

        <button class="empty"></button>

        <button id="up">
            ▲
        </button>

        <button class="empty"></button>

        <button id="left">
            ◀
        </button>

        <button id="down">
            ▼
        </button>

        <button id="right">
            ▶
        </button>

    </div>


    <div class="actions">

        <button id="jump">
            JUMP
        </button>

        <button id="swing">
            WEB
        </button>

        <button id="punch">
            PUNCH
        </button>

        <button id="shot">
            WEB SHOT
        </button>

        <button id="pull">
            PULL
        </button>

        <button id="burst">
            BURST
        </button>

    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x07101b
    );

scene.fog =
    new THREE.FogExp2(
        0x07101b,
        .0011
    );


const camera =
    new THREE.PerspectiveCamera(
        68,
        innerWidth/innerHeight,
        .1,
        3500
    );


const renderer =
    new THREE.WebGLRenderer({

        antialias:true,

        powerPreference:
            "high-performance"
    });


renderer.setSize(
    innerWidth,
    innerHeight
);


renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        1.3
    )
);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


renderer.shadowMap.enabled =
    true;


document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   GRAPHICS
===================================================== */

const graphics = {

    low:{
        pixel:.8,
        buildings:130,
        rain:350
    },

    medium:{
        pixel:1.1,
        buildings:260,
        rain:700
    },

    high:{
        pixel:1.4,
        buildings:420,
        rain:1200
    }

};


let quality =
    "medium";


document
.getElementById(
    "qualitySelect"
)
.addEventListener(
    "change",
    e=>{

        quality =
            e.target.value;

        renderer.setPixelRatio(
            Math.min(
                devicePixelRatio,
                graphics[
                    quality
                ].pixel
            )
        );

        rebuildRain();
    }
);


/* =====================================================
   LIGHTING
===================================================== */

const sun =
    new THREE.DirectionalLight(
        0x9db7ff,
        1.5
    );


sun.position.set(
    -400,
    700,
    300
);


sun.castShadow=true;


scene.add(
    sun
);


const moonLight =
    new THREE.HemisphereLight(
        0x486a9a,
        0x03050a,
        1.2
    );


scene.add(
    moonLight
);


/* =====================================================
   CITY
===================================================== */

const buildings=[];


const buildingMaterials=[

    new THREE.MeshStandardMaterial({

        color:0x111923,

        roughness:.9
    }),

    new THREE.MeshStandardMaterial({

        color:0x1c2631,

        roughness:.85
    }),

    new THREE.MeshStandardMaterial({

        color:0x0d141c,

        roughness:.95
    })

];


function createBuilding(
    x,
    z
){

    const width =
        55+
        Math.random()*20;


    const depth =
        55+
        Math.random()*20;


    const height =
        70+
        Math.random()*250;


    const building =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                width,
                height,
                depth
            ),

            buildingMaterials[
                Math.floor(
                    Math.random()*
                    buildingMaterials.length
                )
            ]
        );


    building.position.set(
        x,
        height/2,
        z
    );


    building.castShadow=true;

    building.receiveShadow=true;


    scene.add(
        building
    );


    buildings.push(
        building
    );
}


let buildingCount=0;


for(
    let x=-850;
    x<=850;
    x+=100
){

    for(
        let z=-850;
        z<=850;
        z+=100
    ){

        if(
            Math.abs(x)<100 &&
            Math.abs(z)<100
        )
            continue;


        if(
            buildingCount >=
            graphics[
                quality
            ].buildings
        )
            break;


        createBuilding(
            x,
            z
        );


        buildingCount++;

    }
}


/* =====================================================
   GROUND
===================================================== */

const ground =
    new THREE.Mesh(

        new THREE.PlaneGeometry(
            3000,
            3000
        ),

        new THREE.MeshStandardMaterial({

            color:0x05080d,

            roughness:1
        })
    );


ground.rotation.x =
    -Math.PI/2;


ground.receiveShadow=true;


scene.add(
    ground
);


/* =====================================================
   PLAYER
===================================================== */

const player =
    new THREE.Group();


player.position.set(
    0,
    1.1,
    0
);


scene.add(
    player
);


const suit =
    new THREE.MeshStandardMaterial({

        color:0xa8192d,

        roughness:.4,

        metalness:.1
    });


const body =
    new THREE.Mesh(

        new THREE.CapsuleGeometry(
            .65,
            1.55,
            8,
            14
        ),

        suit
    );


body.position.y =
    1.45;


player.add(
    body
);


const head =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            .57,
            20,
            16
        ),

        suit
    );


head.position.y =
    2.75;


player.add(
    head
);


const eyeMaterial =
    new THREE.MeshBasicMaterial({

        color:0xffffff
    });


for(
    const x of [-.2,.2]
){

    const eye =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .18,
                12,
                10
            ),

            eyeMaterial
        );


    eye.position.set(
        x,
        2.78,
        -.54
    );


    eye.scale.z=.18;


    player.add(
        eye
    );
}


/* =====================================================
   PLAYER STATE
===================================================== */

const velocity =
    new THREE.Vector3();


const input =
    new THREE.Vector3();


const keys={};


let grounded=true;

let doubleJump=true;

let swinging=false;

let anchor=null;

let webLine=null;

let health=100;

let energy=100;

let xp=0;

let score=0;

let defeated=0;

let checkpoint =
    new THREE.Vector3(
        0,
        1.1,
        0
    );


/* =====================================================
   RAIN SYSTEM
===================================================== */

let rain=null;


function createRain(){

    if(rain)
        scene.remove(
            rain
        );


    const count =
        graphics[
            quality
        ].rain;


    const positions =
        new Float32Array(
            count*6
        );


    for(
        let i=0;
        i<count;
        i++
    ){

        const x =
            player.position.x+
            (Math.random()-.5)*700;


        const y =
            20+
            Math.random()*300;


        const z =
            player.position.z+
            (Math.random()-.5)*700;


        positions[
            i*6
        ]=x;

        positions[
            i*6+1
        ]=y;

        positions[
            i*6+2
        ]=z;


        positions[
            i*6+3
        ]=x;

        positions[
            i*6+4
        ]=y-7;

        positions[
            i*6+5
        ]=z;
    }


    const geometry =
        new THREE.BufferGeometry();


    geometry.setAttribute(

        "position",

        new THREE.BufferAttribute(
            positions,
            3
        )
    );


    const material =
        new THREE.LineBasicMaterial({

            color:0x8bbfff,

            transparent:true,

            opacity:.45
        });


    rain =
        new THREE.LineSegments(
            geometry,
            material
        );


    scene.add(
        rain
    );
}


function rebuildRain(){

    createRain();
}


createRain();


/* =====================================================
   RAIN UPDATE
===================================================== */

function updateRain(dt){

    if(!rain)
        return;


    const positions =
        rain.geometry
        .attributes
        .position
        .array;


    const count =
        positions.length/6;


    for(
        let i=0;
        i<count;
        i++
    ){

        positions[
            i*6+1
        ]-=220*dt;


        positions[
            i*6+4
        ]-=220*dt;


        if(
            positions[
                i*6+1
            ]<0
        ){

            const x =
                player.position.x+
                (Math.random()-.5)*700;


            const z =
                player.position.z+
                (Math.random()-.5)*700;


            positions[
                i*6
            ]=x;

            positions[
                i*6+3
            ]=x;


            positions[
                i*6+1
            ]=280;

            positions[
                i*6+4
            ]=273;


            positions[
                i*6+2
            ]=z;

            positions[
                i*6+5
            ]=z;
        }
    }


    rain.geometry
    .attributes
    .position
    .needsUpdate=true;
}


/* =====================================================
   LIGHTNING
===================================================== */

let lightningTimer =
    4+
    Math.random()*8;


function lightning(){

    const flash =
        document.getElementById(
            "flash"
        );


    flash.style.opacity =
        ".7";


    setTimeout(
        ()=>{
            flash.style.opacity="0";
        },
        80
    );


    setTimeout(
        ()=>{
            flash.style.opacity=".3";
        },
        130
    );


    setTimeout(
        ()=>{
            flash.style.opacity="0";
        },
        190
    );


    sun.intensity=7;


    setTimeout(
        ()=>{
            sun.intensity=1.5;
        },
        250
    );


    message(
        "⚡ LIGHTNING"
    );
}


function updateLightning(dt){

    lightningTimer-=dt;


    if(
        lightningTimer<=0
    ){

        lightning();

        lightningTimer =
            5+
            Math.random()*12;
    }
}


/* =====================================================
   DAY / NIGHT
===================================================== */

let worldTime=0;

let night=true;


function updateTime(dt){

    worldTime+=
        dt*.035;


    const cycle =
        (Math.sin(worldTime)+1)/2;


    const nightNow =
        cycle<.42;


    if(
        nightNow!==night
    ){

        night=
            nightNow;

        document.getElementById(
            "time"
        ).textContent=
            night?
            "Night":
            "Dawn";
    }


    if(night){

        scene.background
            .lerp(
                new THREE.Color(
                    0x020510
                ),
                .01
            );

    }else{

        scene.background
            .lerp(
                new THREE.Color(
                    0x657b91
                ),
                .01
            );
    }
}


/* =====================================================
   ENEMIES
===================================================== */

const enemies=[];


function createEnemy(){

    const enemy =
        new THREE.Group();


    const enemyBody =
        new THREE.Mesh(

            new THREE.CapsuleGeometry(
                .55,
                1,
                6,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:0x353940,

                roughness:.75
            })
        );


    enemyBody.position.y=1.3;


    enemy.add(
        enemyBody
    );


    const enemyHead =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                .43,
                12,
                10
            ),

            new THREE.MeshStandardMaterial({

                color:0x704b3e
            })
        );


    enemyHead.position.y=2.3;


    enemy.add(
        enemyHead
    );


    const angle =
        Math.random()*
        Math.PI*2;


    const distance =
        80+
        Math.random()*150;


    enemy.position.set(

        player.position.x+
        Math.cos(angle)*distance,

        1,

        player.position.z+
        Math.sin(angle)*distance
    );


    enemy.userData={

        health:100,

        speed:4.5,

        stagger:0,

        cooldown:0
    };


    scene.add(
        enemy
    );


    enemies.push(
        enemy
    );
}


for(
    let i=0;
    i<6;
    i++
)
    createEnemy();


function updateEnemies(dt){

    for(
        const enemy of [...enemies]
    ){

        const data =
            enemy.userData;


        data.stagger =
            Math.max(
                0,
                data.stagger-dt
            );


        data.cooldown =
            Math.max(
                0,
                data.cooldown-dt
            );


        if(
            data.stagger>0
        )
            continue;


        const distance =
            enemy.position
            .distanceTo(
                player.position
            );


        if(
            distance<100
        ){

            const direction =
                new THREE.Vector3()
                .subVectors(
                    player.position,
                    enemy.position
                )
                .normalize();


            direction.y=0;


            enemy.position
            .addScaledVector(
                direction,
                data.speed*dt
            );


            enemy.lookAt(
                player.position.x,
                enemy.position.y,
                player.position.z
            );


            if(
                distance<4 &&
                data.cooldown<=0
            ){

                health-=8;

                health=
                    Math.max(
                        0,
                        health
                    );

                data.cooldown=1.2;
            }
        }
    }
}


/* =====================================================
   COMBAT
===================================================== */

function nearestEnemy(range){

    let target=null;

    let closest=range;


    for(
        const enemy of enemies
    ){

        const distance =
            enemy.position
            .distanceTo(
                player.position
            );


        if(
            distance<closest
        ){

            closest=distance;

            target=enemy;
        }
    }


    return target;
}


function punch(){

    const target =
        nearestEnemy(7);


    if(!target)
        return;


    target.userData.health-=50;

    target.userData.stagger=.5;

    score+=100;

    xp+=20;


    if(
        target.userData.health<=0
    )
        defeatEnemy(
            target
        );
}


function webShot(){

    if(
        energy<15
    )
        return;


    const target =
        nearestEnemy(40);


    if(!target)
        return;


    energy-=15;

    target.userData.health-=60;

    target.userData.stagger=.8;


    createWeb(
        target
    );


    if(
        target.userData.health<=0
    )
        defeatEnemy(
            target
        );
}


function webPull(){

    if(
        energy<20
    )
        return;


    const target =
        nearestEnemy(45);


    if(!target)
        return;


    energy-=20;


    const direction =
        new THREE.Vector3()
        .subVectors(
            player.position,
            target.position
        )
        .normalize();


    target.position
    .addScaledVector(
        direction,
        20
    );
}


function webBurst(){

    if(
        energy<35
    )
        return;


    energy-=35;


    for(
        const enemy of [...enemies]
    ){

        if(
            enemy.position
            .distanceTo(
                player.position
            )<18
        ){

            enemy.userData.health-=70;

            enemy.userData.stagger=1;


            if(
                enemy.userData.health<=0
            )
                defeatEnemy(
                    enemy
                );
        }
    }
}


function defeatEnemy(
    enemy
){

    defeated++;

    score+=250;

    xp+=100;


    scene.remove(
        enemy
    );


    const index =
        enemies.indexOf(
            enemy
        );


    if(
        index>=0
    )
        enemies.splice(
            index,
            1
        );
}


/* =====================================================
   WEB EFFECT
===================================================== */

function createWeb(
    target
){

    const start =
        player.position
        .clone();


    start.y+=2;


    const end =
        target.position
        .clone();


    end.y+=1;


    const line =
        new THREE.Line(

            new THREE.BufferGeometry()
            .setFromPoints([
                start,
                end
            ]),

            new THREE.LineBasicMaterial({
                color:0xffffff
            })
        );


    scene.add(
        line
    );


    setTimeout(
        ()=>{
            scene.remove(
                line
            );
        },
        300
    );
}


/* =====================================================
   SWING
===================================================== */

function findAnchor(){

    let best=null;

    let closest=450;


    for(
        const building of buildings
    ){

        const h =
            building.geometry
            .parameters
            .height;


        const point =
            new THREE.Vector3(

                building.position.x,

                building.position.y+
                h/2,

                building.position.z
            );


        const distance =
            point.distanceTo(
                player.position
            );


        if(
            distance<closest &&
            point.y>
            player.position.y+8
        ){

            closest=distance;

            best=point;
        }
    }


    return best;
}


function toggleSwing(){

    if(
        swinging
    ){

        swinging=false;


        if(webLine){

            scene.remove(
                webLine
            );

            webLine=null;
        }


        velocity.multiplyScalar(
            1.4
        );


        return;
    }


    const point =
        findAnchor();


    if(!point)
        return;


    anchor=point;

    swinging=true;


    webLine =
        new THREE.Line(

            new THREE.BufferGeometry()
            .setFromPoints([
                player.position.clone(),
                anchor.clone()
            ]),

            new THREE.LineBasicMaterial({
                color:0xffffff
            })
        );


    scene.add(
        webLine
    );
}


function updateSwing(dt){

    if(!swinging)
        return;


    const pull =
        new THREE.Vector3()
        .subVectors(
            anchor,
            player.position
        );


    const distance =
        pull.length();


    pull.normalize();


    if(
        distance>10
    ){

        velocity.addScaledVector(
            pull,
            (distance-10)*
            dt*
            16
        );
    }


    velocity.y-=7*dt;


    if(webLine){

        const p =
            webLine.geometry
            .attributes
            .position
            .array;


        p[0]=
            player.position.x;

        p[1]=
            player.position.y+1;

        p[2]=
            player.position.z;


        p[3]=
            anchor.x;

        p[4]=
            anchor.y;

        p[5]=
            anchor.z;


        webLine.geometry
        .attributes
        .position
        .needsUpdate=true;
    }
}


/* =====================================================
   MOVEMENT
===================================================== */

function jump(){

    if(
        grounded
    ){

        velocity.y=15;

        grounded=false;

        doubleJump=true;

        return;
    }


    if(
        doubleJump
    ){

        velocity.y=13;

        doubleJump=false;
    }
}


function updateMovement(dt){

    input.set(
        0,
        0,
        0
    );


    if(keys.KeyW)
        input.z-=1;

    if(keys.KeyS)
        input.z+=1;

    if(keys.KeyA)
        input.x-=1;

    if(keys.KeyD)
        input.x+=1;


    if(
        input.length()>0
    )
        input.normalize();


    const speed =
        keys.ShiftLeft
        ?14
        :9;


    velocity.x +=
        input.x*
        speed*
        dt*5;


    velocity.z +=
        input.z*
        speed*
        dt*5;


    velocity.x*=.91;

    velocity.z*=.91;


    if(
        !grounded &&
        !swinging
    )
        velocity.y-=30*dt;


    updateSwing(dt);


    player.position
    .addScaledVector(
        velocity,
        dt
    );


    if(
        player.position.y<=1.1
    ){

        player.position.y=1.1;

        velocity.y=0;

        grounded=true;

        doubleJump=true;

    }else{

        grounded=false;
    }
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    const desired =
        new THREE.Vector3(

            player.position.x,

            player.position.y+5.5,

            player.position.z+12
        );


    if(
        swinging
    ){

        desired.y=
            player.position.y+7;

        desired.z=
            player.position.z+15;
    }


    camera.position.lerp(
        desired,
        .075
    );


    camera.fov =
        THREE.MathUtils.lerp(

            camera.fov,

            swinging
            ?78
            :68,

            .06
        );


    camera.updateProjectionMatrix();


    camera.lookAt(

        player.position.x,

        player.position.y+2,

        player.position.z
    );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "health"
    ).textContent=
        Math.floor(
            health
        );


    document.getElementById(
        "energy"
    ).textContent=
        Math.floor(
            energy
        );


    document.getElementById(
        "xp"
    ).textContent=
        xp;


    document.getElementById(
        "score"
    ).textContent=
        score;


    document.getElementById(
        "defeated"
    ).textContent=
        defeated;
}


/* =====================================================
   MESSAGE
===================================================== */

function message(
    text
){

    const element =
        document.getElementById(
            "message"
        );


    element.textContent=
        text;


    element.style.opacity=1;


    setTimeout(
        ()=>{
            element.style.opacity=0;
        },
        1000
    );
}


/* =====================================================
   CHECKPOINT
===================================================== */

function resetCheckpoint(){

    player.position.copy(
        checkpoint
    );


    velocity.set(
        0,
        0,
        0
    );


    health=100;

    energy=100;


    message(
        "CHECKPOINT RESTORED"
    );
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;


        if(
            e.code==="Space"
        )
            jump();


        if(
            e.code==="KeyE"
        )
            toggleSwing();


        if(
            e.code==="KeyF"
        )
            punch();


        if(
            e.code==="KeyZ"
        )
            webShot();


        if(
            e.code==="KeyG"
        )
            webPull();


        if(
            e.code==="KeyC"
        )
            webBurst();


        if(
            e.code==="KeyR"
        )
            resetCheckpoint();
    }
);


addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =====================================================
   MOBILE CONTROLS
===================================================== */

function holdButton(
    id,
    code
){

    const button =
        document.getElementById(
            id
        );


    const start =
        e=>{

            e.preventDefault();

            keys[code]=true;
        };


    const end =
        e=>{

            e.preventDefault();

            keys[code]=false;
        };


    button.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );


    button.addEventListener(
        "touchend",
        end,
        {passive:false}
    );


    button.addEventListener(
        "touchcancel",
        end,
        {passive:false}
    );
}


holdButton(
    "up",
    "KeyW"
);

holdButton(
    "down",
    "KeyS"
);

holdButton(
    "left",
    "KeyA"
);

holdButton(
    "right",
    "KeyD"
);


function tapButton(
    id,
    action
){

    document
    .getElementById(id)
    .addEventListener(

        "touchstart",

        e=>{

            e.preventDefault();

            action();
        },

        {passive:false}
    );
}


tapButton(
    "jump",
    jump
);

tapButton(
    "swing",
    toggleSwing
);

tapButton(
    "punch",
    punch
);

tapButton(
    "shot",
    webShot
);

tapButton(
    "pull",
    webPull
);

tapButton(
    "burst",
    webBurst
);


/* =====================================================
   GAME LOOP
===================================================== */

const clock =
    new THREE.Clock();


function loop(){

    requestAnimationFrame(
        loop
    );


    const dt =
        Math.min(
            clock.getDelta(),
            .033
        );


    updateMovement(
        dt
    );


    updateEnemies(
        dt
    );


    updateRain(
        dt
    );


    updateLightning(
        dt
    );


    updateTime(
        dt
    );


    updateCamera();


    energy =
        Math.min(
            100,
            energy+
            dt*5
        );


    if(
        health<=0
    )
        resetCheckpoint();


    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>

</body>
</html>
