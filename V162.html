<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V162 — WANTED SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#294856,#081217);
}

#world{
 position:absolute;
 inset:0;
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.45;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#police{
 position:absolute;
 display:none;
 left:20%;
 top:45%;
 font-size:30px;
 z-index:60;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(570px,89vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#wantedInfo{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.6;
}

.stars{
 letter-spacing:2px;
 font-size:15px;
 margin-top:3px;
}

.bar{
 height:8px;
 background:#ffffff12;
 border-radius:7px;
 overflow:hidden;
 margin-top:5px;
}

.fill{
 height:100%;
 width:0%;
 transition:.3s;
}

#wantedFill{
 background:#c95b64;
}

#escapeFill{
 background:#719fd0;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(760px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.6;
}

.card b{
 display:block;
 margin-bottom:7px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road rh"></div>
  <div class="road rv"></div>

  <div class="line lineH"></div>
  <div class="line lineV"></div>

  <div class="building b1">🏠 RESIDENTIAL</div>
  <div class="building b2">🏫 SCHOOL</div>
  <div class="building b3">🏥 HOSPITAL</div>
  <div class="building b4">🏢 CORPORATE</div>
  <div class="building b5">🏭 WAREHOUSE</div>
  <div class="building b6">🌳 PARK</div>

  <div id="police">🚔</div>
  <div id="player"></div>

 </div>

 <div id="hud">

  <div class="title">
   🚨 WEBBOUND V162 — WANTED SYSTEM
  </div>

  <div class="stats">

   <div class="stat">
    🚨 WANTED<br>
    <span id="wantedText">0/5</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">0</span>
   </div>

   <div class="stat">
    ⭐ XP<br>
    <span id="xpText">0</span>
   </div>

   <div class="stat">
    🚔 STATUS<br>
    <span id="statusText">CLEAR</span>
   </div>

  </div>

  <div id="wantedInfo">

   <b>POLICE STATUS</b>

   <div
    id="stars"
    class="stars">
    ☆☆☆☆☆
   </div>

   Wanted level:
   <span id="levelText">0</span>

   <div class="bar">
    <div
     id="wantedFill"
     class="fill">
    </div>
   </div>

   Escape progress:
   <span id="escapeText">0%</span>

   <div class="bar">
    <div
     id="escapeFill"
     class="fill">
    </div>
   </div>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V162.cityAction()">
   ⚠️ CITY ACTION
  </button>

  <button onclick="V162.escape()">
   🏃 ESCAPE
  </button>

  <button onclick="V162.hide()">
   🫥 HIDE
  </button>

  <button onclick="V162.surrender()">
   🚔 SURRENDER
  </button>

  <button onclick="V162.policeHQ()">
   👮 POLICE HQ
  </button>

  <button onclick="V162.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V162
   </h2>

   <div id="panelContent"></div>

   <button onclick="V162.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V162={

 saveKey:"WEBBOUND_V162",

 cash:0,

 xp:0,

 wanted:0,

 escapeProgress:0,

 finesPaid:0,

 arrests:0,

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  this.notify(
   "🚨 V162 Wanted System ready"
  );

 },

 /* =========================
    CITY ACTION
 ========================= */

 cityAction(){

  const gain=
   Math.floor(
    Math.random()*3
   )+1;

  this.addWanted(gain);

  this.xp+=10;

  this.notify(
   "⚠️ Suspicious activity reported! "+
   "+"+gain+
   " wanted level."
  );

  this.update();

  this.save();

 },

 /* =========================
    ADD WANTED
 ========================= */

 addWanted(amount){

  this.wanted=
   Math.max(
    0,
    Math.min(
     5,
     this.wanted+amount
    )
   );

  if(this.wanted>0){

   document.getElementById(
    "police"
   ).style.display=
    "block";

  }

 },

 /* =========================
    ESCAPE
 ========================= */

 escape(){

  if(this.wanted<=0){

   this.notify(
    "✅ You are not wanted."
   );

   return;

  }

  const gain=
   15+
   Math.floor(
    Math.random()*16
   );

  this.escapeProgress=
   Math.min(
    100,
    this.escapeProgress+
    gain
   );

  this.xp+=10;

  if(
   this.escapeProgress>=100
  ){

   this.wanted=0;

   this.escapeProgress=0;

   document.getElementById(
    "police"
   ).style.display=
    "none";

   this.notify(
    "🏃 You escaped the police!"
   );

  }
  else{

   this.notify(
    "🏃 Escape progress: "+
    this.escapeProgress+
    "%"
   );

  }

  this.update();

  this.save();

 },

 /* =========================
    HIDE
 ========================= */

 hide(){

  if(this.wanted<=0){

   this.notify(
    "🌙 There is nobody searching for you."
   );

   return;

  }

  const gain=
   8+
   Math.floor(
    Math.random()*12
   );

  this.escapeProgress=
   Math.min(
    100,
    this.escapeProgress+
    gain
   );

  this.notify(
   "🫥 You found a place to hide."
  );

  if(
   this.escapeProgress>=100
  ){

   this.wanted=0;

   this.escapeProgress=0;

   document.getElementById(
    "police"
   ).style.display=
    "none";

   this.notify(
    "✅ Police search ended."
   );

  }

  this.update();

  this.save();

 },

 /* =========================
    SURRENDER
 ========================= */

 surrender(){

  if(this.wanted<=0){

   this.notify(
    "👮 No reason to surrender."
   );

   return;

  }

  const fine=
   this.wanted*
   250;

  this.cash=
   Math.max(
    0,
    this.cash-fine
   );

  this.finesPaid+=fine;

  this.arrests++;

  this.wanted=0;

  this.escapeProgress=0;

  document.getElementById(
   "police"
  ).style.display=
   "none";

  this.xp+=20;

  this.notify(
   "🚔 Fine paid: ₹"+
   fine+
   ". Wanted level cleared."
  );

  this.update();

  this.save();

 },

 /* =========================
    POLICE HQ
 ========================= */

 policeHQ(){

  const fine=
   this.wanted*
   250;

  this.open(
   "👮 POLICE HQ",
   `
   <div class="card">

    <b>🚔 POLICE RECORD</b>

    Current wanted level:
    ${this.wanted}/5

    <br>

    Total fines paid:
    ₹${this.finesPaid}

    <br>

    Arrests:
    ${this.arrests}

   </div>

   <div class="card">

    <b>🚨 CURRENT FINE</b>

    ${
     this.wanted>0
     ?"₹"+fine
     :"No outstanding fine."
    }

   </div>

   <div class="card">

    <b>📋 STATUS</b>

    ${
     this.wanted===0
     ?"Your record is currently clear."
     :"You are currently wanted by police."
    }

   </div>
   `
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  document.getElementById(
   "wantedText"
  ).textContent=
   this.wanted+
   "/5";

  document.getElementById(
   "levelText"
  ).textContent=
   this.wanted;

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash;

  document.getElementById(
   "xpText"
  ).textContent=
   this.xp;

  document.getElementById(
   "escapeText"
  ).textContent=
   this.escapeProgress+
   "%";

  document.getElementById(
   "wantedFill"
  ).style.width=
   (
    this.wanted/
    5*
    100
   )+"%";

  document.getElementById(
   "escapeFill"
  ).style.width=
   this.escapeProgress+
   "%";

  document.getElementById(
   "statusText"
  ).textContent=
   this.wanted>0
   ?"WANTED"
   :"CLEAR";

  let stars="";

  for(
   let i=1;
   i<=5;
   i++
  ){

   stars+=
    i<=this.wanted
    ?"★"
    :"☆";

  }

  document.getElementById(
   "stars"
  ).textContent=
   stars;

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    xp:this.xp,

    wanted:this.wanted,

    escapeProgress:
     this.escapeProgress,

    finesPaid:
     this.finesPaid,

    arrests:
     this.arrests

   })
  );

  localStorage.setItem(
   "WEBBOUND_V150_CASH",
   this.cash
  );

  this.notify(
   "💾 V162 saved"
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(raw){

    const data=
     JSON.parse(raw);

    this.cash=
     Number.isFinite(data.cash)
     ?data.cash
     :0;

    this.xp=
     Number.isFinite(data.xp)
     ?data.xp
     :0;

    this.wanted=
     Number.isFinite(data.wanted)
     ?data.wanted
     :0;

    this.escapeProgress=
     Number.isFinite(
      data.escapeProgress
     )
     ?data.escapeProgress
     :0;

    this.finesPaid=
     Number.isFinite(
      data.finesPaid
     )
     ?data.finesPaid
     :0;

    this.arrests=
     Number.isFinite(
      data.arrests
     )
     ?data.arrests
     :0;

    return;

   }

   /*
    Continue from V161.
   */

   const old=
    localStorage.getItem(
     "WEBBOUND_V161"
    );

   if(old){

    const data=
     JSON.parse(old);

    this.cash=
     Number.isFinite(data.cash)
     ?data.cash
     :0;

    this.xp=
     Number.isFinite(data.xp)
     ?data.xp
     :0;

   }

  }
  catch(error){

   console.log(
    "V162 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2300
   );

 }

};

V162.init();

console.log(
 "WEBBOUND V162 WANTED SYSTEM READY"
);

</script>

</body>
</html>
