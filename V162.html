<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V62</title>

<style>
*{
 box-sizing:border-box;
}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:white;
}

#game{
 position:fixed;
 inset:0;
 background:
 linear-gradient(#284854,#081217);
 overflow:hidden;
}

#world{
 position:absolute;
 inset:0;
}

.road{
 position:absolute;
 background:#252d32;
}

.horizontal{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.vertical{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.5;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:10px;
 color:#82929b;
 font-size:10px;
}

.b1{
 left:4%;
 top:7%;
 width:19%;
 height:28%;
}

.b2{
 left:28%;
 top:7%;
 width:19%;
 height:28%;
}

.b3{
 left:51%;
 top:7%;
 width:16%;
 height:27%;
}

.b4{
 right:3%;
 top:7%;
 width:23%;
 height:28%;
}

.b5{
 left:4%;
 bottom:6%;
 width:20%;
 height:24%;
}

.b6{
 left:30%;
 bottom:7%;
 width:18%;
 height:22%;
}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:30px;
 height:42px;
 background:#2d91d8;
 border-radius:10px 10px 5px 5px;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:6px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(500px,88vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:8px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#info{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.6;
}

.bar{
 height:7px;
 background:#ffffff12;
 border-radius:6px;
 overflow:hidden;
 margin-top:5px;
}

.fill{
 height:100%;
 width:0%;
 transition:.3s;
}

#health{
 background:#d85f67;
}

#energy{
 background:#5f9fd8;
}

#xp{
 background:#c39bdf;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(900px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 color:white;
 border:1px solid #ffffff22;
 border-radius:8px;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(700px,94vw);
 max-height:82vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.6;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road horizontal"></div>
  <div class="road vertical"></div>

  <div class="line lineH"></div>
  <div class="line lineV"></div>

  <div class="building b1">
   🏠 RESIDENTIAL
  </div>

  <div class="building b2">
   🏫 SCHOOL
  </div>

  <div class="building b3">
   🏥 HOSPITAL
  </div>

  <div class="building b4">
   🏢 CORPORATE
  </div>

  <div class="building b5">
   🏭 WAREHOUSE
  </div>

  <div class="building b6">
   🌳 PARK
  </div>

  <div id="player"></div>

 </div>

 <div id="hud">

  <div class="title">
   🕷️ WEBBOUND V62
  </div>

  <div class="stats">

   <div class="stat">
    ❤️ HEALTH<br>
    <span id="healthText">100/100</span>
   </div>

   <div class="stat">
    ⚡ ENERGY<br>
    <span id="energyText">100/100</span>
   </div>

   <div class="stat">
    ⭐ LEVEL<br>
    <span id="levelText">1</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">500</span>
   </div>

  </div>

  <div id="info">

   <b>PLAYER PROGRESS</b>

   <br>

   XP:
   <span id="xpText">
    0/250
   </span>

   <div class="bar">
    <div
     id="xp"
     class="fill">
    </div>
   </div>

   Health

   <div class="bar">
    <div
     id="health"
     class="fill">
    </div>
   </div>

   Energy

   <div class="bar">
    <div
     id="energy"
     class="fill">
    </div>
   </div>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V62.move()">
   🕹️ MOVE
  </button>

  <button onclick="V62.search()">
   🔎 SEARCH
  </button>

  <button onclick="V62.train()">
   🏃 TRAIN
  </button>

  <button onclick="V62.rest()">
   😴 REST
  </button>

  <button onclick="V62.character()">
   🧑 CHARACTER
  </button>

  <button onclick="V62.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V62
   </h2>

   <div id="panelContent"></div>

   <button onclick="V62.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V62={

 saveKey:"WEBBOUND_V62",

 health:100,

 maxHealth:100,

 energy:100,

 maxEnergy:100,

 xp:0,

 level:1,

 cash:500,

 searches:0,

 trainings:0,

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  this.notify(
   "🕷️ WEBBOUND V62 loaded"
  );

 },

 /* =========================
    XP
 ========================= */

 addXP(amount){

  this.xp+=amount;

  let required=
   this.level*250;

  while(
   this.xp>=required
  ){

   this.xp-=required;

   this.level++;

   this.maxHealth+=5;

   this.maxEnergy+=5;

   this.health=
    this.maxHealth;

   this.energy=
    this.maxEnergy;

   required=
    this.level*250;

   this.notify(
    "⭐ LEVEL UP! Level "+
    this.level
   );

  }

  this.update();

 },

 /* =========================
    MOVE
 ========================= */

 move(){

  if(this.energy<5){

   this.notify(
    "⚡ Not enough energy."
   );

   return;

  }

  this.energy-=5;

  const player=
   document.getElementById(
    "player"
   );

  const x=
   20+
   Math.random()*60;

  const y=
   25+
   Math.random()*55;

  player.style.left=
   x+"%";

  player.style.top=
   y+"%";

  this.addXP(5);

  this.notify(
   "🕹️ You moved through the city."
  );

  this.save();

 },

 /* =========================
    SEARCH
 ========================= */

 search(){

  if(this.energy<8){

   this.notify(
    "⚡ Not enough energy."
   );

   return;

  }

  this.energy-=8;

  this.searches++;

  const rewards=[
   25,
   40,
   60,
   75,
   100
  ];

  const reward=
   rewards[
    Math.floor(
     Math.random()*
     rewards.length
    )
   ];

  this.cash+=reward;

  this.addXP(15);

  this.notify(
   "🔎 Search complete! +₹"+
   reward+
   " +15 XP"
  );

  this.save();

 },

 /* =========================
    TRAIN
 ========================= */

 train(){

  if(this.energy<15){

   this.notify(
    "⚡ Not enough energy."
   );

   return;

  }

  this.energy-=15;

  this.trainings++;

  this.addXP(30);

  this.notify(
   "🏃 Training complete! +30 XP"
  );

  this.save();

 },

 /* =========================
    REST
 ========================= */

 rest(){

  this.energy=
   Math.min(
    this.maxEnergy,
    this.energy+35
   );

  this.health=
   Math.min(
    this.maxHealth,
    this.health+15
   );

  this.notify(
   "😴 Rest complete."
  );

  this.update();

  this.save();

 },

 /* =========================
    CHARACTER
 ========================= */

 character(){

  this.open(
   "🧑 CHARACTER",
   `
   <div class="card">

    <b>PLAYER PROFILE</b>

    Level:
    ${this.level}

    <br>

    XP:
    ${this.xp}/
    ${this.level*250}

    <br>

    Health:
    ${this.health}/
    ${this.maxHealth}

    <br>

    Energy:
    ${this.energy}/
    ${this.maxEnergy}

    <br>

    Cash:
    ₹${this.cash}

   </div>

   <div class="card">

    <b>📊 ACTIVITY</b>

    Searches:
    ${this.searches}

    <br>

    Training sessions:
    ${this.trainings}

   </div>

   <div class="card">

    <b>🌆 CITY</b>

    Explore different areas,
    search for clues and train
    your character to gain XP.

   </div>
   `
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  document.getElementById(
   "healthText"
  ).textContent=
   this.health+
   "/"+
   this.maxHealth;

  document.getElementById(
   "energyText"
  ).textContent=
   this.energy+
   "/"+
   this.maxEnergy;

  document.getElementById(
   "levelText"
  ).textContent=
   this.level;

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash;

  document.getElementById(
   "xpText"
  ).textContent=
   this.xp+
   "/"+
   (
    this.level*250
   );

  document.getElementById(
   "health"
  ).style.width=
   (
    this.health/
    this.maxHealth*
    100
   )+"%";

  document.getElementById(
   "energy"
  ).style.width=
   (
    this.energy/
    this.maxEnergy*
    100
   )+"%";

  document.getElementById(
   "xp"
  ).style.width=
   (
    this.xp/
    (this.level*250)*
    100
   )+"%";

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    health:this.health,

    maxHealth:this.maxHealth,

    energy:this.energy,

    maxEnergy:this.maxEnergy,

    xp:this.xp,

    level:this.level,

    cash:this.cash,

    searches:this.searches,

    trainings:this.trainings

   })
  );

  this.notify(
   "💾 V62 saved"
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   this.health=
    Number.isFinite(data.health)
    ?data.health
    :100;

   this.maxHealth=
    Number.isFinite(data.maxHealth)
    ?data.maxHealth
    :100;

   this.energy=
    Number.isFinite(data.energy)
    ?data.energy
    :100;

   this.maxEnergy=
    Number.isFinite(data.maxEnergy)
    ?data.maxEnergy
    :100;

   this.xp=
    Number.isFinite(data.xp)
    ?data.xp
    :0;

   this.level=
    Number.isFinite(data.level)
    ?data.level
    :1;

   this.cash=
    Number.isFinite(data.cash)
    ?data.cash
    :500;

   this.searches=
    Number.isFinite(data.searches)
    ?data.searches
    :0;

   this.trainings=
    Number.isFinite(data.trainings)
    ?data.trainings
    :0;

  }
  catch(error){

   console.log(
    "V62 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2200
   );

 }

};

V62.init();

console.log(
 "WEBBOUND V62 READY"
);

</script>

</body>
</html>
