<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V187 — CAREER SYSTEM</title>

<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 font-family:Arial,sans-serif;background:#05090d;color:#fff
}
#game{
 position:fixed;inset:0;overflow:hidden;
 background:linear-gradient(#304d59,#091116)
}
#sky{
 position:absolute;inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8)
}
.road{position:absolute;background:#252d32}
.rh{left:0;right:0;top:57%;height:70px}
.rv{top:0;bottom:0;left:68%;width:70px}
.line{position:absolute;background:#d5c36c;opacity:.4}
.lineH{left:0;right:0;top:calc(57% + 34px);height:2px}
.lineV{top:0;bottom:0;left:calc(68% + 34px);width:2px}

.building{
 position:absolute;display:flex;align-items:center;
 justify-content:center;text-align:center;
 background:#14242d;border:1px solid #ffffff18;
 border-radius:9px;color:#82929b;font-size:10px
}
.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;left:50%;top:53%;
 width:29px;height:41px;border-radius:10px 10px 5px 5px;
 background:#2c91da;z-index:50
}
#player:before{
 content:"";position:absolute;left:5.5px;top:-14px;
 width:18px;height:18px;border-radius:50%;background:#bd8967
}

#hud{
 position:fixed;left:10px;top:10px;
 width:min(920px,92vw);padding:12px;
 background:#03070cee;border:1px solid #ffffff25;
 border-radius:13px;z-index:500
}
.title{font-size:13px;font-weight:bold}
.stats{
 display:grid;grid-template-columns:repeat(5,1fr);
 gap:5px;margin-top:8px
}
.stat{
 padding:7px 4px;background:#101b23;
 border-radius:7px;text-align:center;font-size:9px
}
#careerHud{
 margin-top:8px;padding:9px;background:#111d25;
 border-radius:8px;font-size:9px;line-height:1.8
}
.bar{
 height:7px;background:#ffffff12;
 border-radius:7px;overflow:hidden;margin-top:4px
}
.fill{
 height:100%;width:0%;
 background:#8fb8df;transition:.3s
}

#controls{
 position:fixed;left:50%;bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;flex-wrap:wrap;gap:6px;z-index:500
}
button{
 flex:1;min-width:105px;padding:10px;
 background:#142733;border:1px solid #ffffff22;
 border-radius:8px;color:#fff;font-size:10px;cursor:pointer
}
button:active{transform:scale(.97)}
input{
 width:100%;padding:9px;margin-top:7px;
 border-radius:7px;border:1px solid #ffffff22;
 background:#0b141b;color:#fff
}

#panel{
 position:fixed;inset:0;display:none;
 align-items:center;justify-content:center;
 background:#000c;z-index:1000
}
.box{
 width:min(780px,94vw);max-height:84vh;
 overflow:auto;padding:17px;background:#050b10;
 border:1px solid #ffffff28;border-radius:15px
}
.card{
 padding:11px;background:#111d25;
 border-radius:9px;margin-bottom:7px;
 font-size:10px;line-height:1.7
}
.card button{width:100%;margin-top:8px}

#notification{
 position:fixed;left:50%;top:20%;
 transform:translateX(-50%);
 padding:10px 15px;background:#03070cf5;
 border:1px solid #ffffff25;border-radius:9px;
 display:none;z-index:1500;font-size:10px;
 text-align:center
}
</style>
</head>

<body>

<div id="game">

<div id="sky"></div>

<div class="road rh"></div>
<div class="road rv"></div>
<div class="line lineH"></div>
<div class="line lineV"></div>

<div class="building b1">🏠 RESIDENTIAL</div>
<div class="building b2">🏢 CORPORATE OFFICE</div>
<div class="building b3">🏥 HOSPITAL</div>
<div class="building b4">💻 TECHNOLOGY PARK</div>
<div class="building b5">🏭 INDUSTRIAL AREA</div>
<div class="building b6">💼 CAREER CENTER</div>

<div id="player"></div>

<div id="hud">

<div class="title">
💼 WEBBOUND V187 — CAREER SYSTEM
</div>

<div class="stats">

<div class="stat">
💰 CASH<br>
₹<span id="cashText">5000</span>
</div>

<div class="stat">
💼 JOB<br>
<span id="jobText">UNEMPLOYED</span>
</div>

<div class="stat">
💵 SALARY<br>
₹<span id="salaryText">0</span>
</div>

<div class="stat">
⭐ LEVEL<br>
<span id="levelText">1</span>
</div>

<div class="stat">
🎯 XP<br>
<span id="xpText">0</span>
</div>

</div>

<div id="careerHud">

<b>💼 CAREER STATUS</b><br>

Position:
<span id="positionText">Unemployed</span><br>

Experience:
<span id="experienceText">0</span> XP<br>

Work Shifts:
<span id="shiftText">0</span><br>

Career Progress:
<div class="bar">
<div id="xpFill" class="fill"></div>
</div>

</div>

</div>

<div id="notification"></div>

<div id="controls">

<button onclick="V187.jobs()">
💼 JOB MARKET
</button>

<button onclick="V187.work()">
🧑‍💻 WORK SHIFT
</button>

<button onclick="V187.promote()">
⬆️ PROMOTION
</button>

<button onclick="V187.career()">
📊 CAREER
</button>

<button onclick="V187.quit()">
🚪 QUIT JOB
</button>

<button onclick="V187.save()">
💾 SAVE
</button>

</div>

<div id="panel">

<div class="box">

<h2 id="panelTitle">
WEBBOUND V187
</h2>

<div id="panelContent"></div>

<button onclick="V187.close()">
CLOSE
</button>

</div>

</div>

</div>

<script>

const V187={

saveKey:"WEBBOUND_V187",

cash:5000,

job:null,

salary:0,

level:1,

xp:0,

shifts:0,

experience:0,

lastWork:0,

jobsData:{

delivery:{
name:"🚚 Delivery Driver",
salary:500,
xp:20,
requirement:0,
promotion:100
},

retail:{
name:"🛒 Retail Manager",
salary:800,
xp:30,
requirement:50,
promotion:180
},

developer:{
name:"💻 Software Developer",
salary:1500,
xp:50,
requirement:120,
promotion:300
},

engineer:{
name:"⚙️ Engineer",
salary:2200,
xp:65,
requirement:220,
promotion:450
},

doctor:{
name:"🩺 Doctor",
salary:3500,
xp:90,
requirement:400,
promotion:700
},

executive:{
name:"👔 Corporate Executive",
salary:5000,
xp:120,
requirement:650,
promotion:1000
}

},

init(){

this.load();
this.update();

this.notify(
"💼 V187 Career System ready"
);

},

jobs(){

let html="";

Object.entries(this.jobsData)
.forEach(([id,j])=>{

const available=
this.experience>=j.requirement;

html+=`

<div class="card">

<b>${j.name}</b>

<br><br>

💵 Salary per shift:
₹${j.salary.toLocaleString()}

<br>

🎯 XP per shift:
${j.xp}

<br>

📚 Required XP:
${j.requirement}

<br>

⬆️ Promotion XP:
${j.promotion}

<br><br>

<button
${available?"":"disabled"}
onclick="V187.apply('${id}')">

${available?
"💼 APPLY FOR JOB":
"🔒 LOCKED — NEED "+j.requirement+" XP"}

</button>

</div>

`;

});

this.open(
"💼 JOB MARKET",
html
);

},

apply(id){

const j=this.jobsData[id];

if(this.experience<j.requirement){

this.notify(
"❌ You need more experience."
);

return;

}

this.job=id;

this.salary=j.salary;

this.level=1;

this.xp=0;

this.update();
this.save();
this.close();

this.notify(
"🎉 Hired as "+j.name
);

},

work(){

if(!this.job){

this.notify(
"💼 Get a job first."
);

return;

}

const now=Date.now();

if(
now-this.lastWork<10000
){

const remaining=
Math.ceil(
(10000-(now-this.lastWork))/1000
);

this.notify(
"⏳ Next shift available in "+
remaining+"s"
);

return;

}

const j=this.jobsData[this.job];

const levelBonus=
1+(this.level-1)*0.1;

const pay=
Math.floor(
j.salary*levelBonus
);

const gainedXP=
Math.floor(
j.xp*(1+(this.level-1)*0.1)
);

this.cash+=pay;

this.xp+=gainedXP;

this.experience+=gainedXP;

this.shifts++;

this.lastWork=now;

this.update();
this.save();

this.notify(
"💼 Shift complete! +₹"+
pay.toLocaleString()+
" | +"+gainedXP+" XP"
);

},

promote(){

if(!this.job){

this.notify(
"💼 You don't have a job."
);

return;

}

const j=this.jobsData[this.job];

const required=
j.promotion*this.level;

if(this.experience<required){

this.notify(
"🎯 Need "+required+
" total XP for promotion."
);

return;

}

this.level++;

this.salary=
Math.floor(
j.salary*
(1+(this.level-1)*0.1)
);

this.update();
this.save();

this.notify(
"🎉 PROMOTED! Career Level "+
this.level
);

},

career(){

let jobName=
this.job?
this.jobsData[this.job].name:
"Unemployed";

const next=
this.job?
this.jobsData[this.job].promotion*this.level:
0;

this.open(
"📊 CAREER PROFILE",
`

<div class="card">

<b>${jobName}</b>

<br><br>

💵 Current Salary:
₹${this.salary.toLocaleString()}

<br>

⭐ Career Level:
${this.level}

<br>

🎯 Experience:
${this.experience} XP

<br>

🧑‍💻 Completed Shifts:
${this.shifts}

<br>

⬆️ Next Promotion:
${this.job?
Math.max(0,next-this.experience):
"—"} XP remaining

</div>

<div class="card">

<b>📈 Career Progress</b>

<div class="bar">

<div
class="fill"
style="width:${
this.job?
Math.min(
100,
this.experience/next*100
):0
}%">

</div>

</div>

</div>

`
);

},

quit(){

if(!this.job){

this.notify(
"Already unemployed."
);

return;

}

const oldJob=
this.jobsData[this.job].name;

this.job=null;

this.salary=0;

this.level=1;

this.xp=0;

this.update();
this.save();

this.notify(
"🚪 Left "+oldJob
);

},

update(){

document.getElementById(
"cashText"
).textContent=
this.cash.toLocaleString();

document.getElementById(
"jobText"
).textContent=
this.job?
this.jobsData[this.job].name:
"UNEMPLOYED";

document.getElementById(
"salaryText"
).textContent=
this.salary.toLocaleString();

document.getElementById(
"levelText"
).textContent=
this.level;

document.getElementById(
"xpText"
).textContent=
this.xp;

document.getElementById(
"positionText"
).textContent=
this.job?
this.jobsData[this.job].name:
"Unemployed";

document.getElementById(
"experienceText"
).textContent=
this.experience;

document.getElementById(
"shiftText"
).textContent=
this.shifts;

let progress=0;

if(this.job){

const required=
this.jobsData[this.job].promotion*
this.level;

progress=
Math.min(
100,
this.experience/required*100
);

}

document.getElementById(
"xpFill"
).style.width=
progress+"%";

},

save(){

localStorage.setItem(
this.saveKey,
JSON.stringify({

cash:this.cash,

job:this.job,

salary:this.salary,

level:this.level,

xp:this.xp,

shifts:this.shifts,

experience:this.experience

})
);

},

load(){

try{

const raw=
localStorage.getItem(
this.saveKey
);

if(!raw)return;

const data=
JSON.parse(raw);

if(Number.isFinite(data.cash))
this.cash=Math.max(0,data.cash);

if(
typeof data.job==="string" &&
this.jobsData[data.job]
)
this.job=data.job;

if(Number.isFinite(data.salary))
this.salary=Math.max(0,data.salary);

if(Number.isFinite(data.level))
this.level=Math.max(1,data.level);

if(Number.isFinite(data.xp))
this.xp=Math.max(0,data.xp);

if(Number.isFinite(data.shifts))
this.shifts=Math.max(0,data.shifts);

if(Number.isFinite(data.experience))
this.experience=Math.max(
0,
data.experience
);

}catch(e){

console.log(
"V187 load error:",
e
);

}

},

open(title,content){

document.getElementById(
"panelTitle"
).textContent=title;

document.getElementById(
"panelContent"
).innerHTML=
content;

document.getElementById(
"panel"
).style.display=
"flex";

},

close(){

document.getElementById(
"panel"
).style.display=
"none";

},

notify(text){

const el=
document.getElementById(
"notification"
);

el.textContent=text;

el.style.display=
"block";

clearTimeout(this.timer);

this.timer=
setTimeout(
()=>{
el.style.display=
"none";
},
2400
);

}

};

V187.init();

console.log(
"WEBBOUND V187 CAREER SYSTEM READY"
);

</script>

</body>
</html>
