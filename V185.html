<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V185 — BANKING SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#304d59,#091116);
}

#sky{
 position:absolute;
 inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8);
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.4;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(920px,92vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#bankHud{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.8;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

input{
 width:100%;
 padding:9px;
 margin-top:7px;
 border-radius:7px;
 border:1px solid #ffffff22;
 background:#0b141b;
 color:#fff;
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(780px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.7;
}

.card button{
 width:100%;
 margin-top:8px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="sky"></div>

 <div class="road rh"></div>
 <div class="road rv"></div>

 <div class="line lineH"></div>
 <div class="line lineV"></div>

 <div class="building b1">🏠 RESIDENTIAL</div>
 <div class="building b2">🏫 SCHOOL</div>
 <div class="building b3">🏥 HOSPITAL</div>
 <div class="building b4">🏢 CORPORATE</div>
 <div class="building b5">🏭 WAREHOUSE</div>
 <div class="building b6">🏦 BANK</div>

 <div id="player"></div>

 <div id="hud">

  <div class="title">
   🏦 WEBBOUND V185 — BANKING & FINANCE
  </div>

  <div class="stats">

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">5000</span>
   </div>

   <div class="stat">
    🏦 BANK<br>
    ₹<span id="bankText">0</span>
   </div>

   <div class="stat">
    💳 DEBT<br>
    ₹<span id="loanText">0</span>
   </div>

   <div class="stat">
    📈 INTEREST<br>
    <span id="interestText">0</span>%
   </div>

   <div class="stat">
    🧾 TXNS<br>
    <span id="transactionText">0</span>
   </div>

  </div>

  <div id="bankHud">

   <b>🏦 ACCOUNT STATUS</b>

   <br>

   Account:
   <span id="accountText">ACTIVE</span>

   <br>

   Savings Balance:
   ₹<span id="savingsText">0</span>

   <br>

   Loan Remaining:
   ₹<span id="loanRemainingText">0</span>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V185.bank()">
   🏦 BANK
  </button>

  <button onclick="V185.depositMenu()">
   💰 DEPOSIT
  </button>

  <button onclick="V185.withdrawMenu()">
   💵 WITHDRAW
  </button>

  <button onclick="V185.loanMenu()">
   💳 LOANS
  </button>

  <button onclick="V185.history()">
   🧾 HISTORY
  </button>

  <button onclick="V185.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V185
   </h2>

   <div id="panelContent"></div>

   <button onclick="V185.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V185={

 saveKey:"WEBBOUND_V185",

 cash:5000,

 bankBalance:0,

 loan:0,

 interestRate:2,

 transactionHistory:[],

 accountActive:true,

 init(){

  this.load();

  this.update();

  this.notify(
   "🏦 V185 Banking System ready"
  );

 },

 /* =========================
    BANK
 ========================= */

 bank(){

  this.open(
   "🏦 CITY BANK",
   `

   <div class="card">

    <b>💳 Personal Account</b>

    <br><br>

    💰 Wallet:
    ₹${this.cash.toLocaleString()}

    <br>

    🏦 Savings:
    ₹${this.bankBalance.toLocaleString()}

    <br>

    💳 Loan:
    ₹${this.loan.toLocaleString()}

    <br>

    📈 Savings Interest:
    ${this.interestRate}%

   </div>

   <div class="card">

    <b>🏦 Available Services</b>

    <br>

    Deposit money into your savings account.

    <br>

    Withdraw money whenever needed.

    <br>

    Apply for a loan.

    <br>

    Make loan repayments.

    <br>

    View transaction history.

   </div>

   `
  );

 },

 /* =========================
    DEPOSIT
 ========================= */

 depositMenu(){

  this.open(
   "💰 DEPOSIT MONEY",
   `

   <div class="card">

    Wallet Balance:
    ₹${this.cash.toLocaleString()}

    <input
     id="depositAmount"
     type="number"
     min="1"
     placeholder="Enter amount"
    >

    <button
     onclick="V185.deposit()">
     💰 DEPOSIT
    </button>

   </div>

   `
  );

 },

 deposit(){

  const input=
   document.getElementById(
    "depositAmount"
   );

  const amount=
   Math.floor(
    Number(input.value)
   );

  if(
   !Number.isFinite(amount) ||
   amount<=0
  ){

   this.notify(
    "❌ Enter a valid amount."
   );

   return;

  }

  if(
   amount>this.cash
  ){

   this.notify(
    "❌ Not enough cash."
   );

   return;

  }

  this.cash-=amount;

  this.bankBalance+=amount;

  this.addTransaction(
   "Deposit",
   amount
  );

  this.update();

  this.save();

  this.close();

  this.notify(
   "🏦 Deposited ₹"+
   amount.toLocaleString()
  );

 },

 /* =========================
    WITHDRAW
 ========================= */

 withdrawMenu(){

  this.open(
   "💵 WITHDRAW MONEY",
   `

   <div class="card">

    Savings Balance:
    ₹${this.bankBalance.toLocaleString()}

    <input
     id="withdrawAmount"
     type="number"
     min="1"
     placeholder="Enter amount"
    >

    <button
     onclick="V185.withdraw()">
     💵 WITHDRAW
    </button>

   </div>

   `
  );

 },

 withdraw(){

  const input=
   document.getElementById(
    "withdrawAmount"
   );

  const amount=
   Math.floor(
    Number(input.value)
   );

  if(
   !Number.isFinite(amount) ||
   amount<=0
  ){

   this.notify(
    "❌ Enter a valid amount."
   );

   return;

  }

  if(
   amount>this.bankBalance
  ){

   this.notify(
    "❌ Insufficient bank balance."
   );

   return;

  }

  this.bankBalance-=amount;

  this.cash+=amount;

  this.addTransaction(
   "Withdrawal",
   amount
  );

  this.update();

  this.save();

  this.close();

  this.notify(
   "💵 Withdrew ₹"+
   amount.toLocaleString()
  );

 },

 /* =========================
    LOANS
 ========================= */

 loanMenu(){

  this.open(
   "💳 LOAN CENTER",
   `

   <div class="card">

    Current Debt:
    ₹${this.loan.toLocaleString()}

    <br>

    Loan Interest:
    5%

    <input
     id="loanAmount"
     type="number"
     min="500"
     max="20000"
     placeholder="Loan amount"
    >

    <button
     onclick="V185.takeLoan()">
     💳 TAKE LOAN
    </button>

    <button
     onclick="V185.repayMenu()">
     💵 REPAY LOAN
    </button>

   </div>

   `
  );

 },

 takeLoan(){

  const input=
   document.getElementById(
    "loanAmount"
   );

  const amount=
   Math.floor(
    Number(input.value)
   );

  if(
   !Number.isFinite(amount) ||
   amount<500
  ){

   this.notify(
    "❌ Minimum loan is ₹500."
   );

   return;

  }

  if(
   amount>20000
  ){

   this.notify(
    "❌ Maximum loan is ₹20,000."
   );

   return;

  }

  if(
   this.loan+amount>50000
  ){

   this.notify(
    "❌ Maximum total debt is ₹50,000."
   );

   return;

  }

  this.loan+=amount;

  this.cash+=amount;

  this.addTransaction(
   "Loan received",
   amount
  );

  this.update();

  this.save();

  this.close();

  this.notify(
   "💳 Loan received: ₹"+
   amount.toLocaleString()
  );

 },

 repayMenu(){

  this.open(
   "💵 LOAN REPAYMENT",
   `

   <div class="card">

    Outstanding Debt:
    ₹${this.loan.toLocaleString()}

    <input
     id="repayAmount"
     type="number"
     min="1"
     placeholder="Repayment amount"
    >

    <button
     onclick="V185.repay()">
     💵 REPAY
    </button>

   </div>

   `
  );

 },

 repay(){

  const input=
   document.getElementById(
    "repayAmount"
   );

  let amount=
   Math.floor(
    Number(input.value)
   );

  if(
   !Number.isFinite(amount) ||
   amount<=0
  ){

   this.notify(
    "❌ Enter a valid amount."
   );

   return;

  }

  amount=
   Math.min(
    amount,
    this.loan
   );

  if(
   amount>this.cash
  ){

   this.notify(
    "❌ Not enough cash."
   );

   return;

  }

  this.cash-=amount;

  this.loan-=amount;

  this.addTransaction(
   "Loan repayment",
   amount
  );

  this.update();

  this.save();

  this.close();

  this.notify(
   "💵 Repaid ₹"+
   amount.toLocaleString()
  );

 },

 /* =========================
    INTEREST
 ========================= */

 applyInterest(){

  if(
   this.bankBalance<=0
  )
   return;

  const interest=
   Math.floor(
    this.bankBalance*
    this.interestRate/
    100
   );

  this.bankBalance+=interest;

  this.addTransaction(
   "Savings interest",
   interest
  );

  if(
   this.loan>0
  ){

   const loanInterest=
    Math.floor(
     this.loan*5/100
    );

   this.loan+=loanInterest;

   this.addTransaction(
    "Loan interest",
    loanInterest
   );

  }

  this.update();

  this.save();

  this.notify(
   "📈 Interest applied: +₹"+
   interest.toLocaleString()
  );

 },

 /* =========================
    TRANSACTIONS
 ========================= */

 addTransaction(type,amount){

  this.transactionHistory.unshift({

   type:type,

   amount:amount,

   time:new Date()
    .toLocaleTimeString()

  });

  if(
   this.transactionHistory.length>
   30
  ){

   this.transactionHistory=
    this.transactionHistory.slice(
     0,
     30
    );

  }

 },

 history(){

  let html="";

  if(
   this.transactionHistory.length===0
  ){

   html=
    `<div class="card">
      No transactions yet.
     </div>`;

  }
  else{

   this.transactionHistory.forEach(
    tx=>{

     html+=`

     <div class="card">

      🧾 <b>${tx.type}</b>

      <br>

      Amount:
      ₹${Number(
       tx.amount
      ).toLocaleString()}

      <br>

      Time:
      ${tx.time}

     </div>

     `;

    }
   );

  }

  this.open(
   "🧾 TRANSACTION HISTORY",
   html
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash.toLocaleString();

  document.getElementById(
   "bankText"
  ).textContent=
   this.bankBalance.toLocaleString();

  document.getElementById(
   "loanText"
  ).textContent=
   this.loan.toLocaleString();

  document.getElementById(
   "interestText"
  ).textContent=
   this.interestRate;

  document.getElementById(
   "transactionText"
  ).textContent=
   this.transactionHistory.length;

  document.getElementById(
   "accountText"
  ).textContent=
   this.accountActive
   ?"ACTIVE"
   :"INACTIVE";

  document.getElementById(
   "savingsText"
  ).textContent=
   this.bankBalance.toLocaleString();

  document.getElementById(
   "loanRemainingText"
  ).textContent=
   this.loan.toLocaleString();

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    bankBalance:
     this.bankBalance,

    loan:this.loan,

    interestRate:
     this.interestRate,

    transactionHistory:
     this.transactionHistory,

    accountActive:
     this.accountActive

   })
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   if(
    Number.isFinite(
     data.cash
    )
   )
    this.cash=
     Math.max(
      0,
      data.cash
     );

   if(
    Number.isFinite(
     data.bankBalance
    )
   )
    this.bankBalance=
     Math.max(
      0,
      data.bankBalance
     );

   if(
    Number.isFinite(
     data.loan
    )
   )
    this.loan=
     Math.max(
      0,
      data.loan
     );

   if(
    Array.isArray(
     data.transactionHistory
    )
   )
    this.transactionHistory=
     data.transactionHistory.slice(
      0,
      30
     );

   if(
    typeof data.accountActive===
    "boolean"
   )
    this.accountActive=
     data.accountActive;

  }
  catch(error){

   console.log(
    "V185 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2400
   );

 }

};

V185.init();

console.log(
 "WEBBOUND V185 BANKING SYSTEM READY"
);

</script>

</body>
</html>
