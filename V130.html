<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V130</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  overflow:hidden;
  background:#10141b;
  font-family:Arial,sans-serif;
}

#v130World{
  position:fixed;
  inset:0;
  overflow:hidden;
}

#v130NPCs{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.v130NPC{
  position:absolute;
  width:16px;
  height:24px;
  border-radius:8px 8px 4px 4px;
  box-shadow:0 2px 7px #0009;
  transform-origin:center bottom;
}

.v130Head{
  position:absolute;
  width:10px;
  height:10px;
  top:-8px;
  left:3px;
  border-radius:50%;
  background:#c49a78;
}

.v130Name{
  position:absolute;
  bottom:27px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#fff;
  font-size:7px;
  text-shadow:0 1px 3px #000;
}

.v130Money{
  position:absolute;
  bottom:36px;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  color:#fff;
  font-size:6px;
  opacity:.8;
}

.v130Bubble{
  position:absolute;
  bottom:41px;
  left:50%;
  transform:translateX(-50%);
  padding:4px 6px;
  border-radius:6px;
  background:#05070ef2;
  color:#fff;
  font-size:8px;
  white-space:nowrap;
  display:none;
}

.v130NPC.talking .v130Bubble,
.v130NPC.trading .v130Bubble{
  display:block;
}

#v130HUD{
  position:fixed;
  left:12px;
  bottom:12px;
  width:min(350px,82vw);
  padding:14px;
  border:1px solid #ffffff25;
  border-radius:14px;
  background:#05070eee;
  color:#fff;
  z-index:5000;
}

#v130Title{
  font-size:14px;
  font-weight:bold;
}

#v130Stats{
  margin-top:9px;
  font-size:10px;
  line-height:1.7;
  opacity:.9;
}

#v130Buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  margin-top:10px;
}

#v130Buttons button{
  flex:1;
  min-width:80px;
  padding:8px;
  border:1px solid #ffffff25;
  border-radius:8px;
  background:#151c27;
  color:white;
  font-size:9px;
}

#v130Clock{
  position:fixed;
  right:12px;
  top:12px;
  padding:9px 12px;
  border:1px solid #ffffff25;
  border-radius:10px;
  background:#05070eee;
  color:white;
  z-index:5000;
  font-size:11px;
}

#v130Player{
  position:fixed;
  left:50%;
  top:50%;
  width:20px;
  height:28px;
  transform:translate(-50%,-50%);
  background:#2878d0;
  border-radius:9px 9px 4px 4px;
  box-shadow:0 2px 8px #000;
  z-index:3000;
}

#v130PlayerHead{
  position:absolute;
  width:12px;
  height:12px;
  left:4px;
  top:-9px;
  border-radius:50%;
  background:#c49a78;
}

#v130Interaction{
  position:fixed;
  left:50%;
  bottom:18%;
  transform:translateX(-50%);
  width:min(330px,82vw);
  padding:13px;
  border-radius:13px;
  background:#05070ef5;
  border:1px solid #ffffff30;
  color:#fff;
  text-align:center;
  z-index:6000;
  display:none;
}

#v130Interaction button{
  margin:5px 3px 0;
  padding:8px 12px;
  border:0;
  border-radius:8px;
  background:#1d2735;
  color:white;
  font-size:10px;
}

#v130Message{
  position:fixed;
  top:21%;
  left:50%;
  transform:translateX(-50%);
  padding:10px 15px;
  max-width:88%;
  border-radius:10px;
  background:#05070ef5;
  border:1px solid #ffffff30;
  color:#fff;
  z-index:7000;
  font-size:11px;
  font-weight:bold;
  display:none;
  text-align:center;
}

</style>
</head>

<body>

<div id="v130World">

  <div id="v130NPCs"></div>

  <div id="v130Player">
    <div id="v130PlayerHead"></div>
  </div>

</div>

<div id="v130Clock">🕐 08:00</div>

<div id="v130HUD">

  <div id="v130Title">
    💰 WEBBOUND V130 — PLAYER ECONOMY
  </div>

  <div id="v130Stats">
    Player Money: ₹1000<br>
    NPCs: 0<br>
    Transactions: 0<br>
    City Money: ₹0<br>
    Nearby NPC: None
  </div>

  <div id="v130Buttons">

    <button onclick="V130.spawnNPC()">
      🚶 SPAWN
    </button>

    <button onclick="V130.spawnNPCs(5)">
      👥 +5 NPC
    </button>

    <button onclick="V130.advanceTime(1)">
      ⏩ +1 HOUR
    </button>

    <button onclick="V130.nearbyAction()">
      🤝 INTERACT
    </button>

    <button onclick="V130.toggle()">
      ⏯️ PAUSE
    </button>

    <button onclick="V130.clearNPCs()">
      🗑️ CLEAR
    </button>

  </div>

</div>

<div id="v130Interaction">

  <div id="v130InteractionText">
    NPC interaction
  </div>

  <div>
    <button onclick="V130.buyFromNPC()">
      🛒 BUY ₹100
    </button>

    <button onclick="V130.giveMoney()">
      💵 GIVE ₹50
    </button>

    <button onclick="V130.closeInteraction()">
      ❌ CLOSE
    </button>
  </div>

</div>

<div id="v130Message"></div>


<script>

/* =========================================================
   WEBBOUND V130
   PLAYER + NPC ECONOMY
   ========================================================= */

const V130 = {

  version:"V130",

  saveKey:
    "WEBBOUND_V130_PLAYER_ECONOMY",

  npcs:[],

  player:{
    money:1000,
    x:window.innerWidth/2,
    y:window.innerHeight/2
  },

  running:true,

  gameHour:8,

  timeSpeed:1,

  nextId:1,

  totalTransactions:0,

  cityMoney:0,

  selectedNPC:null,

  timer:null,

  saveTimer:null,

  messageTimer:null,

  keys:{},

  maxNPCs:35,

  lastHour:-1,


  /* =======================================================
     NPC TYPES
     ======================================================= */

  types:[

    {
      name:"Student",
      color:"#3f638c",
      speed:.55,
      money:500,
      salary:0,
      routine:[
        [6,8,"home"],
        [8,14,"school"],
        [14,16,"park"],
        [16,19,"home"],
        [19,22,"park"],
        [22,24,"home"],
        [0,6,"home"]
      ]
    },

    {
      name:"Worker",
      color:"#6b5742",
      speed:.48,
      money:1800,
      salary:250,
      routine:[
        [6,9,"home"],
        [9,17,"work"],
        [17,19,"shop"],
        [19,22,"home"],
        [22,24,"home"],
        [0,6,"home"]
      ]
    },

    {
      name:"Shopkeeper",
      color:"#5b426b",
      speed:.38,
      money:3500,
      salary:400,
      routine:[
        [6,9,"home"],
        [9,20,"shop"],
        [20,22,"home"],
        [22,24,"home"],
        [0,6,"home"]
      ]
    },

    {
      name:"Jogger",
      color:"#426b55",
      speed:.72,
      money:900,
      salary:0,
      routine:[
        [6,9,"park"],
        [9,17,"home"],
        [17,21,"park"],
        [21,24,"home"],
        [0,6,"home"]
      ]
    },

    {
      name:"Tourist",
      color:"#7b6540",
      speed:.43,
      money:2500,
      salary:0,
      routine:[
        [6,10,"hotel"],
        [10,18,"park"],
        [18,21,"shop"],
        [21,24,"hotel"],
        [0,6,"hotel"]
      ]
    }

  ],


  /* =======================================================
     INIT
     ======================================================= */

  init(){

    this.load();

    this.setupKeyboard();

    this.renderAll();

    this.updateHUD();

    this.start();

    if(
      this.npcs.length===0
    ){

      this.spawnNPCs(10);

    }

    this.message(
      "V130 player economy loaded"
    );

  },


  /* =======================================================
     START
     ======================================================= */

  start(){

    clearInterval(
      this.timer
    );

    this.timer=
      setInterval(
        ()=>{
          this.update();
        },
        50
      );


    clearInterval(
      this.saveTimer
    );

    this.saveTimer=
      setInterval(
        ()=>{
          this.save();
        },
        30000
      );

  },


  /* =======================================================
     RANDOM NAME
     ======================================================= */

  randomName(){

    const names=[
      "Alex","Sam","Ryan","Maya",
      "Arun","Riya","Dev","Asha",
      "Noah","Leo","Avi","Zara",
      "Kiran","Nikhil","Anu"
    ];

    return names[
      Math.floor(
        Math.random()*names.length
      )
    ];

  },


  /* =======================================================
     RANDOM TYPE
     ======================================================= */

  randomType(){

    return this.types[
      Math.floor(
        Math.random()*this.types.length
      )
    ];

  },


  /* =======================================================
     SPAWN NPC
     ======================================================= */

  spawnNPC(silent=false){

    if(
      this.npcs.length>=this.maxNPCs
    ){

      if(!silent){
        this.message(
          "⚠️ NPC limit reached"
        );
      }

      return null;

    }


    const type=
      this.randomType();


    const npc={

      id:this.nextId++,

      name:this.randomName(),

      type:type.name,

      color:type.color,

      speed:type.speed,

      money:type.money,

      salary:type.salary,

      routine:type.routine,

      x:
        40+
        Math.random()*
        Math.max(
          1,
          window.innerWidth-80
        ),

      y:
        180+
        Math.random()*
        Math.max(
          1,
          window.innerHeight-250
        ),

      targetX:0,

      targetY:0,

      direction:1,

      destination:"home",

      state:"walking",

      idleUntil:0,

      element:null

    };


    this.cityMoney+=
      npc.money;


    this.setDestination(
      npc
    );


    this.npcs.push(
      npc
    );


    this.createNPCElement(
      npc
    );


    if(!silent){

      this.message(
        "🚶 "+
        npc.name+
        " joined the city"
      );

    }


    this.updateHUD();

    this.save();

    return npc;

  },


  /* =======================================================
     SPAWN MULTIPLE
     ======================================================= */

  spawnNPCs(count){

    for(
      let i=0;
      i<count;
      i++
    ){

      this.spawnNPC(true);

    }

    this.updateHUD();

    this.save();

  },


  /* =======================================================
     ROUTINE
     ======================================================= */

  getRoutine(npc){

    for(
      const item of npc.routine
    ){

      if(
        item[0]<=this.gameHour &&
        this.gameHour<item[1]
      ){

        return item[2];

      }

    }

    return "home";

  },


  /* =======================================================
     DESTINATION
     ======================================================= */

  getPoint(place){

    const w=
      window.innerWidth;

    const h=
      window.innerHeight;


    const points={

      home:{
        x:w*.12,
        y:h*.55
      },

      school:{
        x:w*.35,
        y:h*.35
      },

      work:{
        x:w*.62,
        y:h*.32
      },

      shop:{
        x:w*.78,
        y:h*.55
      },

      park:{
        x:w*.45,
        y:h*.72
      },

      hotel:{
        x:w*.82,
        y:h*.25
      }

    };


    const p=
      points[place]||
      points.home;


    return{

      x:p.x+
        Math.random()*100-
        50,

      y:p.y+
        Math.random()*70-
        35

    };

  },


  /* =======================================================
     SET DESTINATION
     ======================================================= */

  setDestination(npc){

    npc.destination=
      this.getRoutine(npc);


    const p=
      this.getPoint(
        npc.destination
      );


    npc.targetX=p.x;

    npc.targetY=p.y;

    npc.state="walking";

  },


  /* =======================================================
     CREATE NPC
     ======================================================= */

  createNPCElement(npc){

    const layer=
      document.getElementById(
        "v130NPCs"
      );


    if(!layer)return;


    const el=
      document.createElement("div");


    el.className=
      "v130NPC";


    el.style.background=
      npc.color;


    const head=
      document.createElement("div");

    head.className=
      "v130Head";


    const name=
      document.createElement("div");

    name.className=
      "v130Name";

    name.textContent=
      npc.name;


    const money=
      document.createElement("div");

    money.className=
      "v130Money";


    const bubble=
      document.createElement("div");

    bubble.className=
      "v130Bubble";

    bubble.textContent=
      "Hello!";


    el.appendChild(head);

    el.appendChild(name);

    el.appendChild(money);

    el.appendChild(bubble);


    npc.element=
      el;


    layer.appendChild(el);

    this.renderNPC(npc);

  },


  /* =======================================================
     RENDER NPC
     ======================================================= */

  renderNPC(npc){

    if(!npc.element)return;


    npc.element.style.left=
      npc.x+"px";


    npc.element.style.top=
      npc.y+"px";


    npc.element.style.transform=
      npc.direction<0
      ? "scaleX(-1)"
      : "scaleX(1)";


    npc.element.classList.toggle(
      "trading",
      npc.state==="trading"
    );


    npc.element.classList.toggle(
      "talking",
      npc.state==="talking"
    );


    const money=
      npc.element.querySelector(
        ".v130Money"
      );


    if(money){

      money.textContent=
        "₹"+
        Math.floor(npc.money);

    }

  },


  /* =======================================================
     UPDATE
     ======================================================= */

  update(){

    if(!this.running)return;


    this.updatePlayer();


    this.advanceClock();


    const now=
      Date.now();


    this.npcs.forEach(
      npc=>{
        this.updateNPC(
          npc,
          now
        );
      }
    );


    this.updateNearbyNPC();

    this.updateHUD();

  },


  /* =======================================================
     PLAYER MOVEMENT
     ======================================================= */

  updatePlayer(){

    const speed=3;


    if(this.keys["ArrowUp"]||
       this.keys["KeyW"]){

      this.player.y-=speed;

    }


    if(this.keys["ArrowDown"]||
       this.keys["KeyS"]){

      this.player.y+=speed;

    }


    if(this.keys["ArrowLeft"]||
       this.keys["KeyA"]){

      this.player.x-=speed;

    }


    if(this.keys["ArrowRight"]||
       this.keys["KeyD"]){

      this.player.x+=speed;

    }


    this.player.x=
      Math.max(
        10,
        Math.min(
          window.innerWidth-30,
          this.player.x
        )
      );


    this.player.y=
      Math.max(
        150,
        Math.min(
          window.innerHeight-50,
          this.player.y
        )
      );


    const playerEl=
      document.getElementById(
        "v130Player"
      );


    if(playerEl){

      playerEl.style.left=
        this.player.x+"px";

      playerEl.style.top=
        this.player.y+"px";

    }

  },


  /* =======================================================
     UPDATE NPC
     ======================================================= */

  updateNPC(npc,now){

    if(
      npc.state==="trading"||
      npc.state==="talking"
    ){

      if(
        now>=npc.idleUntil
      ){

        npc.state="walking";

        this.setDestination(npc);

      }

      this.renderNPC(npc);

      return;

    }


    if(
      npc.state==="idle"
    ){

      if(
        now>=npc.idleUntil
      ){

        this.setDestination(npc);

      }

      this.renderNPC(npc);

      return;

    }


    const desired=
      this.getRoutine(npc);


    if(
      desired!==npc.destination
    ){

      this.setDestination(npc);

    }


    const dx=
      npc.targetX-npc.x;


    const dy=
      npc.targetY-npc.y;


    const distance=
      Math.sqrt(
        dx*dx+dy*dy
      );


    if(distance<10){

      npc.state="idle";

      npc.idleUntil=
        now+
        1500+
        Math.random()*3500;

      this.renderNPC(npc);

      return;

    }


    npc.direction=
      dx>=0?1:-1;


    npc.x+=
      (dx/distance)*
      npc.speed;


    npc.y+=
      (dy/distance)*
      npc.speed;


    this.keepInside(npc);

    this.renderNPC(npc);

  },


  /* =======================================================
     PLAYER → NPC DISTANCE
     ======================================================= */

  getNearestNPC(){

    let nearest=null;

    let best=75;


    for(
      const npc of this.npcs
    ){

      const dx=
        npc.x-this.player.x;

      const dy=
        npc.y-this.player.y;


      const distance=
        Math.sqrt(
          dx*dx+dy*dy
        );


      if(
        distance<best
      ){

        best=distance;

        nearest=npc;

      }

    }


    return nearest;

  },


  /* =======================================================
     NEARBY ACTION
     ======================================================= */

  nearbyAction(){

    const npc=
      this.getNearestNPC();


    if(!npc){

      this.message(
        "🚶 No NPC nearby"
      );

      return;

    }


    this.selectedNPC=
      npc;


    const box=
      document.getElementById(
        "v130Interaction"
      );


    const text=
      document.getElementById(
        "v130InteractionText"
      );


    text.innerHTML=
      "👤 "+
      npc.name+
      " ("+
      npc.type+
      ")<br>"+
      "💰 NPC Money: ₹"+
      Math.floor(npc.money);


    box.style.display=
      "block";


    npc.state=
      "talking";


    npc.idleUntil=
      Date.now()+5000;


    this.renderNPC(npc);

  },


  /* =======================================================
     BUY FROM NPC
     ======================================================= */

  buyFromNPC(){

    const npc=
      this.selectedNPC;


    if(!npc){

      return;

    }


    const price=100;


    if(
      this.player.money<
      price
    ){

      this.message(
        "❌ Not enough money"
      );

      return;

    }


    this.player.money-=
      price;


    npc.money+=
      price;


    this.cityMoney+=
      price;


    this.totalTransactions++;


    npc.state=
      "trading";


    npc.idleUntil=
      Date.now()+1500;


    this.message(
      "🛒 You bought an item from "+
      npc.name+
      " for ₹100"
    );


    this.closeInteraction();

    this.renderNPC(npc);

    this.save();

  },


  /* =======================================================
     GIVE MONEY
     ======================================================= */

  giveMoney(){

    const npc=
      this.selectedNPC;


    if(!npc){

      return;

    }


    const amount=50;


    if(
      this.player.money<
      amount
    ){

      this.message(
        "❌ Not enough money"
      );

      return;

    }


    this.player.money-=
      amount;


    npc.money+=
      amount;


    this.totalTransactions++;


    npc.state=
      "talking";


    npc.idleUntil=
      Date.now()+1500;


    this.message(
      "💵 You gave ₹50 to "+
      npc.name
    );


    this.closeInteraction();

    this.renderNPC(npc);

    this.save();

  },


  /* =======================================================
     CLOSE
     ======================================================= */

  closeInteraction(){

    const box=
      document.getElementById(
        "v130Interaction"
      );


    if(box){

      box.style.display=
        "none";

    }


    if(
      this.selectedNPC &&
      this.selectedNPC.state!==
      "trading"
    ){

      this.selectedNPC.state=
        "idle";

      this.selectedNPC.idleUntil=
        Date.now()+1000;

    }


    this.selectedNPC=null;

  },


  /* =======================================================
     NEARBY DISPLAY
     ======================================================= */

  updateNearbyNPC(){

    const npc=
      this.getNearestNPC();


    this.nearbyNPC=
      npc;

  },


  /* =======================================================
     CLOCK
     ======================================================= */

  advanceClock(){

    const oldHour=
      Math.floor(
        this.gameHour
      );


    this.gameHour+=
      .025*
      this.timeSpeed;


    if(
      this.gameHour>=24
    ){

      this.gameHour-=24;

    }


    const newHour=
