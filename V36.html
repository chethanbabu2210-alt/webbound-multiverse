<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WEBBOUND V36 — Dynamic World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;z-index:20;top:10px;left:10px;width:265px;
 padding:13px;color:#fff;background:rgba(0,0,0,.76);
 border:1px solid rgba(255,255,255,.16);border-radius:15px;
 backdrop-filter:blur(8px);font-size:11px
}
.title{font-size:18px;font-weight:800}
.sub{color:#6cddff;margin-top:3px}
.row{margin-top:7px;line-height:1.55}
#weather{color:#ffd76a}
#time{color:#9fe8ff}

#minimap{
 position:fixed;z-index:20;right:10px;top:10px;
 width:120px;height:120px;border-radius:50%;
 background:rgba(0,15,25,.72);
 border:2px solid rgba(100,220,255,.55)
}
#pDot{
 position:absolute;left:50%;top:50%;
 width:8px;height:8px;background:white;border-radius:50%;
 transform:translate(-50%,-50%)
}

#message{
 position:fixed;z-index:50;left:50%;top:23%;
 transform:translateX(-50%);width:92%;
 text-align:center;color:white;font-size:25px;font-weight:bold;
 text-shadow:0 5px 25px #000;opacity:0;transition:.25s
}

#touch{
 position:fixed;z-index:40;left:0;right:0;bottom:8px;
 display:flex;justify-content:space-between;padding:9px;
 pointer-events:none
}
.pad,.actions{display:grid;gap:6px;pointer-events:auto}
.pad{grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px}
.actions{grid-template-columns:52px 52px;grid-template-rows:52px 52px 52px}
button{
 border:1px solid rgba(255,255,255,.25);
 background:rgba(0,0,0,.7);color:white;
 border-radius:13px;font-size:9px;font-weight:bold;
 touch-action:none
}
button:active{transform:scale(.94);background:rgba(255,255,255,.25)}
.empty{visibility:hidden}

@media(max-width:600px){
 #hud{width:225px;font-size:10px}
 .title{font-size:16px}
}
</style>
</head>

<body>

<div id="hud">
 <div class="title">🕷️ WEBBOUND V36</div>
 <div class="sub">DYNAMIC WORLD SYSTEM</div>

 <div class="row">
  🕐 <b id="time">DAY 06:00</b><br>
  🌦️ Weather: <b id="weather">Clear</b><br>
  🌡️ Temperature: <b id="temp">24°C</b>
 </div>

 <div class="row">
  ❤️ Health: <b id="health">100</b><br>
  🕸️ Web Energy: <b id="energy">100</b><br>
  ⭐ XP: <b id="xp">0</b><br>
  🏆 Score: <b id="score">0</b>
 </div>
</div>

<div id="minimap">
 <div id="pDot"></div>
</div>

<div id="message"></div>

<div id="touch">
 <div class="pad">
  <button class="empty"></button>
  <button id="up">▲</button>
  <button class="empty"></button>
  <button id="left">◀</button>
  <button id="down">▼</button>
  <button id="right">▶</button>
 </div>

 <div class="actions">
  <button id="jump">JUMP</button>
  <button id="swing">WEB</button>
  <button id="punch">PUNCH</button>
  <button id="shot">WEB SHOT</button>
  <button id="weatherBtn">WEATHER</button>
  <button id="burst">BURST</button>
 </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =====================================================
   ENGINE
===================================================== */

const scene=new THREE.Scene();

scene.background=
 new THREE.Color(0x6b8caf);

scene.fog=
 new THREE.FogExp2(
  0x6b8caf,
  .00115
 );

const camera=
 new THREE.PerspectiveCamera(
  68,
  innerWidth/innerHeight,
  .1,
  3500
 );

const renderer=
 new THREE.WebGLRenderer({
  antialias:true,
  powerPreference:"high-performance"
 });

renderer.setSize(
 innerWidth,
 innerHeight
);

renderer.setPixelRatio(
 Math.min(
  devicePixelRatio,
  1.3
 )
);

renderer.outputColorSpace=
 THREE.SRGBColorSpace;

renderer.shadowMap.enabled=true;

document.body.appendChild(
 renderer.domElement
);


/* =====================================================
   LIGHTING
===================================================== */

const sun=
 new THREE.DirectionalLight(
  0xffffff,
  1.8
 );

sun.position.set(
 -500,800,300
);

sun.castShadow=true;

scene.add(sun);

const ambient=
 new THREE.HemisphereLight(
  0x8ca8cf,
  0x05070b,
  1.2
 );

scene.add(ambient);


/* =====================================================
   DAY / NIGHT
===================================================== */

let worldTime=6;
let timeSpeed=.035;

function updateDayNight(dt){

 worldTime+=
  dt*timeSpeed;

 if(worldTime>=24)
  worldTime-=24;

 const sunAngle=
  (worldTime-6)/
  12*Math.PI;

 const daylight=
  Math.max(
   0,
   Math.sin(sunAngle)
  );

 const night=
  1-daylight;

 sun.position.set(
  Math.cos(sunAngle)*600,
  Math.max(
   50,
   daylight*800
  ),
  Math.sin(sunAngle)*500
 );

 sun.intensity=
  .25+
  daylight*1.8;

 ambient.intensity=
  .35+
  daylight*.9;

 const r=
  Math.floor(
   5+daylight*80
  );

 const g=
  Math.floor(
   10+daylight*105
  );

 const b=
  Math.floor(
   20+daylight*130
  );

 scene.background.setRGB(
  r/255,
  g/255,
  b/255
 );

 scene.fog.color.copy(
  scene.background
 );

 document.getElementById(
  "time"
 ).textContent=
  formatTime(worldTime);
}


function formatTime(t){

 const h=
  Math.floor(t);

 const m=
  Math.floor(
   (t-h)*60
  );

 return (
  "DAY "+
  String(h).padStart(2,"0")+
  ":"+
  String(m).padStart(2,"0")
 );
}


/* =====================================================
   CITY
===================================================== */

const buildings=[];

const buildingMaterials=[
 new THREE.MeshStandardMaterial({
  color:0x17202a
 }),
 new THREE.MeshStandardMaterial({
  color:0x222d38
 }),
 new THREE.MeshStandardMaterial({
  color:0x111a23
 })
];

for(
 let x=-850;
 x<=850;
 x+=100
){

 for(
  let z=-850;
  z<=850;
  z+=100
 ){

  if(
   Math.abs(x)<100 &&
   Math.abs(z)<100
  )
   continue;

  const w=
   55+Math.random()*20;

  const d=
   55+Math.random()*20;

  const h=
   70+Math.random()*250;

  const building=
   new THREE.Mesh(
    new THREE.BoxGeometry(
     w,h,d
    ),
    buildingMaterials[
     Math.floor(
      Math.random()*
      buildingMaterials.length
     )
    ]
   );

  building.position.set(
   x,
   h/2,
   z
  );

  building.castShadow=true;

  scene.add(building);

  buildings.push(building);
 }
}


const ground=
 new THREE.Mesh(
  new THREE.PlaneGeometry(
   3000,3000
  ),
  new THREE.MeshStandardMaterial({
   color:0x080b10
  })
 );

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   STREET LIGHTS
===================================================== */

const lamps=[];

function createLamp(x,z){

 const pole=
  new THREE.Mesh(
   new THREE.CylinderGeometry(
    .18,.25,8,6
   ),
   new THREE.MeshStandardMaterial({
    color:0x252525
   })
  );

 pole.position.set(
  x,4,z
 );

 scene.add(pole);

 const bulb=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .45,8,8
   ),
   new THREE.MeshBasicMaterial({
    color:0xffd36a
   })
  );

 bulb.position.set(
  x,8,z
 );

 scene.add(bulb);

 const light=
  new THREE.PointLight(
   0xffcc66,
   0,
   35
  );

 light.position.set(
   x,8,z
  );

 scene.add(light);

 lamps.push({
  light,
  bulb
 });
}

for(
 let x=-800;
 x<=800;
 x+=100
){

 for(
  let z=-800;
  z<=800;
  z+=100
 ){

  createLamp(
   x+15,
   z+15
  );
 }
}


/* =====================================================
   PLAYER
===================================================== */

const player=
 new THREE.Group();

player.position.set(
 0,1.1,0
);

scene.add(player);

const suit=
 new THREE.MeshStandardMaterial({
  color:0xa8192d,
  roughness:.4
 });

const body=
 new THREE.Mesh(
  new THREE.CapsuleGeometry(
   .65,1.55,8,14
  ),
  suit
 );

body.position.y=1.45;

player.add(body);

const head=
 new THREE.Mesh(
  new THREE.SphereGeometry(
   .57,20,16
  ),
  suit
 );

head.position.y=2.75;

player.add(head);

const eyeMat=
 new THREE.MeshBasicMaterial({
  color:0xffffff
 });

for(
 const x of [-.2,.2]
 ){

 const eye=
  new THREE.Mesh(
   new THREE.SphereGeometry(
    .18,12,10
   ),
   eyeMat
  );

 eye.position.set(
  x,2.78,-.54
 );

 eye.scale.z=.18;

 player.add(eye);
}


/* =====================================================
   PLAYER STATE
===================================================== */

const velocity=
 new THREE.Vector3();

const input=
 new THREE.Vector3();

const keys={};

let grounded=true;
let doubleJump=true;
let swinging=false;
let anchor=null;
let webLine=null;

let health=100;
let energy=100;
let xp=0;
let score=0;


/* =====================================================
   WEATHER
===================================================== */

const weatherTypes=[
 "Clear",
 "Cloudy",
 "Rain",
 "Storm",
 "Fog"
];

let weather="Clear";
let rain=null;
let rainCount=700;


function createRain(){

 if(rain)
  return;

 const positions=
  new Float32Array(
   rainCount*3
  );

 for(
  let i=0;
  i<rainCount;
  i++
 ){

  positions[i*3]=
   player.position.x+
   (Math.random()-.5)*700;

  positions[i*3+1]=
   Math.random()*300;

  positions[i*3+2]=
   player.position.z+
   (Math.random()-.5)*700;
 }

 const geometry=
  new THREE.BufferGeometry();

 geometry.setAttribute(
  "position",
  new THREE.BufferAttribute(
   positions,3
  )
 );

 rain=
  new THREE.Points(
   geometry,
   new THREE.PointsMaterial({
    color:0x9ecfff,
    size:.7,
    transparent:true,
    opacity:.7
   })
  );

 scene.add(rain);
}


function removeRain(){

 if(!rain)
  return;

 scene.remove(rain);

 rain.geometry.dispose();
 rain.material.dispose();

 rain=null;
}


function setWeather(type){

 weather=type;

 document.getElementById(
  "weather"
 ).textContent=type;

 if(
  type==="Rain"||
  type==="Storm"
 ){

  createRain();

 }else{

  removeRain();
 }

 if(type==="Fog"){

  scene.fog.density=.004;

 }else{

  scene.fog.density=.00115;
 }

 if(type==="Storm"){

  scene.fog.density=.0018;

  showMessage(
   "⛈️ STORM APPROACHING"
  );

 }else{

  showMessage(
   "🌦️ WEATHER: "+
   type
  );
 }
}


function cycleWeather(){

 const i=
  weatherTypes.indexOf(
   weather
  );

 setWeather(
  weatherTypes[
   (i+1)%
   weatherTypes.length
  ]
 );


}


/* =====================================================
   RAIN UPDATE
===================================================== */

function updateRain(dt){

 if(!rain)
  return;

 const positions=
  rain.geometry
   .attributes
   .position.array;

 for(
  let i=0;
  i<rainCount;
  i++
 ){

  positions[i*3+1]-=
   (weather==="Storm"?55:35)*dt;

  if(
   positions[i*3+1]<0
  ){

   positions[i*3]=
    player.position.x+
    (Math.random()-.5)*700;

   positions[i*3+1]=
    250+
    Math.random()*80;

   positions[i*3+2]=
    player.position.z+
    (Math.random()-.5)*700;
  }
 }

 rain.geometry
  .attributes
  .position
  .needsUpdate=true;
}


/* =====================================================
   WEATHER TEMPERATURE
===================================================== */

function updateTemperature(){

 let base=
  24+
  Math.sin(
   (worldTime-14)/24*
   Math.PI*2
  )*6;

 if(weather==="Rain")
  base-=2;

 if(weather==="Storm")
  base-=4;

 if(weather==="Fog")
  base-=1;

 document.getElementById(
  "temp"
 ).textContent=
  Math.round(base)+
  "°C";
}


/* =====================================================
   STREET LIGHTS
===================================================== */

function updateLamps(){

 const night=
  worldTime<6||
  worldTime>=18;

 for(
  const lamp of lamps
 ){

  lamp.light.intensity=
   night?1.8:0;

  lamp.bulb.material.color.set(
   night?
   0xffd36a:
   0x555555
  );
 }
}


/* =====================================================
   MOVEMENT
===================================================== */

function jump(){

 if(grounded){

  velocity.y=15;
  grounded=false;
  doubleJump=true;
  return;
 }

 if(doubleJump){

  velocity.y=13;
  doubleJump=false;
 }
}


function updateMovement(dt){

 input.set(0,0,0);

 if(keys.KeyW)
  input.z-=1;

 if(keys.KeyS)
  input.z+=1;

 if(keys.KeyA)
  input.x-=1;

 if(keys.KeyD)
  input.x+=1;

 if(input.length()>0)
  input.normalize();

 const speed=
  keys.ShiftLeft
  ?14
  :9;

 velocity.x+=
  input.x*
  speed*
  dt*5;

 velocity.z+=
  input.z*
  speed*
  dt*5;

 velocity.x*=.91;
 velocity.z*=.91;

 if(
  !grounded &&
  !swinging
 )
  velocity.y-=30*dt;

 updateSwing(dt);

 player.position.addScaledVector(
  velocity,
  dt
 );

 if(
  player.position.y<=1.1
 ){

  player.position.y=1.1;
  velocity.y=0;
  grounded=true;
  doubleJump=true;

 }else{

  grounded=false;
 }
}


/* =====================================================
   WEB SWING
===================================================== */

function findAnchor(){

 let best=null;
 let closest=450;

 for(
  const building of buildings
 ){

  const h=
   building.geometry
    .parameters
    .height;

  const point=
   new THREE.Vector3(
    building.position.x,
    building.position.y+h/2,
    building.position.z
   );

  const d=
   point.distanceTo(
    player.position
   );

  if(
   d<closest &&
   point.y>
   player.position.y+8
  ){

   closest=d;
   best=point;
  }
 }

 return best;
}


function toggleSwing(){

 if(swinging){

  swinging=false;

  if(webLine){

   scene.remove(webLine);
   webLine=null;
  }

  velocity.multiplyScalar(1.4);

  return;
 }

 const point=findAnchor();

 if(!point)
  return;

 anchor=point;
 swinging=true;

 webLine=
  new THREE.Line(
   new THREE.BufferGeometry()
    .setFromPoints([
     player.position.clone(),
     anchor.clone()
    ]),
   new THREE.LineBasicMaterial({
    color:0xffffff
   })
  );

 scene.add(webLine);
}


function updateSwing(dt){

 if(!swinging)
  return;

 const pull=
  new THREE.Vector3()
   .subVectors(
    anchor,
    player.position
   );

 const d=pull.length();

 pull.normalize();

 if(d>10){

  velocity.addScaledVector(
   pull,
   (d-10)*
   dt*16
  );
 }

 velocity.y-=7*dt;

 if(webLine){

  const p=
   webLine.geometry
    .attributes
    .position.array;

  p[0]=player.position.x;
  p[1]=player.position.y+1;
  p[2]=player.position.z;

  p[3]=anchor.x;
  p[4]=anchor.y;
  p[5]=anchor.z;

  webLine.geometry
   .attributes
   .position
   .needsUpdate=true;
 }
}


/* =====================================================
   SIMPLE COMBAT
===================================================== */

const enemies=[];

function createEnemy(){

 const enemy=
  new THREE.Mesh(
   new THREE.CapsuleGeometry(
    .55,1,6,10
   ),
   new THREE.MeshStandardMaterial({
    color:0x343941
   })
  );

 enemy.position.set(
  player.position.x+
  (Math.random()-.5)*300,
  1,
  player.position.z+
  (Math.random()-.5)*300
 );

 enemy.userData={
  health:100,
  speed:4
 };

 scene.add(enemy);
 enemies.push(enemy);
}

for(
 let i=0;
 i<7;
 i++
)
 createEnemy();


function nearestEnemy(range){

 let target=null;
 let closest=range;

 for(
  const e of enemies
 ){

  const d=
   e.position.distanceTo(
    player.position
   );

  if(d<closest){

   closest=d;
   target=e;
  }
 }

 return target;
}


function punch(){

 const e=
  nearestEnemy(7);

 if(!e)
  return;

 e.userData.health-=50;

 score+=100;
 xp+=20;

 if(
  e.userData.health<=0
 )
  defeat(e);
}


function webShot(){

 if(energy<15)
  return;

 const e=
  nearestEnemy(40);

 if(!e)
  return;

 energy-=15;

 e.userData.health-=60;

 score+=75;

 if(
  e.userData.health<=0
 )
  defeat(e);
}


function burst(){

 if(energy<35)
  return;

 energy-=35;

 for(
  const e of [...enemies]
 ){

  if(
   e.position.distanceTo(
    player.position
   )<18
  ){

   e.userData.health-=70;

   if(
    e.userData.health<=0
   )
    defeat(e);
  }
 }
}


function defeat(enemy){

 score+=250;
 xp+=100;

 scene.remove(enemy);

 const i=
  enemies.indexOf(enemy);

 if(i>=0)
  enemies.splice(i,1);

 setTimeout(
  createEnemy,
  1300
 );
}


function updateEnemies(dt){

 for(
  const e of enemies
 ){

  const d=
   e.position.distanceTo(
    player.position
   );

  if(d<100){

   const dir=
    new THREE.Vector3()
     .subVectors(
      player.position,
      e.position
     )
     .normalize();

   dir.y=0;

   e.position.addScaledVector(
    dir,
    e.userData.speed*dt
   );

   if(d<4)
    health-=6*dt;
  }
 }
}


/* =====================================================
   UI
===================================================== */

function showMessage(text){

 const m=
  document.getElementById(
   "message"
  );

 m.textContent=text;
 m.style.opacity=1;

 setTimeout(
  ()=>{
   m.style.opacity=0;
  },
  1200
 );
}


function updateHUD(){

 document.getElementById(
  "health"
 ).textContent=
  Math.floor(health);

 document.getElementById(
  "energy"
 ).textContent=
  Math.floor(energy);

 document.getElementById(
  "xp"
 ).textContent=xp;

 document.getElementById(
  "score"
 ).textContent=score;
}


/* =====================================================
   KEYBOARD
===================================================== */

addEventListener(
 "keydown",
 e=>{

  keys[e.code]=true;

  if(e.code==="Space")
   jump();

  if(e.code==="KeyE")
   toggleSwing();

  if(e.code==="KeyF")
   punch();

  if(e.code==="KeyZ")
   webShot();

  if(e.code==="KeyC")
   burst();

  if(e.code==="KeyR")
   cycleWeather();
 }
);

addEventListener(
 "keyup",
 e=>{
  keys[e.code]=false;
 }
);


/* =====================================================
   MOBILE
===================================================== */

function hold(
 id,
 code
){

 const b=
  document.getElementById(id);

 const down=e=>{
  e.preventDefault();
  keys[code]=true;
 };

 const up=e=>{
  e.preventDefault();
  keys[code]=false;
 };

 b.addEventListener(
  "touchstart",
  down,
  {passive:false}
 );

 b.addEventListener(
  "touchend",
  up,
  {passive:false}
 );

 b.addEventListener(
  "touchcancel",
  up,
  {passive:false}
 );
}

hold("up","KeyW");
hold("down","KeyS");
hold("left","KeyA");
hold("right","KeyD");


function tap(
 id,
 fn
){

 document
  .getElementById(id)
  .addEventListener(
   "touchstart",
   e=>{
    e.preventDefault();
    fn();
   },
   {passive:false}
  );
}

tap("jump",jump);
tap("swing",toggleSwing);
tap("punch",punch);
tap("shot",webShot);
tap("weatherBtn",cycleWeather);
tap("burst",burst);


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

 const desired=
  new THREE.Vector3(
   player.position.x,
   player.position.y+5.5,
   player.position.z+12
  );

 camera.position.lerp(
  desired,
  .075
 );

 camera.lookAt(
  player.position.x,
  player.position.y+2,
  player.position.z
 );
}


/* =====================================================
   MAIN LOOP
===================================================== */

const clock=
 new THREE.Clock();

function loop(){

 requestAnimationFrame(
  loop
 );

 const dt=
  Math.min(
   clock.getDelta(),
   .033
  );

 updateDayNight(dt);
 updateLamps();
 updateTemperature();
 updateRain(dt);

 updateMovement(dt);
 updateEnemies(dt);

 energy=
  Math.min(
   100,
   energy+dt*5
  );

 if(health<=0){

  health=100;
  energy=100;

  player.position.set(
   0,1.1,0
  );

  velocity.set(0,0,0);

  showMessage(
   "CHECKPOINT RESTORED"
  );
 }

 updateHUD();
 updateCamera();

 renderer.render(
  scene,
  camera
 );
}

loop();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
 "resize",
 ()=>{

  camera.aspect=
   innerWidth/
   innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   innerWidth,
   innerHeight
  );
 }
);

</script>
</body>
</html>
