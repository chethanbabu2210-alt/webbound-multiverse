<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V160 — VEHICLE GARAGE</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#294856,#081217);
}

#world{
 position:absolute;
 inset:0;
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.lane{
 position:absolute;
 background:#d5c36c;
 opacity:.45;
}

.laneH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.laneV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#vehicle{
 position:absolute;
 left:50%;
 top:53%;
 width:58px;
 height:30px;
 transform:translate(-50%,-50%);
 background:#d43f4a;
 border-radius:10px 13px 7px 7px;
 z-index:50;
 display:none;
}

#vehicle:before{
 content:"";
 position:absolute;
 left:12px;
 top:-10px;
 width:34px;
 height:16px;
 background:#91b5c4;
 border-radius:8px 8px 2px 2px;
}

.wheel{
 position:absolute;
 bottom:-7px;
 width:15px;
 height:15px;
 border-radius:50%;
 background:#090b0d;
 border:2px solid #4a4f52;
}

.w1{left:7px}
.w2{right:7px}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(550px,88vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#vehicleInfo{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.6;
}

.bar{
 height:7px;
 background:#ffffff12;
 border-radius:6px;
 overflow:hidden;
 margin-top:5px;
}

.fill{
 height:100%;
 width:0%;
 transition:.3s;
}

#fuelFill{
 background:#d5a94b;
}

#speedFill{
 background:#70a8d0;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

button:disabled{
 opacity:.4;
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(780px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.grid{
 display:grid;
 grid-template-columns:
 repeat(auto-fit,minmax(160px,1fr));
 gap:7px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 min-height:140px;
 font-size:10px;
 line-height:1.5;
}

.card b{
 display:block;
 margin-bottom:7px;
}

.badge{
 display:inline-block;
 padding:3px 6px;
 background:#ffffff12;
 border-radius:5px;
 font-size:8px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road rh"></div>
  <div class="road rv"></div>

  <div class="lane laneH"></div>
  <div class="lane laneV"></div>

  <div class="building b1">🏠 RESIDENTIAL</div>
  <div class="building b2">🏫 SCHOOL</div>
  <div class="building b3">🏥 HOSPITAL</div>
  <div class="building b4">🏢 CORPORATE</div>
  <div class="building b5">🏭 WAREHOUSE</div>
  <div class="building b6">🌳 PARK</div>

  <div id="vehicle">

   <div class="wheel w1"></div>
   <div class="wheel w2"></div>

  </div>

 </div>

 <div id="hud">

  <div class="title">
   🚗 WEBBOUND V160 — VEHICLES
  </div>

  <div class="stats">

   <div class="stat">
    🚘 VEHICLES<br>
    <span id="vehicleCount">0</span>
   </div>

   <div class="stat">
    🚗 CURRENT<br>
    <span id="currentVehicle">ON FOOT</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cash">0</span>
   </div>

   <div class="stat">
    ⭐ XP<br>
    <span id="xp">0</span>
   </div>

  </div>

  <div id="vehicleInfo">

   <b>VEHICLE STATUS</b><br>

   Speed:
   <span id="speedText">0 km/h</span>

   <div class="bar">
    <div id="speedFill" class="fill"></div>
   </div>

   Fuel:
   <span id="fuelText">—</span>

   <div class="bar">
    <div id="fuelFill" class="fill"></div>
   </div>

   Condition:
   <span id="conditionText">—</span>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V160.garage()">
   🚘 GARAGE
  </button>

  <button onclick="V160.enter()">
   🚗 ENTER
  </button>

  <button onclick="V160.accelerate()">
   🏎️ ACCELERATE
  </button>

  <button onclick="V160.brake()">
   🛑 BRAKE
  </button>

  <button onclick="V160.refuel()">
   ⛽ REFUEL
  </button>

  <button onclick="V160.upgrades()">
   🔧 UPGRADES
  </button>

  <button onclick="V160.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND
   </h2>

   <div id="panelContent"></div>

   <button onclick="V160.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V160={

 saveKey:"WEBBOUND_V160",

 cash:0,

 xp:0,

 selected:null,

 driving:false,

 speed:0,

 fuel:100,

 condition:100,

 vehicles:{

  compact:{
   icon:"🚗",
   name:"City Compact",
   price:0,
   maxSpeed:120,
   fuel:100,
   condition:100,
   acceleration:12,
   owned:true,
   upgrade:0
  },

  sport:{
   icon:"🏎️",
   name:"Street Sport",
   price:2500,
   maxSpeed:190,
   fuel:85,
   condition:100,
   acceleration:18,
   owned:false,
   upgrade:0
  },

  suv:{
   icon:"🚙",
   name:"Urban SUV",
   price:4000,
   maxSpeed:155,
   fuel:120,
   condition:100,
   acceleration:14,
   owned:false,
   upgrade:0
  },

  electric:{
   icon:"⚡",
   name:"Electric GT",
   price:6000,
   maxSpeed:210,
   fuel:100,
   condition:100,
   acceleration:22,
   owned:false,
   upgrade:0
  },

  super:{
   icon:"🏁",
   name:"Supercar",
   price:12000,
   maxSpeed:280,
   fuel:80,
   condition:100,
   acceleration:28,
   owned:false,
   upgrade:0
  }

 },

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  this.notify(
   "🚗 V160 Vehicle System ready"
  );

 },

 /* =========================
    CURRENT VEHICLE
 ========================= */

 current(){

  if(!this.selected)
   return null;

  return this.vehicles[
   this.selected
  ];

 },

 /* =========================
    GARAGE
 ========================= */

 garage(){

  let html=`

   <div class="card">

    <b>🚘 CITY GARAGE</b>

    Owned vehicles:
    ${
     Object.values(
      this.vehicles
     ).filter(
      v=>v.owned
     ).length
    }

    <br>

    Cash:
    ₹${this.cash}

    <br><br>

    Select a vehicle to drive.

   </div>

   <div class="grid">

  `;

  Object.keys(
   this.vehicles
  ).forEach(
   id=>{

    const v=
     this.vehicles[id];

    html+=`

     <div class="card">

      <b>
       ${v.icon}
       ${v.name}
      </b>

      <span class="badge">
       ${
        v.owned
        ?"OWNED"
        :"₹"+v.price
       }
      </span>

      <br><br>

      Maximum speed:
      ${v.maxSpeed} km/h

      <br>

      Acceleration:
      ${v.acceleration}

      <br>

      Fuel capacity:
      ${v.fuel}

      <br>

      Upgrade:
      Level ${v.upgrade}

      <br><br>

      ${
       v.owned
       ?`
        <button
         onclick=
         "V160.select('${id}')">

         ${
          this.selected===id
          ?"✅ SELECTED"
          :"SELECT"
         }

        </button>
       `
       :`
        <button
         onclick=
         "V160.buy('${id}')">

         💰 BUY ₹${v.price}

        </button>
       `
      }

     </div>

    `;

   }
  );

  html+=`</div>`;

  this.open(
   "🚘 GARAGE",
   html
  );

 },

 /* =========================
    BUY
 ========================= */

 buy(id){

  const v=
   this.vehicles[id];

  if(!v)
   return;

  if(v.owned){

   this.notify(
    "🚗 You already own this vehicle."
   );

   return;

  }

  if(this.cash<v.price){

   this.notify(
    "💰 Not enough cash."
   );

   return;

  }

  this.cash-=v.price;

  v.owned=true;

  this.selected=id;

  this.save();

  this.update();

  this.notify(
   v.icon+
   " "+v.name+
   " purchased!"
  );

  this.garage();

 },

 /* =========================
    SELECT
 ========================= */

 select(id){

  const v=
   this.vehicles[id];

  if(!v || !v.owned)
   return;

  this.selected=id;

  this.speed=0;

  this.fuel=v.fuel;

  this.condition=v.condition;

  this.driving=false;

  this.update();

  this.save();

  this.notify(
   v.icon+
   " "+v.name+
   " selected."
  );

  this.garage();

 },

 /* =========================
    ENTER
 ========================= */

 enter(){

  if(!this.selected){

   this.notify(
    "🚘 Select a vehicle first."
   );

   return;

  }

  const v=
   this.current();

  this.driving=
   !this.driving;

  if(!this.driving){

   this.speed=0;

   this.notify(
    "🚶 You left the vehicle."
   );

   this.update();

   return;

  }

  if(this.fuel<=0){

   this.driving=false;

   this.notify(
    "⛽ Vehicle has no fuel."
   );

   return;

  }

  const vehicle=
   document.getElementById(
    "vehicle"
   );

  vehicle.style.display=
   "block";

  this.notify(
   "🚗 Driving "+
   v.name
  );

  this.update();

 },

 /* =========================
    ACCELERATE
 ========================= */

 accelerate(){

  if(!this.driving){

   this.notify(
    "🚗 Enter a vehicle first."
   );

   return;

  }

  const v=
   this.current();

  if(!v)
   return;

  if(this.fuel<=0){

   this.notify(
    "⛽ Out of fuel."
   );

   return;

  }

  if(this.condition<=0){

   this.notify(
    "🔧 Vehicle needs repair."
   );

   return;

  }

  this.speed=
   Math.min(
    v.maxSpeed+
    v.upgrade*10,
    this.speed+
    v.acceleration
   );

  this.fuel=
   Math.max(
    0,
    this.fuel-
    (
     1+
     this.speed/100
    )
   );

  this.condition=
   Math.max(
    0,
    this.condition-
    .2
   );

  this.xp+=5;

  this.update();

  this.save();

 },

 /* =========================
    BRAKE
 ========================= */

 brake(){

  if(!this.driving){

   this.notify(
    "🛑 You are not driving."
   );

   return;

  }

  this.speed=
   Math.max(
    0,
    this.speed-30
   );

  this.update();

 },

 /* =========================
    REFUEL
 ========================= */

 refuel(){

  if(!this.selected){

   this.notify(
    "⛽ Select a vehicle first."
   );

   return;

  }

  const v=
   this.current();

  const missing=
   Math.ceil(
    v.fuel-this.fuel
   );

  if(missing<=0){

   this.notify(
    "⛽ Tank is already full."
   );

   return;

  }

  const cost=
   missing*3;

  if(this.cash<cost){

   this.notify(
    "💰 Refueling requires ₹"+
    cost
   );

   return;

  }

  this.cash-=cost;

  this.fuel=v.fuel;

  this.notify(
   "⛽ Vehicle refueled."
  );

  this.update();

  this.save();

 },

 /* =========================
    UPGRADES
 ========================= */

 upgrades(){

  if(!this.selected){

   this.notify(
    "🔧 Select a vehicle first."
   );

   return;

  }

  const v=
   this.current();

  const cost=
   1000+
   v.upgrade*750;

  const html=`

   <div class="card">

    <b>
     ${v.icon}
     ${v.name}
    </b>

    Upgrade level:
    ${v.upgrade}

    <br>

    Maximum speed:
    ${v.maxSpeed+
      v.upgrade*10}
    km/h

    <br>

    Acceleration:
    ${v.acceleration}

    <br><br>

    Next upgrade:
    ₹${cost}

    <button
     onclick="V160.upgrade()">

     🔧 UPGRADE VEHICLE

    </button>

   </div>

  `;

  this.open(
   "🔧 VEHICLE UPGRADES",
   html
  );

 },

 upgrade(){

  if(!this.selected)
   return;

  const v=
   this.current();

  const cost=
   1000+
   v.upgrade*750;

  if(this.cash<cost){

   this.notify(
    "💰 Not enough cash."
   );

   return;

  }

  this.cash-=cost;

  v.upgrade++;

  v.condition=100;

  this.condition=100;

  this.xp+=50;

  this.update();

  this.save();

  this.notify(
   "🔧 Vehicle upgraded to level "+
   v.upgrade
  );

  this.upgrades();

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  const owned=
   Object.values(
    this.vehicles
   ).filter(
    v=>v.owned
   ).length;

  document.getElementById(
   "vehicleCount"
  ).textContent=
   owned;

  document.getElementById(
   "cash"
  ).textContent=
   this.cash;

  document.getElementById(
   "xp"
  ).textContent=
   this.xp;

  const current=
   this.current();

  if(!current){

   document.getElementById(
    "currentVehicle"
   ).textContent=
    "ON FOOT";

   document.getElementById(
    "speedText"
   ).textContent=
    "0 km/h";

   document.getElementById(
    "fuelText"
   ).textContent=
    "—";

   document.getElementById(
    "conditionText"
   ).textContent=
    "—";

   document.getElementById(
    "fuelFill"
   ).style.width=
    "0%";

   document.getElementById(
    "speedFill"
   ).style.width=
    "0%";

   return;

  }

  document.getElementById(
   "currentVehicle"
  ).textContent=
   current.name;

  document.getElementById(
   "speedText"
  ).textContent=
   Math.round(
    this.speed
   )+
   " km/h";

  document.getElementById(
   "fuelText"
  ).textContent=
   Math.round(
    this.fuel
   )+
   "/"+
   current.fuel;

  document.getElementById(
   "conditionText"
  ).textContent=
   Math.round(
    this.condition
   )+
   "%";

  document.getElementById(
   "fuelFill"
  ).style.width=
   (
    this.fuel/
    current.fuel*
    100
   )+"%";

  const max=
   current.maxSpeed+
   current.upgrade*10;

  document.getElementById(
   "speedFill"
  ).style.width=
   Math.min(
    this.speed/max*100,
    100
   )+"%";

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    xp:this.xp,

    selected:this.selected,

    driving:false,

    speed:0,

    fuel:this.fuel,

    condition:this.condition,

    vehicles:this.vehicles

   })
  );

  localStorage.setItem(
   "WEBBOUND_V150_CASH",
   this.cash
  );

  this.notify(
   "💾 V160 saved"
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(raw){

    const data=
     JSON.parse(raw);

    this.cash=
     Number.isFinite(data.cash)
     ?data.cash
     :0;

    this.xp=
     Number.isFinite(data.xp)
     ?data.xp
     :0;

    this.selected=
     data.selected||
     null;

    this.fuel=
     Number.isFinite(data.fuel)
     ?data.fuel
     :100;

    this.condition=
     Number.isFinite(
      data.condition
     )
     ?data.condition
     :100;

    if(data.vehicles){

     Object.keys(
      this.vehicles
     ).forEach(
      id=>{

       if(
        data.vehicles[id]
       ){

        this.vehicles[id]=
         {
          ...this.vehicles[id],
          ...data.vehicles[id]
         };

       }

      }
     );

    }

    return;

   }

   /*
    Continue from V159.
   */

   const old=
    localStorage.getItem(
     "WEBBOUND_V159"
    );

   if(old){

    const data=
     JSON.parse(old);

    this.cash=
     Number.isFinite(data.cash)
     ?data.cash
     :0;

    this.xp=
     Number.isFinite(data.xp)
     ?data.xp
     :0;

   }

  }
  catch(error){

   console.log(
    "V160 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2300
   );

 }

};

V160.init();

console.log(
 "WEBBOUND V160 VEHICLE SYSTEM READY"
);

</script>

</body>
</html>
