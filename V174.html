<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V174 — FACTION SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#294856,#081217);
}

#world{
 position:absolute;
 inset:0;
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.45;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(720px,92vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#factionHud{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.7;
}

.bar{
 height:8px;
 background:#ffffff12;
 border-radius:7px;
 overflow:hidden;
 margin-top:5px;
}

.repFill{
 height:100%;
 width:0%;
 background:#b48ad4;
 transition:.3s;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(760px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.7;
}

.card button{
 width:100%;
 margin-top:8px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="world">

  <div class="road rh"></div>
  <div class="road rv"></div>

  <div class="line lineH"></div>
  <div class="line lineV"></div>

  <div class="building b1">🏠 RESIDENTIAL</div>
  <div class="building b2">🏫 SCHOOL</div>
  <div class="building b3">🏥 HOSPITAL</div>
  <div class="building b4">🏢 CORPORATE</div>
  <div class="building b5">🏭 WAREHOUSE</div>
  <div class="building b6">🏛️ FACTION HQ</div>

  <div id="player"></div>

 </div>

 <div id="hud">

  <div class="title">
   🏛️ WEBBOUND V174 — FACTION SYSTEM
  </div>

  <div class="stats">

   <div class="stat">
    ⭐ LEVEL<br>
    <span id="levelText">1</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">5000</span>
   </div>

   <div class="stat">
    🏆 REP<br>
    <span id="repText">0</span>
   </div>

   <div class="stat">
    🤝 FACTIONS<br>
    <span id="factionCount">0</span>
   </div>

  </div>

  <div id="factionHud">

   <b>🤝 CURRENT FACTION</b>

   <br>

   <span id="activeFaction">
    No faction selected
   </span>

   <br>

   Reputation:
   <span id="activeRep">
    0
   </span>

   <div class="bar">
    <div id="activeRepFill" class="repFill"></div>
   </div>

   Rank:
   <span id="activeRank">
    Neutral
   </span>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V174.factions()">
   🤝 FACTIONS
  </button>

  <button onclick="V174.selectRandom()">
   🎯 SELECT FACTION
  </button>

  <button onclick="V174.addRep(10)">
   ⭐ +10 REP
  </button>

  <button onclick="V174.addRep(25)">
   🏆 +25 REP
  </button>

  <button onclick="V174.factionMission()">
   📋 FACTION JOB
  </button>

  <button onclick="V174.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V174
   </h2>

   <div id="panelContent"></div>

   <button onclick="V174.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V174={

 saveKey:"WEBBOUND_V174",

 level:1,

 cash:5000,

 totalRep:0,

 selected:null,

 factionsData:[

  {
   id:"civic",
   name:"🏛️ Civic Union",
   description:
    "A public organization focused on city services.",
   rep:0
  },

  {
   id:"tech",
   name:"💻 Tech Collective",
   description:
    "A technology-focused group developing new systems.",
   rep:0
  },

  {
   id:"trade",
   name:"📦 Trade Guild",
   description:
    "A commercial faction controlling local trade.",
   rep:0
  },

  {
   id:"rescue",
   name:"🚑 Rescue Network",
   description:
    "A volunteer network helping people around the city.",
   rep:0
  },

  {
   id:"urban",
   name:"🏗️ Urban Alliance",
   description:
    "A construction and infrastructure organization.",
   rep:0
  }

 ],

 /* =========================
    INIT
 ========================= */

 init(){

  this.load();

  this.update();

  this.notify(
   "🏛️ V174 Faction System ready"
  );

 },

 /* =========================
    CURRENT FACTION
 ========================= */

 current(){

  return this.factionsData.find(
   faction=>
    faction.id===this.selected
  );

 },

 /* =========================
    RANK
 ========================= */

 rank(rep){

  if(rep>=500)
   return "👑 LEGEND";

  if(rep>=300)
   return "💎 ALLIED";

  if(rep>=150)
   return "🤝 FRIENDLY";

  if(rep>=50)
   return "🙂 RESPECTED";

  if(rep>0)
   return "🟢 ACCEPTED";

  if(rep===0)
   return "⚪ NEUTRAL";

  if(rep>=-50)
   return "🟠 UNFRIENDLY";

  return "🔴 HOSTILE";

 },

 /* =========================
    SELECT RANDOM
 ========================= */

 selectRandom(){

  const faction=
   this.factionsData[
    Math.floor(
     Math.random()*
     this.factionsData.length
    )
   ];

  this.selected=
   faction.id;

  this.update();

  this.save();

  this.notify(
   "🤝 "+faction.name+
   " selected."
  );

 },

 /* =========================
    ADD REP
 ========================= */

 addRep(amount){

  if(!this.selected){

   this.notify(
    "🤝 Select a faction first."
   );

   return;

  }

  const faction=
   this.current();

  if(!faction)
   return;

  faction.rep+=amount;

  faction.rep=
   Math.max(
    -1000,
    Math.min(
     1000,
     faction.rep
    )
   );

  this.totalRep=
   this.factionsData.reduce(
    (sum,f)=>
     sum+Math.max(0,f.rep),
    0
   );

  this.cash+=
   Math.floor(amount*2);

  this.update();

  this.save();

  this.notify(
   "⭐ "+amount+
   " reputation with "+
   faction.name
  );

 },

 /* =========================
    FACTION JOB
 ========================= */

 factionMission(){

  if(!this.selected){

   this.selectRandom();

  }

  const faction=
   this.current();

  if(!faction)
   return;

  const jobs=[

   "Deliver supplies",

   "Complete a city task",

   "Help a local resident",

   "Collect technical data",

   "Inspect an infrastructure site",

   "Transport important equipment"

  ];

  const job=
   jobs[
    Math.floor(
     Math.random()*
     jobs.length
    )
   ];

  const rep=
   15+
   Math.floor(
    Math.random()*21
   );

  const cash=
   150+
   Math.floor(
    Math.random()*351
   );

  this.open(
   "📋 FACTION JOB",
   `

   <div class="card">

    <b>${faction.name}</b>

    <br><br>

    ${faction.description}

   </div>

   <div class="card">

    <b>MISSION</b>

    <br>

    ${job}

    <br><br>

    Reward:

    <br>

    ⭐ +${rep} Reputation

    <br>

    💰 ₹${cash}

    <button
     onclick="
      V174.completeJob(${rep},${cash})
     ">

     ✅ COMPLETE JOB

    </button>

   </div>

   `
  );

 },

 /* =========================
    COMPLETE JOB
 ========================= */

 completeJob(rep,cash){

  const faction=
   this.current();

  if(!faction)
   return;

  faction.rep+=rep;

  this.cash+=cash;

  this.totalRep=
   this.factionsData.reduce(
    (sum,f)=>
     sum+Math.max(0,f.rep),
    0
   );

  this.update();

  this.save();

  this.close();

  this.notify(
   "🏆 Job completed! +"+
   rep+
   " REP, ₹"+
   cash
  );

 },

 /* =========================
    FACTION LIST
 ========================= */

 factions(){

  let html="";

  this.factionsData.forEach(
   faction=>{

    const rank=
     this.rank(
      faction.rep
     );

    html+=`

    <div class="card">

     <b>${faction.name}</b>

     <br>

     ${faction.description}

     <br><br>

     ⭐ Reputation:
     ${faction.rep}

     <br>

     🏅 Rank:
     ${rank}

     <div class="bar">

      <div
       class="repFill"
       style="
        width:${Math.min(
         100,
         Math.max(
          0,
          faction.rep/5
         )
        )}%
       ">
      </div>

     </div>

     <button
      onclick="
       V174.selectFaction('${faction.id}')
      ">

      ${
       faction.id===this.selected
       ?"🟢 SELECTED"
       :"SELECT FACTION"
      }

     </button>

    </div>

    `;

  });

  this.open(
   "🤝 FACTION BOARD",
   html
  );

 },

 /* =========================
    SELECT FACTION
 ========================= */

 selectFaction(id){

  const faction=
   this.factionsData.find(
    f=>f.id===id
   );

  if(!faction)
   return;

  this.selected=id;

  this.update();

  this.save();

  this.factions();

  this.notify(
   "🤝 "+faction.name+
   " selected."
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  document.getElementById(
   "levelText"
  ).textContent=
   this.level;

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash.toLocaleString();

  document.getElementById(
   "repText"
  ).textContent=
   this.totalRep;

  document.getElementById(
   "factionCount"
  ).textContent=
   this.factionsData.length;

  const faction=
   this.current();

  if(!faction){

   document.getElementById(
    "activeFaction"
   ).textContent=
    "No faction selected";

   document.getElementById(
    "activeRep"
   ).textContent=
    "0";

   document.getElementById(
    "activeRank"
   ).textContent=
    "Neutral";

   document.getElementById(
    "activeRepFill"
   ).style.width=
    "0%";

   return;

  }

  document.getElementById(
   "activeFaction"
  ).textContent=
   faction.name;

  document.getElementById(
   "activeRep"
  ).textContent=
   faction.rep;

  document.getElementById(
   "activeRank"
  ).textContent=
   this.rank(
    faction.rep
   );

  document.getElementById(
   "activeRepFill"
  ).style.width=
   Math.min(
    100,
    Math.max(
     0,
     faction.rep/5
    )
   )+"%";

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    level:this.level,

    cash:this.cash,

    totalRep:this.totalRep,

    selected:this.selected,

    factions:this.factionsData

   })
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   if(
    Number.isFinite(
     data.level
    )
   )
    this.level=
     Math.max(
      1,
      Math.floor(data.level)
     );

   if(
    Number.isFinite(
     data.cash
    )
   )
    this.cash=
     Math.max(
      0,
      data.cash
     );

   if(
    Number.isFinite(
     data.totalRep
    )
   )
    this.totalRep=
     data.totalRep;

   if(
    typeof data.selected==="string"
   )
    this.selected=
     data.selected;

   if(
    Array.isArray(
     data.factions
    )
   ){

    data.factions.forEach(
     saved=>{

      const faction=
       this.factionsData.find(
        f=>f.id===saved.id
       );

      if(
       faction &&
       Number.isFinite(
        saved.rep
       )
      ){

       faction.rep=
        saved.rep;

      }

     }
    );

   }

  }
  catch(error){

   console.log(
    "V174 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2300
   );

 }

};

V174.init();

console.log(
 "WEBBOUND V174 FACTION SYSTEM READY"
);

</script>

</body>
</html>
