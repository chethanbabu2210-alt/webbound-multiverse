<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V182 — MISSION SYSTEM</title>

<style>
*{box-sizing:border-box}

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 font-family:Arial,sans-serif;
 background:#05090d;
 color:#fff;
}

#game{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#314e5a,#091116);
}

#sky{
 position:absolute;
 inset:0;
 background:linear-gradient(#6fa4c0,#b9d0d8);
}

.road{
 position:absolute;
 background:#252d32;
}

.rh{
 left:0;
 right:0;
 top:57%;
 height:70px;
}

.rv{
 top:0;
 bottom:0;
 left:68%;
 width:70px;
}

.line{
 position:absolute;
 background:#d5c36c;
 opacity:.4;
}

.lineH{
 left:0;
 right:0;
 top:calc(57% + 34px);
 height:2px;
}

.lineV{
 top:0;
 bottom:0;
 left:calc(68% + 34px);
 width:2px;
}

.building{
 position:absolute;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 background:#14242d;
 border:1px solid #ffffff18;
 border-radius:9px;
 color:#82929b;
 font-size:10px;
}

.b1{left:4%;top:7%;width:19%;height:28%}
.b2{left:28%;top:7%;width:19%;height:28%}
.b3{left:51%;top:7%;width:16%;height:27%}
.b4{right:3%;top:7%;width:23%;height:28%}
.b5{left:4%;bottom:6%;width:20%;height:24%}
.b6{left:30%;bottom:7%;width:18%;height:22%}

#player{
 position:absolute;
 left:50%;
 top:53%;
 width:29px;
 height:41px;
 border-radius:10px 10px 5px 5px;
 background:#2c91da;
 z-index:50;
}

#player:before{
 content:"";
 position:absolute;
 left:5.5px;
 top:-14px;
 width:18px;
 height:18px;
 border-radius:50%;
 background:#bd8967;
}

#hud{
 position:fixed;
 left:10px;
 top:10px;
 width:min(900px,92vw);
 padding:12px;
 background:#03070cee;
 border:1px solid #ffffff25;
 border-radius:13px;
 z-index:500;
}

.title{
 font-size:13px;
 font-weight:bold;
}

.stats{
 display:grid;
 grid-template-columns:repeat(5,1fr);
 gap:5px;
 margin-top:8px;
}

.stat{
 padding:7px 4px;
 background:#101b23;
 border-radius:7px;
 text-align:center;
 font-size:9px;
}

#missionHud{
 margin-top:8px;
 padding:9px;
 background:#111d25;
 border-radius:8px;
 font-size:9px;
 line-height:1.7;
}

.bar{
 height:8px;
 background:#ffffff12;
 border-radius:7px;
 overflow:hidden;
 margin-top:5px;
}

.fill{
 height:100%;
 width:0%;
 background:#8fb8df;
 transition:.3s;
}

#controls{
 position:fixed;
 left:50%;
 bottom:10px;
 transform:translateX(-50%);
 width:min(950px,96vw);
 display:flex;
 flex-wrap:wrap;
 gap:6px;
 z-index:500;
}

button{
 flex:1;
 min-width:105px;
 padding:10px;
 background:#142733;
 border:1px solid #ffffff22;
 border-radius:8px;
 color:#fff;
 font-size:10px;
 cursor:pointer;
}

button:active{
 transform:scale(.97);
}

#panel{
 position:fixed;
 inset:0;
 display:none;
 align-items:center;
 justify-content:center;
 background:#000c;
 z-index:1000;
}

.box{
 width:min(760px,94vw);
 max-height:84vh;
 overflow:auto;
 padding:17px;
 background:#050b10;
 border:1px solid #ffffff28;
 border-radius:15px;
}

.card{
 padding:11px;
 background:#111d25;
 border-radius:9px;
 margin-bottom:7px;
 font-size:10px;
 line-height:1.7;
}

.card button{
 width:100%;
 margin-top:8px;
}

#notification{
 position:fixed;
 left:50%;
 top:20%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff25;
 border-radius:9px;
 display:none;
 z-index:1500;
 font-size:10px;
 text-align:center;
}
</style>
</head>

<body>

<div id="game">

 <div id="sky"></div>

 <div class="road rh"></div>
 <div class="road rv"></div>

 <div class="line lineH"></div>
 <div class="line lineV"></div>

 <div class="building b1">🏠 RESIDENTIAL</div>
 <div class="building b2">🏫 SCHOOL</div>
 <div class="building b3">🏥 HOSPITAL</div>
 <div class="building b4">🏢 CORPORATE</div>
 <div class="building b5">🏭 WAREHOUSE</div>
 <div class="building b6">📋 MISSION HQ</div>

 <div id="player"></div>

 <div id="hud">

  <div class="title">
   📋 WEBBOUND V182 — MISSION CONTROL
  </div>

  <div class="stats">

   <div class="stat">
    📋 ACTIVE<br>
    <span id="activeText">None</span>
   </div>

   <div class="stat">
    🎯 OBJECTIVE<br>
    <span id="objectiveText">0/0</span>
   </div>

   <div class="stat">
    ✨ XP<br>
    <span id="xpText">0</span>
   </div>

   <div class="stat">
    ⭐ REP<br>
    <span id="repText">0</span>
   </div>

   <div class="stat">
    💰 CASH<br>
    ₹<span id="cashText">5000</span>
   </div>

  </div>

  <div id="missionHud">

   <b>🎯 CURRENT MISSION</b>

   <br>

   <span id="missionName">
    No mission selected
   </span>

   <br>

   <span id="missionDescription">
    Visit Mission HQ to choose a mission.
   </span>

   <div class="bar">
    <div id="missionFill" class="fill"></div>
   </div>

  </div>

 </div>

 <div id="notification"></div>

 <div id="controls">

  <button onclick="V182.missions()">
   📋 MISSIONS
  </button>

  <button onclick="V182.nextObjective()">
   🎯 COMPLETE OBJECTIVE
  </button>

  <button onclick="V182.claim()">
   🎁 CLAIM REWARD
  </button>

  <button onclick="V182.daily()">
   📅 DAILY QUEST
  </button>

  <button onclick="V182.stats()">
   📊 STATS
  </button>

  <button onclick="V182.save()">
   💾 SAVE
  </button>

 </div>

 <div id="panel">

  <div class="box">

   <h2 id="panelTitle">
    WEBBOUND V182
   </h2>

   <div id="panelContent"></div>

   <button onclick="V182.close()">
    CLOSE
   </button>

  </div>

 </div>

</div>

<script>

const V182={

 saveKey:"WEBBOUND_V182",

 cash:5000,

 xp:0,

 reputation:0,

 activeMission:null,

 completed:[],

 dailyMission:null,

 missionsData:[

  {
   id:"first_steps",
   type:"Main",
   name:"🌆 First Steps",
   description:
    "Explore the city and prove that you can handle your first assignment.",
   objectives:[
    "Visit the residential district",
    "Visit the school district",
    "Return to Mission HQ"
   ],
   reward:{
    cash:500,
    xp:100,
    rep:10
   }
  },

  {
   id:"city_helper",
   type:"Side",
   name:"🤝 City Helper",
   description:
    "Help people around the city and build a positive reputation.",
   objectives:[
    "Complete a community task",
    "Help another resident",
    "Report back to Mission HQ"
   ],
   reward:{
    cash:750,
    xp:150,
    rep:20
   }
  },

  {
   id:"corporate_run",
   type:"Main",
   name:"💼 Corporate Run",
   description:
    "Complete a delivery assignment for a major company.",
   objectives:[
    "Collect the package",
    "Reach the corporate district",
    "Deliver the package"
   ],
   reward:{
    cash:1200,
    xp:250,
    rep:25
   }
  },

  {
   id:"warehouse",
   type:"Side",
   name:"🏭 Warehouse Investigation",
   description:
    "Investigate unusual activity around the warehouse.",
   objectives:[
    "Reach the warehouse",
    "Inspect the area",
    "Submit your report"
   ],
   reward:{
    cash:1000,
    xp:200,
    rep:30
   }
  },

  {
   id:"big_opportunity",
   type:"Main",
   name:"⭐ Big Opportunity",
   description:
    "A high-value assignment has appeared in the city.",
   objectives:[
    "Meet the contact",
    "Complete the assignment",
    "Return to Mission HQ"
   ],
   reward:{
    cash:2500,
    xp:500,
    rep:50
   }
  }

 ],

 init(){

  this.load();

  this.update();

  this.notify(
   "📋 V182 Mission System ready"
  );

 },

 /* =========================
    MISSIONS
 ========================= */

 missions(){

  let html="";

  this.missionsData.forEach(
   mission=>{

    const completed=
     this.completed.includes(
      mission.id
     );

    const active=
     this.activeMission &&
     this.activeMission.id===
     mission.id;

    html+=`

    <div class="card">

     <b>${mission.name}</b>

     <br>

     Type:
     ${mission.type}

     <br>

     ${mission.description}

     <br><br>

     🎯 Objectives:
     ${mission.objectives.length}

     <br>

     🎁 Reward:
     ₹${mission.reward.cash}
     /
     ${mission.reward.xp} XP
     /
     ${mission.reward.rep} REP

     ${
      completed
      ?`
       <br><br>
       ✅ COMPLETED
      `
      :
      active
      ?`
       <br><br>
       🟢 ACTIVE
      `
      :
      `
       <button
        onclick="
         V182.start(
          '${mission.id}'
         )
        ">
        ▶️ START MISSION
       </button>
      `
     }

    </div>

    `;

   }
  );

  this.open(
   "📋 MISSION BOARD",
   html
  );

 },

 /* =========================
    START
 ========================= */

 start(id){

  const mission=
   this.missionsData.find(
    m=>m.id===id
   );

  if(!mission)
   return;

  if(
   this.completed.includes(
    id
   )
  ){

   this.notify(
    "✅ Mission already completed."
   );

   return;

  }

  this.activeMission={

   id:mission.id,

   objective:0

  };

  this.update();

  this.save();

  this.close();

  this.notify(
   "▶️ Mission started: "+
   mission.name
  );

 },

 /* =========================
    OBJECTIVE
 ========================= */

 nextObjective(){

  if(!this.activeMission){

   this.notify(
    "📋 Select a mission first."
   );

   return;

  }

  const mission=
   this.missionsData.find(
    m=>
     m.id===
     this.activeMission.id
   );

  if(!mission)
   return;

  if(
   this.activeMission.objective>=
   mission.objectives.length
  ){

   this.notify(
    "🎁 Mission ready for reward."
   );

   return;

  }

  this.activeMission.objective++;

  this.update();

  this.save();

  if(
   this.activeMission.objective===
   mission.objectives.length
  ){

   this.notify(
    "🎉 All objectives completed!"
   );

  }
  else{

   const next=
    mission.objectives[
     this.activeMission.objective
    ];

   this.notify(
    "🎯 Objective complete! Next: "+
    next
   );

  }

 },

 /* =========================
    CLAIM
 ========================= */

 claim(){

  if(!this.activeMission){

   this.notify(
    "❌ No active mission."
   );

   return;

  }

  const mission=
   this.missionsData.find(
    m=>
     m.id===
     this.activeMission.id
   );

  if(!mission)
   return;

  if(
   this.activeMission.objective<
   mission.objectives.length
  ){

   this.notify(
    "🎯 Complete all objectives first."
   );

   return;

  }

  this.cash+=
   mission.reward.cash;

  this.xp+=
   mission.reward.xp;

  this.reputation+=
   mission.reward.rep;

  this.completed.push(
   mission.id
  );

  this.activeMission=null;

  this.update();

  this.save();

  this.notify(
   "🎁 Mission complete! +₹"+
   mission.reward.cash+
   " +"+
   mission.reward.xp+
   " XP +"+
   mission.reward.rep+
   " REP"
  );

 },

 /* =========================
    DAILY QUEST
 ========================= */

 daily(){

  if(
   !this.dailyMission
  ){

   this.dailyMission={
    name:"🌟 Daily City Challenge",
    objective:0,
    total:3,
    reward:{
     cash:400,
     xp:80,
     rep:8
    }
   };

  }

  const d=
   this.dailyMission;

  if(
   d.objective>=
   d.total
  ){

   this.notify(
    "✅ Daily quest already completed."
   );

   return;

  }

  d.objective++;

  if(
   d.objective===
   d.total
  ){

   this.cash+=
    d.reward.cash;

   this.xp+=
    d.reward.xp;

   this.reputation+=
    d.reward.rep;

   this.notify(
    "🎉 Daily quest complete! +₹"+
    d.reward.cash+
    " +"+
    d.reward.xp+
    " XP"
   );

  }
  else{

   this.notify(
    "📅 Daily objective "+
    d.objective+
    "/"+
    d.total
   );

  }

  this.update();

  this.save();

 },

 /* =========================
    STATS
 ========================= */

 stats(){

  const completed=
   this.completed.length;

  const total=
   this.missionsData.length;

  this.open(
   "📊 MISSION STATISTICS",
   `

   <div class="card">

    📋 Total Missions:
    ${total}

    <br>

    ✅ Completed:
    ${completed}

    <br>

    ⏳ Remaining:
    ${total-completed}

   </div>

   <div class="card">

    💰 Mission Cash Earned:
    ₹${this.cash.toLocaleString()}

    <br>

    ✨ XP:
    ${this.xp}

    <br>

    ⭐ Reputation:
    ${this.reputation}

   </div>

   `
  );

 },

 /* =========================
    UPDATE
 ========================= */

 update(){

  const active=
   this.activeMission;

  if(!active){

   document.getElementById(
    "activeText"
   ).textContent=
    "None";

   document.getElementById(
    "objectiveText"
   ).textContent=
    "0/0";

   document.getElementById(
    "missionName"
   ).textContent=
    "No mission selected";

   document.getElementById(
    "missionDescription"
   ).textContent=
    "Visit Mission HQ to choose a mission.";

   document.getElementById(
    "missionFill"
   ).style.width=
    "0%";

  }
  else{

   const mission=
    this.missionsData.find(
     m=>m.id===active.id
    );

   if(mission){

    const current=
     Math.min(
      active.objective,
      mission.objectives.length
     );

    document.getElementById(
     "activeText"
    ).textContent=
     mission.name;

    document.getElementById(
     "objectiveText"
    ).textContent=
     current+
     "/"+
     mission.objectives.length;

    document.getElementById(
     "missionName"
    ).textContent=
     mission.name;

    document.getElementById(
     "missionDescription"
    ).textContent=
     current<
     mission.objectives.length
     ?
     "Next: "+
     mission.objectives[current]
     :
     "All objectives complete — claim your reward!";

    document.getElementById(
     "missionFill"
    ).style.width=
     (
      current/
      mission.objectives.length*
      100
     )+
     "%";

   }

  }

  document.getElementById(
   "xpText"
  ).textContent=
   this.xp;

  document.getElementById(
   "repText"
  ).textContent=
   this.reputation;

  document.getElementById(
   "cashText"
  ).textContent=
   this.cash.toLocaleString();

 },

 /* =========================
    SAVE
 ========================= */

 save(){

  localStorage.setItem(
   this.saveKey,
   JSON.stringify({

    cash:this.cash,

    xp:this.xp,

    reputation:this.reputation,

    activeMission:
     this.activeMission,

    completed:
     this.completed,

    dailyMission:
     this.dailyMission

   })
  );

 },

 /* =========================
    LOAD
 ========================= */

 load(){

  try{

   const raw=
    localStorage.getItem(
     this.saveKey
    );

   if(!raw)
    return;

   const data=
    JSON.parse(raw);

   if(
    Number.isFinite(
     data.cash
    )
   )
    this.cash=
     Math.max(
      0,
      data.cash
     );

   if(
    Number.isFinite(
     data.xp
    )
   )
    this.xp=
     Math.max(
      0,
      data.xp
     );

   if(
    Number.isFinite(
     data.reputation
    )
   )
    this.reputation=
     Math.max(
      0,
      data.reputation
     );

   if(
    data.activeMission &&
    typeof data.activeMission.id===
    "string"
   )
    this.activeMission=
     data.activeMission;

   if(
    Array.isArray(
     data.completed
    )
   )
    this.completed=
     data.completed;

   if(
    data.dailyMission
   )
    this.dailyMission=
     data.dailyMission;

  }
  catch(error){

   console.log(
    "V182 load error:",
    error
   );

  }

 },

 /* =========================
    PANEL
 ========================= */

 open(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=
   title;

  document.getElementById(
   "panelContent"
  ).innerHTML=
   content;

  document.getElementById(
   "panel"
  ).style.display=
   "flex";

 },

 close(){

  document.getElementById(
   "panel"
  ).style.display=
   "none";

 },

 /* =========================
    NOTIFICATION
 ========================= */

 notify(text){

  const el=
   document.getElementById(
    "notification"
   );

  el.textContent=
   text;

  el.style.display=
   "block";

  clearTimeout(
   this.timer
  );

  this.timer=
   setTimeout(
    ()=>{
     el.style.display=
      "none";
    },
    2500
   );

 }

};

V182.init();

console.log(
 "WEBBOUND V182 MISSION SYSTEM READY"
);

</script>

</body>
</html>
