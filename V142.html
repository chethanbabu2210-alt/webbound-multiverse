<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WEBBOUND V142</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 overflow:hidden;
 background:#071018;
 color:#fff;
 font-family:Arial,sans-serif
}

#world{
 position:fixed;
 inset:0;
 overflow:hidden;
 background:linear-gradient(#172630,#081219)
}

.road{
 position:absolute;
 background:#252d33;
 z-index:2
}

.road.h{
 height:40px;
 left:0;
 right:0
}

.road.v{
 width:40px;
 top:0;
 bottom:0
}

.building{
 position:absolute;
 background:#1b2934;
 border:1px solid #ffffff18;
 border-radius:8px;
 z-index:4
}

.label{
 position:absolute;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 font-size:9px;
 white-space:nowrap
}

#player{
 position:absolute;
 width:22px;
 height:30px;
 background:#268de5;
 border-radius:9px 9px 4px 4px;
 transform:translate(-50%,-50%);
 z-index:7000
}

#player:before{
 content:"";
 position:absolute;
 width:13px;
 height:13px;
 left:4.5px;
 top:-9px;
 border-radius:50%;
 background:#c9936c
}

.npc{
 position:absolute;
 width:17px;
 height:25px;
 border-radius:8px 8px 4px 4px;
 z-index:2000
}

.npc:before{
 content:"";
 position:absolute;
 width:10px;
 height:10px;
 left:3.5px;
 top:-8px;
 border-radius:50%;
 background:#c9936c
}

.npcName{
 position:absolute;
 bottom:28px;
 left:50%;
 transform:translateX(-50%);
 font-size:7px;
 white-space:nowrap;
 text-shadow:0 1px 3px #000
}

.marker{
 position:absolute;
 width:30px;
 height:30px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:6000
}

.missionMarker{
 background:#24628b;
 border:2px solid #75c9ff;
 box-shadow:0 0 13px #398fc9;
 animation:pulse 1.2s infinite
}

.caseMarker{
 background:#71318a;
 border:2px solid #e2a4ff;
 box-shadow:0 0 13px #ad55d6;
 animation:pulse 1.2s infinite
}

@keyframes pulse{
 50%{transform:scale(1.2)}
}

#hud{
 position:fixed;
 left:10px;
 bottom:10px;
 width:min(570px,95vw);
 padding:13px;
 background:#03070cf2;
 border:1px solid #ffffff25;
 border-radius:14px;
 z-index:9000
}

#title{
 font-weight:bold;
 font-size:14px
}

#stats{
 margin-top:7px;
 font-size:10px;
 line-height:1.7
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:5px;
 margin-top:8px
}

button{
 flex:1;
 min-width:100px;
 padding:8px;
 border:1px solid #ffffff20;
 border-radius:8px;
 background:#162534;
 color:white;
 font-size:9px
}

button:active{
 transform:scale(.97)
}

#clock{
 position:fixed;
 right:10px;
 top:10px;
 padding:9px 12px;
 background:#03070cf2;
 border:1px solid #ffffff25;
 border-radius:10px;
 z-index:9000;
 font-size:11px
}

#message{
 position:fixed;
 left:50%;
 top:15%;
 transform:translateX(-50%);
 padding:10px 15px;
 background:#03070cf5;
 border:1px solid #ffffff30;
 border-radius:10px;
 display:none;
 z-index:10000;
 font-size:11px;
 text-align:center
}

#panel{
 position:fixed;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 width:min(550px,94vw);
 max-height:82vh;
 overflow:auto;
 display:none;
 padding:15px;
 background:#03070cf9;
 border:1px solid #ffffff30;
 border-radius:16px;
 z-index:12000
}

#panelTitle{
 font-weight:bold;
 font-size:14px
}

.row{
 margin-top:8px;
 padding:10px;
 background:#111d27;
 border-radius:9px;
 font-size:10px;
 line-height:1.65
}

.progress{
 height:8px;
 background:#26323d;
 border-radius:5px;
 overflow:hidden;
 margin-top:5px
}

.progress i{
 display:block;
 height:100%;
 background:#5d9bc8
}

.close{
 width:100%;
 margin-top:10px
}
</style>
</head>

<body>

<div id="world">

 <div class="road h" style="top:27%"></div>
 <div class="road h" style="top:67%"></div>

 <div class="road v" style="left:24%"></div>
 <div class="road v" style="left:56%"></div>
 <div class="road v" style="left:78%"></div>

 <div class="building"
      style="left:5%;top:5%;width:17%;height:18%">
   <div class="label">🏠 RESIDENTIAL</div>
 </div>

 <div class="building"
      style="left:29%;top:5%;width:17%;height:18%">
   <div class="label">🏫 SCHOOL</div>
 </div>

 <div class="building"
      style="left:60%;top:5%;width:15%;height:18%">
   <div class="label">🏥 HOSPITAL</div>
 </div>

 <div class="building"
      style="left:81%;top:5%;width:15%;height:18%">
   <div class="label">🏢 OFFICES</div>
 </div>

 <div class="building"
      style="left:5%;top:46%;width:17%;height:16%">
   <div class="label">🏭 FACTORY</div>
 </div>

 <div class="building"
      style="left:29%;top:47%;width:18%;height:17%">
   <div class="label">🌳 PARK</div>
 </div>

 <div class="building"
      style="left:60%;top:46%;width:15%;height:15%">
   <div class="label">🍽️ RESTAURANT</div>
 </div>

 <div class="building"
      style="left:81%;top:45%;width:15%;height:17%">
   <div class="label">🏪 MARKET</div>
 </div>

 <div id="player"></div>

</div>

<div id="clock">
 📅 Day 1 • 🕐 08:00
</div>

<div id="message"></div>

<div id="hud">

 <div id="title">
  🎯 WEBBOUND V142 — MISSION SYSTEM
 </div>

 <div id="stats"></div>

 <div class="buttons">

  <button onclick="V142.missionPanel()">
   🎯 MISSIONS
  </button>

  <button onclick="V142.casePanel()">
   📁 CASES
  </button>

  <button onclick="V142.collect()">
   🔎 COLLECT
  </button>

  <button onclick="V142.witness()">
   🗣️ WITNESS
  </button>

  <button onclick="V142.analyze()">
   🧪 ANALYZE
  </button>

  <button onclick="V142.evidenceBoard()">
   🧩 BOARD
  </button>

  <button onclick="V142.levelPanel()">
   ⭐ LEVEL
  </button>

  <button onclick="V142.claimRewards()">
   🎁 REWARDS
  </button>

  <button onclick="V142.court()">
   ⚖️ COURT
  </button>

 </div>

</div>

<div id="panel">

 <div id="panelTitle">
  WEBBOUND V142
 </div>

 <div id="panelContent"></div>

 <button class="close"
         onclick="V142.closePanel()">
  CLOSE
 </button>

</div>

<script>

const V142={

 saveKey:"WEBBOUND_V142",

 keys:{},

 hour:8,
 day:1,

 player:{
  x:window.innerWidth/2,
  y:window.innerHeight/2,
  money:1000,
  reputation:0,
  xp:0,
  level:1
 },

 npcs:[],
 cases:[],
 missions:[],

 investigation:{
  collected:0,
  analyzed:0,
  interviews:0,
  solved:0
 },

 courtStats:{
  hearings:0,
  convictions:0,
  acquittals:0,
  warrants:0,
  arrests:0,
  justice:50
 },

 /* ===============================
    INIT
 =============================== */

 init(){

  this.load();

  this.createNPCs();

  this.createMissions();

  this.keyboard();

  this.render();

  setInterval(
   ()=>this.update(),
   40
  );

  setInterval(
   ()=>this.timeTick(),
   1000
  );

  setInterval(
   ()=>this.spawnMission(),
   18000
  );

  this.message(
   "🎯 V142 Mission System loaded"
  );

 },

 /* ===============================
    NPC
 =============================== */

 createNPCs(){

  if(this.npcs.length)
   return;

  const names=[
   "Alex","Sam","Ryan","Maya",
   "Arun","Riya","Dev","Asha",
   "Noah","Leo","Avi","Zara",
   "Kiran","Nikhil","Anu",
   "Rahul","Meera","Vikram"
  ];

  for(let i=0;i<18;i++){

   this.npcs.push({

    id:i+1,

    name:names[i],

    x:
     60+
     Math.random()*
     (window.innerWidth-120),

    y:
     160+
     Math.random()*
     Math.max(
      1,
      window.innerHeight-210
     ),

    trust:
     30+
     Math.floor(
      Math.random()*70
     ),

    legal:"Free",

    element:null

   });

  }

 },

 /* ===============================
    MISSIONS
 =============================== */

 createMissions(){

  if(this.missions.length)
   return;

  this.addMission(
   "first_steps",
   "🕵️ First Investigation",
   "Collect evidence from a case.",
   "collect",
   1,
   150,
   50
  );

  this.addMission(
   "voice_of_people",
   "🗣️ Voice of the People",
   "Interview a witness.",
   "witness",
   1,
   175,
   60
  );

  this.addMission(
   "forensics",
   "🧪 Forensic Specialist",
   "Analyze evidence.",
   "analyze",
   1,
   250,
   100
  );

  this.addMission(
   "solve_case",
   "⚖️ Bring Justice",
   "Solve a case.",
   "solve",
   1,
   500,
   200
  );

 },

 addMission(
  id,
  name,
  description,
  type,
  target,
  money,
  xp
 ){

  this.missions.push({

   id,
   name,
   description,
   type,
   target,
   progress:0,
   money,
   xp,
   completed:false,
   claimed:false

  });

 },

 spawnMission(){

  const pool=[

   [
    "daily_collect",
    "🔎 Evidence Hunter",
    "Collect 3 pieces of evidence.",
    "collect",
    3,
    300,
    120
   ],

   [
    "daily_witness",
    "🗣️ Interview Expert",
    "Interview 2 witnesses.",
    "witness",
    2,
    350,
    150
   ],

   [
    "daily_analyze",
    "🧪 Science of Crime",
    "Analyze 2 pieces of evidence.",
    "analyze",
    2,
    450,
    180
   ],

   [
    "daily_solve",
    "🏆 City Protector",
    "Solve 2 cases.",
    "solve",
    2,
    800,
    300
   ]

  ];

  const d=
   pool[
    Math.floor(
     Math.random()*pool.length
    )
   ];

  if(
   this.missions.some(
    m=>m.id===d[0]
   )
  )
   return;

  this.addMission(...d);

  this.message(
   "🎯 New mission available: "+
   d[1]
  );

 },

 /* ===============================
    XP
 =============================== */

 addXP(amount){

  this.player.xp+=amount;

  let required=
   100+
   (this.player.level-1)*75;

  while(
   this.player.xp>=required
  ){

   this.player.xp-=required;

   this.player.level++;

   this.player.money+=
    100+
    this.player.level*25;

   this.player.reputation+=2;

   this.message(
    "⭐ LEVEL UP! You are now Level "+
    this.player.level
   );

   required=
    100+
    (this.player.level-1)*75;

  }

  this.updateMissionProgress(
   "xp",
   amount
  );

 },

 /* ===============================
    MISSION PROGRESS
 =============================== */

 updateMissionProgress(
  type,
  amount=1
 ){

  this.missions.forEach(m=>{

   if(
    m.completed||
    m.type!==type
   )
    return;

   m.progress=
    Math.min(
     m.target,
     m.progress+amount
    );

   if(
    m.progress>=m.target
   ){

    m.completed=true;

    this.message(
     "🎯 Mission completed: "+
     m.name
    );

   }

  });

 },

 claimRewards(){

  let claimed=0;

  this.missions.forEach(m=>{

   if(
    m.completed&&
    !m.claimed
   ){

    m.claimed=true;

    this.player.money+=m.money;

    this.addXP(m.xp);

    claimed++;

   }

  });

  if(claimed){

   this.message(
    "🎁 Rewards claimed: "+
    claimed+
    " mission(s)"
   );

  }
  else{

   this.message(
    "🎁 No rewards ready"
   );

  }

 },

 /* ===============================
    CASE
 =============================== */

 createCase(){

  const types=[

   ["🛍️","Market Theft"],
   ["🚗","Vehicle Theft"],
   ["💳","Fraud Investigation"],
   ["🏠","Burglary"],
   ["🏢","Office Crime"]

  ];

  const t=
   types[
    Math.floor(
     Math.random()*types.length
    )
   ];

  const suspect=
   this.npcs[
    Math.floor(
     Math.random()*this.npcs.length
    )
   ];

  const c={

   id:Date.now(),

   name:t[1],
   icon:t[0],

   suspect:suspect.name,

   evidence:15+
    Math.floor(
     Math.random()*45
    ),

   evidenceItems:[],
   witnesses:[],

   analyzed:false,
   solved:false,

   x:
    60+
    Math.random()*
    (window.innerWidth-120),

   y:
    160+
    Math.random()*
    Math.max(
     1,
     window.innerHeight-220
    ),

   element:null

  };

  this.cases.push(c);

  this.message(
   t[0]+" New case: "+t[1]
  );

 },

 nearestCase(){

  let best=null;
  let dist=999999;

  this.cases.forEach(c=>{

   if(c.solved)
    return;

   const dx=
    c.x-this.player.x;

   const dy=
    c.y-this.player.y;

   const d=
    Math.sqrt(
     dx*dx+dy*dy
    );

   if(d<dist){

    dist=d;
    best=c;

   }

  });

  return dist<150
   ?best
   :null;

 },

 collect(){

  let c=this.nearestCase();

  if(!c){

   if(!this.cases.length)
    this.createCase();

   this.message(
    "🔎 Move close to a case marker"
   );

   return;

  }

  const items=[

   "🔍 Fingerprint",
   "📷 CCTV footage",
   "🧾 Receipt",
   "📱 Digital record",
   "👟 Footprint",
   "🧤 Trace evidence"

  ];

  const item=
   items[
    Math.floor(
     Math.random()*items.length
    )
   ];

  if(
   c.evidenceItems.includes(item)
  ){

   this.message(
    "This evidence is already collected"
   );

   return;

  }

  c.evidenceItems.push(item);

  c.evidence=
   Math.min(
    100,
    c.evidence+10
   );

  this.investigation.collected++;

  this.updateMissionProgress(
   "collect"
  );

  this.addXP(20);

  this.message(
   "🔎 Collected: "+item
  );

 },

 /* ===============================
    WITNESS
 =============================== */

 witness(){

  const c=this.nearestCase();

  if(!c){

   this.message(
    "🗣️ No case nearby"
   );

   return;

  }

  const person=
   this.npcs.find(
    n=>
     n.name!==c.suspect&&
     !c.witnesses.includes(n.name)
   );

  if(!person){

   this.message(
    "No new witness available"
   );

   return;

  }

  c.witnesses.push(
   person.name
  );

  this.investigation.interviews++;

  c.evidence=
   Math.min(
    100,
    c.evidence+
    (person.trust>60?12:5)
   );

  this.updateMissionProgress(
   "witness"
  );

  this.addXP(25);

  this.message(
   "🗣️ "+person.name+
   " gave a witness statement"
  );

 },

 /* ===============================
    ANALYZE
 =============================== */

 analyze(){

  const c=
   this.cases.find(
    x=>
     !x.solved&&
     x.evidenceItems.length>0&&
     !x.analyzed
   );

  if(!c){

   this.message(
    "🧪 No evidence ready"
   );

   return;

  }

  c.analyzed=true;

  c.evidence=
   Math.min(
    100,
    c.evidence+15
   );

  this.investigation.analyzed++;

  this.updateMissionProgress(
   "analyze"
  );

  this.addXP(35);

  this.message(
   "🧪 Forensic analysis completed"
  );

 },

 /* ===============================
    SOLVE
 =============================== */

 solveCase(){

  const c=
   this.cases.find(
    x=>!x.solved
   );

  if(!c){

   this.message(
    "No case available"
   );

   return;

  }

  let strength=c.evidence;

  strength+=
   c.witnesses.length*8;

  if(c.analyzed)
   strength+=15;

  if(
   strength+
   Math.random()*15
   >=70
  ){

   c.solved=true;

   this.investigation.solved++;

   this.courtStats.convictions++;

   this.courtStats.justice=
    Math.min(
     100,
     this.courtStats.justice+4
    );

   this.player.reputation+=5;

   this.player.money+=250;

   this.updateMissionProgress(
    "solve"
   );

   this.addXP(100);

   this.message(
    "⚖️ CASE SOLVED! +₹250 +100 XP"
   );

  }
  else{

   this.message(
    "⚖️ Evidence is not strong enough"
   );

  }

 },

 /* ===============================
    PANELS
 =============================== */

 missionPanel(){

  let html="";

  this.missions.forEach(m=>{

   html+=`

   <div class="row">

   <b>${m.name}</b>

   <br>

   ${m.description}

   <br><br>

   Progress:
   ${m.progress}/${m.target}

   <div class="progress">
    <i style="width:${Math.min(
     100,
     m.progress/m.target*100
    )}%"></i>
   </div>

   <br>

   💰 Reward: ₹${m.money}

   <br>

   ⭐ XP: ${m.xp}

   <br>

   Status:
   ${
    m.claimed
    ?"🎁 Claimed"
    :m.completed
    ?"✅ Completed"
    :"⏳ Active"
   }

   </div>

   `;

  });

  this.openPanel(
   "🎯 MISSIONS",
   html||
   "<div class='row'>No missions.</div>"
  );

 },

 casePanel(){

  let html="";

  this.cases.forEach(c=>{

   html+=`

   <div class="row">

   <b>
    ${c.icon} ${c.name}
   </b>

   <br>

   👤 Suspect:
   ${c.suspect}

   <br>

   🔎 Evidence:
   ${c.evidence}%

   <div class="progress">
    <i style="width:${c.evidence}%"></i>
   </div>

   <br>

   🧩 Evidence items:
   ${c.evidenceItems.length}

   <br>

   🗣️ Witnesses:
   ${c.witnesses.length}

   <br>

   🧪 Analyzed:
   ${c.analyzed?"Yes":"No"}

   <br>

   Status:
   ${c.solved?"✅ Solved":"🔴 Active"}

   </div>

   `;

  });

  this.openPanel(
   "📁 CASE FILES",
   html||
   "<div class='row'>No cases.</div>"
  );

 },

 evidenceBoard(){

  let html="";

  this.cases.forEach(c=>{

   html+=`

   <div class="row">

   <b>${c.icon} ${c.name}</b>

   <br><br>

   <b>🔎 Evidence</b>

   <br>

   ${
    c.evidenceItems.length
    ?c.evidenceItems.join("<br>")
    :"None"
   }

   <br><br>

   <b>🗣️ Witnesses</b>

   <br>

   ${
    c.witnesses.length
    ?c.witnesses.join("<br>")
    :"None"
   }

   <br><br>

   🧪 Forensics:
   ${c.analyzed?"Complete":"Pending"}

   </div>

   `;

  });

  this.openPanel(
   "🧩 EVIDENCE BOARD",
   html||
   "<div class='row'>No evidence.</div>"
  );

 },

 levelPanel(){

  const required=
   100+
   (this.player.level-1)*75;

  this.openPanel(
   "⭐ PLAYER LEVEL",

   `

   <div class="row">

   ⭐ Level:
   <b>${this.player.level}</b>

   <br><br>

   XP:
   ${this.player.xp}/${required}

   <div class="progress">
    <i style="width:${
     this.player.xp/required*100
    }%"></i>
   </div>

   <br>

   🏅 Reputation:
   ${this.player.reputation}

   <br>

   💰 Money:
   ₹${Math.floor(this.player.money)}

   </div>

   <div class="row">

   Every level increases your
   rewards and reputation.

   </div>

   `
  );

 },

 court(){

  this.openPanel(
   "⚖️ CITY COURT",

   `

   <div class="row">
   Hearings:
   ${this.courtStats.hearings}
   </div>

   <div class="row">
   Convictions:
   ${this.courtStats.convictions}
   </div>

   <div class="row">
   Acquittals:
   ${this.courtStats.acquittals}
   </div>

   <div class="row">
   🚔 Arrests:
   ${this.courtStats.arrests}
   </div>

   <div class="row">
   ⚖️ Justice Score:
   ${this.courtStats.justice}%
   </div>

   <div class="row">

   <button onclick="V142.solveCase()">
    ⚖️ ATTEMPT CASE SOLUTION
   </button>

   </div>

   `
  );

 },

 openPanel(title,content){

  document.getElementById(
   "panelTitle"
  ).textContent=title;

  document.getElementById(
   "panelContent"
  ).innerHTML=content;

  document.getElementById(
   "panel"
  ).style.display="block";

 },

 closePanel(){

  document.getElementById(
   "panel"
  ).style.display="none";

 },

 /* ===============================
    MOVEMENT
 =============================== */

 update(){

  const speed=3;

  if(
   this.keys.ArrowUp||
   this.keys.KeyW
  )
   this.player.y-=speed;

  if(
   this.keys.ArrowDown||
   this.keys.KeyS
  )
   this.player.y+=speed;

  if(
   this.keys.ArrowLeft||
   this.keys.KeyA
  )
   this.player.x-=speed;

     50+

     150+
     Math.random()*
     Math.max(
      1,
      window.innerHeight-200
     );

   }

   const dx=
    n.targetX-n.x;

   const dy=
    n.targetY-n.y;

   const d=
    Math.sqrt(
     dx*dx+dy*dy
    );

   if(d>2){

    n.x+=dx/d*.5;
    n.y+=dy/d*.5;

   }

  });

 },
